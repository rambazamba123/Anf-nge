<!DOCTYPE html>
<html lang="de" data-day="tag">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3426">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Skipper – SBF See</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#dfe9e6; --paper:#fbf6ec; --paper-edge:#e7dbc4; --ink:#2a2019; --muted:#6c5f52; --line:#e1d5bf;
  --wood:#4a3426; --wood-d:#33241a; --lamp:#f0b53e; --sea:#2d5f6a; --sea-ink:#f7f1e3;
  --stb:#3c8c5a; --stb-soft:#dcefe2; --bb:#c2473b; --bb-soft:#f7dfda;
  --hfont:"Baloo 2","Trebuchet MS",sans-serif; --bfont:"Nunito","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html[data-day="morgen"]{--bg:#e4ebee}
html[data-day="abend"]{--bg:#ecdfd2}
html[data-day="nacht"]{--bg:#15212a; --paper:#22303a; --paper-edge:#2f414d; --ink:#f1e8d8; --muted:#a9b3b6; --line:#344854;
  --sea:#3d7c88; --stb:#5bb37c; --stb-soft:#1d3a2a; --bb:#e0675c; --bb-soft:#3e2320}
html[data-theme="hell"]{--bg:#dfe9e6; --paper:#fbf6ec; --paper-edge:#e7dbc4; --ink:#2a2019; --muted:#6c5f52; --line:#e1d5bf; --sea:#2d5f6a; --stb:#3c8c5a; --stb-soft:#dcefe2; --bb:#c2473b; --bb-soft:#f7dfda}
html[data-theme="dunkel"]{--bg:#15212a; --paper:#22303a; --paper-edge:#2f414d; --ink:#f1e8d8; --muted:#a9b3b6; --line:#344854; --sea:#3d7c88; --stb:#5bb37c; --stb-soft:#1d3a2a; --bb:#e0675c; --bb-soft:#3e2320}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.55 var(--bfont);-webkit-font-smoothing:antialiased;transition:background .6s}
h1,h2,h3{font-family:var(--hfont);font-weight:700;line-height:1.1;margin:0 0 .35em;letter-spacing:-.005em}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 .8em}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:.9rem}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;border-radius:14px;padding:.75em 1.15em;background:var(--sea);color:var(--sea-ink);font-weight:700;min-height:50px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.lamp{background:var(--lamp);color:#3a2610}
/* Grau wie „ausgegraut“, mit Funkeln: Dieser Knopf kann KI- oder Stimmenkosten verursachen. Bei ausgeschalteter KI verschwindet er. */
.btn.ki{background:#bdb8b0;color:#3f3b35;box-shadow:inset 0 0 0 2px #9d978e}
.btn.ki::before{content:'✦';font-size:.85em;opacity:.85}
.noki .ki,.nodev .dev{display:none!important}
.btn.wide{width:100%}
.btn.small{min-height:40px;padding:.4em .9em;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:default}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
/* Logbuch-Papier */
.card{background:var(--paper);border:1px solid var(--paper-edge);border-radius:18px;padding:16px 16px 14px;margin:0 0 14px}
.card h3{margin-bottom:.4em}
label{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:.7em .8em;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--sea)}
textarea{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.45em .9em;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--sea);background:var(--sea);color:var(--sea-ink)}
.status{min-height:1.4em;font-size:.92rem;margin:8px 0 0}
.status.ok{color:var(--stb)} .status.err{color:var(--bb)}

/* ---------- Szenen ---------- */
.scene{position:relative;margin:0 -16px 14px;aspect-ratio:4/3;overflow:hidden;background:var(--skyT)}
.scene svg{display:block;width:100%;height:100%}
@media (min-width:600px){.scene{margin:12px 0 14px;border-radius:22px}}
.hs{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px 6px 8px;min-height:36px;background:rgba(255,250,240,.95);color:#2a2019;font:700 .88rem var(--bfont);box-shadow:0 2px 0 rgba(42,32,25,.18)}
.hs.left{transform:translate(-100%,-50%)}
.hs i{width:11px;height:11px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 3px rgba(240,181,62,.35)}
.scene.hub{aspect-ratio:10/9}
.spot{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:3px 9px;min-height:26px;background:rgba(255,250,240,.88);color:#2a2019;font:700 .74rem var(--bfont);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.spot.l{transform:translate(0,-50%)} .spot.r{transform:translate(-100%,-50%)}
.cabin .ch{cursor:pointer}
.wx-tag{position:absolute;left:10px;bottom:8px;font-size:.75rem;font-weight:700;color:#fff;background:rgba(20,30,40,.35);padding:2px 9px;border-radius:999px}
/* Himmel, Wetter */
.stars{opacity:0;transition:opacity 1s} [data-day="nacht"] .stars{opacity:1}
.moon-cut{opacity:0} [data-day="nacht"] .moon-cut{opacity:1}
[data-wx="regen"] .sky-o,[data-wx="sturm"] .sky-o,[data-wx="nebel"] .sky-o{opacity:.25}
.rain,.fog{display:none}
[data-wx="regen"] .rain,[data-wx="sturm"] .rain{display:inline}
[data-wx="nebel"] .fog{display:inline}
.port-rain{display:none} [data-wx="regen"] .port-rain,[data-wx="sturm"] .port-rain{display:inline}
[data-wx="nebel"] .port-fog{opacity:.55}
.lh .beam{opacity:0} [data-day="nacht"] .lh .beam,[data-day="abend"] .lh .beam{animation:beam 6s linear infinite}
[data-day="nacht"] .navl{filter:drop-shadow(0 0 3px currentColor)}
.navl.red{color:#ff5a4a} .navl.white{color:#fff6c8}
[data-day="nacht"] .glow{opacity:1.6} .cabin[data-day="tag"] .glow{opacity:.55}
  .stage .lh .beam{display:none}
@keyframes beam{0%,100%{opacity:0}45%,55%{opacity:.22}}
@media (prefers-reduced-motion:no-preference){
  .wv{animation:wvx 7s linear infinite}
  .w2{animation-duration:9s} .w3{animation-duration:11s}
  [data-wx="windig"] .wv,[data-wx="sturm"] .wv{animation-duration:2.6s}
  [data-wx="windig"] .w3,[data-wx="sturm"] .w3{animation-duration:3.4s}
  .pw{animation:wvx 5s linear infinite} [data-wx="windig"] .pw,[data-wx="sturm"] .pw{animation-duration:1.8s}
  .clouds{animation:drift 40s ease-in-out infinite alternate}
  [data-wx="windig"] .clouds,[data-wx="sturm"] .clouds{animation-duration:9s}
  .rocker{transform-box:fill-box;transform-origin:50% 90%;animation:bob 5s ease-in-out infinite}
  [data-wx="windig"] .rocker{animation:rock 4.2s ease-in-out infinite}
  [data-wx="sturm"] .rocker{animation:rock2 3.2s ease-in-out infinite}
  .cabin .rocker{animation:none}
  .cabin[data-wx="windig"] .rocker{animation:rockS 5s ease-in-out infinite}
  .cabin[data-wx="sturm"] .rocker{animation:rockS 3.6s ease-in-out infinite}
  .lamp-sw{transform-box:view-box;transform-origin:200px 0;animation:swing 5s ease-in-out infinite}
  [data-wx="windig"] .lamp-sw,[data-wx="sturm"] .lamp-sw{animation-duration:2.8s}
  .flag{transform-box:fill-box;transform-origin:0 50%;animation:flap 1.6s ease-in-out infinite}
  [data-wx="windig"] .flag,[data-wx="sturm"] .flag{animation-duration:.45s}
  .buoy{animation:buoy 3.4s ease-in-out infinite}
  .fall{animation:fall .7s linear infinite} .stage .fall{animation:fall2 .9s linear infinite}
  .fog rect{animation:fogx 30s ease-in-out infinite alternate} .fog .f2{animation-duration:42s}
  .steam{animation:steam 3s ease-in-out infinite}
  .ch .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
  .ch[data-ch="smilla"] .eyes,.ch[data-ch="piet"] .eyes{animation-duration:6.1s;animation-delay:-2s}
  .ch[data-ch="klabauter"] .eyes,.ch[data-ch="backbord"] .eyes{animation-duration:3.9s;animation-delay:-1s}
  .ch[data-ch="kroeger"] .eyes{animation-duration:7.3s}
  .ch.talking .bod{transform-box:fill-box;transform-origin:50% 100%;animation:talkbob .3s ease-in-out infinite alternate}
  .ch[data-ch="backbord"] .glow{animation:pulse 2s ease-in-out infinite}
  .crab{animation:none} .crab>*{} .mouse{transform-box:fill-box;animation:peek 9s ease-in-out infinite}
  .ch .smoke{transform-box:fill-box;transform-origin:50% 100%;animation:smoke 4s ease-in-out infinite}
}
@keyframes wvx{to{transform:translateX(-50px)}}
@keyframes drift{to{transform:translateX(36px)}}
@keyframes bob{50%{transform:translateY(1.5px)}}
@keyframes rock{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg) translateY(2px)}}
@keyframes rock2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3.2deg) translateY(3px)}}
@keyframes rockS{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.7deg)}}
@keyframes swing{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.4deg)}}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82) skewY(4deg)}}
@keyframes buoy{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes fall{to{transform:translate(-26px,300px)}}
@keyframes fall2{to{transform:translate(-40px,640px)}}
@keyframes fogx{to{transform:translateX(90px)}}
@keyframes steam{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.7;transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes talkbob{to{transform:translateY(-1.8px)}}
@keyframes pulse{50%{opacity:.5}}
@keyframes scurry{0%,80%,100%{transform:translateX(0)}88%{transform:translateX(-14px)}94%{transform:translateX(6px)}}
@keyframes peek{0%,70%,100%{transform:translateY(0)}78%,92%{transform:translateY(-5px)}}
@keyframes smoke{0%{transform:translateY(3px);opacity:.2}50%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
/* Figuren */
.ch .mouth .o{transform-box:fill-box;transform-origin:center;transform:scaleY(.2);opacity:0}
.ch.talking .mouth .o{opacity:1;animation:yap .17s ease-in-out infinite alternate}
.ch.talking .mouth .c{opacity:0}
@keyframes yap{from{transform:scaleY(.25)}to{transform:scaleY(1.1)}}
.gaze{transition:transform .5s}
.look-r .gaze{transform:translateX(2.6px)} .look-l .gaze{transform:translateX(-2.6px)}
.actor{transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.tilt-r{transform:rotate(5deg)} .tilt-l{transform:rotate(-5deg)}
.hopper{transform-box:fill-box;transform-origin:50% 100%}
.hop{animation:hop .55s ease-out}
@keyframes hop{40%{transform:translateY(-16px)}}
svg.ch{display:block}
/* Sprechblase */
.bubble{pointer-events:none;position:absolute;top:3%;left:4%;max-width:74%;background:#fffaf0;color:#2a2019;border-radius:16px;padding:7px 12px 9px;font-size:.95rem;line-height:1.35;box-shadow:0 3px 0 rgba(42,32,25,.18);z-index:3}
.bubble.right{left:auto;right:4%}
.bubble b{display:block;font:700 .9rem var(--hfont);color:var(--who,#2a2019)}
.bubble span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bubble::after{content:"";position:absolute;bottom:-9px;left:var(--tail,22%);border:9px solid transparent;border-top-color:#fffaf0;border-bottom:0}
/* ---------- Intro / Startbild ---------- */
.stage{position:fixed;inset:0;z-index:40;background:var(--skyT);overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
#cam{transform-box:view-box;transform-origin:200px 520px;transform:scale(.42) translateY(-470px)}
@media (prefers-reduced-motion:no-preference){#cam{transition:transform 10s cubic-bezier(.35,.1,.25,1)}}
#cam.near{transform:none}
.stage .bubble{top:calc(env(safe-area-inset-top,0px) + 6%);max-width:84%;font-size:1.05rem}
.stage .skip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:4}
.overlay{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent 30%,rgba(18,24,30,.55))}
.overlay .panel{background:var(--paper);color:var(--ink);border-radius:22px;padding:18px;max-width:520px;margin:0 auto;width:100%}
.title{font:700 3.4rem/0.95 var(--hfont);color:#fffaf0;text-shadow:0 3px 0 rgba(0,0,0,.18);margin:0 0 6px}
.splash .lead{color:#fffaf0;font-weight:700;margin:0 0 18px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.tapzone{position:fixed;inset:0;z-index:44;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));background:rgba(18,24,30,.18);border:0;width:100%}
.tapzone span{background:#fffaf0;color:#2a2019;font:700 1.1rem var(--hfont);padding:12px 22px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.tapzone span{animation:breathe 2.4s ease-in-out infinite}}
@keyframes breathe{50%{transform:scale(1.05)}}
details summary{cursor:pointer;font-weight:700}
/* ---------- Kurs bis zur Prüfung ---------- */
.course{display:flex;gap:14px;align-items:center;margin:0 0 6px}
.course .big{font:700 3rem/0.9 var(--hfont)}
.track{position:relative;height:40px;margin:10px 0 2px}
.track .ln{position:absolute;left:0;right:12px;top:22px;border-top:2px dashed var(--line)}
.track .done{position:absolute;left:0;top:21px;height:4px;background:var(--lamp);border-radius:2px}
.track .boatI{position:absolute;top:2px;width:30px;height:30px;margin-left:-15px}
.track .goal{position:absolute;right:-4px;top:6px;width:22px;height:26px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.today b{font:700 1.5rem var(--hfont)}
/* ---------- Quiz ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 10px}
.tag{font-size:.82rem;color:var(--muted);font-weight:600}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--sea);transition:width .3s}
.qtext{font-size:1.12rem;font-weight:700;margin-bottom:12px}
.qimg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.qimg img{border-radius:10px;border:1px solid var(--line);background:#fff;max-height:200px}
.sig{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.sig .tones{font-size:1.5rem;letter-spacing:.14em;font-weight:700}
.sig .tones .on{color:var(--lamp)}
.ans{display:block;width:100%;text-align:left;padding:.8em 1em;margin:0 0 8px;border:2px solid var(--line);border-radius:14px;background:var(--paper);line-height:1.4;color:var(--ink)}
.ans.ok{border-color:var(--stb);background:var(--stb-soft)}
.ans.no{border-color:var(--bb);background:var(--bb-soft)}
.ans[aria-pressed="true"]{border-color:var(--sea);box-shadow:inset 0 0 0 1px var(--sea)}
.ans:disabled{cursor:default}
.fb{margin-top:6px}
.diff{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:.95rem}
.diff mark{background:none;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.diff .w mark{color:var(--bb)} .diff .r mark{color:var(--stb)}
.crewrow{display:flex;align-items:flex-end;gap:8px;min-height:58px;margin:6px 0 0}
.crewrow svg{width:46px;height:auto}
.crewrow .say{flex:1;font-size:.9rem;background:var(--paper);border:1px solid var(--paper-edge);border-radius:12px 12px 12px 4px;padding:6px 10px;align-self:center}
.lesson p{font-size:1.04rem}
.lesson ul{padding-left:1.2em;margin:0 0 .8em}
.fact{border-left:4px solid var(--lamp);padding:.4em .9em;margin:.6em 0 1em;background:var(--bg);border-radius:0 10px 10px 0}
.think{color:var(--muted);font-style:italic}
.exambar{display:flex;align-items:center;gap:12px;margin:14px 0 10px}
.exambar svg{width:52px;height:auto;flex:none}
.exambar .time{font:700 1.6rem var(--hfont);margin-left:auto}
.exambar .time.low{color:var(--bb)}
.result{display:flex;gap:14px;align-items:center}
.result svg{width:96px;height:auto;flex:none}
.result .big{font:700 2.6rem/1 var(--hfont)}
.pass{color:var(--stb)} .fail{color:var(--bb)}
/* ---------- Kajüte ---------- */
.talkbar{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.micbig{width:68px;height:68px;border-radius:50%;border:0;background:var(--lamp);color:#3a2610;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.micbig svg{width:30px;height:30px}
.micbig.on{background:var(--bb);color:#fff}
@media (prefers-reduced-motion:no-preference){.micbig.on{animation:ring 1.3s infinite}}
@keyframes ring{50%{box-shadow:0 0 0 10px rgba(194,71,59,.22)}}
.talkstate{flex:1;font-weight:700;line-height:1.3}
.talkstate small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.interim{font-style:italic;color:var(--muted);min-height:1.3em;margin:-4px 0 10px}
.log{display:flex;flex-direction:column;gap:8px}
.log .l{padding:8px 12px;border-radius:14px;background:var(--paper);border:1px solid var(--paper-edge);max-width:92%}
.log .l b{font:700 .9rem var(--hfont);display:block}
.log .l.u{align-self:flex-end;background:var(--sea);color:var(--sea-ink);border-color:transparent}
.composer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 12px;z-index:6;border-top:1px solid var(--line)}
.composer .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:120px;flex:1;padding:.6em .8em}
.stories .st{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.stories .st:first-child{border-top:0}
.line{display:flex;gap:10px;margin:0 0 8px;padding:6px 8px;border-radius:12px}
.line.now{background:var(--bg)}
.line .who{flex:0 0 76px;font:700 .95rem var(--hfont)}
/* ---------- Navigation (Planken) ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--wood);background-image:repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.18) 118px 120px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;min-height:66px;color:#e9dcc4;font:700 .82rem var(--bfont);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--lamp)}
nav.tabs svg{width:26px;height:26px}
/* Einstellungen */
.set h2{margin-top:22px}
.voice-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.voice-row:first-of-type{border-top:0}
.voice-row svg{width:52px;height:auto}
.crewpick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.crewpick button{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:10px;text-align:left;color:var(--ink)}
.crewpick button[aria-pressed="true"]{border-color:var(--sea);box-shadow:inset 0 0 0 1px var(--sea)}
.crewpick svg{width:64px;height:auto;margin:0 auto 4px}
.crewpick b{font:700 1rem var(--hfont);display:block}
.crewpick small{color:var(--muted);display:block;line-height:1.3}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin-top:5px}

<script>
/* ==========================================================================

/* Tageszeit aus der Handyuhr */
/* Schiffszeit: Standard ist ein 24-Stunden-Tag in 50 Minuten. Mit S.cfg.cycle === 'echt' gilt die Handyuhr. */
const SHIP_DAY_MS = 50 * 60 * 1000;
function shipHour() {
  if (window.S && S.cfg && S.cfg.cycle === 'echt') { const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
  return (Date.now() % SHIP_DAY_MS) / SHIP_DAY_MS * 24;
}
function dayPart(d) {
  const h = d ? d.getHours() + d.getMinutes() / 60 : shipHour();
  if (h >= 5 && h < 9) return 'morgen';
  if (h >= 9 && h < 17.5) return 'tag';
  if (h >= 17.5 && h < 21.5) return 'abend';
  return 'nacht';
}
/* Wetter: pro Tag zufällig, aber den ganzen Tag gleich. Meistens schön. */
function weatherToday() {
  if (window.WX_OVERRIDE && Date.now() < WX_OVERRIDE.until) return WX_OVERRIDE.wx;

<script>
/* ==========================================================================
   Ton-Mischpult
   Drei Kanäle (Musik, Geräusche, Effekte) mit weichen Übergängen.
   Musik wird leiser, sobald jemand spricht.
   ========================================================================== */
const AUD = (() => {
  const FILES = {
    'musik-intro': 'audio/musik-intro.mp3', 'musik-lernen': 'audio/musik-lernen.mp3',
    'musik-deck': 'audio/musik-deck.mp3', 'musik-abend': 'audio/musik-abend.mp3',
    wellen: 'audio/wellen.mp3', wind: 'audio/wind.mp3', windLeise: 'audio/wind-leise.mp3',
    regen: 'audio/regen.mp3', uhr: 'audio/uhr.mp3', segel: 'audio/segel.mp3', glocke: 'audio/glocke.mp3',
    moewe: 'audio/moewe.mp3', nebelhornFern: 'audio/nebelhorn-fern.mp3', nebelhorn: 'audio/nebelhorn.mp3',
    katze: 'audio/katze.mp3', papagei: 'audio/papagei.mp3', funkRauschen: 'audio/funk-rauschen.mp3', funkSuchen: 'audio/funk-suchen.mp3', piep: 'audio/piep.mp3',
    schritte: 'audio/schritte.mp3', tuerAuf: 'audio/tuer-auf.mp3', klopfen: 'audio/klopfen.mp3', streichholz: 'audio/streichholz.mp3', feuerzeug: 'audio/feuerzeug.mp3',
    paffen: 'audio/paffen.mp3', paffen2: 'audio/paffen2.mp3', buchAuf: 'audio/buch-auf.mp3', blaettern: 'audio/blaettern.mp3', sturm: 'audio/sturm.mp3', motorboot: 'audio/motorboot.mp3',
    katze2: 'audio/katze2.mp3', katze3: 'audio/katze3.mp3', schnurren: 'audio/schnurren.mp3', anker: 'audio/anker.mp3', bleistift: 'audio/bleistift.mp3',
    enttaeuschung: 'audio/enttaeuschung.mp3', falsch: 'audio/falsch.mp3', richtig: 'audio/richtig.mp3', motorStart: 'audio/motor-start.mp3', motorLauf: 'audio/motor-lauf.mp3',
  };
  let ctx = null, master, bus = {}, filt, buffers = {}, loading = {};
  let music = {name: null, src: null, gain: null}, loops = {}, duckState = 0, hushed = false, events = [], unlocked = false;
  const cfg = () => (window.S && S.cfg) || {music: .35, amb: .6, sfx: .7};

  function init() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain(); master.connect(ctx.destination);
    filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 20000; filt.connect(master);
    ['music', 'amb', 'sfx'].forEach(k => { bus[k] = ctx.createGain(); bus[k].connect(k === 'amb' ? filt : master); });
    applyVolumes();
    return ctx;
  }
  const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=';
  function unlock() {
    if (!window.__vel) { try { const a = new Audio(); a.src = SILENT; const p = a.play(); if (p && p.catch) p.catch(() => {}); window.__vel = a; } catch (e) {} }
    init(); if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (!unlocked) { const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(master); s.start(0); unlocked = true; }
  }
  function applyVolumes() {
    if (!ctx) return; const c = cfg(), t = ctx.currentTime;
    bus.music.gain.setTargetAtTime(hushed ? 0 : c.music * (duckState ? (music.name === 'musik-abend' ? .12 : .35) : 1), t, .25);
    bus.amb.gain.setTargetAtTime(hushed ? 0 : c.amb, t, .3);
    bus.sfx.gain.setTargetAtTime(c.sfx, t, .1);
  }
  async function load(name) {
    if (buffers[name]) return buffers[name];
    if (loading[name]) return loading[name];
    init(); if (!ctx) return null;
    loading[name] = fetch(FILES[name]).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(a => new Promise((res, rej) => ctx.decodeAudioData(a, res, rej)))
      .then(b => (buffers[name] = b)).catch(() => null);
    return loading[name];
  }

  /* ---------- Musik ---------- */
  async function playMusic(name) {
    /* V15: Solange ein Törn offen ist, gibt es keine Musik (auch nicht in Minispielen, Laden oder Ankreuz-Runde) */
    if (window.TOERN_STILL) name = null;
    if (!ctx || music.name === name) return;
    const old = music; music = {name, src: null, gain: null};
    if (old.gain) { old.gain.gain.setTargetAtTime(0, ctx.currentTime, .8); const s = old.src; setTimeout(() => { try { s.stop(); } catch (e) {} }, 4000); }
    applyVolumes();
    if (!name) return;
    const buf = await load(name); if (!buf || music.name !== name) return;
    const g = ctx.createGain(); g.gain.value = 0; g.connect(bus.music);
    const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.loopStart = .05; s.loopEnd = buf.duration - .05;
    s.connect(g); s.start(0, .05);
    g.gain.setTargetAtTime(1, ctx.currentTime, 1.2);
    music.src = s; music.gain = g;
  }
  function duck(on) { duckState = on ? 1 : 0; applyVolumes(); }
  /* Beim Zuhören Musik und Geräusche ganz leise: Sonst hört das Mikrofon Wellen und Musik statt dich. */
  function hush(on) { hushed = !!on; applyVolumes(); }

  /* ---------- Dauer-Geräusche ---------- */
  async function setLoop(name, vol, rate = 1) {
    if (!ctx) return;
    let L = loops[name];
    if (!vol) { if (L) L.gain.gain.setTargetAtTime(0, ctx.currentTime, .9); return; }
    if (!L) {
      L = loops[name] = {gain: ctx.createGain(), src: null}; L.gain.gain.value = 0; L.gain.connect(bus.amb);
      const buf = await load(name); if (!buf) return;
      const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.loopStart = .06; s.loopEnd = buf.duration - .06;
      s.playbackRate.value = rate; s.connect(L.gain); s.start(0, Math.random() * Math.max(0, buf.duration - 1)); L.src = s;
    }
    L.gain.gain.setTargetAtTime(vol, ctx.currentTime, .9);
  }
  function indoor(on) { if (!ctx) return; filt.frequency.setTargetAtTime(on ? 1100 : 20000, ctx.currentTime, .4); }

  /* ---------- Effekte ---------- */
  async function sfx(name, o = {}) {
    if (!ctx) return; const buf = await load(name); if (!buf) return;
    const g = ctx.createGain(); g.gain.value = o.vol == null ? 1 : o.vol; panTo(g, o.pan);
    const s = ctx.createBufferSource(); s.buffer = buf; if (o.rate) s.playbackRate.value = o.rate; s.connect(g);
    const off = o.offset || 0, dur = o.dur || (buf.duration - off);
    s.start(0, off, dur);
    if (o.dur) { g.gain.setValueAtTime(g.gain.value, ctx.currentTime + Math.max(0, dur - .4)); g.gain.linearRampToValueAtTime(0, ctx.currentTime + dur); }
    return new Promise(r => { s.onended = r; });
  }
  /* Stereo-Richtung (-1 links … 1 rechts), z. B. Nebelsignale im Törn */
  function panTo(node, pan) { if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); node.connect(p); p.connect(bus.sfx); } else node.connect(bus.sfx); }
  /* Uhr: tickt n Sekunden lang (eine Sekunde = ein Tick) */
  function ticks(n, vol = .8) { return sfx('uhr', {offset: 1, dur: Math.max(1, n), vol}); }

  /* Zufällige Ereignisse je nach Wetter (Möwen, Nebelhorn, flatterndes Segel) */
  function clearEvents() { events.forEach(clearTimeout); events = []; }
  function every(minS, maxS, fn) {
    const tick = () => { fn(); events.push(setTimeout(tick, (minS + Math.random() * (maxS - minS)) * 1000)); };
    events.push(setTimeout(tick, (minS * .4 + Math.random() * minS) * 1000));
  }

  /* Wetterklang: wx = schoen | windig | sturm | regen | nebel, place = deck | kajuete | quiz | exam */
  function weather(wx, day, place) {
    if (!ctx) return;
    const out = place === 'deck' || place === 'intro', night = day === 'nacht', on = !(window.S && S.cfg && S.cfg.wxSound === false);
    const v = {wellen: 0, wind: 0, windLeise: 0, regen: 0, uhr: 0, sturm: 0};
    if (on) {
      if (wx === 'windig') Object.assign(v, {wellen: .55, wind: .4, windLeise: .25});
      if (wx === 'sturm') Object.assign(v, {wellen: .2, sturm: .6, wind: .5, windLeise: .3, regen: .5});
      if (wx === 'regen') Object.assign(v, {regen: .6});
      if (wx === 'nebel') Object.assign(v, {wellen: .12});
      if (wx === 'schoen' && out) v.wellen = .08;
      if (place === 'kajuete') v.uhr = .06;
      if (place === 'quiz') Object.keys(v).forEach(k => v[k] *= .35);
      if (place === 'exam') Object.keys(v).forEach(k => v[k] = 0);
    }
    Object.entries(v).forEach(([k, x]) => setLoop(k, x));
    indoor(place === 'kajuete' || place === 'quiz' || place === 'exam');
    clearEvents();
    if (!on || place === 'exam') return;
    if (!night && (wx === 'schoen' || wx === 'windig')) every(28, 75, () => sfx('moewe', {offset: Math.random() * 26, dur: 3 + Math.random() * 3, vol: out ? .45 : .2}));
    if (wx === 'nebel') every(40, 90, () => sfx(Math.random() < .6 ? 'nebelhornFern' : 'nebelhorn', {vol: out ? .5 : .25}));
    if (wx === 'windig' || wx === 'sturm') every(18, 50, () => sfx('segel', {vol: out ? .5 : .2, rate: .9 + Math.random() * .25}));
    if (out && !night && (wx === 'schoen' || wx === 'windig')) every(110, 240, () => sfx('motorboot', {vol: .22}));
  }

  /* ---------- Schallsignale (Typhon) ----------
     Laut Katalog: kurzer Ton etwa 1 Sekunde, langer Ton etwa 4–6 Sekunden. */
  const SIG = {short: 1, long: 4.5, gap: 1, groupGap: 2.5};
  function parseSig(str) {
    const out = []; let gap = false;
    const s = String(str).replace(/mindestens\s*/i, '');
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '●' || c === '▬') { out.push({type: c === '●' ? 'short' : 'long', gapBefore: gap}); gap = false; }
      else if (c === ' ' && s[i + 1] === ' ') gap = true;
    }
    return out;
  }
  function horn(str, onTone, pan) {
    init(); if (!ctx) return {done: Promise.resolve(), stop() {}};
    const tones = parseSig(str); let t = ctx.currentTime + .15, stopped = false; const nodes = [];
    tones.forEach((tn, i) => {

async function offlineStock() {

    Object.values(AUD.files).forEach(u => urls.add(u));
    PACK.files().forEach(f => urls.add('audio/stimmen/' + f));
    let n = 0;
    for (const u of urls) {
      try { const r = await fetch(u); if (r.ok) { await r.arrayBuffer(); n++; } } catch (e) { LOG.add('offline', 'abgebrochen nach ' + n + ' Dateien'); return; }

/* Kernbegriffe eines Antwortvorschlags (für den SKS-Stichwort-Check) */
const STOP = new Set(['durch', 'eine', 'einen', 'einer', 'eines', 'dass', 'oder', 'sowie', 'werden', 'wird', 'sind', 'kann', 'muss', 'nicht', 'nach', 'beim', 'auch', 'wenn', 'bzw', 'diese', 'dieser', 'dabei', 'sich', 'unter', 'über', 'ihre', 'seine', 'immer', 'sollte', 'sollten', 'haben', 'z. b.']);
function keywords(ans) {
  const segs = String(ans).split(/\n|;|,|\.\s|\s(?:und|oder)\s/).map(x => x.replace(/^\s*(\d+\.|[a-z]\)|-|–)\s*/, '').trim()).filter(x => x.length > 2);
  const out = [];
  segs.forEach(sg => {
    const words = sg.split(/\s+/).map(w => w.replace(/[„“"().:!?]/g, '')).filter(w => w.length > 3 && !STOP.has(w.toLowerCase()));
    const nouns = words.filter(w => /^[A-ZÄÖÜ0-9]/.test(w));
    const pick = (nouns.length ? nouns : words).sort((a, b) => b.length - a.length)[0];
    if (pick && !out.some(o => o.toLowerCase() === pick.toLowerCase())) out.push(pick);
  });
  return out.slice(0, 8);
}

/* ---------- Unterschied-Trainer ---------- */
function diffWords(a, b) {
  const ta = a.split(/\s+/), tb = b.split(/\s+/), norm = w => w.toLowerCase().replace(/[.,;:!?()„“"]/g, '');
  const A = ta.map(norm), B = tb.map(norm), m = A.length, n = B.length;
  const L = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ka = new Set(), kb = new Set(); let i = 0, j = 0;
  while (i < m && j < n) { if (A[i] === B[j]) { ka.add(i); kb.add(j); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  const mark = (t, keep) => t.map((w, k) => keep.has(k) ? esc(w) : `<mark>${esc(w)}</mark>`).join(' ');
  return {sim: L[0][0] / Math.max(m, n), a: mark(ta, ka), b: mark(tb, kb)};
}

/* ---------- SKS-Probeprüfung: freie Antworten, 60 Punkte ---------- */
function startExamOpen() {
  const qs = examPick(), answers = new Array(qs.length).fill('');
  LOG.add('prüfung', 'SKS-Start, Fragen: ' + qs.map(q => q.n).join(','));
  let i = 0, left = COURSE.exam.minutes * 60, said10 = false, said3 = false;
  AUD.sfx('glocke', {vol: .7}); VOX.say('kroeger', lineOf('kroeger', 'startSks'), 'fixed');
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  clearInterval(examTimer);
  examTimer = setInterval(() => {
    left--; const t = $('#etime'); if (t) { t.textContent = fmt(left); t.classList.toggle('low', left <= 600); }
    if (left === 600 && !said10) { said10 = true; AUD.clock(.07); VOX.say('kroeger', lineOf('kroeger', 'time10'), 'fixed'); }
    if (left === 180 && !said3) { said3 = true; AUD.clock(.2); VOX.say('kroeger', lineOf('kroeger', 'time3'), 'fixed'); }
    if (left <= 0) { clearInterval(examTimer); examTimer = null; keep(); VOX.say('kroeger', lineOf('kroeger', 'end'), 'fixed'); grade(); }
  }, 1000);
  const keep = () => { const t = $('#ea'); if (t) answers[i] = t.value; };
  function show() {
    const q = qs[i];
    app.innerHTML = `<div class="exambar">${charSVG('kroeger')}<div><div class="tag">Frage ${i + 1} von ${qs.length} · ${esc(q.label)}</div><div class="small">bis zu 2 Punkte</div></div><div class="time ${left <= 600 ? 'low' : ''}" id="etime">${fmt(left)}</div></div>
      <div class="prog"><i style="width:${(i / qs.length * 100).toFixed(0)}%"></i></div>
      <div class="card"><div class="qtext">${esc(q.q).replace(/\n/g, '<br>')}</div>
        ${q.qi ? `<div class="qimg">${q.qi.map(s => `<img src="${s}" alt="Abbildung zur Frage">`).join('')}</div>` : ''}
        <textarea id="ea" placeholder="Deine Antwort…" style="min-height:120px">${esc(answers[i])}</textarea>
        ${VOX.canListen ? '<button class="btn ghost small" id="emic" style="margin-top:8px">Antwort sprechen</button>' : ''}</div>
      <div class="row"><button class="btn ghost" id="eprev" ${i ? '' : 'disabled'}>Zurück</button><button class="btn" id="enext">${i < qs.length - 1 ? 'Weiter' : 'Abgeben'}</button></div>
      <div class="row" style="margin-top:8px"><button class="btn ghost small" id="abort">Prüfung abbrechen</button></div>`;
    window.scrollTo(0, 0);
    const mic = $('#emic'); if (mic) mic.onclick = async () => { AUD.unlock(); mic.disabled = true; mic.textContent = 'Ich höre zu…'; const base = $('#ea').value; const r = await VOX.listen({onInterim: t => { $('#ea').value = (base ? base + ' ' : '') + t; }}).done; if (r.text) $('#ea').value = (base ? base + ' ' : '') + r.text; mic.disabled = false; mic.textContent = 'Antwort sprechen'; };
    $('#eprev').onclick = () => { keep(); i--; show(); };
    $('#enext').onclick = () => { keep(); if (i < qs.length - 1) { i++; show(); } else if (confirm('Prüfung abgeben?')) { clearInterval(examTimer); examTimer = null; AUD.clock(0); grade(); } };
    $('#abort').onclick = () => { if (confirm('Prüfung wirklich abbrechen? Sie wird nicht gewertet.')) { clearInterval(examTimer); examTimer = null; AUD.clock(0); setTab('cabin'); } };
  }
  /* Abgabe: selbst bewerten (gratis, offline) oder Kapitän Harms per KI korrigieren lassen (grauer Kostenknopf) */
  function grade() {
    AUD.clock(0); AUD.sfx('glocke', {vol: .7});
    if (!kiOn()) return selfGrade();
    app.innerHTML = `<div class="result" style="margin-top:16px">${charSVG('kroeger')}<div><h1 style="margin:0">Abgegeben.</h1><p class="small" style="margin:4px 0 0">Wie soll korrigiert werden?</p></div></div>
      <button class="btn wide lamp" id="gself" style="margin-top:12px">Selbst bewerten mit dem Antwortvorschlag</button>
      <button class="btn wide ki" id="gki" style="margin-top:10px">Kapitän Harms korrigiert</button>`;
    app.querySelector('svg.ch').style.width = '96px';
    $('#gself').onclick = selfGrade; $('#gki').onclick = harmsGrade;
  }
  async function harmsGrade() {
    app.innerHTML = `<div class="result" style="margin-top:16px">${charSVG('kroeger')}<div><h1 style="margin:0">Kapitän Harms korrigiert…</h1><p class="think" style="margin:4px 0 0">Er vergleicht jede Antwort mit dem amtlichen Antwortvorschlag.</p></div></div>`;
    app.querySelector('svg.ch').style.width = '96px';
    let pts = null;
    {
      const list = qs.map((q, k) => `[${k}] ${q.label}: ${q.q.replace(/\n/g, ' ')}\nAntwortvorschlag: ${q.a.replace(/\n/g, ' ')}\nAntwort des Bewerbers: ${(answers[k] || '').trim() || '(keine Antwort)'}`).join('\n\n');
      try {
        const j = await aiJson(`Bewerte jede Antwort einer SKS-Probeprüfung mit 0, 1 oder 2 Punkten, so wie ein amtlicher Prüfer: Die Antwort muss nicht wörtlich übereinstimmen. Maßgeblich ist, in welchem Umfang sie mit dem sachlichen Inhalt, der Vollständigkeit und der Fachsprache des Antwortvorschlags übereinstimmt. Keine Antwort gibt 0 Punkte.\n\n${list}\n\nAntworte NUR mit JSON: {"p":[{"i":0,"pt":2,"k":"kurze Begründung"}]}`, {system: `Du bist ein strenger, fairer Prüfer für den ${COURSE.name}.\n${RULES}`, modelTier: 'complex', maxTokens: 3500});
        if (j && Array.isArray(j.p)) { pts = qs.map(() => ({pt: 0, k: ''})); j.p.forEach(x => { if (pts[x.i]) pts[x.i] = {pt: Math.max(0, Math.min(2, +x.pt || 0)), k: String(x.k || '')}; }); }
      } catch (e) { LOG.add('prüfung', 'Korrektur fehlgeschlagen: ' + (e.code || e)); toast(aiErr(e) || 'Die Korrektur klappte nicht. Bewerte selbst.', 6000); }
    }
    if (!pts) return selfGrade();
    result(pts);
  }
  function selfGrade() {
    const pts = qs.map(() => ({pt: null, k: 'selbst bewertet'}));
    app.innerHTML = `<h1 style="margin-top:16px">Selbst bewerten</h1><p class="muted">Vergleiche deine Antwort mit dem Antwortvorschlag und vergib 0, 1 oder 2 Punkte.</p>
      ${qs.map((q, k) => `<div class="card"><div class="tag">${esc(q.label)}</div><p><strong>${esc(q.q)}</strong></p><p class="small" style="margin:0 0 6px"><b>Deine:</b> ${esc(answers[k] || '(keine Antwort)')}</p><p class="small" style="white-space:pre-line;margin:0 0 8px;color:var(--stb)"><b>Vorschlag:</b> ${esc(q.a)}</p>${q.ai ? `<div class="qimg">${q.ai.map(s => `<img src="${s}" alt="">`).join('')}</div>` : ''}<div class="chips">${[0, 1, 2].map(p => `<button class="chip" data-g="${k}" data-p="${p}" aria-pressed="false">${p} Punkte</button>`).join('')}</div></div>`).join('')}
      <button class="btn wide lamp" id="gdone">Auswerten</button>`;
    app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { const k = +b.dataset.g; pts[k].pt = +b.dataset.p; app.querySelectorAll(`[data-g="${k}"]`).forEach(x => x.setAttribute('aria-pressed', x === b)); });
    $('#gdone').onclick = () => { if (pts.some(p => p.pt === null) && !confirm('Noch nicht alle bewertet. Fehlende zählen als 0 Punkte. Auswerten?')) return; pts.forEach(p => { if (p.pt === null) p.pt = 0; }); result(pts); };
  }
  function result(pts) {
    const total = pts.reduce((a, p) => a + p.pt, 0), passed = total >= 39, oral = total >= 33 && total < 39;
    qs.forEach((q, k) => recordQ(q.n, pts[k].pt));
    S.exams = (S.exams || []).concat({day: today(), score: total, n: 60, pass: passed, oral, mode: 'sks'}); markPath('extra'); save();
    const label = passed ? 'Bestanden' : oral ? 'Mündliche Nachprüfung' : 'Nicht bestanden';
    app.innerHTML = `<div class="result" style="margin-top:16px">${charSVG('kroeger')}<div><div class="big ${passed ? 'pass' : 'fail'}">${label}</div><div style="font:700 1.4rem var(--hfont)">${total} von 60 Punkten</div><div class="small muted">Ab 39 bestanden, 33 bis 38 mündlich. Die Kartenaufgabe fehlt hier noch.</div></div></div>
      <h2 style="margin-top:18px">Die Korrektur</h2>
      ${qs.map((q, k) => `<div class="card"><div class="tag">${esc(q.label)} · <b style="color:${pts[k].pt === 2 ? 'var(--stb)' : 'var(--bb)'}">${pts[k].pt} von 2 Punkten</b></div><p><strong>${esc(q.q)}</strong></p>${pts[k].k ? `<p class="small" style="margin:0 0 6px"><i>${esc(pts[k].k)}</i></p>` : ''}${pts[k].pt < 2 ? `<p class="small" style="margin:0 0 4px"><b>Deine:</b> ${esc(answers[k] || '(keine Antwort)')}</p><p class="small" style="white-space:pre-line;margin:0;color:var(--stb)"><b>Vorschlag:</b> ${esc(q.a)}</p>` : ''}</div>`).join('')}
      <button class="btn wide" id="home" style="margin-top:6px">Zurück in die Kajüte</button>`;
    app.querySelector('svg.ch').style.width = '96px';
    $('#home').onclick = () => setTab('cabin');
    if (!passed) setTimeout(() => AUD.sfx('enttaeuschung', {vol: .5}), 400);
    setTimeout(() => VOX.say('kroeger', lineOf('kroeger', passed ? 'pass' : oral ? 'oral' : 'fail'), 'fixed'), passed ? 900 : 3200);
  }
  show();
}

function groupSettings() {
  const root = app.querySelector('.set'); if (!root) return;
  const sections = {}; let cur = null;
  [...root.children].forEach(el => { if (el.tagName === 'H2') { cur = el.textContent.trim(); sections[cur] = []; el.remove(); } else if (cur) { sections[cur].push(el); } });
  const GROUPS = [['Schein und Prüfung', ['Schein und Prüfung']], ['Crew und Stimmen', ['Crew', 'Crew-Charakter', 'Stimmen', 'Zuhören']], ['Ton und Bild', ['Ton und Wetter']], ['Technik', ['Schlüssel', 'Selbsttest', 'Protokoll', 'Sonstiges']]];

    root.appendChild(d);
  });
}

  scene.querySelectorAll('[data-egg],[data-go],[data-tap]').forEach(el => {

function bindPano(pano, key = 'panoX', centerX = null) {
  if (!pano) return;
  const place0 = () => {
    const max = pano.scrollWidth - pano.clientWidth; if (max <= 0) return;
    /* centerX: Ziel in Detail-Koordinaten (0..1200), z. B. nach dem Heranzoomen */
    const want = centerX != null ? (centerX / 1200 * pano.scrollWidth - pano.clientWidth / 2) / max : S[key] != null ? S[key] : (.72 * pano.scrollWidth - pano.clientWidth / 2) / max;
    pano.scrollLeft = Math.max(0, Math.min(1, want)) * max;
  };
  place0(); requestAnimationFrame(place0);
  let st = null;
  pano.addEventListener('scroll', () => { const max = pano.scrollWidth - pano.clientWidth; if (max > 0) S[key] = pano.scrollLeft / max; }, {passive: true});
  pano.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; st = {x: e.clientX, l: pano.scrollLeft, moved: false}; });
  pano.addEventListener('pointermove', e => { if (!st) return; const dx = e.clientX - st.x; if (Math.abs(dx) > 5) st.moved = true; pano.scrollLeft = st.l - dx; });
  const end = () => { if (st && st.moved) { pano.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); }, {capture: true, once: true}); } st = null; };
  pano.addEventListener('pointerup', end); pano.addEventListener('pointerleave', () => { st = null; });
}

  if (!log) return; const e = log.querySelector('.empty'); if (e) e.remove();

  d.innerHTML = s === 'U' ? esc(t) : `<b style="color:${CREW[cid(s)].color}">${esc(nameOf(s))}</b>${esc(t)}`;
  log.appendChild(d); d.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}

function startTalk(fromStory) { TALK.pending = !!fromStory; setTab('talk'); }
function stopTalk(ui) {
  TALK.on = false; if (TALK.ctl) TALK.ctl.cancel(); TALK.ctl = null; if (TALK.abort) TALK.abort.abort(); TALK.abort = null;

function afterCrew() {
  if (!TALK.on || tab !== 'talk') return;

async function listenTurn() {
  if (!apiKey()) return needKey();
  TALK.on = true; setTalkUI('listen');
  /* Kurz durchatmen: Das Handy gibt den Lautsprecher frei, bevor das Mikrofon startet (sonst oft „nichts gehört“). */
  VOX.stop('zuhören'); await new Promise(r => setTimeout(r, 350)); if (tab !== 'talk' || !TALK.on) return;
  TALK.ctl = VOX.listen({onInterim: t => { const i = $('#tint'); if (i) i.textContent = t; }, onState: s => s === 'think' && setTalkUI('think'), noSpeech: 12000});
  const r = await TALK.ctl.done; TALK.ctl = null; const i = $('#tint'); if (i) i.textContent = '';
  if (tab !== 'talk') return;
  if (r.err && r.err !== 'aborted') return setTalkUI('idle', sttErrText(r.err));
  if (r.err === 'aborted') return;
  if (!r.text) return setTalkUI('yourturn', 'Ich hab nichts gehört. Antippen und nochmal versuchen.');
  userSays(r.text);
}
async function userSays(text, extra = '', hidden = false) {
  if (!apiKey()) { const c = $('#chatIn'); if (c) c.value = text; return needKey(); }
  VOX.stop('neue Nachricht'); if (!hidden) { logLine('U', text); daily().talk++; } setTalkUI('think'); TALK.opts = null; showOpts();
  const rel = relevant(text);
  const hist = S.talk.slice(-16, hidden ? undefined : -1).map(l => l.s === 'U' ? {role: 'user', content: l.t} : {role: 'assistant', content: `${l.s}: ${l.t}`});
  const sys = crewSystem((rel.length ? `Passende Katalogfragen mit verbindlicher richtiger Antwort:\n${rel.map(catLine).join('\n')}\n` : '') + (S.talkCtx || '') + extra);
  const out = VOX.stream('live'); let done = 0;
  const take = (full, last) => {
    const lines = full.split('\n'); const upto = last ? lines.length : lines.length - 1;
    for (let k = done; k < upto; k++) {
      const raw = lines[k].trim(); if (!raw) continue;
      const f = raw.match(/^F\s*:\s*(.+)$/); if (f) { addFact(S.profile, f[1].trim()); save(); LOG.add('fakt', f[1].trim()); continue; }
      const o = raw.match(/^O\s*:\s*(.+)$/); if (o) { TALK.opts = o[1].split('|').map(x => x.trim()).filter(Boolean).slice(0, 4); continue; }
      const m = raw.match(/^([KMT])\s*:\s*(.+)$/); const role = m ? m[1] : 'K', t = (m ? m[2] : raw).trim(); if (!t) continue;
      logLine(role, t); out.push(cid(role), t); if (TALK.state === 'think') setTalkUI('speak');
    }
    done = Math.max(done, upto);
  };
  TALK.abort = new AbortController();
  try {
    const full = await ai([...hist, {role: 'user', content: text}], {system: sys, maxTokens: 1024, signal: TALK.abort.signal, onText: t => take(t, false)});
    take(full, true);
  } catch (e) {
    TALK.abort = null; out.close();
    if (e.code !== 'cancelled') { logLine('K', aiErr(e), false); setTalkUI('idle', aiErr(e)); if (e.code === 'bad_key') { setApiKey(''); renderTalk(); } }
    return;
  }
  TALK.abort = null; out.close(); await out.done;
  showOpts(); afterCrew();
}

function epFill(s) { return s.replace(/\{A:([\w-]+)\}/g, (_, n) => { const q = QN[n] || QN[+n]; return q ? ansText(q).replace(/\s+/g, ' ').trim() : ''; }).replace(/\{Q:([\w-]+)\}/g, (_, n) => { const q = QN[n] || QN[+n]; return q ? q.q.replace(/\s+/g, ' ').trim() : ''; }).replace(/\s+/g, ' '); }

/* ---------- Lexikon: Original-Bilder aus dem amtlichen Fragenkatalog ---------- */
/* ---------- Lexikon (5.7) ----------
   Einträge = Katalogfragen mit Originalgrafik oder Tonsignal. Bedeutung = amtliche Antwort a.
   Kategorie, Merkhilfe und Tonmuster aus data/lexikon.json. SKS nutzt das See-Lexikon (SBF See ist Voraussetzung). */
let LEX = {cats: [], e: {}};
const lexSrc = () => COURSE.id === 'binnen' ? 'bin' : 'sbf';
const lexKey = (q, src = lexSrc()) => (src === 'bin' && q.n > 72 ? 'bin:' : 'sbf:') + q.n;
function lexEntries() {
  const src = lexSrc(), data = src === 'bin' ? BIN_DATA : DATA;
  return data.filter(q => !q.skip && (LEX.e[lexKey(q, src)] || (q.img && q.img.length))).map(q => {
    const k = lexKey(q, src), d = LEX.e[k] || [];
    return {k, q, cat: d[0] || 'tafel', merk: d[1] || '', sig: d[2] || sigOf(q), img: q.img || []};
  });
}
/* Lexikon-Eintrag zu einer Frage des aktiven Kurses (für den Verweis aus der Lernrunde) */
function lexOf(q) { if (!q || COURSE.kind !== 'mc') return null; return lexEntries().find(x => x.q.n === q.n) || null; }
/* Verwandte SKS-Fragen: über markante Wörter der Bedeutung */
function sksRelated(x) {
  const words = (ansText(x.q) + ' ' + x.merk).toLowerCase().match(/[a-zäöüß]{7,}/g) || [];
  const stop = new Set(['kennzeichnung', 'fahrzeug', 'fahrzeuge', 'allgemeinen', 'schifffahrt', 'bedeutet', 'zwischen', 'gestattet']);
  const ws = [...new Set(words)].filter(w => !stop.has(w)); if (!ws.length) return [];
  return Q.map(q => ({q, s: ws.filter(w => (q.q + ' ' + ansText(q)).toLowerCase().includes(w)).length})).filter(o => o.s >= 2).sort((a, b) => b.s - a.s).slice(0, 3).map(o => o.q);
}
function lexCard(x, full, noPractice) {
  const catName = (LEX.cats.find(c => c[0] === x.cat) || [, ''])[1];
  const rel = COURSE.id === 'sks' ? sksRelated(x) : [];
  return `<div class="card lex" data-lk="${esc(x.k)}">${x.img.length ? `<div class="leximgs">${x.img.map(src => `<img src="${src}" alt="" loading="lazy">`).join('')}</div>` : ''}
    ${x.sig ? `<div class="lexsig"><span class="small">${esc(x.sig)}</span><button class="btn small ghost" data-play="${esc(x.sig)}">▶ Anhören</button></div>` : ''}
    <p style="margin:6px 0 4px"><b>${esc(ansText(x.q))}</b></p>
    ${x.merk ? `<p class="small" style="margin:0 0 6px">💡 ${esc(x.merk)}</p>` : ''}
    <p class="small muted" style="margin:0">${full ? esc(catName) + ' · ' : ''}${COURSE.id === 'sks' ? 'SBF See' : esc(COURSE.short)}, Frage ${x.q.n}: ${esc(x.q.q.split('\n')[0])}</p>
    <div class="row" style="margin-top:6px;flex-wrap:wrap">${COURSE.id === 'sks' ? rel.map(q => `<button class="btn small ghost" data-rq="${esc(String(q.n))}">SKS ${esc(qLabel(q))}</button>`).join('') : noPractice ? '' : `<button class="btn small ghost" data-qn="${x.q.n}">Frage üben</button>`}</div></div>`;
}

function lexSheet(x) { const w = sheet(`<h2 style="margin:0 0 8px">Lexikon</h2>${lexCard(x, true, true)}`); bindLexCards(w, () => setTab('cabin')); }
let lexCat = 'alle';
function renderLexikon(filter = '') {
  subScreen(); place = 'log';
  const all = lexEntries(), f = filter.trim().toLowerCase();
  const hit = x => (lexCat === 'alle' || x.cat === lexCat) && (!f || (x.q.q + ' ' + ansText(x.q) + ' ' + x.merk + ' ' + x.cat).toLowerCase().includes(f));
  const shown = all.filter(hit), cats = LEX.cats.filter(c => all.some(x => x.cat === c[0]));

/* ---------- Canvas-Grundgerüst für die Fahrspiele ---------- */
function canvasGame(title, rule) {
  gameShell(title, `<div class="gamewrap"><canvas id="gc"></canvas><div class="gameover hidden" id="gover"></div></div><p class="small muted" style="margin:8px 2px">${rule}</p>`);
  const c = $('#gc'), wrap = c.parentElement, dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.min(520, wrap.clientWidth), H = Math.min(560, Math.round(window.innerHeight * .62));
  c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const boat = {x: W / 2, y: H - 70, tx: W / 2};
  const setX = clientX => { const r = c.getBoundingClientRect(); boat.tx = Math.max(24, Math.min(W - 24, clientX - r.left)); };
  c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); setX(e.clientX); });
  c.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') setX(e.clientX); });
  return {c, ctx, W, H, boat};
}
function drawBoatTop(ctx, x, y) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#fbf6ec'; ctx.beginPath(); ctx.moveTo(0, -30); ctx.quadraticCurveTo(16, -8, 13, 24); ctx.lineTo(-13, 24); ctx.quadraticCurveTo(-16, -8, 0, -30); ctx.fill();
  ctx.fillStyle = '#3d5f8f'; ctx.fillRect(-9, 0, 18, 12); ctx.fillStyle = '#5a3e2a'; ctx.fillRect(-1.5, -18, 3, 26); ctx.restore();
}
function drawWater(ctx, W, H, t) {
  ctx.fillStyle = '#2f6f8f'; ctx.fillRect(0, 0, W, H); ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2;
  for (let y = (t * .06) % 40 - 40; y < H; y += 40) { ctx.beginPath(); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, y + Math.sin((x + y) / 30) * 3); ctx.stroke(); }
}
function gameOver(score, key, again) {
  stopGames(); const nb = recordScore(key, score), o = $('#gover'); if (!o) return;
  o.innerHTML = `<h2 style="margin:0 0 4px">${score} Punkte</h2><p class="muted" style="margin:0 0 10px">${nb ? 'Neuer Rekord!' : `Rekord: ${(S.best && S.best[key]) || 0}`}</p><button class="btn lamp" id="again">Nochmal</button>`;
  o.classList.remove('hidden'); $('#again').onclick = again;
}

/* ---------- Tonnen-Slalom (Betonnungssystem A, Einlaufen von See) ----------
   Rote Tonne (Stumpftonne, gerade Nummer) bleibt an Backbord, also links vom Boot.
   Grüne Tonne (Spitztonne, ungerade Nummer) bleibt an Steuerbord, also rechts vom Boot. */
function buoyGame() {
  const g = canvasGame('Tonnen-Slalom', 'Du läufst von See in den Hafen ein. Zieh das Boot so, dass rote Tonnen links (Backbord) und grüne Tonnen rechts (Steuerbord) an dir vorbeiziehen.');
  const {ctx, W, H, boat} = g; let buoys = [], score = 0, lives = 3, t0 = performance.now(), last = t0, spawn = 0, msg = '', msgT = 0, num = 1;
  const step = now => {
    const dt = Math.min(50, now - last); last = now; const t = now - t0, speed = .11 + Math.min(.12, t / 120000);
    spawn -= dt; if (spawn <= 0) { const red = Math.random() < .5; buoys.push({x: W * (.25 + Math.random() * .5), y: -30, red, n: red ? (num % 2 ? num + 1 : num) : (num % 2 ? num : num + 1), done: false}); num += 1; spawn = 1500 - Math.min(700, t / 60); }
    boat.x += (boat.tx - boat.x) * .25;
    drawWater(ctx, W, H, t);
    buoys.forEach(b => {
      b.y += speed * dt;
      ctx.save(); ctx.translate(b.x, b.y);
      ctx.fillStyle = b.red ? '#d33a2c' : '#2e9a52';
      if (b.red) { ctx.fillRect(-11, -14, 22, 26); ctx.fillRect(-6, -24, 12, 8); } else { ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(13, 12); ctx.lineTo(-13, 12); ctx.fill(); }
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(String(b.n), 0, 8); ctx.restore();
      if (!b.done && b.y >= boat.y) {
        b.done = true; const dx = boat.x - b.x;
        if (Math.abs(dx) < 24) { lives--; msg = 'Rumms! Nicht rammen.'; AUD.crash(); }
        else if ((b.red && dx > 0) || (!b.red && dx < 0)) { score++; AUD.sfx('richtig', {vol: .35}); }
        else { lives--; msg = b.red ? 'Rote Tonne an Backbord lassen: Sie muss links von dir sein.' : 'Grüne Tonne an Steuerbord lassen: Sie muss rechts von dir sein.'; AUD.sfx('falsch', {vol: .35}); }
        msgT = now;
      }
    });
    buoys = buoys.filter(b => b.y < H + 40);
    drawBoatTop(ctx, boat.x, boat.y);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`${score} Punkte`, 12, 24); ctx.textAlign = 'right'; ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 12, 24);
    if (msg && now - msgT < 2200) { ctx.fillStyle = 'rgba(20,30,40,.75)'; ctx.fillRect(10, H - 30, W - 20, 24); ctx.fillStyle = '#fffaf0'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(msg, W / 2, H - 13); }
    if (lives <= 0) return gameOver(score, 'buoy', buoyGame);
    gameLoop = requestAnimationFrame(step);
  };
  gameLoop = requestAnimationFrame(step);
}

/* ---------- Fischfang ---------- */
function fishGame() {
  const g = canvasGame('Fischfang', 'Zieh das Boot hin und her. Fang die Fische, weich Treibholz und Quallen aus.');
  const {ctx, W, H, boat} = g; let items = [], score = 0, lives = 3, t0 = performance.now(), last = t0, spawn = 0;
  const step = now => {
    const dt = Math.min(50, now - last); last = now; const t = now - t0, speed = .12 + Math.min(.16, t / 90000);
    spawn -= dt; if (spawn <= 0) { const r = Math.random(); items.push({x: 20 + Math.random() * (W - 40), y: -20, k: r < .62 ? 'fish' : r < .82 ? 'wood' : 'jelly', w: Math.random() * 6}); spawn = 750 - Math.min(400, t / 80); }
    boat.x += (boat.tx - boat.x) * .3;
    drawWater(ctx, W, H, t);
    items.forEach(it => {
      it.y += speed * dt * (it.k === 'jelly' ? .7 : 1); const wob = Math.sin((t / 300) + it.w) * (it.k === 'fish' ? 6 : 2);
      ctx.save(); ctx.translate(it.x + wob, it.y);
      if (it.k === 'fish') { ctx.fillStyle = '#e8954a'; ctx.beginPath(); ctx.ellipse(0, 0, 12, 6, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(18, -6); ctx.lineTo(18, 6); ctx.fill(); ctx.fillStyle = '#2b2118'; ctx.beginPath(); ctx.arc(-6, -1, 1.4, 0, 7); ctx.fill(); }
      else if (it.k === 'wood') { ctx.fillStyle = '#7a4e33'; ctx.fillRect(-18, -5, 36, 10); ctx.fillStyle = '#5a3a24'; ctx.fillRect(-14, -2, 6, 4); }
      else { ctx.fillStyle = 'rgba(190,120,220,.85)'; ctx.beginPath(); ctx.arc(0, 0, 10, Math.PI, 0); ctx.fill(); ctx.strokeStyle = 'rgba(190,120,220,.85)'; ctx.lineWidth = 2; for (let k = -6; k <= 6; k += 4) { ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k + Math.sin(t / 200 + k) * 2, 12); ctx.stroke(); } }
      ctx.restore();
      if (!it.hit && Math.abs(it.y - boat.y) < 22 && Math.abs(it.x + wob - boat.x) < 26) {
        it.hit = true; it.y = H + 99;
        if (it.k === 'fish') { score++; AUD.sfx('richtig', {vol: .3}); } else { lives--; AUD.sfx('falsch', {vol: .35}); }
      }
    });
    items = items.filter(it => it.y < H + 30);
    drawBoatTop(ctx, boat.x, boat.y);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`${score} Fische`, 12, 24); ctx.textAlign = 'right'; ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 12, 24);
    if (lives <= 0) return gameOver(score, 'fish', fishGame);
    gameLoop = requestAnimationFrame(step);
  };
  gameLoop = requestAnimationFrame(step);
}

        return;
      }
      const r = t.rows[i];
      box.innerHTML = `<div class="card small" style="background:var(--bg)"><b>Aufgabe ${n}:</b> ${esc(t.scen.replace(/^Navigationsaufgabe \d+\s*/, ''))}</div>
        <div class="card"><div class="tag">Teilaufgabe ${r.n} von 9</div><p style="font-weight:700;margin:4px 0 10px">${esc(r.q)}</p>
          <textarea id="nans" placeholder="Dein Ergebnis aus der Karte…"></textarea>
          <button class="btn lamp wide" id="nshow" style="margin-top:8px">Amtliches Ergebnis zeigen</button><div id="nres"></div></div>`;
      $('#gscore').textContent = `${score} P.`;
      $('#nshow').onclick = () => {
        $('#nshow').remove();
        $('#nres').innerHTML = `<div class="fact"><b>Ergebnis:</b> ${esc(r.a)}</div>${r.n === 2 && t.note ? `<p class="small muted">${esc(t.note)}</p>` : ''}
          <div class="row"><button class="btn" data-ok="1" style="background:var(--stb)">Hatte ich richtig</button><button class="btn ghost" data-ok="0">Nicht richtig</button></div>`;
        app.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => { const ok = b.dataset.ok === '1'; if (ok) score++; AUD.sfx(ok ? 'richtig' : 'falsch', {vol: ok ? .5 : .3}); i++; step(); });
      };
    };
    step();
  };
  if (opt.task) run(opt.task); else pick();
}

/* ---------- Manöver: Gashebel mit drei Stellungen, Ruder per Wischen ----------
   Aufgaben wie in der praktischen Prüfung: Ablegen, Anlegen, Mensch über Bord, Wenden auf engem Raum. */
const MANEUVERS = [
  {id: 'ablegen', name: 'Ablegen', tip: 'Leg vom Steg ab und fahr durch das Tor. Erst kurz rückwärts, dann vorwärts in die Mitte.', start: {x: 60, y: .62, h: -Math.PI / 2}, goal: {kind: 'gate', x: .5, y: .12}, dock: 'left'},
  {id: 'anlegen', name: 'Anlegen', tip: 'Fahr langsam an den Steg und stoppe parallel daneben. Nicht schneller als Schritttempo!', start: {x: .5, y: .9, h: -Math.PI / 2}, goal: {kind: 'dock'}, dock: 'left'},
  {id: 'mob', name: 'Mensch über Bord', tip: 'Jemand ist über Bord! Fahr ihn an und stopp direkt neben ihm, möglichst mit der Nase gegen den Wind.', start: {x: .5, y: .88, h: -Math.PI / 2}, goal: {kind: 'mob', x: .55, y: .3}},
  {id: 'wenden', name: 'Wenden auf engem Raum', tip: 'Dreh das Boot in der engen Box um 180 Grad: vor und zurück, Ruder jeweils umlegen.', start: {x: .5, y: .5, h: -Math.PI / 2}, goal: {kind: 'turn'}, box: true},
];
function maneuverGame() {
  let mi = S.best && S.best.manIdx ? S.best.manIdx % MANEUVERS.length : 0;
  const run = () => {
    const m = MANEUVERS[mi];
    gameShell('Manöver: ' + m.name, `<div class="gamewrap"><canvas id="gc"></canvas><div class="lever" id="lever"><b style="top:6px">voll</b><b style="top:66px">neutral</b><b style="top:128px">zurück</b><i style="top:58px"></i></div><button class="motorbtn" id="motbtn" aria-pressed="false">Motor<br>starten</button><div class="gameover hidden" id="gover"></div></div>
      <p class="small muted" style="margin:8px 2px">${esc(m.tip)} <b>Steuern:</b> Erst den Motor starten (nur in Neutral). Dann den Hebel stufenlos schieben: aus der Mitte nach oben legt den Vorwärtsgang ein, je weiter, desto mehr Gas. Nach unten rückwärts. Über das Wasser wischen legt das Ruder.</p>`);
    const c = $('#gc'), wrap = c.parentElement, dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.min(520, wrap.clientWidth), H = Math.min(560, Math.round(window.innerHeight * .62));
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px'; const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
    const boat = {x: (m.start.x < 1 ? m.start.x * W : m.start.x), y: m.start.y * H, h: m.start.h, v: 0, rudder: 0, gear: 0, turned: 0, motor: false};
    const wind = Math.random() * Math.PI * 2, mob = m.goal.kind === 'mob' ? {x: m.goal.x * W, y: m.goal.y * H} : null;
    const dock = m.dock ? {x: 0, y: H * .35, w: 26, h: H * .45} : null;
    let t0 = performance.now(), last = t0, done = false, msg = '', msgT = 0, bumps = 0;
    /* Gashebel */
    const lever = $('#lever'), knob = lever.querySelector('i');
    /* Stufenlos: Mitte = neutral (kleine Raste), oben bis voll voraus, unten bis voll zurück */
    const setGear = g => {
      const was = boat.gear; boat.gear = g; knob.style.top = (58 - g * 52) + 'px';
      if ((was === 0) !== (g === 0)) { AUD.click(); if (boat.motor && g !== 0) { msg = g > 0 ? 'Vorwärtsgang eingelegt' : 'Rückwärtsgang eingelegt'; msgT = performance.now(); } }
      if (!boat.motor && g !== 0 && was === 0) { msg = 'Der Motor läuft noch nicht'; msgT = performance.now(); }
      if (boat.motor) AUD.loop('motorLauf', .18 + Math.abs(g) * .3);
    };
    const onLever = e => { const r = lever.getBoundingClientRect(), y = (e.clientY - r.top) / r.height; let g = Math.max(-1, Math.min(1, (.5 - y) / .4)); if (Math.abs(g) < .14) g = 0; else g = Math.sign(g) * (Math.abs(g) - .14) / .86; setGear(Math.round(g * 20) / 20); };
    /* Motor an und aus. Starten nur in Neutral, wie auf dem echten Boot (Startsperre). */
    const mb = $('#motbtn');
    mb.onclick = () => {
      if (!boat.motor) {
        if (boat.gear !== 0) { msg = 'Erst auf Neutral, dann starten'; msgT = performance.now(); AUD.click(); return; }
        boat.motor = true; AUD.sfx('motorStart', {vol: .45}); setTimeout(() => { if (boat.motor && !done) AUD.loop('motorLauf', .18); }, 900);
        msg = 'Motor läuft. Kühlwasserstrahl kommt.'; msgT = performance.now();
      } else { boat.motor = false; AUD.loop('motorLauf', 0); msg = 'Motor aus'; msgT = performance.now(); AUD.click(); }
      mb.setAttribute('aria-pressed', String(boat.motor)); mb.innerHTML = boat.motor ? 'Motor<br>aus' : 'Motor<br>starten';
    };
    lever.addEventListener('pointerdown', e => { lever.setPointerCapture(e.pointerId); onLever(e); });
    lever.addEventListener('pointermove', e => { if (e.buttons) onLever(e); });
    /* Ruder per Wischen */
    let sx = null;
    c.addEventListener('pointerdown', e => { sx = e.clientX; });
    c.addEventListener('pointerup', e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) < 18) { boat.rudder = 0; msg = 'Ruder mittschiffs'; } else { boat.rudder = Math.max(-1, Math.min(1, dx / 90)); msg = dx > 0 ? 'Ruder Steuerbord' : 'Ruder Backbord'; } msgT = performance.now(); AUD.click(); });
    const finish = (ok, text) => { done = true; stopGames(); AUD.sfx(ok ? 'richtig' : 'falsch', {vol: .5}); const o = $('#gover'); o.innerHTML = `<h2 style="margin:0 0 4px">${ok ? 'Manöver geschafft!' : 'Noch mal'}</h2><p class="muted" style="margin:0 0 10px">${esc(text)}</p><div class="row"><button class="btn lamp" id="again">${ok ? 'Nächstes Manöver' : 'Nochmal'}</button></div>`; o.classList.remove('hidden'); $('#again').onclick = () => { if (ok) mi = (mi + 1) % MANEUVERS.length; S.best = S.best || {}; S.best.manIdx = mi; if (ok) recordScore('man', ((S.best && S.best.man) || 0) + 1); run(); }; };
    const step = now => {
      const dt = Math.min(50, now - last) / 1000; last = now; const t = now - t0;
      /* Fahrdynamik: Gas beschleunigt, Wasser bremst, Ruder wirkt nur mit Fahrt (rückwärts umgekehrt) */
      const pow = boat.motor ? (boat.gear > 0 ? boat.gear * 60 : boat.gear * 38) : 0; boat.v += (pow - boat.v) * (pow ? .9 : 1.2) * dt;
      const turn = boat.rudder * 1.6 * (boat.v / 60); boat.h += turn * dt; boat.turned += Math.abs(turn * dt);
      boat.x += Math.cos(boat.h) * boat.v * dt; boat.y += Math.sin(boat.h) * boat.v * dt;
      if (boat.x < 14 || boat.x > W - 14 || boat.y < 14 || boat.y > H - 14) { boat.v *= -.3; boat.x = Math.max(14, Math.min(W - 14, boat.x)); boat.y = Math.max(14, Math.min(H - 14, boat.y)); if (!done) { bumps++; AUD.crash(); msg = 'Autsch, die Kante!'; msgT = now; if (bumps >= 3) return finish(false, 'Dreimal angeeckt. Ruhig und langsam, dann klappt es.'); } }
      drawWater(ctx, W, H, t);
      if (m.box) { ctx.strokeStyle = 'rgba(255,250,240,.6)'; ctx.setLineDash([6, 6]); ctx.strokeRect(W * .2, H * .25, W * .6, H * .5); ctx.setLineDash([]); }
      if (dock) { ctx.fillStyle = '#8a5a3a'; ctx.fillRect(dock.x, dock.y, dock.w, dock.h); ctx.fillStyle = '#5a3a24'; for (let y = dock.y + 8; y < dock.y + dock.h; y += 22) ctx.fillRect(dock.x, y, dock.w, 3); }
      if (m.goal.kind === 'gate') { ctx.fillStyle = '#d33a2c'; ctx.fillRect(W * .5 - 50, H * .12 - 10, 14, 20); ctx.fillStyle = '#2e9a52'; ctx.beginPath(); ctx.moveTo(W * .5 + 43, H * .12 - 12); ctx.lineTo(W * .5 + 55, H * .12 + 10); ctx.lineTo(W * .5 + 31, H * .12 + 10); ctx.fill(); }
      if (mob) { ctx.fillStyle = '#f0b53e'; ctx.beginPath(); ctx.arc(mob.x, mob.y, 8, 0, 7); ctx.fill(); ctx.strokeStyle = '#2b2118'; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('MOB', mob.x, mob.y - 12); }
      /* Wind */
      ctx.save(); ctx.translate(W - 36, 36); ctx.rotate(wind); ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.lineTo(6, -5); ctx.moveTo(12, 0); ctx.lineTo(6, 5); ctx.stroke(); ctx.restore(); ctx.fillStyle = '#fffaf0'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Wind', W - 36, 54);
      /* Boot von oben, in Fahrtrichtung */
      ctx.save(); ctx.translate(boat.x, boat.y); ctx.rotate(boat.h + Math.PI / 2); ctx.fillStyle = '#fbf6ec'; ctx.beginPath(); ctx.moveTo(0, -22); ctx.quadraticCurveTo(12, -6, 10, 16); ctx.lineTo(-10, 16); ctx.quadraticCurveTo(-12, -6, 0, -22); ctx.fill(); ctx.fillStyle = '#3d5f8f'; ctx.fillRect(-6, -4, 12, 12); ctx.strokeStyle = '#5a3e2a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(boat.rudder * 8, 26); ctx.stroke(); ctx.restore();
      const speedKn = Math.abs(boat.v) / 12;
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`${speedKn.toFixed(1)} kn  ${!boat.motor ? 'Motor aus' : boat.gear === 0 ? 'neutral' : (boat.gear > 0 ? 'vor ' : 'zurück ') + Math.round(Math.abs(boat.gear) * 100) + ' %'}  Ruder ${boat.rudder === 0 ? 'mittschiffs' : (boat.rudder > 0 ? 'Stb ' : 'Bb ') + Math.round(Math.abs(boat.rudder) * 30) + '°'}`, 12, 22);
      if (msg && now - msgT < 1800) { ctx.fillStyle = 'rgba(20,30,40,.75)'; ctx.fillRect(10, H - 30, W - 20, 24); ctx.fillStyle = '#fffaf0'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(msg, W / 2, H - 13); }
      /* Ziele prüfen */
      if (!done) {
        if (m.goal.kind === 'gate' && Math.abs(boat.y - H * .12) < 14 && Math.abs(boat.x - W * .5) < 36 && boat.v > 5) finish(true, 'Sauber abgelegt und durch das Tor. Genau so.');
        if (m.goal.kind === 'dock' && dock && boat.x < dock.w + 34 && boat.y > dock.y && boat.y < dock.y + dock.h) { if (speedKn > 2.5) { finish(false, 'Viel zu schnell am Steg. Nicht schneller als Schritttempo.'); } else if (Math.abs(boat.v) < 6 && Math.abs(Math.abs(Math.sin(boat.h)) - 1) < .25) finish(true, 'Parallel und langsam am Steg. Prüfungsreif.'); }
        if (mob && Math.hypot(boat.x - mob.x, boat.y - mob.y) < 30) { if (Math.abs(boat.v) < 8) { const ang = Math.abs(Math.atan2(Math.sin(boat.h - wind), Math.cos(boat.h - wind))); finish(true, ang > 2.2 ? 'Gestoppt und mit der Nase im Wind. Der Mensch ist gerettet.' : 'Gerettet. Noch besser: mit der Nase gegen den Wind stoppen, dann treibst du nicht weg.'); } else { finish(false, 'Zu schnell am Menschen vorbei. Erst stoppen, dann bergen.'); } }
        if (m.goal.kind === 'turn' && boat.turned > Math.PI * .95 && Math.abs(boat.v) < 10) finish(true, 'Um 180 Grad gedreht, ohne anzuecken.');
        if (m.box && (boat.x < W * .2 || boat.x > W * .8 || boat.y < H * .25 || boat.y > H * .75)) finish(false, 'Aus der Box gefahren. Kurz vor, Ruder umlegen, kurz zurück, wieder umlegen.');
      }
      if (!done) gameLoop = requestAnimationFrame(step);
    };
    gameLoop = requestAnimationFrame(step);
  };
  run();
}

<script>
/* ==========================================================================
   Kajütenfunk – vorgefertigte Folgen und Kurzgeschichten
   Folgen: locker wie ein Podcast, Themen hängen zusammen, Stopps mit Katalogfragen.
   Kurzgeschichten: nur Wissenswertes rund um die Seefahrt, nicht prüfungsrelevant,
   immer von einer anderen Figur erzählt. Rollen: K Käpt'n, M Matrose, T Bordtier.
   ========================================================================== */
/* Folgen und Kurzgeschichten liegen in data/folgen.json (loadData). Rollen: K Käptn, M Matrose, T Bordtier, Q Quiz-Stopp. */
let EPISODES = {sbf: [], sks: []};
let SHORTS = [];
</script>
<script>
/* ==========================================================================
   Lernen in der Kajüte
   Kapitel-Ablauf: erst raten (Vorab-Quiz), dann erklärt der Käpt'n gezielt nur das,
   was noch nicht saß, dann ein Abschluss-Quiz. Danach übernimmt die Wiederholung.
   ========================================================================== */

/* Kapitel in Abschnitte von höchstens 12 Fragen teilen */
let UNITS = [], TRAPS = [], RELATED = {};
function rebuildLearn() {
  UNITS = [];
  TOPICS.forEach(t => {
    const qs = Q.filter(t.has).map(q => q.n);
    const target = COURSE.kind === 'open' ? 7 : 12;
    const k = Math.max(1, Math.ceil(qs.length / target)), size = Math.ceil(qs.length / k);
    for (let i = 0; i < k; i++) UNITS.push({id: `${t.id}-${i + 1}`, topic: t, qs: qs.slice(i * size, (i + 1) * size), label: t.name + (k > 1 ? ` (Teil ${i + 1}/${k})` : '')});
  });
  TRAPS = COURSE.kind === 'mc' ? Q.filter(q => q.a.slice(1).some(x => diffWords(x, q.a[0]).sim >= .6)) : [];
  RELATED = COURSE.related || {};
}
rebuildLearn();
function unitStage(u) {
  S.chap = S.chap || {};
  const s = S.chap[u.id]; if (s && s.stage) return s.stage;
  const seen = u.qs.filter(n => st(n)).length;
  return seen >= Math.ceil(u.qs.length * .8) ? 'fertig' : 'neu';
}
const STAGE_NAMES = {neu: 'noch offen', vorab: 'geraten, Erklärung fehlt', erklaert: 'Abschluss-Quiz fehlt', fertig: 'geschafft'};

function startUnit(u) {
  const stg = unitStage(u);
  LOG.add('lernen', 'Kapitel ' + u.id + ' (' + stg + ')');
  if (stg === 'neu') return runVorab(u);
  if (stg === 'vorab') return explainUnit(u);
  if (stg === 'erklaert') return runAbschluss(u);
  runQuiz(shuffle(u.qs.map(n => QN[n])), 'Wiederholung: ' + u.label);
}
function runVorab(u) {
  AUD.sfx('glocke', {vol: .5});
  runQuiz(u.qs.map(n => QN[n]), 'Vorab-Quiz', 'learn', {
    noRequeue: true,
    hint: 'Einfach raten! Fehler sind hier ausdrücklich erwünscht. Danach erklärt dir die Crew genau das, was du noch nicht wusstest.',
    doneLabel: 'Weiter zur Erklärung',
    onDone: r => {
      S.chap[u.id] = {stage: r.wrong.length ? 'vorab' : 'fertig', miss: r.wrong, t: today()}; if (!r.wrong.length) markPath('unit'); save();
      if (r.wrong.length) explainUnit(u); else { toast('Alles gewusst. Respekt! Das Kapitel ist geschafft.'); setTab('cabin'); }
    },
  });
}
function runAbschluss(u) {
  const miss = (S.chap[u.id] && S.chap[u.id].miss) || [];
  runQuiz(shuffle(miss.map(n => QN[n]).filter(Boolean)), 'Abschluss-Quiz', 'learn', {
    doneLabel: 'Zurück in die Kajüte',
    onDone: () => { S.chap[u.id] = {...(S.chap[u.id] || {}), stage: 'fertig'}; markPath('unit'); save(); setTab('cabin'); },
  });
}
function explainUnit(u) {
  subScreen(); place = 'quiz'; soundFor('quiz');
  const miss = ((S.chap[u.id] && S.chap[u.id].miss) || []).map(n => QN[n]).filter(Boolean);
  const K = S.crew.K;
  app.innerHTML = `<div class="qhead"><div class="tag">Erklärung · ${esc(u.label)}</div><button class="btn small ghost" id="back">Kajüte</button></div>
    <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:8px">${charSVG(K)}<h1 style="margin:0">${esc(nameOf('K'))} erklärt</h1></div>
    <p class="muted small" style="margin:0 0 10px">Nur die ${miss.length} Fragen, die beim Raten noch nicht saßen.</p>
    <div class="card lesson" id="les"></div>
    <div class="card hidden" id="openq"></div>
    <div class="row"><button class="btn ghost hidden" id="read">Vorlesen</button><button class="btn lamp" id="nx">Zum Abschluss-Quiz</button></div>`;
  app.querySelector('svg.ch').style.width = '70px';
  $('#back').onclick = () => setTab('cabin');
  $('#nx').onclick = () => { VOX.stop('weiter zum Abschluss'); S.chap[u.id] = {...(S.chap[u.id] || {}), stage: 'erklaert'}; save(); runAbschluss(u); };
  const box = $('#les');
  /* Ohne Kosten: Antworten mit den Erklärungen der Karten. Die erzählte Erklärung mit Verständnisfrage gibt es per grauem Kostenknopf. */
  const fallback = () => { box.innerHTML = `<h3 style="margin-top:0">Die richtigen Antworten</h3><ul>${miss.map(q => { const c = cardOf(q); return `<li style="margin-bottom:8px"><strong>${esc(q.q)}</strong><br>${esc(ansText(q))}${c ? `<br><span class="small muted">${esc(c.e)}${c.m ? ' 💡 ' + esc(c.m) : ''}</span>` : ''}</li>`; }).join('')}</ul>`; clampLong(box); };
  fallback();
  const tell = document.createElement('button'); tell.className = 'btn ki wide'; tell.style.margin = '0 0 12px'; tell.textContent = nameOf('K') + ' erklärt es und fragt nach'; $('#openq').before(tell);
  tell.onclick = () => { tell.remove(); box.innerHTML = `<p class="think">${esc(nameOf('K'))} stopft die Pfeife und überlegt…</p>`; tellUnit(); };
  const tellUnit = () => ai(`Diese Katalogfragen hat der Lernende beim Raten noch nicht gewusst:\n${miss.map(catLine).join('\n')}\n\nErkläre jetzt genau diese Inhalte in deiner Art, etwa ${Math.min(320, 90 + miss.length * 35)} Wörter. Nicht auswendig lernen lassen, sondern verstehen: Zusammenhänge, Bilder, Merkhilfen. Markiere wichtige Begriffe mit **fett**. Schreibe ganz am Ende in eine eigene Zeile genau eine offene Verständnisfrage an den Lernenden im Format: FRAGE: <Frage>`, {system: leadPersona(), onText: tx => { box.innerHTML = md(tx.split(/\nFRAGE:/)[0]); }})
    .then(tx => {
      const [body, fq] = tx.split(/\n?FRAGE:\s*/);
      box.innerHTML = md(body); clampLong(box);
      const r = $('#read'); if (r) { r.className = 'btn ' + readCls(K, body, 'live'); r.onclick = () => { AUD.unlock(); VOX.stop('vorlesen neu'); VOX.say(K, body.replace(/\*\*/g, ''), 'live'); }; }
      if (fq && fq.trim()) openQuestion(fq.trim(), miss);
    })
    .catch(e => { fallback(); box.insertAdjacentHTML('afterbegin', `<p class="muted">${esc(aiErr(e))}</p>`); });
}
/* Eine offene Frage mit eigener Antwort (Text oder Sprache) */
function openQuestion(question, miss) {
  const c = $('#openq'); if (!c) return; c.classList.remove('hidden');
  c.innerHTML = `<div class="tag">Frage vom ${esc(ROLE_NAMES.K)}</div><p style="font-weight:700;margin:4px 0 8px">${esc(question)}</p>
    <textarea id="oa" placeholder="Antworte in deinen eigenen Worten…"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn ki" id="oasend">Antworten</button>${VOX.canListen ? `<button class="btn ghost" id="oamic">Sprechen</button>` : ''}<button class="btn ghost" id="oaskip">Überspringen</button></div>
    <div id="oafb" class="lesson" style="margin-top:8px"></div>`;
  $('#oaskip').onclick = () => c.classList.add('hidden');
  const mic = $('#oamic'); if (mic) mic.onclick = async () => { AUD.unlock(); VOX.stop('sprechen statt tippen'); mic.textContent = 'Ich höre zu…'; mic.disabled = true; const r = await VOX.listen({onInterim: t => { $('#oa').value = t; }}).done; mic.textContent = 'Sprechen'; mic.disabled = false; if (r.text) $('#oa').value = r.text; };
  $('#oasend').onclick = async () => {
    const ans = $('#oa').value.trim(); if (!ans) return;
    const fb = $('#oafb'); fb.innerHTML = '<p class="think">Hm, mal sehen…</p>'; $('#oasend').disabled = true;
    try {
      const tx = await ai(`Verständnisfrage: ${question}\nAntwort des Lernenden: ${ans}\nPassende Katalogfragen mit verbindlicher Antwort:\n${miss.map(catLine).join('\n')}\nBewerte in 2 bis 3 kurzen Sätzen in deiner Art: Was stimmt, was fehlt oder ist falsch? Beginne mit "Richtig.", "Fast." oder "Nicht ganz."`, {system: leadPersona(), modelTier: 'quick', maxTokens: 220, onText: t => { fb.innerHTML = md(t); }});
      fb.innerHTML = md(tx); const rb = document.createElement('button'); rb.className = 'btn small ' + readCls(S.crew.K, tx, 'live'); rb.textContent = 'Vorlesen';
      rb.onclick = () => { AUD.unlock(); VOX.stop(); VOX.say(S.crew.K, tx.replace(/\*\*/g, ''), 'live'); }; fb.appendChild(rb);
    } catch (e) { fb.innerHTML = `<p class="muted">${esc(aiErr(e))}</p>`; }
    $('#oasend').disabled = false;
  };
}
function reviewSession(title = 'Wiederholung', opts = {}) {
  const due = shuffle(Q.filter(q => isDue(q.n))).slice(0, Math.max(10, computePlan().cap));
  if (!due.length) return extraRound(opts);
  runQuiz(due, title, 'learn', opts);
}
/* Tagespfad: drei Etappen pro Tag, ein "Weiter" */
const coverage = () => Q.length ? Q.filter(q => st(q.n)).length / Q.length : 0;
function markPath(k) { todayPath(); S.path[k] = true; }
function todayPath() {
  const d = today(), due = Q.filter(q => isDue(q.n)).length;
  if (!S.path || S.path.day !== d || S.path.course !== S.course) S.path = {day: d, course: S.course, dueStart: due, review: false, unit: false, extra: false};
  const p = S.path, cov = coverage(), last = (S.exams || []).slice(-1)[0];
  const next = UNITS.find(u => ['vorab', 'erklaert'].includes(unitStage(u))) || UNITS.find(u => unitStage(u) === 'neu');
  const examDue = cov >= .6 && (!last || today() - last.day >= 3);
  const doneOpts = k => ({doneLabel: 'Zurück in die Kajüte', onDone: () => { markPath(k); save(); setTab('cabin'); }});
  return [

    {id: 'unit', label: next ? (unitStage(next) === 'neu' ? 'Neu: ' : 'Weiter: ') + next.label : (COURSE.kind === 'mc' ? 'Prüfungsfallen' : 'Wackelkandidaten'), done: p.unit,

function warmup(opts = {}) {

}

/* Prüfungsfallen: Fragen, deren falsche Antworten der richtigen zum Verwechseln ähneln */
