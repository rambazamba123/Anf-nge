urmwarnung im internationalen Sprachgebrauch?","a":"1. Bei zu erwartenden oder noch andauernden Windstärken von mindestens 8 Bft. 2. Gale warning."},{"id":"wetter-59","s":"wetter","n":59,"q":"Welche Wellenhöhe wird bei der Angabe des Seegangs in Seewetterberichten verwendet?","a":"Die kennzeichnende (charakteristische) Wellenhöhe."},{"id":"wetter-60","s":"wetter","n":60,"q":"1. Wie ist die kennzeichnende (charakteristische) Wellenhöhe definiert?\n2. Womit müssen Sie rechnen?","a":"1. Mittlere Höhe der gut ausgeprägten (Mittel des oberen Drittels) - nicht extremen - Wellen.\n2. Einzelne Wellen können das 1,5fache der kennzeichnenden Wellenhöhe erreichen."},{"id":"wetter-61","s":"wetter","n":61,"q":"Was bedeutet rechtdrehender bzw. rückdrehender Wind?","a":"Rechtdrehend bedeutet Änderung der Windrichtung im Uhrzeigersinn. Rückdrehend bedeutet Änderung der Windrichtung gegen den Uhrzeigersinn um mindestens 45°."},{"id":"wetter-62","s":"wetter","n":62,"q":"Sie hören am Ende eines Seewetterberichts die Stationsmeldungen. Was sagen Windrichtung und Windgeschwindigkeit gegenüber den Verhältnissen auf See aus?","a":"Durch die Umgebung der Wetterstation kann die Windrichtung verfälscht werden. Die Windgeschwindigkeit ist meist reduziert, in Einzelfällen auch erhöht."},{"id":"wetter-63","s":"wetter","n":63,"q":"Welche Sichtweiten umfasst der Begriff \"diesig\"?","a":"Sichtweiten über 1 km bis 10 km (bzw. ca. 0,5 bis 6 Seemeilen)."},{"id":"wetter-64","s":"wetter","n":64,"q":"Seegebiete sind international festgelegt. In welchen amtlichen Veröffentlichungen können Sie nachlesen, wo sich das Seegebiet \"Fischer\" befindet?","a":"Im \"Handbuch Nautischer Funkdienst\", im \"Jachtfunkdienst für Nord- und Ostsee\" oder in der \" Admiralty List of Radio Signals \"."},{"id":"wetter-65","s":"wetter","n":65,"q":"Sie wollen einen Törn in einem für Sie fremden Küstenrevier fahren. Wie können Sie sich über mittlere Windverhältnisse für bestimmte Jahreszeiten oder Monate informieren?","a":"In den entsprechenden Hafen-, Revierführern. Außerdem z. B. in Monatskarten."},{"id":"wetter-66","s":"wetter","n":66,"q":"1. Was für Wetter muss meistens erwartet werden, wenn der Luftdruck über einen Zeitraum von 3 Stunden um 10 hPa fällt?\n2. Was muss bei einem an Bord beobachteten starken Luftdruckfall beachtet werden?","a":"1. Schwerer Sturm.\n2. Der Kurs und die Fahrt des Schiffes in Bezug auf das Tiefdruckgebiet."},{"id":"wetter-67","s":"wetter","n":67,"q":"Wie verändert sich der an Bord beobachtete Luftdruckfall, wenn sich ein Fahrzeug mit Westkurs dem Zentrum eines ostwärts ziehenden Tiefdruckgebiets nähert?","a":"Der Luftdruckfall wird verstärkt."},{"id":"wetter-68","s":"wetter","n":68,"q":"Mit welchen Windverhältnissen müssen Sie rechnen, wenn Sie im Hafen liegen und der Wind ablandig weht?","a":"Die im Hafen vorherrschenden Windgeschwindigkeiten entsprechen nicht den Verhältnissen auf der freien See."},{"id":"wetter-69","s":"wetter","n":69,"q":"Mit welchen Windverhältnissen müssen Sie rechnen, wenn Sie in einem relativ ungeschützten Hafen liegen und der Wind auflandig weht?","a":"Die im Hafen vorherrschenden Windgeschwindigkeiten entsprechen etwa den Verhältnissen auf der freien See."},{"id":"wetter-70","s":"wetter","n":70,"q":"Warum verstärkt sich der Wind in engen Durchfahrten?","a":"Durch den Düseneffekt (Trichtereffekt) in Durchfahrten. Dabei wird die Luftströmung \"zusammengepresst\" und beschleunigt."},{"id":"wetter-71","s":"wetter","n":71,"q":"Mit welcher Windentwicklung ist zu rechnen\n1. in Luv und\n2. in Lee von Kaps oder Inseln?","a":"1. Die Windrichtung ändert sich in Luv des Kaps zum Teil stark und verläuft oft parallel zum Kap. Die Windgeschwindigkeit nimmt zu.\n2. Die Windrichtung kann bei besonders hohen Gebirgen auch umlaufend werden. Die Windgeschwindigkeit ist meist schwach, kann dafür örtlich aber sehr böig sein (Fallwinde)."},{"id":"wetter-72","s":"wetter","n":72,"q":"Welche Windverhältnisse erwarten Sie in der Nähe von Steilküsten\n1. bei auflandigem und\n2. bei ablandigem Wind?","a":"1. Der Wind wird durch Küstenführung zum Teil beschleunigt, wenn er nahezu auflandig oder parallel zur Küste weht.\n2. Weht der Wind ablandig, muss örtlich mit umlaufenden Winden und erhöhter Böigkeit (Fallwinden) gerechnet werden."},{"id":"wetter-73","s":"wetter","n":73,"q":"Wie wird sich das Wetter wahrscheinlich entwickeln, wenn der Wind am Abend\n1. abflaut oder\n2. zunimmt?","a":"1. Langsames Abflauen des Windes ist oft ein Zeichen für gutes Wetter.\n2. Windzunahme am Abend kündigt häufig Starkwind, Sturm und Regen an."},{"id":"wetter-74","s":"wetter","n":74,"q":"1. Womit müssen Sie auf der Nordhalbkugel rechnen, wenn nach Durchzug einer Kaltfront der Wind rückdreht und der Luftdruck wieder fällt?\n2. Wie nennt man die Wetterlage?","a":"1. Meist deutliche Wetterverschlechterung mit erneut auffrischendem Wind bis Sturmstärke.\n2. Troglage."},{"id":"wetter-75","s":"wetter","n":75,"q":"Welche Windverhältnisse erwarten Sie auf der Nordhalbkugel während der unmittelbaren Passage eines markanten Troges?","a":"Der Wind dreht recht, meist über 60 bis 90°. Winde bis Orkanstärke besonders auf der Rückseite eines Troges."},{"id":"wetter-76","s":"wetter","n":76,"q":"Wie entsteht Nebel?","a":"Zufuhr von Feuchte, Mischung von Luftmassen mit hoher Feuchtigkeit und verschiedener Temperatur, Abkühlung der Luftmasse."},{"id":"wetter-77","s":"wetter","n":77,"q":"Wie ist Nebel definiert?","a":"Sichtweite unter 1 000 Meter."},{"id":"wetter-78","s":"wetter","n":78,"q":"1. Wie entsteht Kaltwassernebel?\n2. Zu welcher Jahreszeit tritt diese Nebelart in europäischen Gewässern bevorzugt auf?","a":"1. Warme und feuchte Luftmassen werden durch den kalten Untergrund (Meer) unter den Taupunkt abgekühlt.\n2. Überwiegend im Frühjahr."},{"id":"wetter-79","s":"wetter","n":79,"q":"1. Wie entsteht Warmwassernebel?\n2. Zu welcher Jahreszeit tritt diese Nebelart in europäischen Gewässern bevorzugt auf?","a":"1. Kalte Luft strömt über warmes Wasser. Durch Verdunstung an der Wasseroberfläche kommt es bei hoher Differenz zwischen der Luft- und Wassertemperatur zur Feuchtesättigung.\n2. Überwiegend im Herbst."},{"id":"wetter-80","s":"wetter","n":80,"q":"1. Wie entsteht Strahlungsnebel?\n2. Wo ist diese Nebelart anzutreffen?","a":"1. Nach Sonnenuntergang kann sich bei klarem Himmel die bodennahe Luftschicht über Land unter den Taupunkt abkühlen.\n2. Besonders auf Flüssen und engen Durchfahrten, außerdem durch seewärtige Windverdriftung in Küstennähe."},{"id":"wetter-81","s":"wetter","n":81,"q":"Wodurch kann es im Mittelmeerraum in besonderen Fällen zur Sichtreduktion kommen?","a":"Bei bestimmten Wetterlagen kann mit der Luftmasse transportierter Saharastaub die Sicht stark vermindern."},{"id":"wetter-82","s":"wetter","n":82,"q":"Woraus besteht Seegang?","a":"Aus Windsee und Dünung."},{"id":"wetter-83","s":"wetter","n":83,"q":"Was verstehen Sie unter Windsee?","a":"Seegang, der durch den Wind am Ort oder in der näheren Umgebung angefacht wird."},{"id":"wetter-84","s":"wetter","n":84,"q":"Wovon hängt die Höhe der Windsee ab?","a":"Windgeschwindigkeit, Fetch (Windwirklänge) und Wirkdauer des Windes."},{"id":"wetter-85","s":"wetter","n":85,"q":"1. Was verstehen Sie unter Dünung?\n2. Was kann einsetzende hohe Dünung andeuten?","a":"1. Seegang, der dem erzeugenden Windfeld vorausläuft, sowie abklingender (alter) Seegang.\n2. Einen eventuell aufziehenden Sturm."},{"id":"wetter-86","s":"wetter","n":86,"q":"Was verstehen Sie unter der Wellenhöhe?","a":"Der senkrechte Abstand zwischen Wellenberg und Wellental."},{"id":"wetter-87","s":"wetter","n":87,"q":"Was verstehen Sie unter der Wellenlänge?","a":"Der horizontale Abstand zwischen zwei Wellenbergen."},{"id":"wetter-88","s":"wetter","n":88,"q":"Welchen Seegang müssen Sie erwarten, wenn Sie küstennah bei ablandigem Wind fahren?","a":"Der Seegang wird nicht so hoch sein wie auf der freien See, da der Fetch (Windwirklänge) nur sehr kurz ist."},{"id":"wetter-89","s":"wetter","n":89,"q":"1. Welchen Seegang müssen Sie erwarten, wenn Sie küstennah bei auflandigem Wind fahren?\n2. Welche Gefahr besteht bezüglich der Entwicklung des Seegangs außerdem?","a":"1. Der Seegang wird ähnlich ausgeprägt sein wie auf der freien See, da genügend Fetch (Windwirklänge) vorhanden ist.\n2. Dort, wo das Wasser flacher wird, oder im Bereich von Untiefen muss mit Brechern und Grundseen gerechnet werden."},{"id":"wetter-90","s":"wetter","n":90,"q":"1. Was verstehen Sie unter einer Grundsee?\n2. Welche Höhen kann sie erreichen?","a":"1. Meereswellen mit besonders hohen Brechern, die durch Untiefen oder Küstennähe bzw. durch ansteigenden Meeresboden entstehen.\n2. Etwa das 2,5fache der kennzeichnenden (charakteristischen) Wellenhöhe."},{"id":"wetter-91","s":"wetter","n":91,"q":"Wie verändert sich Seegang, wenn Wind und Meeresströmungen (z. B. Gezeitenstrom) entgegengesetzte Richtungen haben?","a":"Die Wellen werden kürzer und steiler."},{"id":"wetter-92","s":"wetter","n":92,"q":"Wie verändert sich Seegang, wenn Wind und Meeresströmungen (z. B. Gezeitenstrom) die gleiche Richtung haben?","a":"Die Wellen werden länger und flacher."},{"id":"wetter-93","s":"wetter","n":93,"q":"1. Was verstehen Sie unter einer Kreuzsee?\n2. Geben Sie 3 Beispiele an, wo mit Kreuzsee zu rechnen ist.","a":"1. Windsee und Dünung laufen aus unterschiedlichen Richtungen heran.\n2. Kurz vor und bei dem Durchzug einer Kaltfront oder eines Troges sowie in der Nähe des Tiefkerns."},{"id":"wetter-94","s":"wetter","n":94,"q":"Welcher Seegang ist in Lee kleiner Inseln zu erwarten?","a":"Kreuzlaufende See, die meist kurz und kabbelig ist."},{"id":"wetter-95","s":"wetter","n":95,"q":"Welche Faktoren können die Länge und Höhe des Seegangs erheblich verändern?","a":"Wassertiefe sowie Meeres- und Gezeitenströmungen."},{"id":"wetter-96","s":"wetter","n":96,"q":"Im Internet finden Sie auf einer \"Wetterseite\" eine Vorhersagekarte für die Dünung. Können Sie daraus ungefähr den vorherrschenden Wind über See ableiten?","a":"Nein. Dünung kann vorhanden sein, auch wenn kein Windfeld unmittelbar vorhanden ist."},{"id":"wetter-97","s":"wetter","n":97,"q":"Mit welchem Messinstrument wird an Bord die Windgeschwindigkeit gemessen?","a":"Mit einem Anemometer."},{"id":"wetter-98","s":"wetter","n":98,"q":"Welche Windgeschwindigkeit zeigt das Anemometer an, wenn das Fahrzeug Fahrt durchs Wasser macht?","a":"Die scheinbare Windgeschwindigkeit."},{"id":"wetter-99","s":"wetter","n":99,"q":"1. Warum sollten Luftdrucktendenzen an Bord beobachtet und aufgezeichnet werden?\n2. In welchem zeitlichen Abstand sollte man den Luftdruck aufzeichnen?","a":"1. Eventuelle Wetterveränderungen (z. B. Trog, Annäherung eines Tiefdruckgebiets) können registriert werden.\n2. Mindestens alle 4 Stunden."},{"id":"wetter-100","s":"wetter","n":100,"q":"Mit welchem Messinstrument wird an Bord der Luftdruck gemessen?","a":"Mit dem Barometer oder Barographen."},{"id":"wetter-101","s":"wetter","n":101,"q":"1. Wie bestimmen Sie an Bord die Windstärke, wenn keine Windmessanlage vorhanden ist?\n2. Wie bestimmen Sie an Bord die Windrichtung, wenn keine Windmessanlage vorhanden ist?","a":"1. Die Windstärke wird geschätzt mit Hilfe der Beaufortskala in Anlehnung an das Seegangsbild.\n2. Die Windrichtung wird anhand der Verlagerung der Wellenkämme geschätzt. Stand: 01. Juli 2006 © Wasserstraßen- und Schifffahrtsverwaltung des Bundes"},{"id":"see1-1","s":"see1","n":1,"q":"Was versteht man im Bootsbau unter Gelcoat?","a":"Die äußere Schutzschicht eines Bauteils aus glasfaserverstärktem Kunststoff."},{"id":"see1-2","s":"see1","n":2,"q":"Was versteht man beim GFK-Bootsbau unter Sandwichverfahren (GFK = glasfaserverstärkter Kunststoff)?","a":"Zwischen zwei GFK-Schichten wird eine Zwischenlage zur Versteifung einlaminiert, z. B. aus Balsaholz."},{"id":"see1-3","s":"see1","n":3,"q":"Welchen Vorteil hat die Sandwichbauweise gegenüber der Massivbauweise bei GFK-Yachten (GFK = glasfaserverstärkter Kunststoff)?","a":"Große Steifheit, Verwindungsfestigkeit, geringes Gewicht, gute Isolierung."},{"id":"see1-4","s":"see1","n":4,"q":"Beschreiben Sie die Vor- und Nachteile von Stahl als Baumaterial für Yachten.","a":"Vorteile:\nzuverlässiges, problemloses Baumaterial mit sehr hoher Festigkeit und langer Lebensdauer. Nachteile:\nhohes Gewicht, Rostanfälligkeit."},{"id":"see1-5","s":"see1","n":5,"q":"Was bedeutet der Begriff \"Kategorie\" im Zusammenhang mit dem CE-Zeichen für Wassersportfahrzeuge?","a":"Mit der Kategorie legt der Hersteller fest, in welchem Fahrgebiet, bis zu welcher Windstärke und bis zu welcher charakteristischen Wellenhöhe das Fahrzeug sicher betrieben werden kann."},{"id":"see1-6","s":"see1","n":6,"q":"Welche Kategorien können im Zusammenhang mit dem CE-Zeichen für Wassersportfahrzeuge vergeben werden?","a":"1. A Hochsee,\n2. B Außerhalb von Küstengewässern,\n3. C Küstennahe Gewässer,\n4. D Geschützte Gewässer."},{"id":"see1-7","s":"see1","n":7,"q":"Was bedeutet die im Zusammenhang mit dem CE-Zeichen für Wassersportfahrzeuge angegebene Kategorie \"B Außerhalb von Küstengewässern\"?","a":"Das Fahrzeug ist ausgelegt für Fahrten außerhalb von Küstengewässern, in denen Windstärken bis einschließlich 8 Bft und signifikante Wellenhöhen bis einschließlich 4 m auftreten können."},{"id":"see1-8","s":"see1","n":8,"q":"Beschreiben Sie den Aufbau einer Radsteuerung mit Seilzügen.","a":"Das Rad dreht ein Zahnrad, über das eine Kette in der Steuersäule nach unten verläuft. Die Kette ist mit den Steuerseilen verbunden, welche über Umlenkrollen zum Ruderquadranten führen."},{"id":"see1-9","s":"see1","n":9,"q":"Wie nennt man die Teile des \"stehenden Gutes\", die den Mast nach vorn, achtern und seitlich verankern?","a":"Stagen und Wanten."},{"id":"see1-10","s":"see1","n":10,"q":"1. Wozu dienen Backstagen?\n2. Bei welchen Takelungen werden sie vor allem gefahren?","a":"1. Zum zusätzlichen Abstagen des Mastes nach achtern.\n2. Bei 7/8-Takelung und anderen nicht toppgetakelten Yachten."},{"id":"see1-11","s":"see1","n":11,"q":"Was ist das \"laufende Gut\"?","a":"Tauwerk, das zum Setzen, Bergen oder Bedienen der Segel oder anderer Teile der Takelage dient."},{"id":"see1-12","s":"see1","n":12,"q":"Was gehört zur regelmäßigen Pflege der Segel?","a":"1. Nasse Segel trocknen,\n2. Segel vor Sonnenlicht schützen,\n3. Salzwasserreste abspülen und\n4. Beschädigungen umgehend beseitigen."},{"id":"see1-13","s":"see1","n":13,"q":"Warum sollten Vorsegel für schweres Wetter im Unterliek hoch geschnitten sein?","a":"Damit überkommende Seen nicht ins Segel schlagen und so Rigg und Segel belasten."},{"id":"see1-14","s":"see1","n":14,"q":"Was ist ein Trysegel und wie wird es gefahren?","a":"Ein Schwerwettersegel, das anstelle des Großsegels mit losem Unterliek gefahren wird."},{"id":"see1-15","s":"see1","n":15,"q":"Warum soll man das Schlagen eines Segels vermeiden, vor allem bei stärkerem Wind?","a":"Um Beschädigungen zu vermeiden."},{"id":"see1-16","s":"see1","n":16,"q":"Wozu dienen Segellatten?","a":"Zur Profilierung des Segels, damit das Achterliek nicht einklappt."},{"id":"see1-17","s":"see1","n":17,"q":"Wozu dient ein \"Cunningham-Stropp\"?","a":"Zur Regulierung der Vorliekspannung des Großsegels, um es so zu trimmen."},{"id":"see1-18","s":"see1","n":18,"q":"Welche Segel sollte eine Segelyacht in der Küstenfahrt mindestens an Bord haben?","a":"1. Reffbares Großsegel,\n2. reffbare Rollfock oder Vorsegel verschiedener Größen,\n3. Sturmfock."},{"id":"see1-19","s":"see1","n":19,"q":"Wozu dient eine Vorsegel-Rollreffeinrichtung?","a":"Mit ihr wird das Vorsegel um das Vorstag gerollt und kann so stufenlos verkleinert werden."},{"id":"see1-20","s":"see1","n":20,"q":"Wozu dient eine Großsegel-Rollreffeinrichtung?","a":"Mit ihr wird das Großsegel entweder im Mast oder im Baum aufgerollt und kann stufenlos verkleinert werden."},{"id":"see1-21","s":"see1","n":21,"q":"Wozu dient der Lenzkorb am Ansaugstutzen einer Lenzpumpe und wie erhalten Sie damit ihre Funktionsfähigkeit?","a":"Der Lenzkorb verhindert Verunreinigungen und Verstopfungen der Lenzpumpe. Er muss regelmäßig überprüft und gereinigt werden."},{"id":"see1-22","s":"see1","n":22,"q":"Welche Lenzvorrichtungen und -möglichkeiten sollten auf jeder seegehenden Yacht vorhanden sein?","a":"Zwei voneinander unabhängige Bilgenpumpen, von denen eine über Deck und eine unter Deck bedienbar ist, sowie 2 Pützen mit Leinen."},{"id":"see1-23","s":"see1","n":23,"q":"Warum sollten Sie mehr als einen Anker an Bord haben, möglichst unterschiedlicher Art?","a":"1. Als Ersatz bei Verlust,\n2. zum Verwarpen oder Verkatten,\n3. um unterschiedliche Ankergründe berücksichtigen zu können,\n4. um bei schwerem Wetter oder in Tidengewässern vor 2 Ankern liegen zu können."},{"id":"see1-24","s":"see1","n":24,"q":"Wie viele Fender und Festmacherleinen sollten Sie mindestens an Bord haben?","a":"4 Festmacherleinen und 4 Fender."},{"id":"see1-25","s":"see1","n":25,"q":"Was sollte auf jeder Yacht außer Festmacherleinen, Fallen und Schoten an Tauwerk vorhanden sein?","a":"Reservetauwerk, Wurfleine, Schlepptrosse und Ankerleine."},{"id":"see1-26","s":"see1","n":26,"q":"Für welche unterschiedlichen Reparaturbereiche sollten Sie Ersatzteile und Werkzeug an Bord haben?","a":"1. Segelreparaturen,\n2. Reparaturen an Rumpf und Rigg,\n3. Motorreparaturen,\n4. Elektroreparaturen und\n5. Reparaturen an Schlauchleitungen."},{"id":"see1-27","s":"see1","n":27,"q":"Welches Werkzeug sollten Sie zur Segelreparatur an Bord haben?","a":"Segelhandschuh, Segelnadeln, Segelgarn, Wachs, Zange und selbstklebendes Segeltuch."},{"id":"see1-28","s":"see1","n":28,"q":"Ihr Mast ist gebrochen, eine Bergung ist nicht möglich. Welche Werkzeuge benötigen Sie, um die Takelage zu kappen?","a":"Bolzenschneider, Metallsäge mit Ersatzblättern, Schraubenschlüssel und verschiedene Zangen."},{"id":"see1-29","s":"see1","n":29,"q":"Welches Kleinmaterial und Kleinwerkzeug muss an Bord jederzeit greifbar sein?","a":"Zeisinge, Bändselwerk, Tape, Reserveschäkel, Schäkelöffner, Bordmesser und Kombizange."},{"id":"see1-30","s":"see1","n":30,"q":"Womit muss insbesondere eine Yacht mit Radsteuerung zusätzlich ausgerüstet sein, und warum sollten alle Mitsegler mit dieser Einrichtung vertraut sein?","a":"Mit einer Notpinne. Sie muss ggf. in kürzester Zeit einsatzbereit sein."},{"id":"see1-31","s":"see1","n":31,"q":"Wo finden Sie amtliche Informationen über die Ausrüstung und Sicherheit von Sportbooten, die auch bei der Beurteilung von Sportbootunfällen herangezogen werden?","a":"1. \"Sicherheit im See- und Küstenbereich, Sorgfaltsregeln für Wassersportler\", herausgegeben vom BSH,\n2. \"Sicherheit auf dem Wasser, Leitfaden für Wassersportler\", herausgegeben vom Bundesministerium für Verkehr, Bau und Stadtentwicklung."},{"id":"see1-32","s":"see1","n":32,"q":"Warum müssen auf Yachten zusätzlich zu elektrisch oder motorgetriebenen Lenzpumpen auch Handlenzpumpen vorhanden sein?","a":"Weil sie auch bei Strom- oder Motorausfall betätigt werden können."},{"id":"see1-33","s":"see1","n":33,"q":"Warum ist Flüssiggas (Propan, Butan) an Bord einer Yacht besonders gefährlich?","a":"Es ist schwerer als Luft, sinkt nach unten und bildet mit Luft ein explosives Gemisch; es kann sich im Schiffsinneren (z. B. in der Bilge) sammeln."},{"id":"see1-34","s":"see1","n":34,"q":"Welche 4 Bedienelemente besitzt ein mit Handpumpe betriebenes Bord-WC auf einer Yacht?","a":"1. Seeventil und Spülwasserschlauch (Seewasser),\n2. Handpumpe für Toilettenspülung,\n3. Hebel zur Unterbrechung der Seewasserzufuhr (Handpumpe dient dann nur noch zum Abpumpen),\n4. Abwasserschlauch (via Fäkalientank) zum Seeventil."},{"id":"see1-35","s":"see1","n":35,"q":"Beschreiben Sie in 5 Schritten die Bedienung eines Bord-WC auf einer Yacht.","a":"1. Seeventil für Seewasserspülung öffnen,\n2. Handpumpe betätigen, sodass das Becken gespült wird und gleichzeitig die Fäkalien abfließen - ausgiebig spülen,\n3. Seewasserzufuhr unterbrechen (Hebel umlegen),\n4. Becken mit Handpumpe leer pumpen,\n5. Seeventile für Zu- und Abfluss schließen."},{"id":"see1-36","s":"see1","n":36,"q":"Was versteht man unter der \"Stabilität\" eines Schiffes?","a":"Unter Stabilität eines Schiffes versteht man seine Eigenschaft, in aufrechter Lage zu schwimmen und sich aus einer Krängung wieder aufzurichten."},{"id":"see1-37","s":"see1","n":37,"q":"Wovon hängt die Stabilität eines Schiffes in ruhigem Wasser ab? Nennen Sie Beispiele für äußere Momente, welche die Stabilität beanspruchen.","a":"Die Stabilität eines Schiffes hängt ab von:\n1. seiner Geometrie (Form),\n2. der Gewichtsverteilung im Schiff (Ausrüstung, Crew, Ballast). Beispiele für eine Beanspruchung der Stabilität sind krängende Momente durch Seitenwind, Trossenzug oder Drehkreisfahrt bei schnellen Motoryachten."},{"id":"see1-38","s":"see1","n":38,"q":"Wovon hängt eine in ruhigem Wasser vorhandene Stabilität zusätzlich in schwerem Wetter ab?","a":"Die Stabilität in schwerem Wetter hängt zusätzlich von Wind und Seegang, besonders von brechenden Wellen ab."},{"id":"see1-39","s":"see1","n":39,"q":"Was versteht man unter\n1. Formschwerpunkt (F)?\n2. Massenschwerpunkt (Gewichtsschwerpunkt, G)? Welche Kräfte wirken in den beiden Punkten?","a":"1. Im Formschwerpunkt F kann man sich die Masse des vom Schiff verdrängten Wassers vereinigt denken. In F wirkt die Auftriebskraft senkrecht zur Wasseroberfläche nach oben.\n2. Im Massenschwerpunkt G kann man sich die Masse des Schiffes einschließlich Ausrüstung und Besatzung vereinigt denken. In G wirkt die Gewichtskraft senkrecht zur Wasseroberfläche nach unten."},{"id":"see1-40","s":"see1","n":40,"q":"Was geschieht bei einer Neigung des Schiffes, z. B. durch seitlichen Winddruck, solange sich die Lage des Massenschwerpunktes (Gewichtsschwerpunktes) nicht verändert? (Begründung!)","a":"Der Formschwerpunkt F wandert zur geneigten Seite aus, weil dort ein größerer Teil des Bootskörpers unter Wasser gelangt. Die Wirklinie der Auftriebskraft bekommt dadurch einen seitlichen Abstand zur Wirklinie der Gewichtskraft. Es entsteht ein Kräftepaar, der seitliche Abstand zwischen den Wirklinien ist der Hebelarm. Es entsteht ein aufrichtendes Moment, welches gleich dem Produkt aus Gewichtskraft und Hebelarm ist."},{"id":"see1-41","s":"see1","n":41,"q":"Erklären Sie mit Hilfe eines Vektorparallelogramms aus \"wahrem Wind (wW)\", \"Fahrtwind (Fw)\" und \"scheinbarem Wind (sW)\", warum beim Einfallen einer Bö (Windzunahme) der \"scheinbare Wind\" raumt. Welcher Vorteil ergibt sich dadurch beim Kreuzen? (Zeichnung!)","a":"Verhältnisse vor Einfall der Bö Verhältnisse bei Einfall der Bö:\nDer \"scheinbare Wind\" fällt etwas achterlicher ein, er \"raumt\", und das Segelboot kann etwas höher an den \"wahren Wind\" gehen.","qi":["img/q/44fc14daf0fe.png","img/q/3857c3587f06.png"]},{"id":"see1-42","s":"see1","n":42,"q":"Auf Amwindkurs mussten Sie reffen. Ein entgegenkommendes Boot gleicher Größe segelt ungerefft. Wie erklären Sie das?","a":"Der \"scheinbare Wind\" ist unterschiedlich stark. Er ist auf Amwindkursen stärker und auf Raumschot- oder Vorwindkursen schwächer als der \"wahre Wind\"."},{"id":"see1-43","s":"see1","n":43,"q":"Warum wird die Versetzung einer Yacht durch den Wind mit zunehmender Krängung größer?","a":"Der Lateralplan wird kleiner, dadurch verringert sich der seitliche Widerstand des Schiffes im Wasser."},{"id":"see1-44","s":"see1","n":44,"q":"Welchen Einfluss hat zunehmende Krängung auf den Trimm eines Segelbootes? (Begründung!)","a":"Die Luvgierigkeit nimmt zu, weil der Segeldruckpunkt nach Lee auswandert."},{"id":"see1-45","s":"see1","n":45,"q":"Sie segeln am Wind, Krängung und Ruderdruck nehmen stark zu.\n1. Wie bezeichnet man das Verhalten des Bootes?\n2. Mit welchen Mitteln können Sie die Krängung und den Ruderdruck vermindern?","a":"1. Luvgierigkeit.\n2. Traveller nach Lee setzen und/oder Großschot (etwas) fieren, Großsegel reffen."},{"id":"see1-46","s":"see1","n":46,"q":"Welche Funktion hat ein Unterliekstrecker und wie kann mit dem Unterliekstrecker der Trimm des Großsegels beeinflusst werden?","a":"Er reguliert die Spannung der Unterlieks. Je nach Zugkraft wird der untere Teil des Großsegels flacher oder bauchiger."},{"id":"see1-47","s":"see1","n":47,"q":"Das Vorliek der Fock wirft Falten. Welches ist die häufigste Ursache?","a":"Das Fall ist nicht genügend durchgesetzt."},{"id":"see1-48","s":"see1","n":48,"q":"Das Unterliek Ihres Vorsegels killt. Was ist die Ursache?","a":"Der Holepunkt der Schot liegt zu weit vorne."},{"id":"see1-49","s":"see1","n":49,"q":"Das Achterliek Ihres Vorsegels killt. Was ist die Ursache?","a":"Der Holepunkt der Schot liegt zu weit achtern."},{"id":"see1-50","s":"see1","n":50,"q":"Wozu dienen Windfäden am Segel?","a":"Sie machen den Strömungsverlauf am Segel sichtbar, um das Segel optimal trimmen zu können."},{"id":"see1-51","s":"see1","n":51,"q":"1. Wann sollte ein Großsegel flach getrimmt sein?\n2. Wie kann ein Großsegel flach getrimmt werden?","a":"1. Bei Starkwind.\n2. Dichtholen von Unterliek- und Vorliekstrecker, Dichtholen der Großschot, Durchsetzen des Großfalls, Spannung des Achterstags erhöhen, Traveller nach Lee."},{"id":"see1-52","s":"see1","n":52,"q":"Mit welchen 6 Teilen des laufenden und stehenden Guts können Sie ein Großsegel trimmen?","a":"Großschot, Traveller, Unterliekstrecker, Cunninghamstrecker, Großfall, Achterstagspanner."},{"id":"see1-53","s":"see1","n":53,"q":"Wozu dienen \"Opferanoden\" und wann sollten sie ausgewechselt werden?","a":"Sie dienen dem Schutz gegen Schäden durch Elektrolyse. Verbrauchte Anoden müssen nach einer Saison ersetzt werden, nicht erst wenn sie verbraucht sind."},{"id":"see1-54","s":"see1","n":54,"q":"Wie schützt man auf Kunststoffyachten den Propeller gegen Elektrolyse?","a":"Durch eine Zinkanode auf der Propellerwelle."},{"id":"see1-55","s":"see1","n":55,"q":"Welche Sicherheitsmaßnahmen sind vor und beim Tanken von Diesel zu treffen?","a":"1. Maschine abstellen,\n2. offenes Feuer löschen (Rauchen einstellen),\n3. Maßnahmen gegen Überlaufen treffen."},{"id":"see1-56","s":"see1","n":56,"q":"Wie können Sie beim Tanken Umweltverschmutzungen vermeiden?","a":"1. Tanköffnung mit Ölbindetüchern umlegen,\n2. möglichst an Zapfsäulen mit Zapfhahn tanken,\n3. beim Tanken aus Kanistern großen Trichter mit Schlauch benutzen,\n4. Nachfüllen aus Kanistern bei Wind und bewegter See möglichst vermeiden."},{"id":"see1-57","s":"see1","n":57,"q":"Wozu dient das Wendegetriebe eines Motors?","a":"1. Zum Ein- und Auskuppeln des Propellers,\n2. zum Umsteuern des Propellers auf Rückwärtsfahrt,\n3. zur Drehzahluntersetzung."},{"id":"see1-58","s":"see1","n":58,"q":"Welche Maßnahmen sind vor dem Anlassen eines eingebauten Motors zu treffen?","a":"1. Hauptstromschalter einschalten,\n2. Kraftstoff- und Kühlwasserventile öffnen,\n3. Getriebe auf \"neutral\" stellen."},{"id":"see1-59","s":"see1","n":59,"q":"Was sollte nach dem Anlassen der Maschine kontrolliert werden?","a":"1. Kühlwasserdurchlauf,\n2. Öldruck und Ladung,\n3. Motorengeräusche und\n4. Auspuffgase."},{"id":"see1-60","s":"see1","n":60,"q":"Was können erste Störungsanzeichen im Motorbetrieb sein?","a":"Ungewöhnliche und fremde Motorengeräusche, Vibrationen, Verfärbung der Abgase, Aufleuchten der Ladekontrolle bzw. Öldruckkontrolle und die entsprechenden akustischen Warnungen."},{"id":"see1-61","s":"see1","n":61,"q":"Wie können Sie einen Dieselmotor abstellen, wenn die vorgesehene Abstellvorrichtung defekt ist?","a":"1. Kraftstoffzufuhr unterbrechen.\n2. Verschließen des Luftansaugrohres/der Luftansaugrohre."},{"id":"see1-62","s":"see1","n":62,"q":"Der Dieselmotor Ihres Bootes startet nicht. Welche Fehler, die Sie selber überprüfen können, könnten die Ursache sein?","a":"1. Anlasserdrehzahl zu gering (Batterie zu schwach),\n2. kein Kraftstoff im Tank,\n3. Luft in der Kraftstoffleitung,\n4. falsche Bedienung der Kaltstarthilfe (eventuell Vorglühen zu kurz),\n5. Anlasser defekt."},{"id":"see1-63","s":"see1","n":63,"q":"Der Motor Ihres Bootes bleibt beim Einkuppeln stehen. Nennen Sie mögliche Ursachen.","a":"1. Propellerwelle durch Tauwerk o. Ä. blockiert,\n2. Schwerlauf des Getriebes wegen defekter Zahnräder, Lagerschaden, dicken Öls oder\n3. verbogene Propellerwelle."},{"id":"see1-64","s":"see1","n":64,"q":"Während Sie unter Maschine laufen, steigt plötzlich die Kühlwassertemperatur stark an. Ihre Yacht ist mit einem Saildrive-Antrieb ausgestattet.\n1. Welche typische Ursache hat der Temperaturanstieg, wenn eine technische Störung unwahrscheinlich ist?\n2. Wie können Sie die Störung einfach beheben?","a":"1. Fremdkörper (Folienstücke, Plastiktüten, Pflanzenteile o. Ä.) haben den Kühlwassereinlass verstopft.\n2. Mehrmals abwechselnd vor- und zurückfahren, sodass sich die Fremdkörper vom Kühlwassereinlass lösen."},{"id":"see1-65","s":"see1","n":65,"q":"Welche Propeller werden auf Yachten mit Einbaumotor eingesetzt?","a":"Festflügelpropeller, Faltpropeller, Drehflügelpropeller und Verstellpropeller."},{"id":"see1-66","s":"see1","n":66,"q":"Was müssen Sie beim Aufstoppen unter Maschine mit einem Faltpropeller beachten?","a":"Der Propeller entfaltet sich eventuell erst bei relativ hoher Drehzahl und der Wirkungsgrad ist geringer als beim Festflügelpropeller."},{"id":"see1-67","s":"see1","n":67,"q":"Mit welchen 4 Angaben werden Propeller auf Yachten beschrieben?","a":"Anzahl der Flügel, Größe ihrer Fläche, Durchmesser und Steigung."},{"id":"see1-68","s":"see1","n":68,"q":"Was sollten Sie beachten, wenn Sie den kleinen Außenborder mit eingebautem Tank Ihres Beibootes an Bord verstauen? (Begründung!)","a":"1. Tank und Vergaser müssen leer sein.\n2. Lagerung an Deck oder in einer Backskiste mit Außenentlüftung, niemals unter Deck.\n3. Restbenzin und entweichende Benzingase bilden mit Luft ein leicht entzündliches Gemisch."},{"id":"see1-69","s":"see1","n":69,"q":"Wozu dient ein Wasserabscheider in der Kraftstoffleitung?","a":"In ihm sammelt sich das Kondenswasser aus dem Tank; dadurch werden Startschwierigkeiten vermieden."},{"id":"see1-70","s":"see1","n":70,"q":"Warum sollten Sie bei seltener Motorbenutzung den eingebauten Tank eines Dieselmotors möglichst voll getankt halten?","a":"Um Kondenswasserbildung zu verringern, was zu Startschwierigkeiten führen kann."},{"id":"see1-71","s":"see1","n":71,"q":"Welche Motor-Ersatzteile bzw. Schmierstoffe sollten Sie mindestens an Bord haben?","a":"1. Impeller für die Wasserpumpe,\n2. Reservekeilriemen,\n3. Motorenöl,\n4. Dichtungsmaterial."},{"id":"see1-72","s":"see1","n":72,"q":"1. Was bedeutet die Angabe einer Batteriekapazität \"2 x 60 Ah\"? (Begründung!)\n2. Welche Nettokapazität steht in dem Fall zur Verfügung? (Begründung!)","a":"1. Es handelt sich um 2 Batterien (Akkus) mit jeweils 60 Amperestunden, insgesamt also 120 Ah Nennkapazität.\n2. Dem entspricht eine Nettokapazität von etwa 72 Ah, da ein Akku kaum über 80 % seiner Nennkapazität geladen werden kann."},{"id":"see1-73","s":"see1","n":73,"q":"Geben Sie die benötigte Strommenge (in Amperestunden) an, um bei einer 12-Volt-Anlage zwei Verbraucher mit je 24 Watt 10 Stunden betreiben zu können (mit Angabe der Berechnung)!","a":"Benötigte Strommenge je Verbraucher:\n24: 12 = 2 Ampere mal Anzahl der Verbraucher mal Stunden ergibt:\n2 x 2 A x 10 h = 40 Ah."},{"id":"see1-74","s":"see1","n":74,"q":"Wie muss Tauwerk beschaffen sein, das für Festmacherleinen, Anker- und Schlepptrossen verwendet wird?","a":"Es muss bruchfest und elastisch sein.","qi":["img/q/1c5bd141c312.png"]},{"id":"see1-75","s":"see1","n":75,"q":"Wodurch können Sie verhindern, dass Festmacherleinen durch Schamfilen in Klüsen oder an Kanten an der Pier beschädigt werden?","a":"Durch einen gegen Verrutschen gesicherten Plastikschlauch, der über den Festmacher an der Scheuerstelle gezogen wird, hilfsweise mit Tuchstreifen."},{"id":"see1-76","s":"see1","n":76,"q":"Was müssen Sie hinsichtlich der Festigkeit bedenken, wenn Sie Leinen zusammenknoten?","a":"Beim Knoten können Festigkeitsverluste bis zu 50 % auftreten."},{"id":"see1-77","s":"see1","n":77,"q":"Wodurch können Sie verhindern, dass bei Tauwerk aus unterschiedlichem Innen- und Außenmaterial die Seele in den Mantel rutscht?","a":"Durch einen genähten Takling."},{"id":"see1-78","s":"see1","n":78,"q":"Wie sind längsseits liegende Fahrzeuge festzumachen? Ergänzen Sie die Skizze und benennen Sie die Leinen.","a":"1. Achterleine,\n2. Achterspring,\n3. Vorspring,\n4. Vorleine.","ai":["img/q/a8680b9c2ec7.png","img/q/8b8b109ef4e6.png","img/q/ebf32cae9be5.png"]},{"id":"see1-79","s":"see1","n":79,"q":"Wie können Sie mit Hilfe von zwei Fendern und einem Fenderbrett Ihr Boot festmachen, wenn die Pier mit vorspringenden Pfählen versehen ist? Ergänzen Sie die Skizze mit Leinen.","a":"Die Antwort ist eine Skizze. Sie steht im amtlichen Katalog und wird hier nicht abgefragt.","sketch":1},{"id":"see1-80","s":"see1","n":80,"q":"Was ist an Land beim Reinigen eines mit Antifouling behandelten Unterwasserschiffes zu beachten?","a":"Umweltschutzbestimmungen beachten, d. h., das Schiff nur auf einem entsprechend ausgerüsteten Reinigungsplatz abspritzen und Wasser und Schmutz auffangen, also nicht in die Kanalisation leiten."},{"id":"see1-81","s":"see1","n":81,"q":"Ein funktionsfähiges elektrisches Gerät arbeitet an Bord nicht. Nennen Sie häufige Ursachen und was kann zur Behebung getan werden?","a":"1. Schlechte Kontakte und Korrosion.\n2. Kontakte fest anziehen, korrodierte Stellen mit feinstem Schleifpapier säubern, Kontaktspray verwenden."},{"id":"see1-82","s":"see1","n":82,"q":"Warum müssen Schäden im Gelcoat unverzüglich beseitigt werden?","a":"Das Laminat unter der Gelcoatschicht nimmt sonst Wasser auf und wird dadurch geschädigt."},{"id":"see1-83","s":"see1","n":83,"q":"Welche Daten sollten mindestens an Bord im Logbuch dokumentiert werden?","a":"1. Namen und Funktionen der Crewmitglieder,\n2. Beginn und Ende einer Fahrt und\n3. in angemessenen Zeitabständen: Position, Kurs, Geschwindigkeit, Strömung, Wetter, Luftdruck."},{"id":"see1-84","s":"see1","n":84,"q":"Worauf müssen Sie vor dem Setzen des Großsegels achten? Welche Gefahr besteht nach dem Setzen des Großsegels, solange der Wind von vorne kommt?","a":"1. Großschot und Baumniederholer müssen ausreichend Lose haben.\n2. Das Großfall muss frei laufen und darf nicht vertörnt sein.\n3. Verletzungsgefahr durch schlagenden Großbaum."},{"id":"see1-85","s":"see1","n":85,"q":"Was tun Sie, wenn Ihr Großsegel unter der untersten Lattentasche einreißt?","a":"1. Untere Latte entfernen.\n2. Segel bis über den Riss reffen."},{"id":"see1-86","s":"see1","n":86,"q":"Beschreiben Sie die Schritte für den Reffvorgang mit dem Bindereff.","a":"1. Sicherstellen, dass Dirk angeschlagen oder Baum durch stützenden Baumniederholer in der Höhe gehalten wird,\n2. Fall fieren und Segel etwas herunterholen,\n3. Segelhals in Reffhaken am Lümmelbeschlag einhaken und festsetzen,\n4. Fall wieder dichtholen,\n5. Segelschothorn (hintere Reffkausch) mit Schmeerreep oder Reffleine nach achtern auf den Baum holen und\n6. eventuell loses Segeltuch auftuchen und mit Reffbändseln/Reffleine einbinden."},{"id":"see1-87","s":"see1","n":87,"q":"1. Wozu dient ein \"Bullenstander\"?\n2. Wie wird er gefahren?","a":"1. Er soll das ungewollte Überkommen des Großbaums bei achterlichen Winden verhindern.\n2. Von der Baumnock zum Vorschiff."},{"id":"see1-88","s":"see1","n":88,"q":"Warum muss beim Segeln vor dem Wind oder mit raumem Wind der Baumniederholer entsprechend der Windstärke durchgesetzt werden?","a":"Um das Steigen des Baumes zu verhindern."},{"id":"see1-89","s":"see1","n":89,"q":"Wenn gleich große Boote im Päckchen oder in der Box zusammenliegen, kann es zu Berührungen und Schäden in der Takelage kommen. Wie ist das zu verhindern?","a":"Boote versetzt legen, damit Masten nicht auf gleicher Höhe sind oder im Wechsel Heck-Bug zur Pier legen."},{"id":"see1-90","s":"see1","n":90,"q":"Worauf ist beim Liegen in einer Box in Bezug auf benachbarte Boote zu achten, wenn Schwell in den Hafen läuft?","a":"Dass benachbarte Boote mit ihren Masten versetzt liegen und nicht gegeneinander schlagen."},{"id":"see1-91","s":"see1","n":91,"q":"Sie sind mit Ihrer Segelyacht auf See. Was veranlassen Sie bei einem Gewitteraufzug?","a":"1. Vorsegel rechtzeitig verkleinern,\n2. Großsegel klar zum Reffen oder Bergen,\n3. Schlechtwetterkleidung, Sicherheitsgurte und Rettungswesten anlegen,\n4. Position in Karte eintragen."},{"id":"see1-92","s":"see1","n":92,"q":"Sie übernehmen in einem Hafen eine Ihnen unbekannte Yacht. Wie machen Sie sich zu Reisebeginn mit den Segeleigenschaften vertraut?","a":"Ich fahre diverse Manöver - Wende, Halse, Q-Wende, verschiedene Rettungsmanöver - mit unterschiedlicher Geschwindigkeit und Besegelung."},{"id":"see1-93","s":"see1","n":93,"q":"Wie verhalten Sie sich nach einem Mastbruch, was müssen Sie veranlassen?","a":"1. Nach Möglichkeit den Mast an Bord nehmen und sichern.\n2. Falls nicht möglich, Mast und Wanten kappen, um Rumpfschäden zu vermeiden."},{"id":"see1-94","s":"see1","n":94,"q":"Von welchen Faktoren ist die Länge eines Nahezu-Aufschießers zu einer im Wasser treibenden Person abhängig?","a":"Geschwindigkeit, Wind, Seegang, Strömung und Form und Gewicht des Bootes."},{"id":"see1-95","s":"see1","n":95,"q":"Sie wollen in eine Box einlaufen. Wie bereiten Sie die Achterleinen vor und machen sie fest?","a":"Achterleinen mit Auge versehen (z. B. Palstek), möglichst früh über die Pfähle legen, bei seitlichem Wind zuerst über den Luvpfahl."},{"id":"see1-96","s":"see1","n":96,"q":"Welche Vorbereitung haben Sie für ein Anlegemanöver zu treffen?","a":"1. Crew für Manöver einteilen.\n2. Leinen und Fender bereitlegen."},{"id":"see1-97","s":"see1","n":97,"q":"Welchen Nachteil hat ein \"Saildrive-Antrieb\" insbesondere bei Hafenmanövern?","a":"Durch den großen Abstand zwischen Propeller und Ruder wird dieses nicht direkt angeströmt. Das kann die Manövrierfähigkeit beim Anfahren etwas verschlechtern."},{"id":"see1-98","s":"see1","n":98,"q":"Was ist ein Bugstrahlruder und wozu dient es?","a":"Eine im Bug einer Yacht befindliche Röhre mit einem Propeller, mit dem ein Querschub und damit ein Drehen des Buges bei geringen Vorausgeschwindigkeiten erreicht werden kann."},{"id":"see1-99","s":"see1","n":99,"q":"Bei welchen Manövern können Sie ein Bugstrahlruder sinnvoll einsetzen?","a":"1. Beim An- und Ablegen.\n2. Beim Drehen auf engem Raum."},{"id":"see1-100","s":"see1","n":100,"q":"Sie liegen längsseits mit der Steuerbordseite an einer Pier. Beschreiben Sie ein Ablegemanöver unter gleichzeitigem Einsatz von Bugstrahlruder und Maschine.","a":"1. Hebel für Bugstrahlruder nach Backbord legen, sodass der Bug von der Pier weggedrückt wird (nach Backbord schwenkt) und gleichzeitig\n2. Ruderlage deutlich nach Steuerbord und langsame Fahrt voraus, sodass das Heck nach Backbord ausschwenkt. So wird das Schiff fast parallel von der Pier abgedrückt.","ai":["img/q/47f925850f65.png"]},{"id":"see1-101","s":"see1","n":101,"q":"Wie können Sie im freien Seeraum auf einer Segelyacht einen Sturm abwettern?","a":"1. Durch Beiliegen; Lenzen vor Topp und Takel, dabei Leinen achteraus schleppen; Liegen vor Treibanker oder\n2. unter Sturmbesegelung aktiv segelnd und nach Möglichkeit brechende Seen aussteuernd."},{"id":"see1-102","s":"see1","n":102,"q":"Warum kann das Anlaufen eines Hafens bei auflandigem Starkwind bzw. schwerem Wetter gefährlich werden?","a":"Gefahr durch Grundseen bzw. Kreuzseen. Möglichkeit von Querstrom."},{"id":"see1-103","s":"see1","n":103,"q":"Warum kann eine Leeküste bei schwerem Wetter einer Segelyacht gefährlich werden?","a":"Wenn die Yacht sich nicht freikreuzen kann, droht Strandung."},{"id":"see1-104","s":"see1","n":104,"q":"Mit welchem Manöver können Sie bei Starkwind das Halsen vermeiden (Name)? Vervollständigen Sie die Skizze durch Einzeichnen der Kurslinie und geben Sie die erforderlichen Manöver an.","a":"Die Antwort ist eine Skizze. Sie steht im amtlichen Katalog und wird hier nicht abgefragt.","qi":["img/q/ec6a86e03eba.png"],"sketch":1},{"id":"see1-105","s":"see1","n":105,"q":"Was erreicht man mit dem Ausbringen eines Treibankers bei schwerer See?","a":"Man hält bei richtiger Leinenlänge den Bug im Wind und verringert die Driftgeschwindigkeit."},{"id":"see1-106","s":"see1","n":106,"q":"Worauf müssen Sie achten, wenn Sie in Tidengewässern längsseits einer Pier festgemacht haben?","a":"1. Die Wassertiefe muss auch bei Niedrigwasser ausreichen oder sicheres Aufsetzen muss gewährleistet sein.\n2. Die Leinen müssen für den Tidenstieg oder -fall ausreichend lang sein. Bei größerem Tidenhub darf das Fahrzeug keinesfalls unbeaufsichtigt bleiben."},{"id":"see1-107","s":"see1","n":107,"q":"Sie kreuzen bei frischem Wind und mitlaufendem Strom (Wind gegen Strom) nach Luv auf. Welche Auswirkungen hat ein gegen den Wind setzender Strom auf den Seegang?","a":"Durch den Strom entsteht eine kurze, steile und kabbelige See."},{"id":"see1-108","s":"see1","n":108,"q":"Wie wirkt sich mitlaufender Strom auf die Fahrt eines Fahrzeugs und die Loganzeige aus?","a":"1. Der Strom erhöht die Fahrt über Grund.\n2. Das Log zeigt dies nicht an."},{"id":"see1-109","s":"see1","n":109,"q":"Welche Hilfsmittel können Sie einsetzen, um einen Überbordgefallenen an Deck zu bekommen?","a":"Bewegliche (und gesicherte) Badeleiter, eventuell Großschot, beschwerte Trittschlinge, Rettungstalje, Unterfangen mit kleinem Segel, Bergegurt, Dingi."},{"id":"see1-110","s":"see1","n":110,"q":"Welche Sofortmaßnahmen sind einzuleiten, wenn jemand über Bord gefallen ist?","a":"1. Ruf \"Mensch über Bord!\"\n2. Rettungsmittel zuwerfen,\n3. Ausguck halten, Mensch im Auge behalten,\n4. Maschine starten,\n5. \"Mensch-über-Bord-Manöver\" einleiten,\n6. Notmeldung abgeben,\n7. ggf. Markierungsblitzboje werfen,\n8. ggf. MOB -Taste eines satellitengestützten Navigationsgerätes drücken,\n9. Bergung durchführen."},{"id":"see1-111","s":"see1","n":111,"q":"Welche Maßnahmen können gegen das Überbordfallen getroffen werden?","a":"1. Sicherheitsgurte anlegen und einpicken.\n2. Anbringen von \"Streck-\" oder Laufleinen vom Bug zum Heck.\n3. Crew auf Befestigungspunkte (Einpickpunkte für Karabinerhaken) hinweisen."},{"id":"see1-112","s":"see1","n":112,"q":"Nennen Sie die grundsätzlichen Schritte und ihre Ziele zur Rettung einer über Bord gegangenen Person.","a":"1. Maschine starten,\n2. Suche, Herstellung eines Sichtkontaktes zur über Bord gegangenen Person,\n3. \"Mensch-über-Bord-Manöver\", Annäherung an die im Wasser treibende Person und Herstellung einer ersten Leinenverbindung,\n4. Bergung, sicheres und schnelles Anbordnehmen der Person,\n5. Erste Hilfe, Betreuung,\n6. ggf. Notalarm abgeben."},{"id":"see1-113","s":"see1","n":113,"q":"Mit welchen Hilfsmitteln können Sie den Bezugspunkt (internationaler Begriff: Datum) für die Suche nach einem Überbordgefallenen sichern?","a":"1. Markierungsblitzboje,\n2. MOB-Taste eines satellitengestützten Navigationsgerätes (z. B. GPS)."},{"id":"see1-114","s":"see1","n":114,"q":"Was gehört u. a. zur Sicherheitsausrüstung z. B. einer 10-m-Yacht? Nennen Sie mindestens 6 Ausrüstungsgegenstände.","a":"1. Lenzpumpen und Pützen,\n2. Lecksicherungsmaterial,\n3. Feuerlöscher,\n4. Werkzeuge und Ersatzteile,\n5. Seenotsignalmittel,\n6. Handlampen,\n7. Funkeinrichtung,\n8. Anker,\n9. Erste-Hilfe-Ausrüstung,\n10. Radarreflektor und\n11. Rettungsmittel."},{"id":"see1-115","s":"see1","n":115,"q":"Was gehört zur Sicherheitsausrüstung der Besatzung in der Küstenfahrt?","a":"1. Rettungsweste und Sicherheitsgurt (Lifebelt) für jedes Besatzungsmitglied,\n2. Rettungsfloß (Rettungsinsel),\n3. Rettungskragen mit Tag- und Nachtsignal und\n4. Erste-Hilfe-Ausrüstung mit Anleitung."},{"id":"see1-116","s":"see1","n":116,"q":"Wie erhalten Sie Kenntnis über das nächste Wartungsdatum eines Rettungsfloßes?","a":"Die runde, auf der Insel klebende farbige Serviceplakette oder das bei der letzten Wartung mitgelieferte Zertifikat geben Auskunft über den nächsten Wartungstermin."},{"id":"see1-117","s":"see1","n":117,"q":"Worauf müssen Sie bei Ihren Automatikrettungswesten hinsichtlich der Funktionssicherheit achten?","a":"Auf regelmäßige Wartung. Wartungsfälligkeit erkennbar an der farbigen Serviceplakette."},{"id":"see1-118","s":"see1","n":118,"q":"Was ist auf Deck einer Yacht ein Strecktau (auch Laufleine genannt) und wozu dient es?","a":"Ein neben der Fußreling verlaufender Draht, Gurt oder eine starke Leine zwischen Cockpit und Vorschiff straff gespannt zum Einpicken der Sicherheitsleine (Lifebelt)."},{"id":"see1-119","s":"see1","n":119,"q":"Welche Seenotsignalmittel sollten Sie an Bord haben? Nennen Sie mindestens 6 Beispiele.","a":"1. Handfackeln, rot,\n2. Handraketen, rot,\n3. Rauchfackeln oder Rauchtopf, orange,\n4. Signalpistole mit Munition,\n5. Seewasserfärber,\n6. Signalflaggen N und C,\n7. Signallampe,\n8. Seenotfunkboje."},{"id":"see1-120","s":"see1","n":120,"q":"Welche Feuerlöscheinrichtungen sollten an Bord vorhanden sein?","a":"1. Feuerlöscher (ABC -Pulverlöscher und eventuell CO2 -Löscher), 2\n2. Pütz zum Löschen von Bränden fester Stoffe,\n3. Feuerlöschdecke,\n4. Löschdurchlass für geschlossene Motorräume, der das Löschen von Bränden mit CO -Löschern ohne Sauerstoffzutritt ermöglicht."},{"id":"see1-121","s":"see1","n":121,"q":"Welche Feuerlöscharten sind für Sportboote geeignet? Wie und wo sind sie an Bord unterzubringen?","a":"1. Der ABC-Pulverlöscher, für geschlossene Motorräume der CO -Löscher,\n2. Der Feuerlöscher muss gebrauchsfertig und leicht erreichbar sein, CO -Löscher nicht im Schiffsinneren unterbringen (Erstickungsgefahr bei Leckage).\n3. Er soll in der Nähe der Maschinenräume, der Kombüse bzw. der Koch- oder Heizstelle montiert sein."},{"id":"see1-122","s":"see1","n":122,"q":"Wie wird die ständige Funktionssicherheit eines Feuerlöschers sichergestellt?","a":"1. Durch Einhaltung des vorgeschriebenen Prüftermins, ersichtlich aus der Prüfplakette.\n2. Der Feuerlöscher muss vor Feuchtigkeit und Korrosion geschützt werden."},{"id":"see1-123","s":"see1","n":123,"q":"Wie wird ein Brand an Bord wirksam bekämpft?","a":"1. Alle Öffnungen schließen,\n2. Brennstoffzufuhr (Hauptschalter) unterbrechen,\n3. Feuerlöscher erst am Brandherd betätigen,\n4. Feuer von unten und von vorn bekämpfen,\n5. Löschdecke einsetzen,\n6. Flüssigkeitsbrände nicht mit Wasser bekämpfen."},{"id":"see1-124","s":"see1","n":124,"q":"Was ist vor Reisebeginn beim Seeklarmachen zu überprüfen und zu beachten? Nennen Sie mindestens 6 Beispiele. 2 2 2","a":"1. Seetüchtigkeit der Yacht,\n2. Zahl und Zustand der Segel,\n3. Treibstoffvorrat,\n4. Navigationsunterlagen,\n5. Sicherheitseinweisung der Besatzung,\n6. Rettungsmittel,\n7. Seenotsignale,\n8. Trinkwasser- und Proviantvorräte,\n9. Funktionsfähigkeit des Motors,\n10. Funktionsfähigkeit der elektronischen Navigationsgeräte,\n11. Lenzeinrichtungen,\n12. Feuerlöscher,\n13. Boots- und Personalpapiere,\n14. Betriebsfähigkeit der UKW-Seefunkanlage."},{"id":"see1-125","s":"see1","n":125,"q":"Was gehört zur Sicherheitseinweisung der gesamten Besatzung vor Reisebeginn? Nennen Sie mindestens 6 Beispiele.","a":"Einweisung in Gebrauch und Bedienung\n1. der Rettungswesten und Sicherheitsgurte,\n2. des Rettungsfloßes,\n3. der Signalmittel,\n4. der Lenzpumpen,\n5. der Seeventile und des Bord-WC,\n6. der Kocheinrichtung,\n7. der Feuerlöscher,\n8. der Motoranlage,\n9. der Elektroanlage,\n10. des Rundfunkgerätes und der UKW-Seefunkanlage,\n11. Verhalten bei \"Mensch-über-Bord\",\n12. Erkennen und Verhalten bei Seekrankheit."},{"id":"see1-126","s":"see1","n":126,"q":"In welche technischen Einrichtungen/Ausrüstungen muss der Schiffsführer die Besatzung vor Reiseantritt unbedingt einweisen? Nennen Sie mindestens 6 Beispiele.","a":"1. Ankergeschirr,\n2. Lenzeinrichtung,\n3. Feuerlöscheinrichtungen,\n4. Motoranlage,\n5. Seeventile,\n6. UKW-Seefunkanlage,\n7. MOB-Taste von satellitengestützten Navigationsgerät (z. B. GPS),\n8. Seenotsignalmittel,\n9. Notrudereinrichtung."},{"id":"see1-127","s":"see1","n":127,"q":"Welche Sicherheitsmaßnahmen sind vor jedem Auslaufen durchzuführen? Nennen Sie mindestens 6 Beispiele.","a":"1. Wetterbericht einholen,\n2. Kontrolle der Sicherheitseinrichtung,\n3. Kontrolle von Motor und Schaltung,\n4. Kontrolle der nautischen Geräte,\n5. Kontrolle der Bilge,\n6. Überprüfen des Wasser- und Kraftstoffvorrats,\n7. Kontrolle der Schall- und Lichtsignaleinrichtung,\n8. Kontrolle der Navigationslichter,\n9. Bereitlegen der aktuellen Seekarten und nautischen Veröffentlichungen."},{"id":"see1-128","s":"see1","n":128,"q":"Warum sollten alle Crewmitglieder Lage und Funktion sämtlicher Pumpen und Ventile kennen?","a":"Damit im Bedarfsfall sie jeder bedienen kann."},{"id":"see1-129","s":"see1","n":129,"q":"Warum sollte die Crew in die Funktion des Bord-WC eingewiesen werden?","a":"Weil durch unsachgemäße Bedienung Wasser ins Bootsinnere gelangen kann."},{"id":"see1-130","s":"see1","n":130,"q":"Warum sollte die Crew vor Reisebeginn in die Funktion des Ankergeschirrs und die Durchführung eines Ankermanövers eingewiesen werden?","a":"Damit jeder den Anker sicher ausbringen und einholen kann."},{"id":"see1-131","s":"see1","n":131,"q":"Wie verhalten Sie sich, wenn Ihr Schiff leckgeschlagen ist?","a":"1. Meldung abgeben.\n2. Je nach Erfordernissen Fahrt aus dem Schiff nehmen.\n3. Lenzpumpen betätigen, Lecksuche, Leck mit Bordmitteln abdichten.\n4. Küste bzw. flaches Wasser ansteuern.\n5. Fahrzeug so trimmen, dass Leckstelle aus dem Wasser kommt bzw. möglichst wenig unter Wasser ist."},{"id":"see1-132","s":"see1","n":132,"q":"Was tun Sie, wenn Ihr Schiff leckgeschlagen ist und das Wasser im Schiff trotz aller Maßnahmen weiter steigt?","a":"1. Notzeichen geben, Funkmeldung abgeben, ggf. Radartransponder einschalten.\n2. Verlassen des Bootes vorbereiten, Rettungswesten anlegen, Rettungsfloß klarmachen.\n3. Wenn möglich, ruhiges Flachwasser anlaufen und Schiff auf Grund setzen."},{"id":"see1-133","s":"see1","n":133,"q":"Welche Folgen können Grundberührungen und harte Stöße, z. B. bei Anlegemanövern oder Kollisionen mit treibenden Gegenständen haben?","a":"1. Eine Beschädigung der Bordwand kann eintreten.\n2. Es kann Sinkgefahr entstehen."},{"id":"see1-134","s":"see1","n":134,"q":"Welche grundsätzliche Verhaltensweise sollte beachtet und welche Maßnahmen sollten ergriffen werden, wenn Ihr Schiff in Seenot kommt?","a":"1. Ruhe bewahren und überlegt handeln.\n2. Notalarm abgeben, ggf. Radartransponder einschalten.\n3. Rettungsfloß klarmachen.\n4. Rettungsweste und Sicherheitsgurt anlegen.\n5. So lange wie möglich an Bord bleiben.\n6. Wärmende Kleidung anziehen."},{"id":"see1-135","s":"see1","n":135,"q":"Welche Maßnahmen treffen Sie, bevor Sie von Ihrem Fahrzeug in ein Rettungsfloß übersteigen?","a":"1. Rettungsweste und Sicherheitsgurt anlegen.\n2. Wärmende Kleidung anziehen.\n3. Nach Möglichkeit vorher reichlich warme Flüssigkeit trinken.\n4. Soweit noch nicht geschehen, Proviant, Wasser, Seenotsignalmittel und ggf. Seenotfunkbake, Radartransponder und UKW- Handsprechfunkgeräte in das Rettungsfloß bringen."},{"id":"see1-136","s":"see1","n":136,"q":"Warum sollte ein sinkendes Schiff im Notfall so spät wie möglich verlassen werden?","a":"1. Die Überlebensmöglichkeiten sind auf dem Schiff größer.\n2. Ein Schiff ist besser zu orten.\n3. Einstieg in das Rettungsfloß und Aufenthalt können sehr schwierig sein."},{"id":"see1-137","s":"see1","n":137,"q":"Erklären Sie die Handhabung der Hubschrauberrettungsschlinge im Einsatz!","a":"1. Bei offener Rettungsschlinge: zuerst den Karabinerhaken einpicken.\n2. Mit dem Kopf und beiden Armen in die Rettungsschlinge einsteigen.\n3. Die Arme müssen nach unten gedrückt werden und die Hände sind zu schließen.\n4. Das Windenseil muss frei hängen, es darf nicht an Bord befestigt werden."},{"id":"see1-138","s":"see1","n":138,"q":"Wann dürfen Notzeichen gegeben werden?","a":"Nach Feststellung des Notfalls auf Anordnung des Schiffsführers; bei unmittelbarer Gefahr für das Schiff oder die Besatzung, die ohne fremde Hilfe nicht überwunden werden kann."},{"id":"see1-139","s":"see1","n":139,"q":"Wann darf ein UKW-Sprechfunkgerät auch ohne entsprechenden Befähigungsnachweis benutzt werden?","a":"In Notfällen."},{"id":"see1-140","s":"see1","n":140,"q":"Worauf ist zu achten, wenn Crewmitglieder seekrank sind?","a":"1. Aufenthalt im Cockpit beaufsichtigen und Crewmitglieder gegen Überbordfallen sichern,\n2. Flüssigkeitsverlust ausgleichen (Wasser),\n3. Crewmitglied anhalten, zur Küste oder zum Horizont zu schauen,\n4. mit Arbeiten beschäftigen."},{"id":"see1-141","s":"see1","n":141,"q":"Wozu dient ein Reitgewicht (Gleitgewicht, Ankergewicht) beim Ankern?","a":"Es soll die Ankertrosse auf den Grund ziehen, damit der Anker nicht durch einen zu steilen Winkel aus dem Grund gebrochen wird. Es wirkt ruckdämpfend."},{"id":"see1-142","s":"see1","n":142,"q":"Warum sollte beim Verwenden einer Ankertrosse ein Kettenvorlauf benutzt werden?","a":"Damit der Zug auf den Anker nicht zu steil wird."},{"id":"see1-143","s":"see1","n":143,"q":"Welcher Ankergrund ist für die üblichen Leichtgewichtsanker\n1. gut geeignet?\n2. mäßig geeignet?\n3. ungeeignet?","a":"1. Sand, Schlick, weicher Ton und Lehm,\n2. harter Ton und Lehm,\n3. steinige, verkrautete und stark schlammige Böden."},{"id":"see1-144","s":"see1","n":144,"q":"Was müssen Sie bei der Auswahl eines Ankerplatzes beachten?","a":"1. Der Ankerplatz sollte Schutz vor Wind und Wellen bieten.\n2. Auf ausreichenden Platz zum Schwojen achten.\n3. Mögliche Winddrehungen einplanen."},{"id":"see1-145","s":"see1","n":145,"q":"Welchen Ankergrund sollten Sie nach Möglichkeit meiden?","a":"Steinige, verkrautete und stark schlammige Böden."},{"id":"see1-146","s":"see1","n":146,"q":"Wie können Sie die Haltekraft eines Ankers erhöhen, wenn Sie auf engem Raum (z. B. zwischen zwei Stegen) nicht die erforderliche Kettenlänge stecken können?","a":"Mit einem Reitgewicht, um so den Anker besser am Boden zu halten."},{"id":"see1-147","s":"see1","n":147,"q":"Sie ankern in einer Bucht. Wie können Sie bei zunehmendem Wind die Haltekraft Ihres Ankers verbessern?","a":"1. Mehr Trosse oder Kette stecken,\n2. Reitgewicht verwenden."},{"id":"see1-148","s":"see1","n":148,"q":"Sie wollen auf verkrautetem Grund ankern. Ihnen steht ein Leichtgewichtsanker und ein Stockanker zur Verfügung. Welchen benutzen Sie und warum?","a":"Den Stockanker, weil er sich insbesondere auch aufgrund seines höheren Gewichtes besser eingräbt."},{"id":"see1-149","s":"see1","n":149,"q":"Wozu dient eine Ankerboje?","a":"1. Sie zeigt die Lage des Ankers an.\n2. Mit der Trippleine kann das Bergen eines unklaren Ankers unterstützt werden."},{"id":"see1-150","s":"see1","n":150,"q":"Wie erkennen Sie, ob der Anker hält?","a":"1. Vibration von Kette oder Trosse prüfen,\n2. Einrucken des Ankers prüfen,\n3. durch wiederholte Peilungen und ggf. Schätzungen des Abstands zu anderen Schiffen oder zu Landmarken,\n4. falls GPS vorhanden ist, die Ankeralarmfunktion einschalten."},{"id":"see1-151","s":"see1","n":151,"q":"Welche Ankerarten finden überwiegend auf Sportbooten Verwendung? Nennen Sie 3.","a":"1. Patentanker,\n2. Stockanker (einklappbarer Stock),\n3. Draggen (klappbare Flunken),\n4. Pflugscharanker."},{"id":"see1-152","s":"see1","n":152,"q":"Nennen Sie 3 Ankertypen, die vom Germanischen Lloyd als Anker mit hoher Haltekraft anerkannt sind.","a":"Bruce-Anker, CQR -Anker, Danforth-Anker, D'Hone-Anker."},{"id":"see1-153","s":"see1","n":153,"q":"1. Welches sind die Vorteile einer Ankerkette gegenüber einer Ankerleine?\n2. Wie kombiniert man auf Yachten häufig die Systeme?","a":"1. Die Kette unterstützt das Eingraben, verkleinert den Schwojeraum, wirkt ruckdämpfend, kann nicht an Steinen durchscheuern und erhöht die Haltekraft des Ankers.\n2. Es wird zwischen Anker und Leine ein Kettenvorlauf von 3 bis 5 m gefahren."},{"id":"see1-154","s":"see1","n":154,"q":"1. Warum soll eine Ankerleine nicht an den Anker geknotet werden?\n2. Warum muss die Ankerkette mit einem Taustropp am Schiff bzw. im Kettenkasten befestigt werden?","a":"1. Knoten reduzieren die Bruchlast einer Leine um bis zu 50 %.\n2. Damit die Kette im Notfall schnell gekappt werden kann."},{"id":"see1-155","s":"see1","n":155,"q":"Sie wollen in einer Bucht ankern, in der das (ausreichend tiefe) Wasser unterschiedliche Färbungen zeigt. Wo wählen Sie den Akerplatz? (Begründung!)","a":"Ich ankere auf hellem Wasser. Begründung: Der Grund ist hier sandig, der Anker hält gut. Dunkler Grund weist auf Bewuchs hin, wo der Anker schlecht hält."},{"id":"see1-156","s":"see1","n":156,"q":"Warum darf der Anker nicht zusammen mit seiner Leine am Ankerplatz über Bord geworfen werden?","a":"Die Leine könnte mit dem Anker vertörnen und dadurch das Eingraben des Ankers verhindern. Der Anker würde dann nicht halten."},{"id":"see1-157","s":"see1","n":157,"q":"Was müssen Sie bedenken, wenn ein großes Schiff auf Ihr Sportboot zukommt?","a":"1. Andere Manövrierfähigkeit (größere Drehkreise, längere Stoppstrecken), 2. u. U. eingeschränkte Sicht des anderen Fahrzeugs, insbesondere nach voraus,\n3. Möglichkeit des Übersehenwerdens, weil man sich im Radarschatten befindet,\n4. Beeinträchtigung durch Bugwellen des großen Schiffes,\n5. mögliche Beeinträchtigung der Manövrierfähigkeit des eigenen Bootes durch Windabdeckung."},{"id":"see1-158","s":"see1","n":158,"q":"Warum sollten Sie nicht zu dicht hinter dem Heck eines vorbeifahrenden Schiffes durchfahren?","a":"Sog und Hecksee können das eigene Boot erheblich gefährden."},{"id":"see1-159","s":"see1","n":159,"q":"Was müssen Sie beim Passieren eines großen Schiffes bei dessen Kursänderungen, z. B. in einem kurvenreichen Fahrwasser, beachten?","a":"Bei einer Kursänderung schwenkt das Heck deutlich in die entgegengesetzte Richtung aus, also nach Backbord bei einer Kursänderung nach Steuerbord und umgekehrt."},{"id":"see1-160","s":"see1","n":160,"q":"Mit welchen Stoppstrecken und Stoppzeiten müssen Sie bei großen Schiffen in voller Fahrt rechnen und wovon hängen sie ab?","a":"Abhängig von Schiffstyp und -größe, Beladungszustand und Ausgangsgeschwindigkeit ist mit der 8- bis 12fachen Schiffslänge und bis zu 8 bis 12 Minuten Dauer (z. B. ein 300 m langes Containerschiff voll abgeladen mit 24 kn: Stoppstrecke ca. 2 sm, Stoppzeit ca. 12 Minuten) zu rechnen."},{"id":"see1-161","s":"see1","n":161,"q":"Wie reagiert ein großes Schiff, wenn bei ca. 20 kn Fahrt ein Ausweichmanöver durch Hartruderlage eingeleitet wird? Nach welcher Distanz verlässt es in etwa die alte Kurslinie?","a":"Der Steven bewegt sich in Richtung der Hartruderlage, das Heck schlägt relativ weit zur entgegengesetzten Richtung aus. Das Schiff verlässt mit seinem Heck erst nach mehreren Schiffslängen seine bisherige Kurslinie, bewegt sich also zunächst in der alten Kursrichtung fort. Diese Strecke kann bei 300 m langen Containerschiffen 1,5 bis 2,5 Schiffslängen, d. h. ca. 500 bis 600 m betragen."},{"id":"see1-162","s":"see1","n":162,"q":"Auf vielen großen Schiffen ist die Sicht nach vorne eingeschränkt. Welchen Abstand vor einem Schiff müssen Sie als nicht einsehbar mindestens berücksichtigen?","a":"Sichtbeschränkung nach voraus maximal 2 Schiffslängen oder 500 m."},{"id":"see1-163","s":"see1","n":163,"q":"Wie können Sie die Wahrscheinlichkeit erhöhen, im Radar von anderen Fahrzeugen gesehen zu werden?","a":"Durch einen möglichst hoch und fest angebrachten passiven Radarreflektor bzw. besser noch durch einen \"aktiven\" Radarreflektor. Stand: 01. Juli 2006 © Wasserstraßen- und Schifffahrtsverwaltung des Bundes"},{"id":"see2-1","s":"see2","n":1,"q":"Welche Bootsbau-Werkstoffe finden im Sportbootbau für den Rumpf überwiegend Verwendung?","a":"1. GFK = glasfaserverstärkter Kunststoff,\n2. Stahl,\n3. Aluminium,\n4. wasserfest verleimtes Sperrholz,\n5. Massivholz."},{"id":"see2-2","s":"see2","n":2,"q":"Was versteht man unter einem Gleiter (schnelle Schiffe) und welche Fahreigenschaften hat solch ein Motorboot?","a":"Schnelle Schiffe, deren Gewicht überwiegend von Antriebskomponenten getragen wird (flache und breite Konstruktion) und die auf glattem Wasser bei höherer Geschwindigkeit in Gleitfahrt kommen. Bei Seegang können die Boote hart aufschlagen, sodass die Konstruktionen stark beansprucht werden."},{"id":"see2-3","s":"see2","n":3,"q":"Was versteht man unter einem \"Verdränger\" und welche Fahreigenschaften hat solch ein Motorboot?","a":"Konventionelle Schiffe - unabhängig vom Tiefgang -, deren Gewicht ausschließlich vom hydrostatischen Auftrieb getragen wird und deren Geschwindigkeit dementsprechend beschränkt ist (Rumpfgeschwindigkeit)."},{"id":"see2-4","s":"see2","n":4,"q":"Was versteht man unter einem \"Halbgleiter\" und welche Fahreigenschaften hat solch ein Motorboot?","a":"Halbgleiter sind Motorboote mit geringem Tiefgang, sehr hoher Formstabilität und schneller Fahrweise bei starker Motorisierung."},{"id":"see2-5","s":"see2","n":5,"q":"Was versteht man im Bootsbau unter Gelcoat?","a":"Die äußere Schutzschicht eines Bauteils aus glasfaserverstärktem Kunststoff."},{"id":"see2-6","s":"see2","n":6,"q":"Was versteht man beim GFK-Bootsbau unter Sandwichverfahren (GFK = glasfaserverstärkter Kunststoff)?","a":"Zwischen zwei GFK-Schichten wird eine Zwischenlage zur Versteifung einlaminiert, z. B. aus Balsaholz."},{"id":"see2-7","s":"see2","n":7,"q":"Welchen Vorteil hat die Sandwichbauweise gegenüber der Massivbauweise bei GFK-Yachten (GFK = glasfaserverstärkter Kunststoff)?","a":"Große Steifheit, Verwindungsfestigkeit, geringes Gewicht, gute Isolierung."},{"id":"see2-8","s":"see2","n":8,"q":"Beschreiben Sie die Vor- und Nachteile von Stahl als Baumaterial für Yachten.","a":"Vorteile:\nzuverlässiges, problemloses Baumaterial mit sehr hoher Festigkeit und langer Lebensdauer. Nachteile:\nhohes Gewicht, Rostanfälligkeit."},{"id":"see2-9","s":"see2","n":9,"q":"Was bedeutet der Betriff \"Kategorie\" im Zusammenhang mit dem CE-Zeichen für Wassersportfahrzeuge?","a":"Mit der Kategorie legt der Hersteller fest, in welchem Fahrgebit, bis zu welcher Windstärke und bis zu welcher charakteristischen Wellenhöhe das Fahrzeug sicher betrieben werden kann."},{"id":"see2-10","s":"see2","n":10,"q":"Welche Kategorien können im Zusammenhang mit dem CE-Zeichen für Wassersportfahrzeuge vergeben werden?","a":"1. A Hochsee,\n2. B Außerhalb von Küstengewässern,\n3. C Küstennahe Gewässer,\n4. D Geschützte Gewässer."},{"id":"see2-11","s":"see2","n":11,"q":"Was bedeutet die im Zusammenhang mit dem CE-Zeichen für Wassersportfahrzeuge angegebene Kategorie \"B Außerhalb von Küstengewässern\"?","a":"Das Fahrzeug ist ausgelegt für Fahrten außerhalb von Küstengewässern, in denen Windstärken bis einschließlich 8 Bft und signifikante Wellenhöhen bis einschließlich 4 m auftreten können."},{"id":"see2-12","s":"see2","n":12,"q":"Beschreiben Sie den Aufbau einer Radsteuerung mit Seilzügen.","a":"Das Rad dreht ein Zahnrad, über das eine Kette in der Steuersäule nach unten verläuft. Die Kette ist mit den Steuerseilen verbunden, welche über Umlenkrollen zum Ruderquadranten führen."},{"id":"see2-13","s":"see2","n":13,"q":"Wozu dient der Lenzkorb am Ansaugstutzen einer Lenzpumpe und wie erhalten Sie seine Funktionsfähigkeit?","a":"Der Lenzkorb verhindert Verunreinigungen und Verstopfungen der Lenzpumpe. Er muss regelmäßig überprüft und gereinigt werden."},{"id":"see2-14","s":"see2","n":14,"q":"Welche Lenzvorrichtungen und -möglichkeiten sollten auf jeder seegehenden Yacht vorhanden sein?","a":"Zwei voneinander unabhängige Bilgepumpen, von denen eine über Deck bedienbar ist, sowie 2 Pützen mit Leinen."},{"id":"see2-15","s":"see2","n":15,"q":"Warum sollten Sie mehr als einen Anker an Bord haben, möglichst unterschiedlicher Art?","a":"1. Als Ersatz bei Verlust,\n2. zum Verwarpen oder Verkatten,\n3. um unterschiedliche Ankergründe berücksichtigen zu können,\n4. um bei schwerem Wetter oder in Tidengewässern vor 2 Ankern liegen zu können."},{"id":"see2-16","s":"see2","n":16,"q":"Wie viele Fender und Festmacherleinen sollten Sie mindestens an Bord haben?","a":"4 Festmacherleinen und 4 Fender."},{"id":"see2-17","s":"see2","n":17,"q":"Was sollte auf jeder Motoryacht außer Festmacherleinen an Tauwerk vorhanden sein?","a":"Reservetauwerk, Wurfleine, Schlepptrosse und Ankerleine."},{"id":"see2-18","s":"see2","n":18,"q":"In welchen Publikationen finden Sie amtliche Informationen über die Ausrüstung und Sicherheit von Sportbooten, die auch bei der Beurteilung von Sportbootunfällen herangezogen werden?","a":"1. \"Sicherheit im See- und Küstenbereich, Sorgfaltsregeln für Wassersportler\", herausgegeben vom BSH,\n2. \"Sicherheit auf dem Wasser, Leitfaden für Wassersportler\", herausgegeben vom Bundesministerium für Verkehr, Bau und Stadtentwicklung."},{"id":"see2-19","s":"see2","n":19,"q":"Warum müssen auf Yachten zusätzlich zu elektrisch oder motorgetriebenen Lenzpumpen auch Handlenzpumpen vorhanden sein?","a":"Weil sie auch bei Strom- und Motorausfall betätigt werden können."},{"id":"see2-20","s":"see2","n":20,"q":"Warum ist Flüssiggas (Propan, Butan) auf einer Yacht besonders gefährlich?","a":"Es ist schwerer als Luft, sinkt nach unten und bildet mit Luft ein explosives Gemisch; es kann sich im Schiffsinneren (z. B. in der Bilge) sammeln."},{"id":"see2-21","s":"see2","n":21,"q":"Welche 4 Bedienelemente besitzt ein mit Handpumpe betriebenes Bord-WC auf einer Yacht?","a":"1. Seeventil und Spülwasserschlauch (Seewasser),\n2. Handpumpe für Toilettenspülung,\n3. Hebel zur Unterbrechung der Seewasserzufuhr (Handpumpe dient dann nur noch zum Abpumpen),\n4. Abwasserschlauch (via Fäkalientank) zum Seeventil."},{"id":"see2-22","s":"see2","n":22,"q":"Beschreiben Sie in 5 Schritten die Bedienung eines Bord-WC auf einer Yacht.","a":"1. Seeventil für Seewasserspülung öffnen,\n2. Handpumpe betätigen, sodass das Becken gespült wird und gleichzeitig die Fäkalien abfließen - ausgiebig spülen,\n3. Seewasserzufuhr unterbrechen (Hebel umlegen),\n4. Becken mit Handpumpe leer pumpen,\n5. Seeventile für Zu- und Abfluss schließen."},{"id":"see2-23","s":"see2","n":23,"q":"Was versteht man unter der \"Stabilität\" eines Schiffes?","a":"Unter Stabilität eines Schiffes versteht man seine Eigenschaft, in aufrechter Lage zu schwimmen und sich aus einer Krängung wieder aufzurichten."},{"id":"see2-24","s":"see2","n":24,"q":"Wovon hängt die Stabilität eines Schiffes in ruhigem Wasser ab? Nennen Sie Beispiele für äußere Momente, welche die Stabilität beanspruchen.","a":"Die Stabilität eines Schiffes hängt ab von:\n1. seiner Geometrie (Form),\n2. der Gewichtsverteilung im Schiff (Ausrüstung, Crew, Ballast). Beispiele für eine Beanspruchung der Stabilität sind krängende Momente durch Seitenwind, Trossenzug oder Drehkreisfahrt bei schnellen Motoryachten."},{"id":"see2-25","s":"see2","n":25,"q":"Wovon hängt eine in ruhigem Wasser vorhandene Stabilität zusätzlich in schwerem Wetter ab?","a":"Die Stabilität in schwerem Wetter hängt zusätzlich von Wind und Seegang, besonders von brechenden Wellen ab."},{"id":"see2-26","s":"see2","n":26,"q":"Was versteht man unter\n1. Formschwerpunkt (F)?\n2. Massenschwerpunkt (Gewichtsschwerpunkt, G)? Welche Kräfte wirken in den beiden Punkten?","a":"1. Im Formschwerpunkt F kann man sich die Masse des vom Schiff verdrängten Wassers vereinigt denken. In F wirkt die Auftriebskraft senkrecht zur Wasseroberfläche nach oben.\n2. Im Massenschwerpunkt G kann man sich die Masse des Schiffes einschließlich Ausrüstung und Besatzung vereinigt denken. In G wirkt die Gewichtskraft senkrecht zur Wasseroberfläche nach unten."},{"id":"see2-27","s":"see2","n":27,"q":"Was geschieht bei einer Neigung des Schiffes, z. B. durch seitlichen Winddruck, solange sich die Lage des Massenschwerpunktes (Gewichtsschwerpunktes) nicht verändert? (Begründung!)","a":"Der Formschwerpunkt F wandert zur geneigten Seite aus, weil dort ein größerer Teil des Bootskörpers unter Wasser gelangt. Die Wirklinie der Auftriebskraft bekommt dadurch einen seitlichen Abstand zur Wirklinie der Gewichtskraft. Es entsteht ein Kräftepaar, der seitliche Abstand zwischen den Wirklinien ist der Hebelarm. Es entsteht ein aufrichtendes Moment, welches gleich dem Produkt aus Gewichtskraft und Hebelarm ist."},{"id":"see2-28","s":"see2","n":28,"q":"Was verstehen Sie unter \"Trimm\"?","a":"Der Trimm ist der Unterschied zwischen dem vorderen und dem achteren Tiefgang."},{"id":"see2-29","s":"see2","n":29,"q":"Nennen Sie mögliche Trimmlagen einer Motoryacht.","a":"Ist der vordere Tiefgang größer als der achtere, ergibt dies einen vorlichen Trimm. Ist der achtere Tiefgang größer als der vordere, ergibt dies einen achterlichen Trimm. Sind beide gleich, liegt eine Yacht auf ebenem Kiel."},{"id":"see2-30","s":"see2","n":30,"q":"Was verstehen Sie unter \"Rumpfgeschwindigkeit\" und wovon ist sie abhängig?","a":"Rumpfgeschwindigkeit ist die rechnerische Höchstfahrt eines Verdrängers. Sie ist abhängig von der Wasserlinienlänge."},{"id":"see2-31","s":"see2","n":31,"q":"Erklären Sie die wesentlichen Vorteile des Dieselmotors gegenüber dem Benzinmotor.","a":"1. Der zum Betrieb erforderliche Kraftstoff (Diesel) ist weniger feuergefährlich als der für einen Benzinmotor.\n2. Er hat einen geringeren Kraftstoffverbrauch."},{"id":"see2-32","s":"see2","n":32,"q":"Erklären Sie die wesentlichen Nachteile des Benzinmotors gegenüber dem Dieselmotor.","a":"1. Das Benzin-Luft-Gemisch birgt Explosions- und Brandgefahr im Schiff.\n2. Die Zündanlage kann störempflindlich gegen Feuchtigkeit und Nässe sein.\n3. Der Motor hat einen höheren Kraftstoffverbrauch als der Dieselmotor."},{"id":"see2-33","s":"see2","n":33,"q":"Wozu dient das Wendegetriebe eines Motors?","a":"1. Zum Ein- und Auskuppeln des Propellers,\n2. zum Umsteuern des Propellers auf Rückwärtsfahrt,\n3. zur Drehzahluntersetzung."},{"id":"see2-34","s":"see2","n":34,"q":"Wodurch unterscheiden sich Einhebel- und Zweihebelschaltung?","a":"1. Bei Einhebelschaltung werden Gas und Getriebe gleichzeitig bedient.\n2. Bei Zweihebelschaltung werden Gas und Getriebe mit 2 Hebeln getrennt bedient."},{"id":"see2-35","s":"see2","n":35,"q":"Erklären Sie die Grundstruktur des Zweikreis-Kühlsystems bei der Motorkühlung.","a":"Das Zweikreis-Kühlsystem besteht aus einem geschlossenen inneren Süßwasserkreislauf mit eigenem Kühlwassertank und einem offenen Seewasserkreislauf. Beide Kreisläufe sind in einem thermostatgeregelten Wärmetauscher wärmetechnisch miteinander verbunden. Der innere Süßwasserkreislauf durchfließt den Motor."},{"id":"see2-36","s":"see2","n":36,"q":"Welchen Vorteil hat die Zweikreis-Kühlung gegenüber der Einkreis-Kühlung?","a":"Im Zweikreis-Kühlsystem wird im inneren geschlossenen Kühlwasserkreislauf Süßwasser gefahren. Dem geschlossenen Kühlwassersystem können Zusätze (z. B. Frostschutzmittel) zugegeben werden. Ablagerungen durch Fremdwasser werden verhindert. Durch eine thermostatische Regelung des Wärmeaustausches zwischen innerem und äußerem Kreislauf erreicht der Motor schneller seine Betriebstemperatur, diese wird auch konstant gehalten."},{"id":"see2-37","s":"see2","n":37,"q":"Was sollte nach dem Anlassen der Maschine kontrolliert werden?","a":"1. Kühlwasserdurchlauf,\n2. Öldruck und Ladung,\n3. Motorengeräusche und\n4. Auspuffgase."},{"id":"see2-38","s":"see2","n":38,"q":"Was können erste Störungsanzeichen im Motorbetrieb sein?","a":"Ungewöhnliche und fremde Motorengeräusche, Vibrationen, Verfärbung der Abgase, Aufleuchten der Ladekontrolle bzw. Öldruckkontrolle und die entsprechenden akustischen Warnungen."},{"id":"see2-39","s":"see2","n":39,"q":"Der Dieselmotor Ihres Bootes startet nicht. Welche Teile der Kraftstoffanlage sollten überprüft werden?","a":"1. Kraftstofffüllung,\n2. Kraftstoffabsperrhahn,\n3. Kraftstoffschläuche,\n4. Kraftstofffilter,\n5. Kraftstoffpumpe."},{"id":"see2-40","s":"see2","n":40,"q":"Der Benzinmotor Ihres Bootes startet nicht. Welche Teile der Kraftstoffanlage sollten überprüft werden?","a":"1. Kraftstofffüllung,\n2. Kraftstoffabsperrhahn,\n3. Kraftstoffschläuche,\n4. Kraftstofffilter,\n5. Kraftstoffpumpe,\n6. Vergaser."},{"id":"see2-41","s":"see2","n":41,"q":"Welche Ursachen können zu einer Anzeige eines zu geringen Öldrucks führen?","a":"1. Ein verstopftes Ölsieb (Ölwanne),\n2. ein zu geringer Ölstand,\n3. ein verstopfter Ölfilter,\n4. eine defekte Ölpumpe,\n5. ein defektes Öldruckventil,\n6. ein defektes Anzeigegerät."},{"id":"see2-42","s":"see2","n":42,"q":"Welche Ursachen kann das Aufleuchten der Warnlampe der Batterie-Ladekontrolle während des Betriebes zur Folge haben?","a":"1. Die Kabelverbindungen sind unterbrochen (oxydiert, lose oder gebrochen).\n2. Der Keilriemen zum Antrieb der Lichtmaschine ist defekt und es erfolgt keine Stromerzeugung.\n3. Der Regler oder die Lichtmaschine können defekt sein."},{"id":"see2-43","s":"see2","n":43,"q":"Welche Fehlerursachen kann eine schwarze Färbung der Auspuffgase haben?","a":"Unvollständige Verbrennung durch:\n1. kalten Motor,\n2. verschmutzten Luftfilter,\n3. schlechte Kraftstoffqualität,\n4. verstellte Einspritzpumpe,\n5. Überlastung des Motors."},{"id":"see2-44","s":"see2","n":44,"q":"Welche Fehlerursachen kann eine weiße Färbung der Auspuffgase haben?","a":"Verdampfung von Wasser durch z. B.\n1. Kondensat im Auspuffsystem bei noch kaltem Motor,\n2. gerissenen Zylinderkopf,\n3. defekte Zylinderkopfdichtung."},{"id":"see2-45","s":"see2","n":45,"q":"Welche Vorsichtsmaßnahmen müssen beim Tanken und Umfüllen von Brennstoffen getroffen werden?","a":"1. Maschine abstellen.\n2. Offenes Feuer löschen (Rauchen einstellen).\n3. Keine elektrischen Schalter betätigen.\n4. Alle Öffnungen schließen.\n5. Tragbare Tanks möglichst außerhalb des Bootes befüllen."},{"id":"see2-46","s":"see2","n":46,"q":"Welche Maßnahmen sind vor dem Anlassen eines Dieselmotors zu treffen?","a":"1. Hauptstromschalter einschalten.\n2. Kraftstoff- und Kühlwasserventile öffnen.\n3. Getriebe auf \"neutral\" stellen.\n4. Kühlwasser prüfen (Zweikreis-Kühlsystem)."},{"id":"see2-47","s":"see2","n":47,"q":"Welche Maßnahmen sind vor dem Anlassen eines Benzinmotors zu treffen?","a":"1. Hauptstromschalter einschalten.\n2. Motorraum mit Bilge entlüften.\n3. Kraftstoff- und Kühlwasserventile öffnen.\n4. Getriebe auf \"neutral\" stellen.\n5. Kühlwasser prüfen (Zweikreis-Kühlsystem)."},{"id":"see2-48","s":"see2","n":48,"q":"Wie kontrollieren Sie den ordnungsgemäßen Betrieb des Motors?","a":"Kontrolle der Anzeigegeräte auf:\n1. Öldruck und Öltemperatur,\n2. Kühlwassertemperatur,\n3. Motorendrehzahl und\n4. Batterieladung. Außerdem auf Motorgeräusche, Vibrationen und Farbe der Auspuffgase achten."},{"id":"see2-49","s":"see2","n":49,"q":"Welche Maßnahmen treffen Sie nach dem Abstellen des Motors?","a":"1. Kraftstoffventil schließen.\n2. Hauptstromschalter (Batterie) ausschalten.\n3. Seeventile schließen."},{"id":"see2-50","s":"see2","n":50,"q":"Während Sie unter Maschine laufen, steigt plötzlich die Kühlwassertemperatur stark an. Ihre Yacht ist mit einem Saildrive-Antrieb ausgestattet.\n1. Welche typische Ursache hat der Temperaturanstieg, wenn eine technische Störung unwahrscheinlich ist?\n2. Wie können Sie die Störung einfach beheben?","a":"1. Fremdkörper (Folienstücke, Plastiktüten, Pflanzenteile o. Ä.) haben den Kühlwassereinlass verstopft.\n2. Mehrmals abwechselnd vor- und zurückfahren, sodass sich die Fremdkörper vom Kühlwassereinlass lösen."},{"id":"see2-51","s":"see2","n":51,"q":"Welche Fehlerursachen kann eine blaue Färbung der Auspuffgase haben?","a":"Zweitaktmotor:\nzu fettes Benzin-Öl-Gemisch. Es ist zu viel Schmieröl im Gemisch. Viertaktmotor:\nzu viel Schmieröl, Ölabstreifringe bzw. Kolbenringe defekt. In beiden Fällen verbrennt/verdampft Schmieröl."},{"id":"see2-52","s":"see2","n":52,"q":"Erklären Sie die Arbeitsweise in Bezug auf die Zündung beim Ottomotor und Dieselmotor.","a":"Beim Ottomotor wird das zündfähige Benzin-Luft-Gemisch im Vergaser durch Einspritzung erzeugt und mit Fremdzündung durch die Zündkerze gezündet. Beim Dieselmotor wird die angesaugte Luft hoch verdichtet und so erwärmt, dass der eingespritzte Dieselkraftstoff sich durch Eigenzündung in dieser komprimierten Luft entzündet."},{"id":"see2-53","s":"see2","n":53,"q":"Weshalb sollte dringend vermieden werden, dass beim Dieselmotor der Kraftstofftank leer gefahren wird?","a":"In die Einspritzpumpe/Kraftstoffleitung würde Luft gelangen. Startversuche nach dem Tanken wären erfolglos. Vor dem Tanken müssten die Leitung und die Einspritzpumpe entlüftet werden. Ablagerungen sowie Kondenswasserbildung durch Temperaturschwankungen können entstehen."},{"id":"see2-54","s":"see2","n":54,"q":"Während der Fahrt lässt plötzlich die Motordrehzahl abrupt nach und der Motor geht beim Zurücklegen des Gashebels gänzlich aus. Was kann die Ursache sein?","a":"Es ist möglicherweise ein schwimmender Fremdkörper (Leine, Trosse, Plane, Persening o. Ä.) in den Propeller geraten und behindert bzw. blockiert ihn."},{"id":"see2-55","s":"see2","n":55,"q":"In welchen Bereichen werden an Bord Batterien eingesetzt?","a":"Zum Starten und für das Bordnetz."},{"id":"see2-56","s":"see2","n":56,"q":"Was ist beim Laden von Batterien dringend zu beachten?","a":"Die Batteriekästen bzw. -räume müssen ausreichend be- und entlüftet sein."},{"id":"see2-57","s":"see2","n":57,"q":"1. Was bedeutet die Angabe einer Batteriekapazität \"2 x 60 Ah\"? (Begründung!)\n2. Welche Nettokapazität steht in dem Fall zur Verfügung? (Begründung!)","a":"1. Es handelt sich um 2 Batterien (Akkus) mit jeweils 60 Amperestunden, insgesamt also 120 Ah Nennkapazität.\n2. Dem entspricht eine Nettokapazität von etwa 72 Ah, da ein Akku kaum über 80 % seiner Nennkapazität geladen werden kann."},{"id":"see2-58","s":"see2","n":58,"q":"Geben Sie die benötigte Strommenge (in Amperestunden) an, um bei einer 12-Volt-Anlage zwei Verbraucher mit je 24 Watt 10 Stunden betreiben zu können (mit Angabe der Berechnung)!","a":"Benötigte Strommenge je Verbraucher:\n24: 12 = 2 Ampere mal Anzahl der Verbraucher mal Stunden ergibt:\n2 x 2 A x 10 h = 40 Ah."},{"id":"see2-59","s":"see2","n":59,"q":"Was könnte zu möglichen Motorschäden bis hin zum Kolbenfresser führen?","a":"Zu wenig Kühlwasser, Dampfblasen im Kühlwasserschauglas, Kühlwassertemperatur zu hoch, zu niedriger oder stetig fallender Öldruck, zu wenig oder nicht geeignetes Öl, fallende Drehzahl, zitternde Nadel im Drehzahlmesser, klopfende Motorgeräusche."},{"id":"see2-60","s":"see2","n":60,"q":"Wie muss Tauwerk beschaffen sein, das für Festmacherleinen, Anker- und Schlepptrossen verwendet wird?","a":"Es muss bruchfest und elastisch sein."},{"id":"see2-61","s":"see2","n":61,"q":"Wodurch können Sie verhindern, dass Festmacherleinen durch Schamfilen in Klüsen oder an Kanten an der Pier beschädigt werden?","a":"Durch einen gegen Verrutschen gesicherten Plastikschlauch, der über den Festmacher an der Scheuerstelle gezogen wird, hilfsweise mit Tuchstreifen."},{"id":"see2-62","s":"see2","n":62,"q":"Was müssen Sie hinsichtlich der Festigkeit bedenken, wenn Sie Leinen zusammenknoten?","a":"Beim Knoten können Festigkeitsverluste bis zu 50 % auftreten."},{"id":"see2-63","s":"see2","n":63,"q":"Wodurch können Sie verhindern, dass bei Tauwerk aus unterschiedlichem Innen- und Außenmaterial die Seele in den Mantel rutscht?","a":"Durch einen genähten Takling."},{"id":"see2-64","s":"see2","n":64,"q":"Wie sind längsseits liegende Fahrzeuge festzumachen? Ergänzen Sie die Skizze und benennen Sie die Leinen.","a":"1. Achterleine,\n2. Achterspring,\n3. Vorspring,\n4. Vorleine.","qi":["img/q/9fade5265938.png","img/q/ebd59a8f1648.png","img/q/a2ee54dc1476.png"]},{"id":"see2-65","s":"see2","n":65,"q":"Wie können Sie mit Hilfe von zwei Fendern und einem Fenderbrett Ihr Boot festmachen, wenn die Pier mit vorspringenden Pfählen versehen ist? Ergänzen Sie die Skizze mit Leinen.","a":"Die Antwort ist eine Skizze. Sie steht im amtlichen Katalog und wird hier nicht abgefragt.","qi":["img/q/89cf99853fe3.png"],"sketch":1},{"id":"see2-66","s":"see2","n":66,"q":"Was ist beim Reinigen eines mit Antifoul
