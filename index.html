/* ---------- Was soll ich als Nächstes lernen? Der Käpt'n empfiehlt genau eine Sache. ---------- */
function recommendNext() {
  const due = Q.filter(q => isDue(q.n)).length, left = daysLeft(), chance = passChance(), dl = daily(), cap = computePlan().cap;
  const open = UNITS.find(u => ['vorab', 'erklaert'].includes(unitStage(u)));
  const next = UNITS.find(u => unitStage(u) === 'neu');
  const last = (S.exams || []).slice(-1)[0];
  if (open) return {label: `${open.label} zu Ende bringen`, say: `Wir haben ${open.label} angefangen. Das bringen wir erst sauber zu Ende, halbe Sachen gibt es auf See nicht.`, run: () => startUnit(open)};
  if (due >= 12) return {label: `${due} Wiederholungen`, say: `Erst wird aufgeklart: ${due} Fragen wollen wiederholt werden. Danach gibt es Neues.`, run: () => reviewSession()};
  if (left <= 10 && coverage() >= .6 && chance < .95 && (!last || today() - last.day >= 2)) return {label: 'Probeprüfung bei Kapitän Harms', say: `Noch ${left} Tage bis zur Prüfung. Zeit, dass Kapitän Harms dich mal richtig prüft.`, run: examIntro};
  if (next && dl.answered < cap) return {label: `Neu: ${next.label}`, say: `Als Nächstes nehmen wir uns ${next.label} vor. Erst rätst du, dann erkläre ich dir den Rest.`, run: () => startUnit(next)};
  if (due > 0) return {label: `${due} Wiederholungen`, say: `Bevor Feierabend ist: ${due} Fragen wollen noch einmal wiederholt werden.`, run: () => reviewSession()};
  if (!next) return COURSE.kind === 'mc' ? {label: 'Prüfungsfallen üben', say: 'Alle Kapitel hast du durch. Jetzt üben wir die gemeinen Fallen, bei denen die falschen Antworten fast gleich klingen.', run: trapRound} : {label: 'Wackelkandidaten üben', say: 'Alle Kapitel hast du durch. Jetzt nehmen wir uns die Fragen vor, die noch wackeln.', run: trapRound};
  return {label: 'Feierabend oder Extrarunde', say: `Für heute hast du dein Pensum geschafft. Wenn du noch Lust hast, machen wir eine Extrarunde.`, run: extraRound};
}

/* ---------- Auswahl der Prüfungsfragen: zuletzt gezeigte meiden, Schwächen etwas öfter ---------- */
function examPick() {
  const hist = S.examHist || [], recent = new Set(hist.slice(-60));
  const weight = q => { const s = st(q.n); let x = 1; if (!s) x += .5; else { x += Math.min(3, s.w * .8); if (s.b < 3) x += .7; } return recent.has(q.n) ? x * .12 : x; };
  const pick = (has, count) => {
    const pool = Q.filter(has), out = [];
    while (out.length < count && pool.length) {
      const ws = pool.map(weight), tot = ws.reduce((a, b) => a + b, 0); let r = Math.random() * tot, i = 0;
      while (i < pool.length - 1 && r > ws[i]) { r -= ws[i]; i++; }
      out.push(pool[i]); pool.splice(i, 1);
    }
    return out;
  };
  const qs = COURSE.exam.parts.flatMap(p => pick(p.has, p.count));
  S.examHist = hist.concat(qs.map(q => q.n)).slice(-90); save();
  return shuffle(qs);
}

/* ---------- Podcast: Kapitel für Kapitel, wenig Wiederholung, bis alles einmal dran war ---------- */
function pickStoryQs(topicId) {
  const used = new Set(S.storyQs || []), inT = t => q => t.has(q);
  let base = topicId && topicId !== 'auto' ? TOPICS.find(t => t.id === topicId) : null;
  if (!base) base = TOPICS.find(t => Q.some(q => inT(t)(q) && st(q.n) && !used.has(q.n))) || TOPICS.find(t => Q.some(q => inT(t)(q) && !used.has(q.n))) || TOPICS[0];
  let pool = Q.filter(q => inT(base)(q) && !used.has(q.n));
  if (pool.length < 4) for (const rid of RELATED[base.id] || []) { const rt = TOPICS.find(t => t.id === rid); pool = pool.concat(Q.filter(q => inT(rt)(q) && !used.has(q.n))); if (pool.length >= 5) break; }
  if (!pool.length) { S.storyQs = (S.storyQs || []).filter(n => !inT(base)(QN[n] || {n: 0})); pool = Q.filter(inT(base)); }
  const seenFirst = pool.filter(q => st(q.n)).concat(pool.filter(q => !st(q.n)));
  return {topic: base, qs: seenFirst.slice(0, 5).sort((a, b) => a.n - b.n)};
}

/* ---------- Fahrplan bis zur Prüfung ----------
   Wie computePlan: die letzten 20 % der Tage nur Wiederholung, davor neue Fragen Thema für Thema. */
function fahrplan() {
  const left = Math.max(1, daysLeft());
  const reviewDays = left >= 8 ? Math.round(left * .2) : Math.floor(left / 4), learnDays = Math.max(1, left - reviewDays);
  const topics = TOPICS.map(t => ({name: t.name, n: Q.filter(q => t.has(q) && !st(q.n)).length})).filter(t => t.n);
  const total = topics.reduce((a, t) => a + t.n, 0), perDay = total ? Math.ceil(total / learnDays) : 0;
  const dateOf = d => new Date(Date.now() + d * 864e5).toISOString().slice(0, 10);
  const weeks = []; let day = 0;
  topics.forEach(t => {
    const from = day, to = day + t.n / perDay; day = to;
    for (let w = Math.floor(from / 7); w <= Math.floor(Math.max(from, to - .001) / 7); w++) (weeks[w] = weeks[w] || []).includes(t.name) || weeks[w].push(t.name);
  });
  return {left, learnDays, reviewDays, perDay, total, reviewFrom: dateOf(learnDays),
    weeks: weeks.map((names, w) => ({from: dateOf(w * 7), to: dateOf(Math.min(learnDays, w * 7 + 7) - 1), names: names || []})).filter(w => w.names.length)};
}

    <button class="btn small ghost" id="scheininfo" style="margin-top:10px">Was erwartet mich beim ${esc(COURSE.short)}?</button>`);
  w.querySelectorAll('[data-m^="c:"]').forEach(b => b.onclick = () => { const id = b.dataset.m.slice(2); closeSheet(); if (id !== S.course) { switchCourse(id); toast('Jetzt lernst du für den ' + COURSES[id].name + '.'); } setTab(tab === 'deck' ? 'deck' : 'cabin'); einfuehrung('schein_' + id); });
  const ib = w.querySelector('#scheininfo'); if (ib) ib.onclick = () => { closeSheet(); einfuehrung('schein_' + S.course, true); };
}

/* ---------- Los geht's ---------- */
/* Inhalte (Kataloge, Navigationsaufgaben, Folgen) liegen in data/ und werden vor dem Start geladen. */
async function loadData() {
  const get = f => fetch('data/' + f + '?v=' + window.__ver).then(r => { if (!r.ok) throw new Error(f + ': HTTP ' + r.status); return r.json(); });
  const [sbf, sks, nav, folgen, bin, lex] = await Promise.all([get('sbf.json'), get('sks.json'), get('nav.json'), get('folgen.json'), get('binnen.json'), get('lexikon.json')]);
  DATA = sbf; SKS_DATA = sks; NAV_TASKS = nav; BIN_DATA = bin; LEX = lex;
  EPISODES = Object.assign({sbf: [], sks: []}, folgen.episodes); SHORTS = folgen.shorts || [];
  /* Fragekarten: fehlt eine Datei, geht alles weiter wie ohne Karte */
  const cards = await Promise.all(['sbf', 'bin', 'sks'].map(c => get('karten-' + c + '.json').catch(() => ({k: {}}))));
  KARTEN = Object.assign({}, ...cards.map(c => (c && c.k) || {}));
  INTROS = await get('einfuehrungen.json').catch(() => ({e: {}}));
  useCourse(S.course);
}
function startApp() {
  const box = $('#loading');
  loadData().then(() => { if (box) box.remove(); boot(); }).catch(e => {
    try { LOG.add('start', 'Daten fehlen: ' + (e && e.message)); } catch (x) {}
    if (!box) return;
    box.querySelector('p').innerHTML = location.protocol === 'file:'
      ? 'Die App muss über einen Server laufen (z.&nbsp;B. <b>python -m http.server</b>), nicht per Doppelklick.'
      : 'Die Fragen ließen sich nicht laden. Prüf dein Internet.<br><button class="btn small" id="reload" style="margin-top:12px">Nochmal versuchen</button>';
    const b = $('#reload'); if (b) b.onclick = () => location.reload();
  });
}
startApp();

</script>
