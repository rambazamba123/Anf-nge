ing behandelten Unterwasserschiffes zu beachten?","a":"Umweltschutzbestimmungen beachten, d. h. das Schiff nur auf einem entsprechend ausgerüsteten Reinigungsplatz abspritzen und Wasser und Schmutz auffangen, also nicht in die Kanalisation lassen."},{"id":"see2-67","s":"see2","n":67,"q":"Ein funktionsfähiges elektrisches Gerät arbeitet an Bord nicht. Nennen Sie häufige Ursachen und was kann zur Behebung getan werden?","a":"1. Schlechte Kontakte und Korrosion.\n2. Kontakte fest anziehen, korrodierte Stellen mit feinstem Schleifpapier säubern, Kontaktspray verwenden."},{"id":"see2-68","s":"see2","n":68,"q":"Warum müssen Schäden im Gelcoat unverzüglich beseitigt werden?","a":"Das Laminat unter der Gelcoatschicht nimmt Wasser auf und wird dadurch geschädigt."},{"id":"see2-69","s":"see2","n":69,"q":"Welche Daten sollten an Bord mindestens im Logbuch dokumentiert werden?","a":"1. Namen und Funktionen der Crewmitglieder,\n2. Beginn und Ende einer Fahrt und\n3. in angemessenen Zeitabständen: Position, Kurs, Geschwindigkeit, Strömung, Wetter, Luftdruck."},{"id":"see2-70","s":"see2","n":70,"q":"Welche Sicherheitsmaßnahmen müssen auch bei ruhigem Wetter bei Nachtfahrten beachtet werden?","a":"1. Bei jeder Tätigkeit an Deck Rettungswesten und Sicherheitsgurt tragen.\n2. Nur mit am Schiff eingepickter Sicherheitsleine über Deck gehen."},{"id":"see2-71","s":"see2","n":71,"q":"Was verstehen Sie unter \"Radeffekt\" des Schiffspropellers (Schraube)?","a":"\"Radeffekt\" ist die seitliche Versetzung des Hecks durch die drehende Schraube."},{"id":"see2-72","s":"see2","n":72,"q":"Mit welchen 4 Angaben werden Propeller auf Yachten beschrieben?","a":"Anzahl der Flügel, Größe ihrer Fläche, Durchmesser und Steigung."},{"id":"see2-73","s":"see2","n":73,"q":"Wie wirkt der rechts- bzw. linksdrehende Propeller auf das Schiffsheck bei Rückwärtsfahrt?","a":"Ein rechtsdrehender Propeller versetzt das Heck bei Rückwärtsfahrt nach Backbord, ein linksdrehender nach Steuerbord."},{"id":"see2-74","s":"see2","n":74,"q":"1. Wie drehen bei einem Zweischrauber in der Regel die Propeller?\n2. Welchen manövriertechnischen Vorteil haben Yachten mit 2 Propellern?","a":"1. Gegenläufig.\n2. Mit 2 Propellern kann man nahezu auf der Stelle drehen, indem man einen Propeller vorwärts und einen Propeller rückwärts arbeiten lässt. Die Manövrierfähigkeit wird dadurch verbessert."},{"id":"see2-75","s":"see2","n":75,"q":"Warum gibt es bei einem Zweischrauben-Schiff (in der Regel) keinen Radeffekt?","a":"Die Drehrichtungen der Schrauben sind gegenläufig. So heben sich die jeweiligen Radeffekte gegenseitig auf."},{"id":"see2-76","s":"see2","n":76,"q":"Was ist ein Bugstrahlruder und wozu dient es?","a":"Eine im Bug einer Yacht befindliche Röhre mit einem Propeller, mit dem ein Querschub und damit ein Drehen des Buges bei geringen Vorausgeschwindigkeiten erreicht werden kann."},{"id":"see2-77","s":"see2","n":77,"q":"Wann sollte aus Gründen der Sicherheit auf Motoryachten der Außenfahrstand besetzt werden?","a":"1. Bei verminderter Sicht zum Wahrnehmen der Schallsignale.\n2. Bei Manövern in engen Gewässern zur besseren Rundumsicht."},{"id":"see2-78","s":"see2","n":78,"q":"Warum empfiehlt sich beim Schleppen die Verwendung einer Hahnepot und wo sollte sie belegt werden?","a":"1. Eine Hahnepot verteilt die Zugkräfte auf mehrere Belegpunkte für die Schleppleine an der Durchführung an Bug und auf den beiden Bootsseiten.\n2. Zum Belegen eignen sich zumeist kräftigere Klampen für die Vorspring auf den Bootsseiten."},{"id":"see2-79","s":"see2","n":79,"q":"Sie wollen in eine Box einlaufen. Wie bereiten Sie die Achterleinen vor und machen sie fest?","a":"Achterleinen mit Auge versehen. Möglichst fühzeitig über die Pfähle legen, bei seitlichem Wind zuerst über den Luvpfahl."},{"id":"see2-80","s":"see2","n":80,"q":"Welche Vorbereitung haben Sie für ein Anlegemanöver zu treffen?","a":"1. Crew für Manöver einteilen.\n2. Leinen und Fender bereitlegen."},{"id":"see2-81","s":"see2","n":81,"q":"Beschreiben Sie das Fahrmanöver mit einem Zweischrauben-Schiff bei einer Drehung auf engem Raum über Steuerbord.","a":"Ruder hart Steuerbord, Steuerbordmaschine rückwärts, Backbordmaschine voraus."},{"id":"see2-82","s":"see2","n":82,"q":"Bei welchen Manövern können Sie ein Bugstrahlruder sinnvoll einsetzen?","a":"1. Beim An- und Ablegen.\n2. Beim Drehen auf engem Raum."},{"id":"see2-83","s":"see2","n":83,"q":"Sie liegen längsseits mit der Stuerbordseite an einer Pier. Beschreiben Sie ein Ablegemanöver unter gleichzeitigem Einsatz von Bugstrahlruder und Maschine.","a":"1. Hebel für Bugstrahlruder nach Backbord legen, sodass der Bug von der Pier weggedrückt wird (nach Backbord schwenkt) und gleichzeitig\n2. Ruderlage deutlich nach Steuerbord und langsame Fahrt voraus, sodass das Heck nach Backbord ausschwenkt. So wird das Schiff fast parallel von der Pier abgedrückt."},{"id":"see2-84","s":"see2","n":84,"q":"Warum kann das Anlaufen eines Hafens bei auflandigem Starkwind bzw. schwerem Wetter gefährlich werden?","a":"Gefahr durch Grundseen bzw. Kreuzseen. Möglichkeit von Querstromwirbeln."},{"id":"see2-85","s":"see2","n":85,"q":"Sie werden in Küstennähe von einem Sturm überrascht. Wie verhalten Sie sich mit einer Motoryacht?","a":"1. Möglichst rasch versuchen, Hafen oder Landschutz anzulaufen. 2. Ggf. Motoryacht mit langsamer Fahrt gegen die See halten.\n3. Sicherheitsmaßnahmen für die Besatzung treffen."},{"id":"see2-86","s":"see2","n":86,"q":"Worauf müssen Sie achten, wenn Sie in Tidengewässern längsseits einer Pier festgemacht haben?","a":"1. Die Wassertiefe muss auch bei Niedrigwasser ausreichen oder sicheres Aufsetzen muss gewährleistet sein.\n2. Die Leinen müssen für den Tidenstieg oder -fall ausreichend lang sein. Bei größerem Tidenhub darf das Fahrzeug keinesfalls unbeaufsichtigt bleiben."},{"id":"see2-87","s":"see2","n":87,"q":"Sie fahren bei frischem Wind und mitlaufendem Strom (Wind gegen Strom) nach Luv. Welche Auswirkungen hat ein gegen den Wind setzender Strom auf den Seegang?","a":"Durch den Strom entsteht eine kurze, steile und kabbelige See."},{"id":"see2-88","s":"see2","n":88,"q":"Wie wirkt sich mitlaufender Strom auf die Fahrt eines Fahrzeugs und die Loganzeige aus?","a":"1. Der Strom erhöht die Fahrt über Grund.\n2. Das Log zeigt dies nicht an."},{"id":"see2-89","s":"see2","n":89,"q":"Welcher Kurswinkel ist bei schwerer See am besten geeignet, das Aufschlagen des Bootes zu verringern?","a":"Ein Kurswinkel von 20 bis 25° bezogen auf die Seegangsrichtung ist am besten geeignet, hartes Aufschlagen zu verringern."},{"id":"see2-90","s":"see2","n":90,"q":"Welche Hilfsmittel können Sie einsetzen, um einen Überbordgefallenen an Deck zu bekommen?","a":"Bewegliche (und gesicherte) Badeleiter, beschwerte Trittschlinge, Rettungstalje, Bergegurt."},{"id":"see2-91","s":"see2","n":91,"q":"Welche Sofortmaßnahmen sind einzuleiten, wenn jemand über Bord gefallen ist?","a":"1. Ruf: \"Mensch über Bord!\",\n2. Rettungsmittel zuwerfen,\n3. Ausguck halten, Mann im Auge behalten,\n4. Maschine starten,\n5. \"Mensch-über-Bord-Manöver\" einleiten,\n6. Notmeldung abgeben,\n7. ggf. Markierungsblitzboje werfen,\n8. ggf. MOB -Taste eines satellitengestützten Navigationsgerätes drücken,\n9. Bergung durchführen."},{"id":"see2-92","s":"see2","n":92,"q":"Welche Maßnahmen können gegen das Überbordfallen getroffen werden?","a":"1. Sicherheitsgurte anlegen und einpicken.\n2. Anbringen von Strecktau oder Laufleinen von Bug zum Heck.\n3. Crew auf Befestigungspunkte (Einpickpunkte für Karabinerhaken) hinweisen."},{"id":"see2-93","s":"see2","n":93,"q":"Nennen Sie die grundsätzlichen Schritte und ihre Ziele zur Rettung einer über Bord gegangenen Person.","a":"1. Maschine starten,\n2. Suche, Herstellung eines Sichtkontaktes zur über Bord gegangenen Person,\n3. \"Mensch-über-Bord-Manöver\", Annäherung an die im Wasser treibende Person und Herstellung einer ersten Leinenverbindung,\n4. Bergung, sicheres und schnelles Anbordnehmen der Person,\n5. Erste Hilfe, Betreuung,\n6. ggf. Notalarm abgeben."},{"id":"see2-94","s":"see2","n":94,"q":"Mit welchen Hilfsmitteln können Sie den Bezugspunkt (internationaler Begriff: Datum) für die Suche nach einem Überbordgefallenen sichern?","a":"1. Markierungsblitzboje,\n2. MOB-Taste eines satellitengestützten Navigationsgerätes (z. B. GPS)."},{"id":"see2-95","s":"see2","n":95,"q":"Was gehört u. a. zur Sicherheitsausrüstung z. B. einer 10-m-Yacht? Nennen Sie mindestens 6 Ausrüstungsgegenstände.","a":"1. Lenzpumpen und Pützen,\n2. Lecksicherungsmaterial,\n3. Feuerlöscher,\n4. Werkzeug und Ersatzteile,\n5. Seenotsignalmittel,\n6. Handlampen,\n7. Funkeinrichtung,\n8. Anker,\n9. Erste-Hilfe-Ausrüstung,\n10. Radarreflektor und\n11. Rettungsmittel."},{"id":"see2-96","s":"see2","n":96,"q":"Was gehört zur Sicherheitsausrüstung der Besatzung in der Küstenfahrt?","a":"1. Rettungsweste und Sicherheitsgurt (Lifebelt) für jedes Besatzungsmitglied,\n2. Rettungsfloß (Rettungsinsel),\n3. Rettungskragen mit Tag- und Nachtsignal und\n4. Erste-Hilfe-Ausrüstung mit Anleitung."},{"id":"see2-97","s":"see2","n":97,"q":"Wie erhalten Sie Kenntnis über das nächste Wartungsdatum eines Rettungsfloßes?","a":"Die runde, auf der Insel klebende farbige Serviceplakette oder das bei der letzten Wartung mitgelieferte Zertifikat geben Auskunft über den nächsten Wartungstermin."},{"id":"see2-98","s":"see2","n":98,"q":"Worauf müssen Sie bei Ihren Automatikrettungswesten hinsichtlich der Funktionssicherheit achten?","a":"Auf regelmäßige Wartung. Wartungsfälligkeit erkennbar an der farbigen Serviceplakette."},{"id":"see2-99","s":"see2","n":99,"q":"Was ist auf Deck einer Yacht ein Strecktau (auch Laufleine genannt) und wozu dient es?","a":"Ein neben der Fußreling verlaufender Draht, Gurt oder eine starke Leine zwischen Cockpit und Vorschiff straff gespannt zum Einpicken der Sicherheitsleine (Lifebelts)."},{"id":"see2-100","s":"see2","n":100,"q":"Welche Seenotsignalmittel sollten Sie an Bord haben? Nennen Sie mindestens 6 Beispiele.","a":"1. Handfackeln, rot,\n2. Handraketen, rot,\n3. Rauchfackeln oder Rauchtopf, orange,\n4. Signalpistole mit Munition,\n5. Seewasserfärber,\n6. Signalflaggen N und C,\n7. Signallampe,\n8. Seenotfunkboje."},{"id":"see2-101","s":"see2","n":101,"q":"Welche Feuerlöscheinrichtungen sollten an Bord sein?","a":"1. Feuerlöscher (ABC -Pulverlöscher und eventuell CO2 -Löscher),\n2. Pütz zum Löschen von Bränden fester Stoffe,\n3. Feuerlöschdecke,\n4. Löschdurchlass für geschlossene Motorräume, der das Löschen von Bränden mit CO -Löschern ohne Sauerstoffzutritt ermöglicht."},{"id":"see2-102","s":"see2","n":102,"q":"Welche Feuerlöscharten sind für Sportboote geeignet? Wie und wo sind sie an Bord unterzubringen? 2 2","a":"1. Der ABC-Pulverlöscher, für geschlossene Motorräume der CO -Löscher.\n2. Der Feuerlöscher muss gebrauchsfertig und leicht erreichbar sein, CO -Löscher nicht im Schiffsinneren unterbringen (Erstickungsgefahr bei Leckage).\n3. Er soll in der Nähe der Maschinenräume, der Kombüse sowie der Koch- oder Heizstelle montiert sein."},{"id":"see2-103","s":"see2","n":103,"q":"Wie wird die ständige Funktionssicherheit eines Feuerlöschers sichergestellt?","a":"1. Durch Einhaltung des vorgeschriebenen Prüftermins, ersichtlich aus der Prüfplakette.\n2. Der Feuerlöscher muss vor Feuchtigkeit und Korrosion geschützt werden."},{"id":"see2-104","s":"see2","n":104,"q":"Wie wird ein Brand an Bord wirksam bekämpft?","a":"1. Alle Öffnungen schließen,\n2. Brennstoffzufuhr (Hauptschalter) unterbrechen,\n3. Feuerlöscher erst am Brandherd betätigen,\n4. Feuer von unten und von vorn bekämpfen,\n5. Löschdecke einsetzen,\n6. Flüssigkeitsbrände nicht mit Wasser bekämpfen."},{"id":"see2-105","s":"see2","n":105,"q":"Was ist vor Reisebeginn beim Seeklarmachen zu überprüfen und zu beachten? Nennen Sie mindestens 6 Beispiele.","a":"1. Seetüchtigkeit der Yacht,\n2. Treibstoffvorrat,\n3. Navigationsunterlagen,\n4. Sicherheitseinweisung der Besatzung,\n5. Rettungsmittel,\n6. Seenotsignale,\n7. Trinkwasser- und Proviantvorräte,\n8. Funktionsfähigkeit des Motors,\n9. Funktionsfähigkeit der elektronischen Navigationsgeräte, 2 2\n10. Lenzeinrichtungen,\n11. Feuerlöscher,\n12. Boots- und Personalpapiere."},{"id":"see2-106","s":"see2","n":106,"q":"Was gehört zur Sicherheitseinweisung der gesamten Besatzung vor Reisebeginn? Nennen Sie mindestens 6 Beispiele.","a":"Einweisung in Gebrauch und Bedienung\n1. der Rettungswesten und Sicherheitsgurte,\n2. des Rettungsfloßes,\n3. der Signalmittel,\n4. der Lenzpumpen,\n5. der Seeventile und des Bord-WC,\n6. der Kocheinrichtung,\n7. der Feuerlöscher,\n8. der Motoranlage,\n9. der Elektroanlage,\n10. des Rundfunkgerätes und der UKW -Seefunkanlage,\n11. Verhalten bei \"Mensch-über-Bord\",\n12. Erkennen der Seekrankheit und entsprechendes Verhalten."},{"id":"see2-107","s":"see2","n":107,"q":"In welche technischen Einrichtungen/Ausrüstungen muss der Schiffsführer die Besatzung vor Reiseantritt unbedingt einweisen? Nennen Sie mindestens 6 Beispiele.","a":"1. Ankergeschirr,\n2. Lenzeinrichtung,\n3. Feuerlöscheinrichtungen,\n4. Motoranlage,\n5. Seeventile,\n6. UKW-Seefunkanlage,\n7. MOB-Taste vom satellitengestützten Navigationsgerät (z. B. GPS),\n8. Seenotsignalmittel,\n9. Notrudereinrichtung."},{"id":"see2-108","s":"see2","n":108,"q":"Welche Sicherheitsmaßnahmen sind vor jedem Auslaufen durchzuführen? Nennen Sie mindestens 6 Beispiele.","a":"1. Wetterbericht einholen,\n2. Kontrolle der Sicherheitsausrüstung,\n3. Kontrolle von Motor und Schaltung,\n4. Kontrolle der nautischen Geräte,\n5. Kontrolle der Bilge,\n6. Überprüfen des Wasser- und Kraftstoffvorrats,\n7. Kontrolle der Schall- und Lichtsignaleinrichtung,\n8. Kontrolle der Navigationslichter,\n9. Bereitlegen der aktuellen Seekarten und nautischen Veröffentlichungen."},{"id":"see2-109","s":"see2","n":109,"q":"Warum sollten alle Crewmitglieder Lage und Funktion sämtlicher Pumpen und Ventile kennen?","a":"Damit im Bedarfsfall sie jeder bedienen kann."},{"id":"see2-110","s":"see2","n":110,"q":"Warum sollte die Crew in die Funktion des Bord-WC eingewiesen werden?","a":"Weil durch unsachgemäße Bedienung Wasser ins Bootsinnere gelangen kann."},{"id":"see2-111","s":"see2","n":111,"q":"Warum sollte die Crew vor Reisebeginn in die Funktion des Ankergeschirrs und die Durchführung eines Ankermanövers eingewiesen werden?","a":"Damit jeder den Anker sicher ausbringen und einholen kann."},{"id":"see2-112","s":"see2","n":112,"q":"Wie verhalten Sie sich, wenn Ihr Schiff leckgeschlagen ist?","a":"1. Meldung abgeben.\n2. Je nach Erfordernissen Fahrt aus dem Schiff nehmen.\n3. Lenzpumpen betätigen, Lecksuche, Leck mit Bordmitteln abdichten.\n4. Küste bzw. flaches Wasser ansteuern.\n5. Fahrzeug so trimmen, dass Leckstelle aus dem Wasser kommt bzw. möglichst wenig unter Wasser ist."},{"id":"see2-113","s":"see2","n":113,"q":"Was tun Sie, wenn Ihr Schiff leckgeschlagen ist und das Wasser im Schiff trotz aller Maßnahmen weiter steigt?","a":"1. Notzeichen geben, Funkmeldung abgeben, ggf. Radartransponder einschalten.\n2. Verlassen des Bootes vorbereiten, Rettungswesten anlegen, Rettungsfloß klarmachen.\n3. Wenn möglich, ruhiges Flachwasser anlaufen und Schiff auf Grund setzen."},{"id":"see2-114","s":"see2","n":114,"q":"Welche Folgen können Grundberührungen und harte Stöße, z. B. bei Anlegemanövern oder Kollisionen mit treibenden Gegenständen, haben?","a":"1. Eine Beschädigung der Bordwand kann eintreten.\n2. Es kann Sinkgefahr entstehen."},{"id":"see2-115","s":"see2","n":115,"q":"Welche grundsätzliche Verhaltensweise sollte beachtet und welche Maßnahmen sollten ergriffen werden, wenn Ihr Schiff in Seenot kommt?","a":"1. Ruhe bewahren und überlegt handeln.\n2. Notalarm abgeben, ggf. Radartransponder einschalten.\n3. Rettungsfloß klarmachen.\n4. Rettungsweste und Sicherheitsgurt anlegen.\n5. So lange wie möglich an Bord bleiben.\n6. Wärmende Kleidung anziehen."},{"id":"see2-116","s":"see2","n":116,"q":"Welche Maßnahmen treffen Sie, bevor Sie von Ihrem Fahrzeug in ein Rettungsfloß übersteigen?","a":"1. Rettungsweste und Sicherheitsgurt anlegen.\n2. Wärmende Kleidung anziehen.\n3. Nach Möglichkeit vorher reichlich warme Flüssigkeit trinken.\n4. Soweit noch nicht geschehen, Proviant, Wasser, Seenotsignalmittel und ggf. Seenotfunkbake, Radartransponder und UKW- Handsprechfunkgeräte in das Rettungsfloß bringen."},{"id":"see2-117","s":"see2","n":117,"q":"Warum sollte ein sinkendes Schiff im Notfall so spät wie möglich verlassen werden?","a":"1. Die Überlebensmöglichkeiten sind auf dem Schiff größer.\n2. Ein Schiff ist besser zu orten.\n3. Einstieg in das Rettungsfloß und Aufenthalt können sehr schwierig sein."},{"id":"see2-118","s":"see2","n":118,"q":"Erklären Sie die Handhabung der Hubschrauberrettungsschlinge im Einsatz!","a":"1. Bei offener Rettungsschlinge: zuerst den Karabinerhaken einpicken.\n2. Mit dem Kopf und beiden Armen in die Rettungsschlinge einsteigen.\n3. Die Arme müssen nach unten gedrückt werden und die Hände sind zu schließen.\n4. Das Windenseil muss frei hängen, es darf nicht an Bord befestigt werden."},{"id":"see2-119","s":"see2","n":119,"q":"Wann dürfen Notzeichen gegeben werden?","a":"Nach Feststellung des Notfalles auf Anordnung des Schiffsführers; bei unmittelbarer Gefahr für das Schiff oder die Besatzung, die ohne fremde Hilfe nicht überwunden werden kann."},{"id":"see2-120","s":"see2","n":120,"q":"Wann darf ein UKW-Sprechfunkgerät auch ohne entsprechenden Befähigungsnachweis benutzt werden?","a":"In Notfällen."},{"id":"see2-121","s":"see2","n":121,"q":"Worauf ist zu achten, wenn Crewmitglieder seekrank sind?","a":"1. Aufenthalt im Cockpit beaufsichtigen und Crewmitglieder gegen Überbordfallen sichern,\n2. Flüssigkeitsverlust ausgleichen (Wasser),\n3. Crewmitglied anhalten, zur Küste oder zum Horizont zu schauen,\n4. mit Arbeiten beschäftigen."},{"id":"see2-122","s":"see2","n":122,"q":"Wozu dient ein Reitgewicht (Gleitgewicht, Ankergewicht) beim Ankern?","a":"Es soll die Ankertrosse auf den Grund ziehen, damit der Anker nicht durch einen zu steilen Winkel aus dem Grund gebrochen wird. Es wirkt ruckdämpfend."},{"id":"see2-123","s":"see2","n":123,"q":"Warum sollte beim Verwenden einer Ankertrosse ein Kettenvorlauf benutzt werden?","a":"Damit der Zug auf den Anker nicht zu steil wird."},{"id":"see2-124","s":"see2","n":124,"q":"Welcher Ankergrund ist für die üblichen Leichtgewichtsanker\n1. gut geeignet?\n2. mäßig geeignet?\n3. ungeeignet?","a":"1. Sand, Schlick, weicher Ton und Lehm,\n2. harter Ton und Lehm,\n3. steinige, verkrautete und stark schlammige Böden."},{"id":"see2-125","s":"see2","n":125,"q":"Was müssen Sie bei der Auswahl eines Ankerplatzes beachten?","a":"1. Der Ankerplatz sollte Schutz vor Wind und Wellen bieten.\n2. Auf ausreichenden Platz zum Schwojen achten.\n3. Mögliche Winddrehungen einplanen."},{"id":"see2-126","s":"see2","n":126,"q":"Welchen Ankergrund sollten Sie nach Möglichkeit meiden?","a":"Steinige, verkrautete und stark schlammige Böden."},{"id":"see2-127","s":"see2","n":127,"q":"Wie können Sie die Haltekraft eines Ankers erhöhen, wenn Sie auf engem Raum (z. B. zwischen zwei Stegen) nicht die erforderliche Kettenlänge stecken können?","a":"Mit einem Reitgewicht, um so den Anker besser am Boden zu halten."},{"id":"see2-128","s":"see2","n":128,"q":"Sie ankern in einer Bucht. Wie können Sie bei zunehmendem Wind die Haltekraft Ihres Ankers verbessern?","a":"1. Mehr Trosse oder Kette stecken,\n2. Reitgewicht verwenden."},{"id":"see2-129","s":"see2","n":129,"q":"Sie wollen auf verkrautetem Grund ankern. Ihnen steht ein Leichtgewichtsanker und ein Stockanker zur Verfügung. Welchen benutzen Sie und warum?","a":"Den Stockanker, weil er sich insbesondere auch aufgrund seines höheren Gewichtes besser eingräbt."},{"id":"see2-130","s":"see2","n":130,"q":"Wozu dient eine Ankerboje?","a":"1. Sie zeigt die Lage des Ankers an.\n2. Mit der Trippleine kann das Bergen eines unklaren Ankers unterstützt werden."},{"id":"see2-131","s":"see2","n":131,"q":"Wie erkennen Sie, ob der Anker hält?","a":"1. Vibration von Kette oder Trosse prüfen,\n2. Einrucken des Ankers prüfen,\n3. durch wiederholte Peilungen und ggf. Schätzungen des Abstands zu anderen Schiffen oder zu Landmarken,\n4. falls GPS vorhanden ist, die Ankeralarmfunktion einschalten."},{"id":"see2-132","s":"see2","n":132,"q":"Welche Ankerarten finden überwiegend auf Sportbooten Verwendung? Nennen Sie 3.","a":"1. Patentanker,\n2. Stockanker (einklappbarer Stock),\n3. Draggen (klappbare Flunken),\n4. Pflugscharanker."},{"id":"see2-133","s":"see2","n":133,"q":"Nennen Sie 3 Ankertypen, die vom Germanischen Lloyd als Anker mit hoher Haltekraft anerkannt sind.","a":"Bruce-Anker, CQR -Anker, Danforth-Anker, D'Hone-Anker."},{"id":"see2-134","s":"see2","n":134,"q":"1. Welches sind die Vorteile einer Ankerkette gegenüber einer Ankerleine?\n2. Wie kombiniert man auf Yachten häufig die Systeme?","a":"1. Die Kette unterstützt das Eingraben, verkleinert den Schwojeraum, wirkt ruckdämpfend, kann nicht an Steinen durchscheuern und erhöht die Haltekraft des Ankers.\n2. Es wird zwischen Anker und Leine ein Kettenvorlauf von 3 bis 5 m gefahren."},{"id":"see2-135","s":"see2","n":135,"q":"1. Warum soll eine Ankerleine nicht an den Anker geknotet werden?\n2. Warum muss die Ankerkette mit einem Taustropp am Schiff bzw. im Kettenkasten befestigt werden?","a":"1. Knoten reduzieren die Bruchlast einer Leine um bis zu 50 %.\n2. Damit die Kette im Notfall schnell gekappt werden kann."},{"id":"see2-136","s":"see2","n":136,"q":"Sie wollen in einer Bucht ankern, in der das (ausreichend tiefe) Wasser unterschiedliche Färbungen zeigt. Wo wählen Sie den Ankerplatz? (Begründung!)","a":"Ich ankere auf hellem Wasser. Begründung:\nDer Grund ist hier sandig, der Anker hält gut. Dunkler Grund weist auf Bewuchs hin, wo der Anker schlecht hält."},{"id":"see2-137","s":"see2","n":137,"q":"Warum darf der Anker nicht zusammen mit seiner Leine am Ankerplatz über Bord geworfen werden?","a":"Die Leine könnte mit dem Anker vertörnen und dadurch das Eingraben des Ankers verhindern. Der Anker würde dann nicht halten."},{"id":"see2-138","s":"see2","n":138,"q":"Beschreiben Sie die Vorbereitung eines Ankermanövers.","a":"Auswählen eines geeigneten Ankerplatzes anhand der Seekarte bzw. des Seehandbuches (Meeresgrund/Wassertiefe geeignet?), Ermitteln der Wind- und/oder Stromrichtung und -stärke, Klarmachen des Ankergeschirrs und des Ankersignals, mit langsamster Fahrt - Kurs gegen Strom bzw. Wind - einen Ankerplatz ansteuern."},{"id":"see2-139","s":"see2","n":139,"q":"Beschreiben Sie wichtige Elemente eines Ankermanövers.","a":"Geeigneten Ankerplatz festlegen/planen, Ansteuerung planen (in der Regel gegen Wind und/oder Strom), bei langsamer Fahrt rückwärts über Grund Anker fallen lassen, Kette/Leine in Abhängigkeit vom Wetter/Strom bis auf das 3- bzw. 5fache der Wassertiefe stecken, Ankerball/Ankerlicht setzen, Ankerposition feststellen, dokumentieren und ausreichend kontrollieren."},{"id":"see2-140","s":"see2","n":140,"q":"Was müssen Sie bedenken, wenn ein großes Schiff auf Ihr Sportboot zukommt?","a":"1. Andere Manövrierfähigkeit (größere Drehkreise, längere Stoppstrecken), 2. u. U. eingeschränkte Sicht des anderen Fahrzeugs, insbesondere nach voraus,\n3. Möglichkeit des Übersehenwerdens, weil man sich im Radarschatten befindet,\n4. Beeinträchtigung durch Bugwellen des großen Schiffes."},{"id":"see2-141","s":"see2","n":141,"q":"Warum sollten Sie nicht zu dicht hinter dem Heck eines vorbeifahrenden Schiffes durchfahren?","a":"Sog und Hecksee können das eigene Boot erheblich gefährden."},{"id":"see2-142","s":"see2","n":142,"q":"Was müssen Sie beim Passieren eines großen Schiffes bei dessen Kursänderungen, z. B. in einem kurvenreichen Fahrwasser, beachten?","a":"Bei einer Kursänderung schwenkt das Heck deutlich in die entgegengesetzte Richtung aus, also nach Backbord bei einer Kursänderung nach Steuerbord und umgekehrt."},{"id":"see2-143","s":"see2","n":143,"q":"Mit welchen Stoppstrecken und Stoppzeiten müssen Sie bei großen Schiffen in voller Fahrt rechnen und wovon hängen sie ab?","a":"Abhängig von Schiffstyp und -größe, Beladungszustand und Ausgangsgeschwindigkeit ist mit der 8- bis 12fachen Schiffslänge und bis zu 8 bis 12 Minuten Dauer (z. B. ein 300 m langes Containerschiff voll abgeladen mit 24 kn: Stoppstrecke ca. 2 sm, Stoppzeit ca. 12 Minuten) zu rechnen."},{"id":"see2-144","s":"see2","n":144,"q":"Wie reagiert ein großes Schiff, wenn bei ca. 20 kn Fahrt ein Ausweichmanöver durch Hartruderlage eingeleitet wird? Nach welcher Distanz verlässt es in etwa die alte Kurslinie?","a":"Der Steven bewegt sich in Richtung der Hartruderlage, das Heck schlägt relativ weit zur entgegengesetzten Richtung aus. Das Schiff verlässt mit seinem Heck erst nach mehreren Schiffslängen seine bisherige Kurslinie, bewegt sich also zunächst in der alten Kursrichtung fort. Diese Strecke kann bei 300 m langen Containerschiffen 1,5 bis 2,5 Schiffslängen, d. h. ca. 500 bis 600 m betragen."},{"id":"see2-145","s":"see2","n":145,"q":"Auf vielen großen Schiffen ist die Sicht nach vorne eingeschränkt. Welchen Abstand vor einem Schiff müssen Sie als nicht einsehbar mindestens berücksichtigen?","a":"Sichtbeschränkung nach voraus maximal 2 Schiffslängen oder 500 m."},{"id":"see2-146","s":"see2","n":146,"q":"Wie können Sie die Wahrscheinlichkeit erhöhen, im Radar von anderen Fahrzeugen gesehen zu werden?","a":"Durch einen möglichst hoch und fest angebrachten passiven Radarreflektor bzw. besser noch durch einen \"aktiven\" Radarreflektor. Stand: 01. Juli 2006 © Wasserstraßen- und Schifffahrtsverwaltung des Bundes"}];

</script>
<script>
/* ==========================================================================
   Crew – Figuren, Zeichnungen, Persönlichkeiten, feste Sätze
   Rollen: K = Käpt'n (führt das Gespräch), M = Matrose, T = Bordtier, P = Prüfer
   ========================================================================== */
const SKIN = '#f4d0ac', INK = '#2b2118', CHEEK = '#f19a9a', MOUTH = '#7a3f33';

/* Gemeinsame Bausteine: .bod wippt beim Sprechen, .gaze steuert die Blickrichtung,
   .eyes blinzelt, .mouth .o öffnet sich beim Sprechen, .mouth .c ist der geschlossene Mund. */
const eyes = (pts, r = 2.6) => `<g class="gaze"><g class="eyes">${pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/>`).join('')}</g></g>`;
const cheeks = (pts, r = 4.5) => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${CHEEK}" opacity=".55"/>`).join('');
const mouth = (closed, ox, oy, rx = 4, ry = 3.2) =>
  `<g class="mouth">${closed ? `<path class="c" d="${closed}" stroke="${INK}" stroke-width="1.8" fill="none" stroke-linecap="round"/>` : ''}<ellipse class="o" cx="${ox}" cy="${oy}" rx="${rx}" ry="${ry}" fill="${MOUTH}"/></g>`;
const shadow = (rx = 36, cy = 141) => `<ellipse cx="50" cy="${cy}" rx="${rx}" ry="5" fill="#3a2414" opacity=".13"/>`;

const ART = {
  hinnerk: () => `${shadow(38)}<g class="bod">
    <ellipse cx="50" cy="100" rx="42" ry="40" fill="#3d5f8f"/>
    <path d="M36 70 Q33 100 36 134 M64 70 Q67 100 64 134" stroke="#4d73a6" stroke-width="3" fill="none" opacity=".7"/>
    <circle cx="50" cy="48" r="28" fill="${SKIN}"/>
    <ellipse cx="50" cy="68" rx="27" ry="20" fill="#f6f2e8"/>
    ${mouth('M45 73 Q50 77.5 55 73', 50, 74.5, 4.5, 3.4)}
    <circle cx="50" cy="55" r="6" fill="#eaa38e"/>

<script>
/* ==========================================================================
   Ton-Mischpult

   ========================================================================== */
const AUD = (() => {
  const FILES = {
    'musik-intro': 'audio/musik-intro.mp3', 'musik-lernen': 'audio/musik-lernen.mp3',
    'musik-deck': 'audio/musik-deck.mp3', 'musik-abend': 'audio/musik-abend.mp3',
    wellen: 'audio/wellen.mp3', wind: 'audio/wind.mp3', windLeise: 'audio/wind-leise.mp3',
    regen: 'audio/regen.mp3', uhr: 'audio/uhr.mp3', segel: 'audio/segel.mp3', glocke: 'audio/glocke.mp3',
    moewe: 'audio/moewe.mp3', nebelhornFern: 'audio/nebelhorn-fern.mp3', nebelhorn: 'audio/nebelhorn.mp3',
    katze: 'audio/katze.mp3', papagei: 'audio/papagei.mp3', funkRauschen: 'audio/funk-rauschen.mp3', funkSuchen: 'audio/funk-suchen.mp3', piep: 'audio/piep.mp3',
    schritte: 'audio/schritte.mp3', tuerAuf: 'audio/tuer-auf.mp3', klopfen: 'audio/klopfen.mp3', streichholz: 'audio/streichholz.mp3', feuerzeug: 'audio/feuerzeug.mp3',
    paffen: 'audio/paffen.mp3', paffen2: 'audio/paffen2.mp3', buchAuf: 'audio/buch-auf.mp3', blaettern: 'audio/blaettern.mp3', sturm: 'audio/sturm.mp3', motorboot: 'audio/motorboot.mp3',
    katze2: 'audio/katze2.mp3', katze3: 'audio/katze3.mp3', schnurren: 'audio/schnurren.mp3', anker: 'audio/anker.mp3', bleistift: 'audio/bleistift.mp3',
    enttaeuschung: 'audio/enttaeuschung.mp3', falsch: 'audio/falsch.mp3', richtig: 'audio/richtig.mp3', motorStart: 'audio/motor-start.mp3', motorLauf: 'audio/motor-lauf.mp3',
  };
  let ctx = null, master, bus = {}, filt, buffers = {}, loading = {};
  let music = {name: null, src: null, gain: null}, loops = {}, duckState = 0, events = [], unlocked = false;
  const cfg = () => (window.S && S.cfg) || {music: .35, amb: .6, sfx: .7};

  function init() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain(); master.connect(ctx.destination);
    filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 20000; filt.connect(master);
    ['music', 'amb', 'sfx'].forEach(k => { bus[k] = ctx.createGain(); bus[k].connect(k === 'amb' ? filt : master); });
    applyVolumes();
    return ctx;
  }
  const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=';
  function unlock() {
    if (!window.__vel) { try { const a = new Audio(); a.src = SILENT; const p = a.play(); if (p && p.catch) p.catch(() => {}); window.__vel = a; } catch (e) {} }
    init(); if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (!unlocked) { const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(master); s.start(0); unlocked = true; }
  }
  function applyVolumes() {
    if (!ctx) return; const c = cfg(), t = ctx.currentTime;
    bus.music.gain.setTargetAtTime(c.music * (duckState ? (music.name === 'musik-abend' ? .12 : .35) : 1), t, .25);
    bus.amb.gain.setTargetAtTime(c.amb, t, .3);
    bus.sfx.gain.setTargetAtTime(c.sfx, t, .1);
  }
  async function load(name) {
    if (buffers[name]) return buffers[name];
    if (loading[name]) return loading[name];
    init(); if (!ctx) return null;
    loading[name] = fetch(FILES[name]).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(a => new Promise((res, rej) => ctx.decodeAudioData(a, res, rej)))
      .then(b => (buffers[name] = b)).catch(() => null);
    return loading[name];
  }

  /* ---------- Musik ---------- */
  async function playMusic(name) {
    if (!ctx || music.name === name) return;
    const old = music; music = {name, src: null, gain: null};
    if (old.gain) { old.gain.gain.setTargetAtTime(0, ctx.currentTime, .8); const s = old.src; setTimeout(() => { try { s.stop(); } catch (e) {} }, 4000); }
    applyVolumes();
    if (!name) return;
    const buf = await load(name); if (!buf || music.name !== name) return;
    const g = ctx.createGain(); g.gain.value = 0; g.connect(bus.music);
    const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.loopStart = .05; s.loopEnd = buf.duration - .05;
    s.connect(g); s.start(0, .05);
    g.gain.setTargetAtTime(1, ctx.currentTime, 1.2);
    music.src = s; music.gain = g;
  }
  function duck(on) { duckState = on ? 1 : 0; applyVolumes(); }

  /* ---------- Dauer-Geräusche ---------- */
  async function setLoop(name, vol, rate = 1) {
    if (!ctx) return;
    let L = loops[name];
    if (!vol) { if (L) L.gain.gain.setTargetAtTime(0, ctx.currentTime, .9); return; }
    if (!L) {
      L = loops[name] = {gain: ctx.createGain(), src: null}; L.gain.gain.value = 0; L.gain.connect(bus.amb);
      const buf = await load(name); if (!buf) return;
      const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.loopStart = .06; s.loopEnd = buf.duration - .06;
      s.playbackRate.value = rate; s.connect(L.gain); s.start(0, Math.random() * Math.max(0, buf.duration - 1)); L.src = s;
    }
    L.gain.gain.setTargetAtTime(vol, ctx.currentTime, .9);
  }
  function indoor(on) { if (!ctx) return; filt.frequency.setTargetAtTime(on ? 1100 : 20000, ctx.currentTime, .4); }

  /* ---------- Effekte ---------- */
  async function sfx(name, o = {}) {
    if (!ctx) return; const buf = await load(name); if (!buf) return;
    const g = ctx.createGain(); g.gain.value = o.vol == null ? 1 : o.vol; g.connect(bus.sfx);
    const s = ctx.createBufferSource(); s.buffer = buf; if (o.rate) s.playbackRate.value = o.rate; s.connect(g);
    const off = o.offset || 0, dur = o.dur || (buf.duration - off);
    s.start(0, off, dur);
    if (o.dur) { g.gain.setValueAtTime(g.gain.value, ctx.currentTime + Math.max(0, dur - .4)); g.gain.linearRampToValueAtTime(0, ctx.currentTime + dur); }
    return new Promise(r => { s.onended = r; });
  }
  /* Uhr: tickt n Sekunden lang (eine Sekunde = ein Tick) */
  function ticks(n, vol = .8) { return sfx('uhr', {offset: 1, dur: Math.max(1, n), vol}); }

  /* Zufällige Ereignisse je nach Wetter (Möwen, Nebelhorn, flatterndes Segel) */
  function clearEvents() { events.forEach(clearTimeout); events = []; }
  function every(minS, maxS, fn) {
    const tick = () => { fn(); events.push(setTimeout(tick, (minS + Math.random() * (maxS - minS)) * 1000)); };
    events.push(setTimeout(tick, (minS * .4 + Math.random() * minS) * 1000));
  }

  /* Wetterklang: wx = schoen | windig | sturm | regen | nebel, place = deck | kajuete | quiz | exam */
  function weather(wx, day, place) {
    if (!ctx) return;
    const out = place === 'deck' || place === 'intro', night = day === 'nacht', on = !(window.S && S.cfg && S.cfg.wxSound === false);
    const v = {wellen: 0, wind: 0, windLeise: 0, regen: 0, uhr: 0, sturm: 0};
    if (on) {
      if (wx === 'windig') Object.assign(v, {wellen: .55, wind: .4, windLeise: .25});
      if (wx === 'sturm') Object.assign(v, {wellen: .2, sturm: .6, wind: .5, windLeise: .3, regen: .5});
      if (wx === 'regen') Object.assign(v, {regen: .6});
      if (wx === 'nebel') Object.assign(v, {wellen: .12});
      if (wx === 'schoen' && out) v.wellen = .08;
      if (place === 'kajuete') v.uhr = .06;
      if (place === 'quiz') Object.keys(v).forEach(k => v[k] *= .35);
      if (place === 'exam') Object.keys(v).forEach(k => v[k] = 0);
    }
    Object.entries(v).forEach(([k, x]) => setLoop(k, x));
    indoor(place === 'kajuete' || place === 'quiz' || place === 'exam');
    clearEvents();
    if (!on || place === 'exam') return;
    if (!night && (wx === 'schoen' || wx === 'windig')) every(28, 75, () => sfx('moewe', {offset: Math.random() * 26, dur: 3 + Math.random() * 3, vol: out ? .45 : .2}));
    if (wx === 'nebel') every(40, 90, () => sfx(Math.random() < .6 ? 'nebelhornFern' : 'nebelhorn', {vol: out ? .5 : .25}));
    if (wx === 'windig' || wx === 'sturm') every(18, 50, () => sfx('segel', {vol: out ? .5 : .2, rate: .9 + Math.random() * .25}));
    if (out && !night && (wx === 'schoen' || wx === 'windig')) every(110, 240, () => sfx('motorboot', {vol: .22}));
  }

  /* ---------- Schallsignale (Typhon) ----------
     Laut Katalog: kurzer Ton etwa 1 Sekunde, langer Ton etwa 4–6 Sekunden. */
  const SIG = {short: 1, long: 4.5, gap: 1, groupGap: 2.5};
  function parseSig(str) {
    const out = []; let gap = false;
    const s = String(str).replace(/mindestens\s*/i, '');
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '●' || c === '▬') { out.push({type: c === '●' ? 'short' : 'long', gapBefore: gap}); gap = false; }
      else if (c === ' ' && s[i + 1] === ' ') gap = true;
    }
    return out;
  }
  function horn(str, onTone) {
    init(); if (!ctx) return {done: Promise.resolve(), stop() {}};
    const tones = parseSig(str); let t = ctx.currentTime + .15, stopped = false; const nodes = [];
    tones.forEach((tn, i) => {
      if (i) t += tn.gapBefore ? SIG.groupGap : SIG.gap;
      const d = SIG[tn.type], g = ctx.createGain(); g.gain.value = 0; g.connect(bus.sfx);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(g);
      [[148, 'sawtooth', .5], [222, 'sawtooth', .28], [296, 'square', .1]].forEach(([f, type, a]) => {
        const o = ctx.createOscillator(), og = ctx.createGain(); o.type = type; o.frequency.value = f; og.gain.value = a;
        o.connect(og); og.connect(lp); o.start(t); o.stop(t + d + .2); nodes.push(o);
      });
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.55, t + .08); g.gain.setValueAtTime(.55, t + d - .1); g.gain.linearRampToValueAtTime(0, t + d);
      if (onTone) { const at = (t - ctx.currentTime) * 1000; setTimeout(() => !stopped && onTone(i, tn.type, d), at); }
      t += d;
    });
    const total = (t - ctx.currentTime) * 1000 + 200;
    return {total, done: new Promise(r => setTimeout(r, total)), stop() { stopped = true; nodes.forEach(o => { try { o.stop(); } catch (e) {} }); }};
  }

  const story = await ask({s: 'K', t: 'Jetzt erzähl mal frei: Was hast du mit dem Schein vor, wo willst du fahren, und was macht dir vielleicht Respekt? Je mehr du erzählst, desto besser können wir dir helfen.'},
    `<textarea id="fa" placeholder="Zum Beispiel: Ich will mit Freunden an der Ostsee chartern. Vor Nachtfahrten hab ich Respekt…">${esc(prof.about || '')}</textarea><div class="row" style="margin-top:8px"><button class="btn" id="fok">Weiter</button><button class="btn ghost" id="fskip">Überspringen</button></div>`,
    fin => { $('#fok').onclick = () => fin($('#fa').value.trim() || null); $('#fskip').onclick = () => fin(null); },
    t => t.trim(), {noSpeech: 20000, pause: 3});
  if (story) { prof.about = (prof.about ? prof.about + ' ' : '') + story; prof.facts = (prof.facts || []).concat('Erzählt beim Kennenlernen: ' + story.slice(0, 220)).slice(-30); await sayRole('K', 'Danke, das merk ich mir. Das hilft uns mehr, als du denkst.'); }
  /* Noch jemand im Raum? */
  if (mic) {
    const t = await ask({s: 'M', t: ONB.room.t}, '', () => {}, t => t.trim() || '', {noSpeech: 6500, pause: 1.4, allowSilence: true});
    S.others = !!(t && t.length > 1);
    await sayRole(S.others ? 'T' : 'K', S.others ? ONB.roomYes.t : ONB.roomFish.t);
  }
  if (!prof.exam) prof.exam = new Date(Date.now() + 42 * 864e5).toISOString().slice(0, 10);
  const changed = !old.exam || old.exam !== prof.exam || old.minutes !== prof.minutes;
  S.profile = prof; if (changed) S.plan = null; (S.courses[S.course] = S.courses[S.course] || {}).examSet = true; save();
  LOG.add('kennenlernen', 'fertig: ' + JSON.stringify({name: prof.name, exam: prof.exam, age: prof.ageGroup, min: prof.minutes, exp: prof.exp, about: !!prof.about}));
  await sayRole('K', 'So. Kurs ist abgesteckt. Den Rest erzählst du uns nach und nach. Dann mal: Leinen los!');

  if (apiKey() && elKey()) return endIntro(false);
  keysStep(() => endIntro(false));
}

  const P = {name: '', course: S.course, exam: new Date(Date.now() + 28 * 864e5).toISOString().slice(0, 10), ageGroup: 'erw', minutes: 30, exp: 'none'};
  const chips = (key, list) => `<div class="chips big">${list.map(([k, v]) => `<button class="chip" data-v="${k}" aria-pressed="${String(P[key]) === String(k)}">${v}</button>`).join('')}</div>`;
  const STEPS = [
    {q: 'Wie heißt du?', html: () => `<input type="text" id="sv" placeholder="Vorname" autocomplete="given-name" value="${esc(P.name)}">`, get: () => { P.name = $('#sv').value.trim(); }},
    {q: 'Für welchen Schein lernst du?', html: () => chips('course', Object.values(COURSES).map(c => [c.id, c.name])), key: 'course'},
    {q: 'Wann ist deine Prüfung?', html: () => `<input type="date" id="sv" value="${P.exam}">`, get: () => { P.exam = $('#sv').value || P.exam; }},
    {q: 'Wie alt bist du?', sub: 'Danach richtet sich, wie frech die Crew sein darf.', html: () => chips('ageGroup', [['kind', 'Unter 16'], ['teen', '16 oder 17'], ['erw', '18 oder älter']]), key: 'ageGroup'},

      <div class="row"><button class="btn ghost" id="sback" ${i ? '' : 'disabled'}>Zurück</button><button class="btn lamp" id="snext">${i < STEPS.length - 1 ? 'Weiter' : 'Kurs abstecken'}</button></div></div>`;
    app.querySelector('svg.ch').style.width = '72px';
    app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { P[s.key] = s.num ? +b.dataset.v : b.dataset.v; app.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    const inp = $('#sv'); if (inp && inp.type === 'text') { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') $('#snext').click(); }; }

      <svg class="goal" viewBox="0 0 22 24" aria-hidden="true"><path d="M11 2v20" stroke="var(--muted)" stroke-width="2"/><path d="M11 3h9l-3 4 3 4h-9z" fill="#c2473b"/></svg></div>
    <div class="legend"><span><i style="background:#f0b53e"></i>Dein Lernstand</span><span><i style="background:#8a96a3"></i>Das Prüfungsboot</span></div>

}
/* ---------- Kajüte: hier wird gelernt ---------- */
function renderCabin() {

  app.innerHTML = `<div class="topbar"><button class="btn small ghost" id="updeck">↑ An Deck</button><span></span><button class="coursechip" id="crs" aria-label="Schein wechseln">${esc(COURSE.short)}</button></div>
  ${cabinScene(S.crew)}
  ${!courseBucket(S.course).examSet ? `<div class="card" id="datecard"><h3>Wann ist deine ${esc(COURSE.short)}-Prüfung?</h3><input type="date" id="cdate" value="${S.profile.exam}"><button class="btn wide" id="cdsave" style="margin-top:10px">Speichern</button></div>` : ''}
  ${needAge ? `<div class="card" id="agecard"><h3>Kurze Frage der Crew</h3><p class="small" style="margin:0 0 8px">Wie alt bist du? Danach richtet sich, wie frech die Crew sein darf.</p>
    <div class="chips">${[['kind', 'Unter 16'], ['teen', '16 oder 17'], ['erw', '18 oder älter']].map(([k, v]) => `<button class="chip" data-age="${k}">${v}</button>`).join('')}</div></div>` : ''}
  <div class="card pathcard" id="pathcard">

    <button class="btn wide lamp" id="pathgo" style="font-size:1.08rem">${next ? 'Weiter: ' + esc(next.label) : 'Geschafft! Noch eine Extrarunde?'}</button>
  </div>
  <div class="row ways"><button class="btn" id="totalk">Mit der Crew reden</button><button class="btn ghost" id="toexam">Probeprüfung</button></div>
  <button class="btn wide ghost" id="togames" style="margin-top:10px">🎲 Spielekiste</button>
  <p class="sidelinks"><button id="tolex">Lexikon</button><button id="tofunk">Kajütenfunk</button><button id="tobooks">Kapitel</button><button id="tolog">Logbuch</button></p>`;
  $('#updeck').onclick = () => { AUD.click(); setTab('deck'); };
  $('#crs').onclick = courseSheet;
  $('#pathgo').onclick = () => { AUD.unlock(); AUD.click(); next ? next.run() : extraRound(); };
  $('#totalk').onclick = () => { AUD.unlock(); setTab('talk'); };
  $('#toexam').onclick = examIntro; $('#togames').onclick = () => { AUD.unlock(); gamesHub(); }; $('#tofunk').onclick = () => setTab('funk'); $('#tolex').onclick = () => { returnTo = 'cabin'; renderLexikon(); }; $('#tobooks').onclick = chaptersSheet; $('#tolog').onclick = () => setTab('log');
  const cd = $('#cdsave'); if (cd) cd.onclick = () => { S.profile.exam = $('#cdate').value || S.profile.exam; (S.courses[S.course] = S.courses[S.course] || {}).examSet = true; S.plan = null; save(); $('#datecard').remove(); toast('Prüfungsdatum gespeichert.'); };
  app.querySelectorAll('[data-age]').forEach(b => b.onclick = () => { S.profile.ageGroup = b.dataset.age; save(); const c = $('#agecard'); if (c) c.remove(); toast('Danke! Die Crew weiß jetzt Bescheid.'); });
  const sc = app.querySelector('.scene.cabin');
  bindFernglas(sc);
  app.querySelectorAll('.cabin .ch').forEach(g => g.addEventListener('click', () => { AUD.unlock(); charMenu(g.dataset.ch); }));
  const SPOT = {buecher: chaptersSheet, plan: planSheet, deck: () => setTab('deck'), funk: () => setTab('funk'), logbuch: () => setTab('log'), pruefung: examIntro, kiste: () => { AUD.sfx('tuerAuf', {vol: .5}); renderSettings(); },
    knoten: () => toast('Das Knotenbrett wartet noch auf die Knotenfotos.'), spiele: () => gamesHub(), hocker: () => bgSit(), karte: () => { AUD.sfx('bleistift', {vol: .5, dur: .9}); navGame(); }};
  app.querySelectorAll('[data-spot]').forEach(b => b.onclick = () => { AUD.unlock(); AUD.click(); (SPOT[b.dataset.spot] || (() => {}))(); });
  /* Überall was zu entdecken: Uhr, Lampe, Maus, Möwe, Krebs, Spinne */
  let lampTaps = [];
  const TAP = {
    clock: el => { const on = el.classList.toggle('ticking'); AUD.clock(on ? .45 : .06); LOG.add('entdecken', 'Uhr ' + (on ? 'tickt' : 'still')); },
    lamp: el => {
      if (el.classList.contains('fallen')) return;
      const now = Date.now(); lampTaps = lampTaps.filter(t => now - t < 4000).concat(now);

  };

  pipeOnce();
  const dl = daily();
  if (AUD.ready && dl.answered < 5 && dl.talk >= 3 && S.lastTease !== today()) { S.lastTease = today(); save(); setTimeout(() => VOX.say(S.crew.M, teaseOf(S.crew.M) || teaseOf(S.crew.K), 'fixed'), 800); }
}
let catTimer = null;
function scheduleCatWalk(first) {
  clearTimeout(catTimer);
  catTimer = setTimeout(catWalk, (first != null ? first : 25 + Math.random() * 40) * 1000);
}
function catWalk() {
  const svg = document.querySelector('.scene.cabin svg .rocker');
  if (tab !== 'cabin' || !svg || document.querySelector('.walker')) return scheduleCatWalk();
  const isPet = S.crew.T === 'backbord', perch = isPet ? document.querySelector('.scene.cabin [data-ch="backbord"]') : null;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('class', 'walker'); g.setAttribute('data-tap', 'walkcat');
  const flip = Math.random() < .5;
  g.innerHTML = `<g transform="translate(${flip ? 450 : -50} 282) scale(${flip ? -.42 : .42} .42)">${ART.backbord()}</g>`;
  if (flip) g.classList.add('back');
  svg.appendChild(g); if (perch) perch.style.visibility = 'hidden';
  g.addEventListener('click', e => { e.stopPropagation(); AUD.unlock(); meow(); });
  if (AUD.ready) AUD.sfx('schnurren', {vol: .4});
  setTimeout(() => { g.remove(); if (perch) perch.style.visibility = ''; scheduleCatWalk(60 + Math.random() * 60); }, 9500);
}

/* Podcast „Kajütenfunk“: einmal erzeugt und gespeichert, mit Stopps zum Mitmachen */
async function makeStory(topicId) {
  if (!apiKey()) return needKey();
  const box = $('#story'), g = $('#gen'); g.disabled = true;
  box.innerHTML = '<p class="think" style="margin-top:12px">Der Funk rauscht, die Crew setzt sich an den Tisch…</p>';
  AUD.sfx('funkSuchen', {vol: .4}); AUD.loop('funkRauschen', .1);
  const {topic: t, qs: pick} = pickStoryQs(topicId);
  const K = CREW[S.crew.K], M = CREW[S.crew.M], T = CREW[S.crew.T];
  const prompt = `Katalogfragen mit verbindlicher richtiger Antwort:\n${pick.map(catLine).join('\n')}\n\nSchreibe ein unterhaltsames Hörspiel-Gespräch in der Kajüte einer Segelyacht zwischen:\nK = ${K.persona}\nM = ${M.persona}\nT = ${T.persona}\nThema: „${t.name}“. Sie erzählen sich kleine Erlebnisse, in denen das Wissen aus ALLEN oben genannten Katalogfragen vorkommt und richtig erklärt wird. Fachinhalte exakt wie im Katalog, keine erfundenen Regeln. Kein Erzähler, nur wörtliche Rede, kurze Sätze, gut vorlesbar, leicht norddeutsch, keine Abkürzungen. 14 bis 20 Beiträge, T höchstens dreimal mit ganz kurzen Einwürfen.\n${styleRules()}\nBaue genau 2 Stopps zum Mitmachen ein: Nachdem das Wissen einer Katalogfrage erklärt wurde, fragt K den Zuhörer direkt (zum Beispiel "Na, was meinst du?"), danach folgt eine Zeile ${COURSE.kind === 'open' ? '{"s":"Q","n":"<Kennung dieser Katalogfrage aus der Klammer, zum Beispiel nav-5>"}' : '{"s":"Q","n":<Nummer dieser Katalogfrage>}'}. Nach dem Stopp geht das Gespräch kurz weiter. Am Ende verabschiedet sich K vom Zuhörer.\nAntworte NUR mit JSON: {"title":"kurzer Titel","lines":[{"s":"K","t":"..."},{"s":"Q","n":12}]}`;
  try {
    const data = await aiJson(prompt, {modelTier: 'complex', maxTokens: 4000, system: `Du schreibst Hörspiele für eine Lern-App zum ${COURSE.name} (${COURSE.short}).\n${RULES}`});
    if (!data || !Array.isArray(data.lines) || !data.lines.length) throw {code: 'invalid_json'};
    const ok = new Set(pick.map(q => q.n));
    const key = n => COURSE.kind === 'open' ? String(n) : +n;
    const lines = data.lines.map(l => l && l.s === 'Q' ? (ok.has(key(l.n)) ? {s: 'Q', n: key(l.n)} : null) : (l && /^[KMT]$/.test(l.s) && l.t ? {s: l.s, t: String(l.t)} : null)).filter(Boolean);
    const story = {title: String(data.title || t.name), topic: t.id, qs: pick.map(q => q.n), crew: {...S.crew}, lines};
    S.stories = (S.stories || []).concat(story).slice(-10);
    S.storyQs = [...new Set((S.storyQs || []).concat(story.qs))]; save();
    LOG.add('funk', 'Neue Folge: ' + story.title + ' (Fragen ' + story.qs.join(',') + ')');
    showStory(story);
  } catch (e) { box.innerHTML = `<p class="muted" style="margin-top:12px">${esc(aiErr(e))}</p>`; }
  AUD.loop('funkRauschen', 0); g.disabled = false;
}
async function showStory(story) {
  const box = $('#story'); if (!box) return; VOX.stop('neue Folge');
  const crewOf = r => (story.crew && story.crew[r]) || S.crew[r];
  const spoken = story.lines.filter(l => l.s !== 'Q'), chars = spoken.reduce((a, l) => a + l.t.length, 0);
  box.innerHTML = `<h3 style="margin-top:14px">${esc(story.title)}</h3>
    <p class="small muted" id="cost"></p>
    <div class="row" style="margin-bottom:10px"><button class="btn" id="play">Anhören</button>${story.qs.length ? '<button class="btn ghost" id="pq">Fragen dazu üben</button>' : ''}</div>

/* Kernbegriffe eines Antwortvorschlags (für den SKS-Stichwort-Check) */
const STOP = new Set(['durch', 'eine', 'einen', 'einer', 'eines', 'dass', 'oder', 'sowie', 'werden', 'wird', 'sind', 'kann', 'muss', 'nicht', 'nach', 'beim', 'auch', 'wenn', 'bzw', 'diese', 'dieser', 'dabei', 'sich', 'unter', 'über', 'ihre', 'seine', 'immer', 'sollte', 'sollten', 'haben', 'z. b.']);
function keywords(ans) {
  const segs = String(ans).split(/\n|;|,|\.\s|\s(?:und|oder)\s/).map(x => x.replace(/^\s*(\d+\.|[a-z]\)|-|–)\s*/, '').trim()).filter(x => x.length > 2);
  const out = [];
  segs.forEach(sg => {
    const words = sg.split(/\s+/).map(w => w.replace(/[„“"().:!?]/g, '')).filter(w => w.length > 3 && !STOP.has(w.toLowerCase()));
    const nouns = words.filter(w => /^[A-ZÄÖÜ0-9]/.test(w));
    const pick = (nouns.length ? nouns : words).sort((a, b) => b.length - a.length)[0];
    if (pick && !out.some(o => o.toLowerCase() === pick.toLowerCase())) out.push(pick);
  });
  return out.slice(0, 8);
}

/* ---------- Unterschied-Trainer ---------- */
function diffWords(a, b) {
  const ta = a.split(/\s+/), tb = b.split(/\s+/), norm = w => w.toLowerCase().replace(/[.,;:!?()„“"]/g, '');
  const A = ta.map(norm), B = tb.map(norm), m = A.length, n = B.length;
  const L = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ka = new Set(), kb = new Set(); let i = 0, j = 0;
  while (i < m && j < n) { if (A[i] === B[j]) { ka.add(i); kb.add(j); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  const mark = (t, keep) => t.map((w, k) => keep.has(k) ? esc(w) : `<mark>${esc(w)}</mark>`).join(' ');
  return {sim: L[0][0] / Math.max(m, n), a: mark(ta, ka), b: mark(tb, kb)};
}

function runQuiz(queue, title, mode = 'learn', opts = {}) {

  /* Karteikarte mit freier Antwort (SKS): antworten, aufdecken, einschätzen */
  function showOpen(q) {
    const retry = requeued.has(q.n);
    app.innerHTML = `<div class="qhead"><div class="tag">${esc(title)} · ${esc(topicOf(q.n).name)}</div><button class="btn small ghost" id="quit">Beenden</button></div>
      <div class="prog"><i style="width:${(i / queue.length * 100).toFixed(0)}%"></i></div>
      <div class="card">
        ${opts.hint && i === 0 ? `<p class="small" style="margin:0 0 8px;color:var(--sea)"><b>${esc(opts.hint)}</b></p>` : ''}
        <div class="tag">${esc(q.label)}${st(q.n) ? '' : ' · neu'} · freie Antwort</div>
        <div class="qtext">${esc(q.q).replace(/\n/g, '<br>')}</div>
        ${q.qi ? `<div class="qimg">${q.qi.map(s => `<img src="${s}" alt="Abbildung zur Frage">`).join('')}</div>` : ''}
        <textarea id="myans" placeholder="Deine Antwort (optional, aber gut fürs Gedächtnis)"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn lamp" id="reveal">Antwort zeigen</button>${VOX.canListen ? '<button class="btn ghost" id="speak">Sprechen</button>' : ''}</div>
        <div id="after"></div>

    window.scrollTo(0, 0);

      $('#after').innerHTML = `<div class="fact" style="white-space:pre-line"><b>Antwortvorschlag:</b>\n${esc(q.a)}</div>
        ${q.ai ? `<div class="qimg">${q.ai.map(s => `<img src="${s}" alt="Abbildung zur Antwort">`).join('')}</div>` : ''}
        ${mine && apiKey() ? '<button class="btn ghost small" id="check">Prüf meine Antwort</button><div id="checkfb" class="lesson" style="margin-top:8px"></div>' : ''}
        ${kw.length >= 2 ? `<p class="small muted" style="margin:10px 0 0">Hast du das genannt? Tippe an, was drin war:</p><div class="kwchips">${kw.map((k, j) => `<button class="kw" data-kw="${j}" aria-pressed="false">${esc(k)}</button>`).join('')}</div><p class="small" id="kwsug" style="margin:0"></p>` : ''}

    app.innerHTML = `<div class="result" style="margin-top:16px">${charSVG('kroeger')}<div><div class="big ${passed ? 'pass' : 'fail'}">${label}</div><div style="font:700 1.4rem var(--hfont)">${total} von 60 Punkten</div><div class="small muted">Ab 39 bestanden, 33 bis 38 mündlich. Die Kartenaufgabe fehlt hier noch.</div></div></div>
      <h2 style="margin-top:18px">Die Korrektur</h2>
      ${qs.map((q, k) => `<div class="card"><div class="tag">${esc(q.label)} · <b style="color:${pts[k].pt === 2 ? 'var(--stb)' : 'var(--bb)'}">${pts[k].pt} von 2 Punkten</b></div><p><strong>${esc(q.q)}</strong></p>${pts[k].k ? `<p class="small" style="margin:0 0 6px"><i>${esc(pts[k].k)}</i></p>` : ''}${pts[k].pt < 2 ? `<p class="small" style="margin:0 0 4px"><b>Deine:</b> ${esc(answers[k] || '(keine Antwort)')}</p><p class="small" style="white-space:pre-line;margin:0;color:var(--stb)"><b>Vorschlag:</b> ${esc(q.a)}</p>` : ''}</div>`).join('')}
      <button class="btn wide" id="home" style="margin-top:6px">Zurück in die Kajüte</button>`;
    app.querySelector('svg.ch').style.width = '96px';
    $('#home').onclick = () => setTab('cabin');
    if (!passed) setTimeout(() => AUD.sfx('enttaeuschung', {vol: .5}), 400);
    setTimeout(() => VOX.say('kroeger', lineOf('kroeger', passed ? 'pass' : oral ? 'oral' : 'fail'), 'fixed'), passed ? 900 : 3200);
  }
  show();
}

/* ---------- Logbuch ---------- */
function renderLog() {
  place = 'log';
  const all = Q.length, mastered = Q.filter(q => st(q.n) && st(q.n).b >= 3).length, ex = (S.exams || []).slice(-6).reverse();
  const days = [...Array(7)].map((_, k) => today() - 6 + k), hist = S.hist || {}, week = days.reduce((a, d) => a + (hist[d] || 0), 0), maxd = Math.max(5, ...days.map(d => hist[d] || 0));
  const weak = weakTopics()[0], wd = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

function doBackup() {
  stashCourse(); S.lastBackup = today(); save();

function groupSettings() {
  const root = app.querySelector('.set'); if (!root) return;
  const sections = {}; let cur = null;
  [...root.children].forEach(el => { if (el.tagName === 'H2') { cur = el.textContent.trim(); sections[cur] = []; el.remove(); } else if (cur) { sections[cur].push(el); } });
  const GROUPS = [['Schein und Prüfung', ['Schein und Prüfung']], ['Crew und Stimmen', ['Crew', 'Crew-Charakter', 'Stimmen', 'Zuhören']], ['Ton und Bild', ['Ton und Wetter']], ['Technik', ['Schlüssel', 'Selbsttest', 'Protokoll', 'Sonstiges']]];
  GROUPS.forEach(([title, keys], gi) => {
    const d = document.createElement('details'); d.className = 'group'; if (gi === 0) d.open = true;
    d.innerHTML = `<summary>${title}</summary>`;
    keys.forEach(k => (sections[k] || []).forEach(el => d.appendChild(el)));

const FERNGLAS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="15.5" r="3.5"/><circle cx="17.5" cy="15.5" r="3.5"/><path d="M10 15.5h4M5 12l2-6h3l1 6M19 12l-2-6h-3l-1 6"/></svg>';

/* Fernglas: antippen oder gedrückt halten zeigt kurz alle antippbaren Stellen */
/* Kringel und Beschriftung nur dort, wo ein Spiel oder Lerninhalt steckt */
const GAME_KEYS = new Set(['kajuete', 'horn', 'segel', 'pinne', 'motor']);
const EGG_LABELS = {moewe: 'Möwe', leuchtturm: 'Leuchtturm', bauteile: 'Bauteile', laternen: 'Laternen', kajuete: 'Niedergang', horn: 'Horn', pinne: 'Pinne', motor: 'Motor', tonne: 'Tonne', seehund: 'Seehund', fisch: 'Fisch', segel: 'Segel',
  clock: 'Uhr', lamp: 'Lampe', mouse: 'Maus', gull: 'Möwe', crab: 'Krebs', spider: 'Spinne', walkcat: 'Katze'};
/* Fernglas: Kreise plus Beschriftung, damit man weiß, wo was ist */
function revealLabels(scene, on) {
  scene.querySelectorAll('.revlabel').forEach(e => e.remove());
  if (!on) return;
  const host = scene.getBoundingClientRect(), seen = new Set();
  scene.querySelectorAll('[data-egg],[data-go],[data-tap]').forEach(el => {
    const key = el.dataset.egg || el.dataset.go || el.dataset.tap, name = EGG_LABELS[key]; if (!name || seen.has(key) || !GAME_KEYS.has(key)) return; seen.add(key);
    const r = el.getBoundingClientRect(); if (!r.width) return;
    const s = document.createElement('span'); s.className = 'revlabel'; s.textContent = name;
    s.style.left = ((r.left + r.width / 2 - host.left) / host.width * 100).toFixed(1) + '%';
    s.style.top = ((r.top - host.top) / host.height * 100 - 2).toFixed(1) + '%';
    scene.appendChild(s);
  });
}
function bindFernglas(scene) {
  const b = scene.querySelector('.fernglas'); if (!b) return;
  let t = null;
  const on = ms => { clearTimeout(t); scene.classList.add('reveal'); revealLabels(scene, true); AUD.click(); t = setTimeout(() => { scene.classList.remove('reveal'); revealLabels(scene, false); }, ms); };
  b.addEventListener('pointerdown', () => on(4000));
  b.addEventListener('pointerup', () => on(1600));
  b.addEventListener('click', e => e.preventDefault());
}

  const sc = app.querySelector('.scene.boat');

  $('#down').onclick = goBelow; $('#crs').onclick = courseSheet; $('#gear').onclick = () => { AUD.click(); returnTo = 'deck'; renderSettings(); }; bindSaying();

  sc.querySelectorAll('[data-egg]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); AUD.unlock(); startEgg(el.dataset.egg, el); }));
  clearTimeout(fishTimer);
  const jump = () => { if (tab !== 'deck') return; const f = sc.querySelector('.fishwrap'); if (f) { f.classList.remove('jump'); f.getBBox(); f.classList.add('jump'); } fishTimer = setTimeout(jump, 9000 + Math.random() * 14000); };

}
function goBelow() { AUD.unlock(); setTab('cabin'); }
/* Panorama: Start beim Cockpit, Position merken, am Laptop mit der Maus ziehen */
function bindPano(pano) {
  if (!pano) return;
  requestAnimationFrame(() => {
    const max = pano.scrollWidth - pano.clientWidth; if (max <= 0) return;
    const want = S.panoX != null ? S.panoX : (.72 * pano.scrollWidth - pano.clientWidth / 2) / max;
    pano.scrollLeft = Math.max(0, Math.min(1, want)) * max;
  });
  let st = null;
  pano.addEventListener('scroll', () => { const max = pano.scrollWidth - pano.clientWidth; if (max > 0) S.panoX = pano.scrollLeft / max; }, {passive: true});
  pano.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; st = {x: e.clientX, l: pano.scrollLeft, moved: false}; });
  pano.addEventListener('pointermove', e => { if (!st) return; const dx = e.clientX - st.x; if (Math.abs(dx) > 5) st.moved = true; pano.scrollLeft = st.l - dx; });
  const end = () => { if (st && st.moved) { pano.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); }, {capture: true, once: true}); } st = null; };
  pano.addEventListener('pointerup', end); pano.addEventListener('pointerleave', () => { st = null; });
}

function startEgg(id, el) {

<script>
/* ==========================================================================
   Klönschnack: Gespräch nach dem Walkie-Talkie-Prinzip.
   Die Crew spricht zu Ende, dann ist der Nutzer dran: antippen, sprechen,
   nochmal antippen (oder Pause). Freihand hört nach jeder Antwort automatisch zu.
   ========================================================================== */
let TALK = {on: false, ctl: null, abort: null, state: 'idle'};
const STATE_TXT = {
  idle: ['Antippen und sprechen', 'Oder unten schreiben.'],
  yourturn: ['Du bist dran', 'Antippen und sprechen.'],
  listen: ['Ich höre zu…', 'Antippen zum Senden, oder einfach eine Pause machen.'],
  think: ['Die Crew überlegt…', ''],

function setTalkUI(s, note) {

  st.innerHTML = `<b>${STATE_TXT[s][0]}</b><small>${esc(note || STATE_TXT[s][1])}</small>`;
  b.className = 'ptt ' + s; b.disabled = s === 'think';
  b.setAttribute('aria-label', STATE_TXT[s][0]);
}
function logLine(s, t, store = true) {
  const log = $('#tlog'); if (store) { S.talk.push({s, t}); S.talk = S.talk.slice(-40); save(); }
  if (!log) return; const e = log.querySelector('.empty'); if (e) e.remove();
  const d = document.createElement('div'); d.className = 'l' + (s === 'U' ? ' u' : '');
  d.innerHTML = s === 'U' ? esc(t) : `<b style="color:${CREW[cid(s)].color}">${esc(nameOf(s))}</b>${esc(t)}`;
  log.appendChild(d); d.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}
function needKey() {
  if ($('#keycard')) { $('#keycard').scrollIntoView({block: 'center', behavior: 'smooth'}); const i = $('#ck'); if (i) i.focus(); return; }
  toast(aiErr({code: 'no_key'}), 6000); setTab('talk');
}
function sttErrText(err) {
  return {network: 'Die Spracherkennung des Handys braucht Internet und funktioniert nur in Chrome. Mit ElevenLabs-Schlüssel nutze ich automatisch dessen Erkennung.',
    'not-allowed': 'Das Mikrofon ist gesperrt. Tippe oben in der Adresszeile auf das Schloss-Symbol und erlaube das Mikrofon.',
    'service-not-allowed': 'Dieser Browser lässt keine Spracherkennung zu. Nimm Chrome oder trag einen ElevenLabs-Schlüssel ein.',
    unsupported: 'Dieser Browser kann keine Sprache erkennen. Schreib unten, oder nimm Chrome.',
    'audio-capture': 'Kein Mikrofon gefunden, oder eine andere App benutzt es gerade.',
    el_stt_perm: 'Dein ElevenLabs-Schlüssel darf „Sprache zu Text“ nicht nutzen. Stell unter Einstellungen → Zuhören auf „Handy“.',
    el_stt_quota: 'Das ElevenLabs-Guthaben reicht nicht für die Spracherkennung.',
    el_stt: 'Die ElevenLabs-Spracherkennung hat nicht geklappt. Prüf die Verbindung.'}[err] || `Die Spracherkennung hat nicht geklappt (${err}). Schreib unten.`;
}
const KEYCARD = () => `<div class="card" id="keycard"><h3>Ein Schlüssel fehlt noch</h3>
  <p class="small" style="margin:0 0 8px">Damit die Crew mit dir redet, braucht sie deinen Anthropic-Schlüssel. Er wird nur auf diesem Handy gespeichert.</p>
  <input type="password" id="ck" autocomplete="off" placeholder="sk-ant-…"><button class="btn wide" id="cks" style="margin-top:10px">Speichern und testen</button><p class="status" id="ckr"></p></div>`;
function bindKeycard(after) {
  const ck = $('#cks'); if (!ck) return;
  ck.onclick = async () => {
    const v = $('#ck').value.trim(), o = $('#ckr'); if (!v) { o.className = 'status err'; o.textContent = 'Bitte den Schlüssel einfügen.'; return; }
    setApiKey(v); o.className = 'status'; o.textContent = 'Teste die Verbindung…';
    try { await ai('Antworte nur mit: Ahoi', {modelTier: 'quick', maxTokens: 10}); o.className = 'status ok'; o.textContent = 'Verbindung steht. Ahoi!'; setTimeout(after, 800); }
    catch (e) { o.className = 'status err'; o.textContent = aiErr(e); if (e.code === 'bad_key') setApiKey(''); }
  };
}

function renderTalk() {
  const fromStory = TALK.pending; TALK.pending = false;
  place = 'kajuete'; soundFor('kajuete');
  app.innerHTML = `<div class="topbar"><button class="btn small ghost" id="back">← Kajüte</button><b class="tbtitle">Klönschnack</b><button class="chip" id="free" aria-pressed="${S.cfg.free ? 'true' : 'false'}">Freihand</button></div>
    <div class="crewstage">${charSVG(S.crew.K)}${charSVG(S.crew.M)}${charSVG(S.crew.T)}<div class="bubble hidden" id="bubble" role="status" aria-live="polite"><b></b><span></span></div></div>
    ${apiKey() ? '' : KEYCARD()}
    <div class="log" id="tlog"><p class="small muted empty">Frag die Crew, was du willst: Regeln, Begriffe, Geschichten. Oder lass dich abfragen.</p></div>
    <div style="height:230px"></div>
    <div class="dock">
      <div id="topts"></div>
      <div class="interim" id="tint"></div>
      <div class="dockrow"><button class="ptt idle" id="ptt">${MIC_SVG}</button><div class="dockstate" id="tstate"></div></div>
      <div class="typerow"><input type="text" id="chatIn" placeholder="Oder hier schreiben…" aria-label="Nachricht an die Crew" autocomplete="off"><button class="btn small" id="sendBtn">Senden</button></div>
    </div>`;
  S.talk.slice(-14).forEach(l => logLine(l.s, l.t, false));
  $('#back').onclick = () => setTab('cabin');
  $('#free').onclick = () => { S.cfg.free = !S.cfg.free; save(); $('#free').setAttribute('aria-pressed', S.cfg.free); toast(S.cfg.free ? 'Freihand an: Ich höre nach jeder Antwort automatisch zu.' : 'Freihand aus: Tippe zum Sprechen auf den Knopf.'); };
  $('#ptt').onclick = () => {
    AUD.unlock();
    if (TALK.state === 'listen') { if (TALK.ctl) TALK.ctl.finish(); return; }
    if (TALK.state === 'speak') { VOX.stop('Unterbrechen'); if (TALK.abort) TALK.abort.abort(); return listenTurn(); }
    if (TALK.state === 'think') return;
    listenTurn();
  };
  const send = () => { const v = $('#chatIn').value.trim(); if (!v) return; $('#chatIn').value = ''; AUD.unlock(); if (TALK.ctl) TALK.ctl.cancel(); userSays(v); };
  $('#sendBtn').onclick = send;
  $('#chatIn').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); send(); } };
  bindKeycard(() => renderTalk());
  TALK.on = true;
  setTalkUI('idle');
  if (!apiKey()) return;
  if (!VOX.hasSR && !elKey()) setTalkUI('idle', 'Dieser Browser kann keine Sprache erkennen. Schreib einfach unten.');
  if (fromStory) return userSays('(Die Geschichte ist zu Ende. Sprecht mich jetzt direkt an und knüpft daran an.)', '', true);
  S.talkCtx = '';
  const t = lineOf(S.crew.K, 'talk'); logLine('K', t);
  setTalkUI('speak'); VOX.say(S.crew.K, t, 'fixed').then(() => afterCrew());
}
function startTalk(fromStory) { TALK.pending = !!fromStory; setTab('talk'); }
function stopTalk(ui) {
  TALK.on = false; if (TALK.ctl) TALK.ctl.cancel(); TALK.ctl = null; if (TALK.abort) TALK.abort.abort(); TALK.abort = null;
  if (ui) { VOX.stop('Gespräch beendet'); setTalkUI('idle'); }
}
function afterCrew() {
  if (!TALK.on || tab !== 'talk') return;
  if (S.cfg.free) listenTurn(); else setTalkUI('yourturn');
}
async function listenTurn() {
  if (!apiKey()) return needKey();
  TALK.on = true; setTalkUI('listen');
  TALK.ctl = VOX.listen({onInterim: t => { const i = $('#tint'); if (i) i.textContent = t; }, onState: s => s === 'think' && setTalkUI('think'), noSpeech: 12000});
  const r = await TALK.ctl.done; TALK.ctl = null; const i = $('#tint'); if (i) i.textContent = '';
  if (tab !== 'talk') return;
  if (r.err && r.err !== 'aborted') return setTalkUI('idle', sttErrText(r.err));
  if (r.err === 'aborted') return;
  if (!r.text) return setTalkUI('yourturn', 'Ich hab nichts gehört. Antippen und nochmal versuchen.');
  userSays(r.text);
}
async function userSays(text, extra = '', hidden = false) {
  if (!apiKey()) { const c = $('#chatIn'); if (c) c.value = text; return needKey(); }
  VOX.stop('neue Nachricht'); if (!hidden) { logLine('U', text); daily().talk++; } setTalkUI('think'); TALK.opts = null; showOpts();
  const rel = relevant(text);
  const hist = S.talk.slice(-16, hidden ? undefined : -1).map(l => l.s === 'U' ? {role: 'user', content: l.t} : {role: 'assistant', content: `${l.s}: ${l.t}`});
  const sys = crewSystem((rel.length ? `Passende Katalogfragen mit verbindlicher richtiger Antwort:\n${rel.map(catLine).join('\n')}\n` : '') + (S.talkCtx || '') + extra);
  const out = VOX.stream('live'); let done = 0;
  const take = (full, last) => {
    const lines = full.split('\n'); const upto = last ? lines.length : lines.length - 1;
    for (let k = done; k < upto; k++) {
      const raw = lines[k].trim(); if (!raw) continue;
      const f = raw.match(/^F\s*:\s*(.+)$/); if (f) { S.profile.facts = (S.profile.facts || []).concat(f[1].trim()).slice(-30); save(); LOG.add('fakt', f[1].trim()); continue; }
      const o = raw.match(/^O\s*:\s*(.+)$/); if (o) { TALK.opts = o[1].split('|').map(x => x.trim()).filter(Boolean).slice(0, 4); continue; }
      const m = raw.match(/^([KMT])\s*:\s*(.+)$/); const role = m ? m[1] : 'K', t = (m ? m[2] : raw).trim(); if (!t) continue;
      logLine(role, t); out.push(cid(role), t); if (TALK.state === 'think') setTalkUI('speak');
    }
    done = Math.max(done, upto);
  };
  TALK.abort = new AbortController();
  try {
    const full = await ai([...hist, {role: 'user', content: text}], {system: sys, maxTokens: 1024, signal: TALK.abort.signal, onText: t => take(t, false)});
    take(full, true);
  } catch (e) {
    TALK.abort = null; out.close();
    if (e.code !== 'cancelled') { logLine('K', aiErr(e), false); setTalkUI('idle', aiErr(e)); if (e.code === 'bad_key') { setApiKey(''); renderTalk(); } }

  }
  TALK.abort = null; out.close(); await out.done;
  showOpts(); afterCrew();
}
/* Antwortmöglichkeiten zum Antippen, wenn die Crew etwas fragt */

  $('#back').onclick = () => setTab('cabin');

/* Vorgefertigte Folge abspielen: gleiche Technik wie eigene Folgen, mit Stopps */
function epFill(s) { return s.replace(/\{A:([\w-]+)\}/g, (_, n) => { const q = QN[n] || QN[+n]; return q ? ansText(q).replace(/\s+/g, ' ').trim() : ''; }).replace(/\{Q:([\w-]+)\}/g, (_, n) => { const q = QN[n] || QN[+n]; return q ? q.q.replace(/\s+/g, ' ').trim() : ''; }).replace(/\s+/g, ' '); }
/* ---------- Kajüte: Hinsetzen, und die Crew schnackt im Hintergrund ----------

let bgChat = null;

<script>

const LCOL = {w: '#fff7d6', r: '#ff4a3a', g: '#3dff86', y: '#ffd23c'};

/* ---------- Leuchtfeuer-Kennungen (deutsche Schreibweise der Seekarte) ----------
   Muster: Folge aus [Licht ms, Dunkel ms]. */

  {k: 'F.', name: 'Festfeuer', p: [[1e9, 0]], why: 'Festfeuer: Das Licht brennt ununterbrochen.'},
  {k: 'Blz. 5s', name: 'Blitzfeuer', p: [[500, 4500]], why: 'Blitz: Das Licht ist deutlich kürzer als die Dunkelheit. Ein Blitz alle 5 Sekunden.'},
  {k: 'Blz.(3) 10s', name: 'Blitzgruppe', p: [[400, 600], [400, 600], [400, 7600]], why: 'Blitzgruppe: drei Blitze, dann lange Pause. Wiederkehr 10 Sekunden.'},
  {k: 'Blz.(2) 6s', name: 'Blitzgruppe', p: [[400, 600], [400, 4600]], why: 'Blitzgruppe: zwei Blitze, dann Pause. Wiederkehr 6 Sekunden.'},

  {k: 'Ubr.(2) 8s', name: 'Unterbrochene Gruppe', p: [[4000, 800], [2400, 800]], why: 'Unterbrochene Gruppe: zwei Verdunkelungen pro Wiederkehr.'},
  {k: 'Glt. 4s', name: 'Gleichtaktfeuer', p: [[2000, 2000]], why: 'Gleichtakt: Licht und Dunkelheit sind gleich lang.'},
  {k: 'Fkl.', name: 'Funkelfeuer', p: [[500, 500]], why: 'Funkel: etwa 60 Mal pro Minute, ohne Pause.'},
  {k: 'SFkl.', name: 'Schnelles Funkelfeuer', p: [[250, 250]], why: 'Schnelles Funkel: etwa 120 Mal pro Minute.'},
  {k: 'Mo.(A) 8s', name: 'Morsefeuer', p: [[500, 500], [1500, 5500]], why: 'Morse A: kurz, lang (· –), dann Pause.'},
];
function lighthouseGame() {
  const ks = BEACONS.map(b => b.k), rounds = shuffle(BEACONS).slice(0, 7); let i = 0, score = 0, blinkT = null;
  gameShell('Leuchtfeuer', `<div class="nightsea"><svg viewBox="0 0 300 160">
      <rect width="300" height="160" fill="#0b1626"/><rect y="124" width="300" height="36" fill="#0d2238"/>
      <path d="M140 124 L144 70 L156 70 L160 124 Z" fill="#20303f"/><rect x="141" y="58" width="18" height="12" rx="2" fill="#20303f"/>
      <circle id="beam" cx="150" cy="64" r="26" fill="#fff3c0" opacity="0"/><circle id="bulb" cx="150" cy="64" r="6" fill="#3a3a2a"/></svg></div><div class="card" id="bq"></div>`);
  const setLight = (on, col) => { const b = $('#bulb'), g = $('#beam'); if (!b) return; b.setAttribute('fill', on ? col : '#3a3a2a'); g.setAttribute('fill', col); g.setAttribute('opacity', on ? .35 : 0); };
  const run = (pat, col) => {
    clearTimeout(blinkT); let k = 0;
    const step = () => { const [on, off] = pat[k % pat.length]; setLight(true, col); blinkT = setTimeout(() => { if (!off) return; setLight(false, col); blinkT = setTimeout(() => { k++; step(); }, off); }, on); gameTimers.push(blinkT); };
    step();
  };
  const show = () => {
    if (i >= rounds.length) { clearTimeout(blinkT); const nb = best('lh', score); $('#bq').innerHTML = `<h2 style="margin:0">${score} von ${rounds.length} erkannt</h2><p class="muted">${nb ? 'Neuer Rekord!' : `Dein Rekord: ${(S.best && S.best.lh) || 0}`}</p><button class="btn wide lamp" id="again">Nochmal</button>`; $('#again').onclick = lighthouseGame; return; }
    const r = rounds[i], col = ['#fff3c0', '#ff5a4a', '#4dff8a'][Math.random() * 3 | 0];

    $('#bq').innerHTML = `<p style="margin:0 0 8px"><b>Beobachte das Feuer. Welche Kennung steht in der Seekarte?</b></p>${pickOpts(r.k, ks).map(o => `<button class="ans" data-o="${esc(o)}">${esc(o)} <span class="muted small">${esc(BEACONS.find(b => b.k === o).name)}</span></button>`).join('')}<div id="bfb"></div>`;
    app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {

      AUD.sfx(ok ? 'richtig' : 'falsch', {vol: ok ? .55 : .35});
      app.querySelectorAll('[data-o]').forEach(x => { x.disabled = true; if (x.dataset.o === r.k) x.classList.add('ok'); else if (x === b) x.classList.add('no'); });
      $('#bfb').innerHTML = `<p class="small" style="margin:8px 0">${esc(r.why)}</p><button class="btn wide" id="bnext">Nächstes Feuer</button>`;
