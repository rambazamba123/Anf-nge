S erfasst werden?","a":"Die britischen Notices to Mariners."},{"id":"nav-38","s":"nav","n":38,"q":"1. Was sind P-Nachrichten?\n2. Wie verfährt man mit diesen Nachrichten im Berichtigungsverfahren? (Begründung!)","a":"1. P-Nachrichten sind solche, die eine bevorstehende (preliminary) Maßnahme ankündigen.\n2. Wegen der begrenzten Geltungsdauer werden keine Berichtigungen auf der Grundlage von P-Nachrichten vom BSH bzw. von amtlichen Seekartenberichtigungsstellen durchgeführt. Deshalb müssen vor Gebrauch jeder Seekarte die noch gültigen P-Nachrichten erfasst und in der Karte vermerkt werden."},{"id":"nav-39","s":"nav","n":39,"q":"1. Was sind T-Nachrichten?\n2. Wie verfährt man mit diesen Nachrichten im Berichtigungsverfahren? (Begründung!)","a":"1. T-Nachrichten sind solche, die über einen zeitweiligen (temporary) Zustand unterrichten.\n2. Wegen der begrenzten Geltungsdauer werden keine Berichtigungen auf der Grundlage von T-Nachrichten vom BSH bzw. amtlichen Seekartenberichtigungsstellen durchgeführt. Deshalb müssen vor Gebrauch jeder Seekarte die noch gültigen T- Nachrichten erfasst und in der Karte vermerkt werden."},{"id":"nav-40","s":"nav","n":40,"q":"Worauf muss beim Ansteuern einer Küste bei der Auswahl von Seekarten geachtet werden? Begründen Sie Ihre Antwort.","a":"Seekarten mit größtmöglichem Maßstab verwenden. Nur in diesen Karten sind alle Schifffahrtszeichen und weitere für die Navigation wichtigen Informationen eingetragen."},{"id":"nav-41","s":"nav","n":41,"q":"Was müssen Sie bei Kursberechnungen hinsichtlich der in der Seekarte angegebenen Ortsmissweisungen beachten?","a":"Die für ein bestimmtes Jahr angegebene Missweisung muss mittels der in der Seekarte angegebenen jährlichen Änderung für das aktuelle Jahr berichtigt werden."},{"id":"nav-42","s":"nav","n":42,"q":"Was müssen Sie bei der Benutzung von deutschen \"Sportbootkarten\" beachten?","a":"Sie werden nach dem Druck weder vom BSH noch von den Seekartenvertriebsstellen berichtigt. Sie müssen also vom Nutzer nach dem Kauf vor Benutzung über die NfS auf den aktuellen Stand berichtigt werden."},{"id":"nav-43","s":"nav","n":43,"q":"Nach welcher Faustregel können Sie m/s in Knoten umrechnen?","a":"\"Doppelt so viele Knoten (kn) wie m/s\" oder \"m/s multipliziert mit 2 = kn\"."},{"id":"nav-44","s":"nav","n":44,"q":"Was müssen Sie beachten, wenn Sie die mit Loggen ermittelte Fahrt z. B. für das Arbeiten in Seekarten berücksichtigen wollen?","a":"Die üblichen Logmethoden liefern ausschließlich die \"Fahrt durchs Wasser (FdW)\". Um die \"Fahrt über Grund (FüG)\" zu ermitteln, müssen Stromrichtung und Stromgeschwindigkeit berücksichtigt werden."},{"id":"nav-45","s":"nav","n":45,"q":"Welche Fahrt zeigen GPS-Geräte an?","a":"Die Fahrt über Grund (FüG)."},{"id":"nav-46","s":"nav","n":46,"q":"Welchen Kurs zeigen GPS-Geräte an?","a":"Den Kurs über Grund (KüG)."},{"id":"nav-47","s":"nav","n":47,"q":"Warum müssen Sie Ihre Position regelmäßig in die Seekarte eintragen?","a":"Um Abweichungen von der Kurslinie frühzeitig und sicher zu erkennen und um ggf. den Kurs zu berichtigen."},{"id":"nav-48","s":"nav","n":48,"q":"Was ist die Besteckversetzung (BV)?","a":"Richtung (rw) und Entfernung (in sm) vom Koppelort (O) zum beobachteten Ort (O), bezogen auf den gleichen Zeitpunkt. kb"},{"id":"nav-49","s":"nav","n":49,"q":"Welche Ursachen kann die Besteckversetzung (BV) haben?","a":"Die BV kann folgende Ursachen haben:\n1. ungenaues Steuern und Koppeln,\n2. Kursfehler (z. B. ungenaue Steuertafel) und\n3. fehlende oder unvollständige Berücksichtigung von Strom und Wind."},{"id":"nav-50","s":"nav","n":50,"q":"Warum sollte der Winkel zwischen zwei Peilungen nicht kleiner als 30° und nicht größer als 150° sein?","a":"Damit der gefundene Standort eine ausreichend sichere Positionsbestimmung ergibt."},{"id":"nav-51","s":"nav","n":51,"q":"Warum sind regelmäßige Kompasskontrollen erforderlich?","a":"Zur Überprüfung der Funktionsfähigkeit des Kompasses und der Werte in der Ablenkungstabelle."},{"id":"nav-52","s":"nav","n":52,"q":"Wodurch können auch in gezeitenlosen Revieren erhebliche Wasserstandsschwankungen und Strömungen (z. B. Triftstrom) hervorgerufen werden?","a":"Durch Stärke, Dauer und Richtung des Windes oder \"Zurückschwappen\" aufgestauter Wassermassen (z. B. Ostsee)."},{"id":"nav-53","s":"nav","n":53,"q":"Welche navigatorischen Vorbereitungen treffen Sie vor einer Fahrt in Dunkelheit?","a":"1. Kurse und Kursänderungspunkte möglichst vorausbestimmen,\n2. Untiefen und Hindernisse in der Karte besonders kennzeichnen,\n3. in der Seekarte markieren, welche Leuchtfeuer wann und wo in der Kimm erscheinen und\n4. Wegstrecke nach unbefeuerten Tonnen absuchen."},{"id":"nav-54","s":"nav","n":54,"q":"Welche Möglichkeiten der terrestrischen Ortsbestimmung muss man kennen?","a":"1. Kreuzpeilung,\n2. Peilung und Abstand (Feuer in der Kimm, Radarabstand),\n3. Peilung und Lotung."},{"id":"nav-55","s":"nav","n":55,"q":"Nennen Sie zwei Möglichkeiten der Ortsbestimmung, wenn Sie nur ein Objekt mit bekannten Merkmalen (z. B. Leuchtturm) in Sicht haben.","a":"1. Peilung und Abstand (Feuer in der Kimm, Radarabstand),\n2. Peilung und Lotung."},{"id":"nav-56","s":"nav","n":56,"q":"Welche Nordrichtungen werden in der Navigation unterschieden? Erläutern Sie diese kurz.","a":"1. rwN: rechtweisend Nord ist die Richtung eines Meridians zum geographischen Nordpol. 2. mwN: missweisend Nord ist die Richtung des erdmagnetischen Feldes zum magnetischen Nordpol, abhängig von Schiffsort und Datum (Jahr). In diese Richtung stellt sich eine ungestörte Magnet-(Kompass-)nadel ein. 3. MgN: ist die Richtung zu Magnetkompass-Nord. In diese Richtung zeigt die durch das schiffsmagnetische Feld beeinflusste Kompassnadel an Bord."},{"id":"nav-57","s":"nav","n":57,"q":"Nennen Sie die Winkel zwischen den Nordrichtungen rechtweisend Nord (rwN), missweisend Nord (mwN) und Magnetkompass-Nord (MgN).","a":"1. Mw: Missweisung ist der Winkel von rwN nach mwN. 2. Abl: Ablenkung (Abl) oder Deviation (Dev) ist der Winkel von mwN nach MgN."},{"id":"nav-58","s":"nav","n":58,"q":"Nennen Sie den Winkel zwischen den Nordrichtungen rwN und MgN.","a":"Der Winkel von rwN nach MgN ist die Fehlweisung (Fw; Abl + Mw = Fw)."},{"id":"nav-59","s":"nav","n":59,"q":"Wo finden Sie die erforderlichen Werte der Missweisung? Worauf ist dabei zu achten?","a":"1. Die Missweisung findet sich in der Seekarte eingedruckt für ein bestimmtes Jahr.\n2. Dieser Wert muss mit der ebenfalls in der Seekarte angegebenen jährlichen Änderung auf das Jahr der Benutzung berichtigt werden."},{"id":"nav-60","s":"nav","n":60,"q":"Wo finden Sie die erforderlichen Werte der Ablenkung (Abl)? Worauf ist dabei zu achten?","a":"1. Die Abl wird einer Ablenkungstabelle entnommen.\n2. Die Abl ist abhängig vom anliegenden Kurs."},{"id":"nav-61","s":"nav","n":61,"q":"Warum muss für jedes Fahrzeug eine eigene Ablenkungstabelle (Steuertafel) erstellt werden?","a":"Die Ablenkungstabelle kann auf jedem Schiff andere Werte haben."},{"id":"nav-62","s":"nav","n":62,"q":"Worauf müssen Sie achten, wenn eine Magnetkompasspeilung (MgP) auf eine rechtweisende Peilung (rwP) beschickt werden soll?","a":"Abl für den anliegenden MgK (Magnetkompasskurs) aus der Steuertafel (Ablenkungstabelle) entnehmen; an den so erhaltenen mwK (missweisenden Kurs) die für das laufende Jahr der Seekarte entnommene Mw anbringen."},{"id":"nav-63","s":"nav","n":63,"q":"Unter welchen Voraussetzungen ergibt sich eine brauchbare Standlinie aus einer Lotung?","a":"Der Meeresgrund muss ausreichend regelmäßig und ausreichend steil ansteigen/abfallen."},{"id":"nav-64","s":"nav","n":64,"q":"Neben den Fahrwassertonnen liegen auf den Seeschifffahrtsstraßen weitere Tonnen aus, die für die Sportschifffahrt besonders wichtig sind. Welche Schifffahrtszeichen sind das?","a":"Sonderzeichen zur Bezeichnung von Sperrgebieten und Kardinalzeichen für allgemeine Gefahrenstellen."},{"id":"nav-65","s":"nav","n":65,"q":"Aus welchen nautischen Publikationen können Sie Sperr- und Verbotsgebiete mit ihren Grenzen ersehen?","a":"Aus den Seekarten, Bekanntmachungen für Seefahrer (BfS) und Nautischen Warnnachrichten (NWN)."},{"id":"nav-66","s":"nav","n":66,"q":"Welche Sonderzeichen kennzeichnen Reeden, besondere Gebiete oder Stellen, z. B. Warngebiete?","a":"Gelbe Fasstonnen, Leuchttonnen, Spierentonnen oder Stangen."},{"id":"nav-67","s":"nav","n":67,"q":"Welche Sonderzeichen kennzeichnen Sperrgebiete?","a":"Gelbe Fasstonnen, Leuchttonnen, Spierentonnen oder Stangen mit einem breiten roten Band. Beschriftung auf Fasstonne oder Leuchttonne mit schwarzen Buchstaben: \"Sperrgebiet\" oder \"Sperr-G\"."},{"id":"nav-68","s":"nav","n":68,"q":"Welche Farbe haben Feuer auf Sonderzeichen, wenn vorhanden?","a":"Farbe gelb."},{"id":"nav-69","s":"nav","n":69,"q":"Was bedeutet das Ausliegen der folgenden Schifffahrtszeichen:\nweiße Fasstonne, Kugeltonne oder Stange mit einem - von oben gesehen - rechtwinkligen gelben Kreuz bzw. bei Stangen mit einem breiten gelben Band?","a":"Fahrverbot für Maschinenfahrzeuge und Wassermotorräder auf wegen Badebetrieb gesperrten Wasserflächen."},{"id":"nav-70","s":"nav","n":70,"q":"Wie stehen Sonne und Mond winkelmäßig zur Erde bei Springzeit und bei Nippzeit (die Springverspätung soll hier unberücksichtigt bleiben)?","a":"Bei Springzeit befinden sich Mond und Sonne in einer Ebene mit der Erde, bei Nippzeit stehen die Verbindungslinien Erde/Sonne und Erde/Mond im rechten Winkel zueinander."},{"id":"nav-71","s":"nav","n":71,"q":"Erklären Sie den Begriff \"Alter der Gezeit\".","a":"Das Alter der Gezeit gibt an, in welcher Phase (Nippzeit, Mittzeit, Springzeit) sich das aktuelle Tidengeschehen befindet."},{"id":"nav-72","s":"nav","n":72,"q":"Warum findet man z. B. bei Bezugsorten in der Nordsee bzw. im Englischen Kanal zeitweise nur ein Hoch- bzw. Niedrigwasser pro Tag?","a":"Die Umlaufzeit des Mondes um die Erde dauert im Mittel 24 h 50 min. (Mondtag) gegenüber dem Sonnentag (= 24 h). Deshalb \"rutscht\" das letzte HW oder NW zeitweise in den nächsten Tag."},{"id":"nav-73","s":"nav","n":73,"q":"Weshalb und wie können die tatsächlichen Wasserstände von den Angaben in den Gezeitentafeln teilweise erheblich abweichen?","a":"Durch Wind und/oder durch sehr hohen bzw. sehr niedrigen Luftdruck können erhebliche Wasserstandsänderungen entstehen. HWH bzw. NWH können höher oder niedriger sein als angegeben, die Hoch- und Niedrigwasserzeit kann füher oder später eintreten als angegeben."},{"id":"nav-74","s":"nav","n":74,"q":"Worauf beziehen sich die Tiefenangaben in Seekarten in den deutschen Gewässern der Ost- und Nordsee?","a":"Auf Kartennull (KN)."},{"id":"nav-75","s":"nav","n":75,"q":"Was ist Kartennull?","a":"Kartennull (KN) ist die Bezugsfläche für die Tiefenangaben in einer Seekarte."},{"id":"nav-76","s":"nav","n":76,"q":"Wie ist Kartennull (KN) in der Ost- und Nordsee und im Englischen Kanal definiert? Wo finden Sie die entsprechenden Angaben zur Kartennullebene?","a":"In der Ostsee entspricht KN dem mittleren Wasserstand. In der Nordsee und im Englischen Kanal entspricht KN dem niedrigstmöglichen Gezeitenwasserstand (LAT = Lowest Astronomical Tide). In der jeweiligen Seekarte ist die Kartennullebene beschrieben."},{"id":"nav-77","s":"nav","n":77,"q":"Was müssen Sie bedenken, wenn Sie die Wassertiefe außerhalb der Niedrigwasserzeit loten?","a":"Beim folgenden Niedrigwasser wird die Wassertiefe geringer sein als zum Zeitpunkt der Lotung."},{"id":"nav-78","s":"nav","n":78,"q":"Was ist die Kartentiefe?","a":"Die Kartentiefe (KT) ist die auf Kartennull bezogene Wassertiefe. Kartentiefe ist Wassertiefe abzüglich Höhe der Gezeit."},{"id":"nav-79","s":"nav","n":79,"q":"Mit welcher Wassertiefe können Sie bei einer Lotung normalerweise mindestens rechnen?","a":"Mit der Kartentiefe."},{"id":"nav-80","s":"nav","n":80,"q":"Welche Bedeutung hat die Angabe \"Springzeit\" für die Wasserstände in Gezeitengebieten?","a":"Zur Springzeit sind besonders hohe Hochwasser und besonders niedrige Niedrigwasser zu erwarten."},{"id":"nav-81","s":"nav","n":81,"q":"Welche Bedeutung hat die Angabe \"Nippzeit\" für die Wasserstände in Gezeitengebieten?","a":"Zur Nippzeit sind besonders niedrige Hochwasser und besonders hohe Niedrigwasser zu erwarten."},{"id":"nav-82","s":"nav","n":82,"q":"Welche Bedeutung haben die Angaben \"Nippzeit\" bzw. \"Springzeit\" für die Gezeitenströme?","a":"Zur Springzeit setzen die Gezeitenströme z. T. deutlich stärker als zur Nippzeit."},{"id":"nav-83","s":"nav","n":83,"q":"Wo können Sie Informationen über Gezeitenströme in Küstengewässern finden?","a":"1. In Gezeitenstromatlanten, Seehandbüchern,\n2. in Seekarten aus Gezeitenstromtabellen, die bezogen sind auf die Hochwasserzeiten des dort genannten Bezugsortes."},{"id":"nav-84","s":"nav","n":84,"q":"Auf einer Seekarte finden Sie in Küstennähe die Tiefenangabe 2. Was bedeutet das?","a":"Der Ort der Zahl liegt 2,3 m über Kartennull und kann trockenfallen."},{"id":"nav-85","s":"nav","n":85,"q":"In welchem Zusammenhang stehen Kartentiefe (KT), Wassertiefe (WT) und Höhe der Gezeit (H)?","a":"WT - H = KT oder KT + H = WT (Lösung auch als Skizze möglich)."},{"id":"nav-86","s":"nav","n":86,"q":"Warum ist es in Tidengewässern wichtig, die Uhrzeit einer Lotung festzuhalten?","a":"Um anhand der Gezeitentafel feststellen zu können, ob das Wasser steigt oder fällt."},{"id":"nav-87","s":"nav","n":87,"q":"3 Was ist ein Pegel?","a":"Eine Skala zur Anzeige des Wasserstandes."},{"id":"nav-88","s":"nav","n":88,"q":"Welchen Einfluss kann der Wind auf die Gezeiten haben?","a":"Der Wind kann Strömungen und Wasserstandsänderungen hervorrufen, die zu den Gezeitenströmen und den Gezeiten hinzutreten."},{"id":"nav-89","s":"nav","n":89,"q":"Nennen Sie drei wichtige Vorzüge von GPS.","a":"1. GPS arbeitet weltweit.\n2. Die Positionsanzeige ist jederzeit verfügbar.\n3. Der Positionsfehler ist gering."},{"id":"nav-90","s":"nav","n":90,"q":"Wie groß ist die typische und realistische Genauigkeit von Positionen, die mit GPS und DGPS ermittelt werden?","a":"1. GPS: 10 - 20 m bei einer Wahrscheinlichkeit von etwa 95 %.\n2. DGPS: 1 - 10 m bei einer Wahrscheinlichkeit von etwa 95 %."},{"id":"nav-91","s":"nav","n":91,"q":"Wo muss man mit ungenauen Anzeigen des GPS rechnen?","a":"1. Bei Abschattung der GPS-Antenne.\n2. In der Nähe von Flughäfen und in der Nähe von Fernsehsendern.\n3. In der Nähe von Marineeinrichtungen.\n4. Bei Nutzung von UKW-Geräten und anderen elektronischen/elektrischen Geräten an Bord."},{"id":"nav-92","s":"nav","n":92,"q":"Was bedeutet die Abkürzung GPS? Global Positioning System","a":"."},{"id":"nav-93","s":"nav","n":93,"q":"Was ist das Grundprinzip von GPS?","a":"Durch Laufzeitmessungen von GPS-Signalen vom Satelliten zum Empfänger und damit durch Abstandsmessungen zu den Satelliten wird die Ortsbestimmung ermöglicht."},{"id":"nav-94","s":"nav","n":94,"q":"Was bedeutet die Abkürzung DGPS und nach welchem Prinzip arbeitet DGPS?","a":"DGPS = Differential Global Positioning System. Hierbei handelt es sich um eine regionale Verbesserung der Ortsbestimmung. Dabei werden von Referenzstationen über Funk Korrekturwerte für die GPS-Messwerte an die Schiffe übertragen."},{"id":"nav-95","s":"nav","n":95,"q":"Was ist bei Anbringung einer GPS-Antenne zu beachten?","a":"1. Sie muss ringsum freie Sicht (ohne Abschattungen) haben.\n2. Einwandfreie Erdung."},{"id":"nav-96","s":"nav","n":96,"q":"Was bewirkt die Bedienung der MOB-Taste bei GPS-Geräten?","a":"1. Die Position zur Zeit des Tastendrucks wird gespeichert.\n2. Rechtweisende Peilung (rwP) und Distanz zu diesem Punkt werden angezeigt."},{"id":"nav-97","s":"nav","n":97,"q":"Was bedeutet die Aussage: \"Die Ortsgenauigkeit beträgt 100 m mit einer Wahrscheinlichkeit von 95 %\"?","a":"Das Schiff befindet sich mit einer Wahrscheinlichkeit von 95 % in einem Fehlerkreis von 100 m Radius um den beobachteten Ort. Also: jede 20. Ortsbestimmung (5 %) ist ungenauer als ca. 100 m."},{"id":"nav-98","s":"nav","n":98,"q":"Wie kann man feststellen, ob die GPS-Position genau bzw. zuverlässig ist?","a":"1. Durch den vom Empfänger angezeigten HDOP (horizontal dilution of precision = Satellitenverteilung).\n2. Durch die vom Empfänger angezeigte Anzahl der getrackten Satelliten.\n3. Durch Vergleich mit anderen Navigationssystemen und der Koppelposition."},{"id":"nav-99","s":"nav","n":99,"q":"Was ist bei Eintragung eines GPS-Ortes in eine Seekarte zu beachten?","a":"Das Bezugssystem muss übereinstimmen. Dieses kann geschehen durch:\n1. Auswahl und Einstellung des Kartenbezugssystems im Empfänger.\n2. Manuelle Verschiebung des GPS-Ortes um die in der Seekarte angegebenen N / S\n- und E / W -Korrektur.\n3. Verwendung von Seekarten, die auf dem System WGS 84 beruhen."},{"id":"nav-100","s":"nav","n":100,"q":"Was ist ein Wegpunkt?","a":"Geographische Koordination eines anzusteuernden Punktes."},{"id":"nav-101","s":"nav","n":101,"q":"Was bedeutet WGS 84 und was wird damit erreicht?","a":"1. Globales Bezugssystem \"World Geodetic System 1984\".\n2. Mit diesem System (= Referenzellipsoid bei GPS) wird weltweit eine optimale Anpassung an die reale Form des gesamten Erdkörpers erreicht."},{"id":"nav-102","s":"nav","n":102,"q":"Wodurch können Radarechos von kleinen Fahrzeugen und Tonnen auf den Sichtschirmen von Radargeräten \"verschwinden\"?","a":"1. Durch Seegang und/oder Niederschlag,\n2. durch falsche Bedienung,\n3. durch zu große Entfernung,\n4. durch Gieren des eigenen Fahrzeugs bei relativ vorausorientierter Radarstellung (head up)."},{"id":"nav-103","s":"nav","n":103,"q":"Wie kann man mit Radar den eigenen Schiffsort bestimmen?","a":"1. Peilung des Objektes gibt einen Peilstrahl als Standlinie.\n2. Abstandsmessung mit dem VRM (Variable Range Marker) gibt einen Abstandskreis als Standlinie."},{"id":"nav-104","s":"nav","n":104,"q":"Wie kann man gegebenenfalls verhindern, dass sich Echoanzeigen von Zielen (z. B. 2 Tonnen, 2 Molenköpfe) überlappen?","a":"1. Kurze Impulslänge wählen.\n2. Messbereich verkleinern."},{"id":"nav-105","s":"nav","n":105,"q":"Was bedeutet der Begriff AIS auf See?","a":"AIS bezeichnet das automatische Identifizierungssystem (Automatic Identification System)."},{"id":"nav-106","s":"nav","n":106,"q":"Welche Aufgaben hat AIS?","a":"Alle ausgerüsteten Schiffe senden automatisch (also ohne Aufforderung und menschliches Eingreifen) in regelmäßigen kurzen Abständen ihre Identität und einen schiffsbezogenen Datensatz. Außerdem können bei Bedarf sicherheitsrelevante Nachrichten (\"safety related messages\") von Bord oder von Landstationen gesendet werden."},{"id":"nav-107","s":"nav","n":107,"q":"Welche Reichweite hat ein AIS-Bordgerät und wovon ist sie abhängig?","a":"Die Reichweite und Ausbreitungsbedingungen entsprechen denen von UKW. Bei Handelsschiffen kann man von 20 bis 30 sm ausgehen. Die Reichweite ist abhängig von der Antennenhöhe."},{"id":"nav-108","s":"nav","n":108,"q":"Wie kann die Reichweite eines AIS-Bordgerätes landseitig erhöht werden und wie wirken sich dabei Hindernisse (z. B. Berge) aus?","a":"Unter bestimmten Umständen kann die Reichweite heraufgesetzt werden (z. B. mit Hilfe von \"Relaisstationen\"), wobei ggf. auch abschattende Hindernisse umgangen werden können."},{"id":"nav-109","s":"nav","n":109,"q":"Welche AIS-Daten werden von Schiffen aus der Berufsschifffahrt gesendet?","a":"Statische Daten:\nID, Rufzeichen, Länge und Breite des Schiffes u. a. Dynamische Daten (i. W. Sensordaten):\nUTC, Position, Heading, Kurs und Fahrt über Grund, ggf. Rate-of-turn, Fahrtstatus (z. B. Maschinenfahrzeug mit Fahrt durchs Wasser, Ankerlieger, manövrierbehindertes Fahrzeug). Reisebezogene Daten: Tiefgang, Zielort (Destinaton), ETA u. a."},{"id":"nav-110","s":"nav","n":110,"q":"Wann kann man sich auf die Verfügbarkeit und Anzeige vn AIS-Signalen anderer Fahrzeuge verlassen? Nennen Sie die wesentlichen Voraussetzungen!","a":"Andere Fahrzeuge werden nur angezeigt, wenn das Fahrzeug auch sendet, d. h., wenn\n1. das Fahrzeug mit AIS ausgerüstet ist,\n2. das sendende Fahrzeug AIS nicht abgeschaltet hat (darf der Kapitän allerdings nur bei bestimmten zwingenden Gründen),\n3. GPS aktiv ist und\n4. aus Kapazitätsgründen (z. B. durch zu viele Schiffe in einem Seegebiet = \"target overflow\") keine Fahrzeuge ausgeschlossen werden."},{"id":"nav-111","s":"nav","n":111,"q":"Wie ist die Genauigkeit von AIS-Daten zu beurteilen (Position und manuell eingegebene Daten)?","a":"Position:\nMit AIS wird zusätzlich zur GPS-Position eines Schiffes die Information übertragen, ob es sich um einen GPS- oder DGPS-Ort handelt. Ist die GPS-Position eines Schiffes falsch, wird diese falsche Position auf allen anderen Schiffen angezeigt. Manuell eingegebene Daten:\nEs muss damit gerechnet werden, dass Zielort, Tiefgang, Fahrtstatus u. a. falsch sind, wenn sie - z. B. aus Nachlässigkeit - nicht von der Schiffsführung aufdatiert werden."},{"id":"nav-112","s":"nav","n":112,"q":"Welche besondere Bedeutung hat AIS für die Sportschifffahrt im Vergleich mit der Radaranzeige auf anderen Schiffen?","a":"Sportfahrzeuge werden häufig auf den Radargeräten anderer Schiffe nicht sicher angezeigt bzw. die Anzeigen gehen im Seegangsclutter oder in der Informationsfülle unter. Da jetzt auf vielen Schiffen die AIS-Daten zusätzlich im Radar dargestellt werden, besteht die Gefahr, dass Sportfahrzeuge noch weniger auffällig sind, wenn sie nicht selbst mit AIS ausgerüstet sind."},{"id":"nav-113","s":"nav","n":113,"q":"Welche Navigationsgeräte sollten Sie auf einer Yacht auch bei Kurzfahrten nahe der Küste mindestens an Bord haben?","a":"Steuerkompass, Peilkompass, Lot, Log, Uhr."},{"id":"nav-114","s":"nav","n":114,"q":"Was gehört zur navigatorischen Mindestausrüstung einer Yacht in Küstengewässern? Nennen Sie mindestens 6 Beispiele.","a":"1. Steuerkompass,\n2. Peileinrichtung,\n3. terrestrisches oder satellitengestütztes Funknavigationsgerät,\n4. Log,\n5. Lot,\n6. Fernglas,\n7. Barometer,\n8. Weltempfänger für Rundfunk,\n9. Seebücher und auf den neuesten Stand berichtigte Seekarten für das zu befahrende Seegebiet,\n10. Logbuch,\n11. Uhr/Zeitmesser."},{"id":"nav-115","s":"nav","n":115,"q":"Welchen Vorteil hat ein Kugelkompass gegenüber einem Fernglaskompass?","a":"1. Der Kugelkompass kann auch bei größerer Krängung noch als Messinstrument benutzt werden.\n2. Die Kugelform verbessert die Ablesbarkeit der Kompassrose (Vergrößerungseffekt)."},{"id":"nav-116","s":"nav","n":116,"q":"Was beeinflusst die Ablenkung eines Kompasses dauerhaft?","a":"Veränderung des magnetischen Zustandes an Bord, z. B. Einbauten und Lageänderung von Ausrüstungsgegenständen."},{"id":"nav-117","s":"nav","n":117,"q":"Was beeinflusst die Ablenkung eines Kompasses vorübergehend?","a":"Elektronische Geräte (z. B. Radio, Handy), magnetisierte Gegenstände (z. B. Werkzeug, Peilkompass) und Gleichstromleitungen in der Nähe des Kompasses."},{"id":"nav-118","s":"nav","n":118,"q":"Welchen Abstand muss magnetisierbares Material vom Magnetkompass haben?","a":"Mindestens 1 Meter. Stand: 01. Juli 2006 © Wasserstraßen- und Schifffahrtsverwaltung des Bundes"},{"id":"recht-1","s":"recht","n":1,"q":"Was sind \"Sicherheitszonen\" im Sinne der Verordnung zu den KVR?","a":"Sicherheitszonen sind Wasserflächen im Umkreis von 500 m um Plattformen, Bohrinseln, Forschungsanlagen u. a., die nicht befahren werden dürfen."},{"id":"recht-2","s":"recht","n":2,"q":"Die Verordnung zu den KVR verbietet die Führung eines Fahrzeugs, wenn man infolge des Genusses alkoholischer Getränke in der sicheren Führung des Fahrzeugs behindert ist. Welchen örtlichen Geltungsbereich hat die vorgenannte Verordnung?","a":"Die Verordnung gilt auf Seeschifffahrtsstraßen und für Schiffe, die die Bundesflagge führen, seewärts der Begrenzung des Küstenmeeres der Bundesrepublik Deutschland (also weltweit), soweit nicht in den Hoheitsgewässern anderer Staaten abweichende Regelungen gelten."},{"id":"recht-3","s":"recht","n":3,"q":"Wer darf laut Verordnung zu den KVR ein Fahrzeug nicht führen oder als Mitglied der Crew eine andere Tätigkeit des Brücken- oder Decksdienstes nicht ausüben (allgemein ohne Zahlen zu beantworten)?","a":"Wer infolge körperlicher oder geistiger Mängel oder des Genusses alkoholischer Getränke oder anderer berauschender Mittel in der sicheren Führung eines Fahrzeugs oder in der sicheren Ausübung einer anderen Tätigkeit des Brücken- oder Decksdienstes behindert ist."},{"id":"recht-4","s":"recht","n":4,"q":"Welche Atem- bzw. Blutalkoholkonzentration darf laut Verordnung zu den KVR nicht erreicht werden, damit kein Verbot für ein Führen eines Fahrzeugs oder als Mitglied der Crew für ein Ausüben des Brückendienstes besteht?","a":"0,25 mg/l oder mehr Alkohol in der Atemluft oder 0,5 Promille oder mehr Alkohol im Blut oder eine Alkoholmenge, die zu einer solchen Atem- oder Blutalkoholkonzentration führt."},{"id":"recht-5","s":"recht","n":5,"q":"Die KVR regeln u. a. das Verhalten der Schiffsführungen bei Kollisionsgefahr. Was ist im Rahmen der Verantwortlichkeit bei der Auslegung und Befolgung der KVR zu berücksichtigen?","a":"Bei der Auslegung und Befolgung der KVR sind stets alle Gefahren der Schifffahrt und des Zusammenstoßes sowie alle besonderen Umstände einschließlich Behinderungen der betroffenen Fahrzeuge gebührend zu berücksichtigen, die zum Abwenden unmittelbarer Gefahr ggf. auch ein Abweichen von diesen Regeln erfordern können (z. B. Abweichen von der Kurshaltepflicht, wenn der Ausweichpflichtige nicht angemessen handelt)."},{"id":"recht-6","s":"recht","n":6,"q":"Welche Grundregeln für das Verhalten im Verkehr verlangen die KVR, die ein Schiffsführer zu berücksichtigen hat, auch wenn keine konkrete Regel anwendbar ist?","a":"Die KVR befreien nicht von den Folgen, die durch unzureichende Einhaltung der KVR oder unzureichende Vorsichtsmaßnahmen entstehen, d. h., allgemeine seemännische Praxis oder besondere Umstände des Falles können über die Mindestanforderungen der KVR hinausgehende Maßnahmen erfordern."},{"id":"recht-7","s":"recht","n":7,"q":"Was sind Verkehrstrennungsgebiete? Wie sind sie zu befahren?","a":"1. Verkehrstrennungsgebiete sind Schifffahrtswege, die durch Trennlinien oder Trennzonen in Einbahnwege geteilt sind.\n2. Diese dürfen nur in Fahrtrichtung rechts der Trennlinie/Trennzone befahren werden, aber unter Nutzung der vollen Breite des Einbahnweges."},{"id":"recht-8","s":"recht","n":8,"q":"Was ist ein \"manövrierunfähiges Fahrzeug\"?","a":"Manövrierunfähig ist ein Fahrzeug, das wegen außergewöhnlicher Umstände (z. B. Ruderbruch) nicht regelgerecht manövrieren und daher einem anderen Fahrzeug nicht ausweichen kann."},{"id":"recht-9","s":"recht","n":9,"q":"Was ist ein \"manövrierbehindertes Fahrzeug\"?","a":"Manövrierbehindert ist ein Fahrzeug, das durch die Art seines Einsatzes behindert ist (z. B. Bagger, Kabelleger), regelgerecht zu manövrieren, und daher einem anderen Fahrzeug nicht ausweichen kann."},{"id":"recht-10","s":"recht","n":10,"q":"Nennen Sie mindestens 3 Beispiele für \"manövrierbehinderte Fahrzeuge\".","a":"1. Tonnenleger, Kabelleger, Rohrleger im Einsatz,\n2. Bagger, Vermessungsfahrzeuge im Einsatz,\n3. Versorger im Einsatz,\n4. Flugzeugträger im Einsatz,\n5. Minenräumfahrzeuge im Einsatz,\n6. Fahrzeuge während eines Schleppvorganges, bei dem das schleppende Fahrzeug und sein Anhang erheblich behindert sind, vom Kurs abzuweichen."},{"id":"recht-11","s":"recht","n":11,"q":"Was ist unter \"sicherer Geschwindigkeit\" zu verstehen?","a":"Das Fahrzeug muss jederzeit innerhalb einer solchen Entfernung zum Stehen gebracht werden können, dass ein Zusammenstoß vermieden wird."},{"id":"recht-12","s":"recht","n":12,"q":"Ab welcher Länge müssen Sportfahrzeuge mit den Lichtern/Signalkörpern ausgerüstet sein, die bei Manövrierunfähigkeit zu setzen sind?","a":"Fahrzeuge ab 12 m Länge."},{"id":"recht-13","s":"recht","n":13,"q":"Sie sehen in der Dämmerung in der Nordsee in der Zufahrt zur Jade einen großen Tanker mit der üblichen Lichterführung, auf dem kurze Zeit später die Lichter rot-weiß-rot senkrecht übereinander zusätzlich zu den Fahrtlichtern gesetzt werden. Welche rechtliche Bedeutung hat die geänderte Signalgebung für Sie?","a":"Beim Erreichen des Geltungsbereiches der SeeSchStrO kennzeichnet sich der Tanker als Wegerechtschiff, das als manövrierbehindertes Fahrzeug gilt. Diesem so gekennzeichneten Fahrzeug muss im Falle einer Kollisionsgefahr ausgewichen werden."},{"id":"recht-14","s":"recht","n":14,"q":"Welche Lichter müssen manövrierbehinderte Fahrzeuge (außer Minenräumfahrzeuge) führen\n1. ohne Fahrt durchs Wasser (FdW),\n2. mit FdW,\n3. vor Anker?","a":"1. Ohne FdW:\nrot-weiß-rot senkrecht übereinander.\n2. Mit FdW:\nrot-weiß-rot senkrecht übereinander und Lichter eines Maschinenfahrzeugs (Topplicht[er]), Seitenlichter, Hecklicht.\n3. Vor Anker:\nrot-weiß-rot senkrecht übereinander und Ankerlicht(er)."},{"id":"recht-15","s":"recht","n":15,"q":"Wie sind manövrierbehinderte und manövrierunfähige Fahrzeuge am Tage bezeichnet?","a":"1. Manövrierbehinderte Fahrzeuge:\nBall-Rhombus-Ball senkrecht übereinander.\n2. Manövrierunfähige Fahrzeuge:\nzwei schwarze Bälle senkrecht übereinander."},{"id":"recht-16","s":"recht","n":16,"q":"Wie müssen Sie Ihr Fahrzeug unter Segel bei Tage und bei Nacht kennzeichnen, wenn Sie gleichzeitig mit Maschinenkraft fahren?","a":"1. Bei Nacht Lichterführung eines Maschinenfahrzeugs entsprechender Größe,\n2. bei Tage einen Kegel - Spitze unten - im Vorschiff gut sichtbar."},{"id":"recht-17","s":"recht","n":17,"q":"Was müssen Sie hinsichtlich der Zeiten der Lichterführung beachten?","a":"Die Lichter müssen geführt werden\n1. zwischen Sonnenuntergang und Sonnenaufgang,\n2. bei verminderter Sicht auch zwischen Sonnenaufgang und Sonnenuntergang."},{"id":"recht-18","s":"recht","n":18,"q":"Sie sehen am Tage ein Fahrzeug, augenscheinlich kürzer als 50 m, mit dem Sichtzeichen \"schwarzer Rhombus\", dahinter in gleichbleibendem Abstand ein weiteres Fahrzeug mit dem gleichen Signalkörper.\n1. Worum handet es sich?\n2. Wie sind die Fahrzeuge bei Nacht gekennzeichnet?","a":"1. Es handelt sich um einen Schleppverband länger als 200 m (Heck des Schleppers - Heck des Anhangs).\n2. Der Schlepper führt nachts drei weiße Topplichter senkrecht übereinander, Seitenlichter, Hecklicht und das gelbe Schlepplicht über dem Hecklicht. Der Anhang führt Seitenlichter und Hecklicht.","qi":["img/q/9a5754496823.png","img/q/f46d427bcc03.png","img/q/bf5534c4f2d7.png"]},{"id":"recht-19","s":"recht","n":19,"q":"Man hört bei Nebel folgendes Schallsignal mit der Pfeife (lang-kurz-kurz), unmittelbar gefolgt von (lang-kurz-kurz-kurz) etwa jede Minute. Worum handelt es sich dabei?","a":"Es ist das Schallsignal eines Schleppverbandes in Fahrt (schleppendes Fahrzeug lang-kurz-kurz; Anhang lang-kurz-kurz-kurz)."},{"id":"recht-20","s":"recht","n":20,"q":"Bei Nebel im Küstenbereich fahrend, hört man etwa jede Minute folgendes Signal: drei Glockenschläge, dann ca. 5 Sekunden lang rasches Läuten einer Glocke, dann drei Glockenschläge. Wer gibt dieses Signal?","a":"Dieses Signal gibt ein Fahrzeug auf Grund unter 100 m Länge."},{"id":"recht-21","s":"recht","n":21,"q":"Sie sehen ein Fahrzeug mit folgender Lichterführung:\n1. Worum handelt es sich?\n2. Welches Schallsignal müsste dieses Fahrzeug bei unsichtigem Wetter geben?","a":"1. Treibnetzfischer (Fahrzeug, das nicht trawlt) in Fahrt oder vor Anker mit ausgebrachtem Fanggerät, das waagerecht weiter als 150 m ins Wasser reicht. (Das untere weiße Licht kann auch das Hecklicht sein).\n2. Schallsignal (lang-kurz-kurz) mindestens alle 2 Minuten.","qi":["img/q/9a5754496823.png","img/q/f58be1fda27a.png","img/q/f58be1fda27a.png","img/q/3d176d5bad1f.png"]},{"id":"recht-22","s":"recht","n":22,"q":"Sie sehen nachts auf See 2 rote Lichter senkrecht übereinander:\nWorum handelt es sich?","a":"Um ein manövrierunfähiges Fahrzeug in Fahrt ohne Fahrt durchs Wasser."},{"id":"recht-23","s":"recht","n":23,"q":"Die Lichteranordnung eines Fahrzeugs ändert sich plötzlich von in Was schließen Sie daraus?","a":"Ein manövrierunfähiges Fahrzeug in Fahrt ohne Fahrt durchs Wasser (FdW) hat FdW aufgenommen, da man jetzt auch das Backbord-Seitenlicht sieht."},{"id":"recht-24","s":"recht","n":24,"q":"Was bestimmen die KVR über das Ausguckhalten?","a":"Es muss jederzeit durch Sehen und Hören sowie durch jedes andere verfügbare Mittel gehöriger Ausguck gehalten werden, der einen vollständigen Überblick über die Lage und die Möglichkeit der Gefahr eines Zusammenstoßes gibt."},{"id":"recht-25","s":"recht","n":25,"q":"Was bestimmen die KVR für das Verhalten von Fahrzeugen von weniger als 20 m Länge oder von Segelfahrzeugen im Fahrwasser einer Seeschifffahrtsstraße?","a":"Fahrzeuge von weniger als 20 m Länge oder Segelfahrzeuge dürfen nicht die Durchfahrt eines Fahrzeuges behindern, das nur innerhalb eines engen Fahrwassers oder einer Fahrrinne sicher fahren kann. Sie müssen, wenn es die Umstände erfordern, frühzeitig Maßnahmen ergreifen, um genügend Raum für die sichere Durchfahrt des anderen Fahrzeugs zu lassen."},{"id":"recht-26","s":"recht","n":26,"q":"Was ist eine \"Küstenverkehrszone\"?","a":"Das Gebiet zwischen der Küste und der landwärtigen Grenze eines Verkehrstrennungsgebietes."},{"id":"recht-27","s":"recht","n":27,"q":"Welche Fahrzeuge dürfen die Küstenverkehrszone benutzen, ohne einen Hafen innerhalb der Küstenverkehrszone anzusteuern?","a":"Fahrzeuge von weniger als 20 m Länge und Segelfahrzeuge."},{"id":"recht-28","s":"recht","n":28,"q":"Wie müssen Maschinenfahrzeuge ohne Radar bei verminderter Sicht ihre Fahrweise einrichten?","a":"Maschinenfahrzeuge müssen mit sicherer Geschwindigkeit fahren, die den gegebenen Umständen und Bedingungen der verminderten Sicht angepasst ist."},{"id":"recht-29","s":"recht","n":29,"q":"Wie müssen sich Segelfahrzeuge ohne Radar bei verminderter Sicht verhalten? Was gehört dabei zu den Regeln guter Seemannschaft?","a":"1. Segelfahrzeuge müssen mit sicherer Geschwindigkeit fahren, die den gegebenen Umständen und Bedingungen der verminderten Sicht angepasst ist.\n2. Bei Segelfahrzeugen, die eine Maschine an Bord haben, gehört das Bereithalten der Maschine zu den Regeln guter Seemannschaft."},{"id":"recht-30","s":"recht","n":30,"q":"Wie müssen sich Fahrzeuge ohne Radar bei verminderter Sicht verhalten, wenn sie voraus das Schallsignal eines anderen Fahrzeuges hören?","a":"Jedes Fahrzeug, das anscheinend vorlicher als querab das Schallsignal eines anderen Fahrzeuges hört, muss seine Fahrt auf das für die Erhaltung der Steuerfähigkeit geringstmögliche Maß verringern. Erforderlichenfalls muss es jegliche Fahrt wegnehmen und in jedem Fall mit äußerster Vorsicht manövrieren, bis die Gefahr eines Zusammenstoßes vorüber ist."},{"id":"recht-31","s":"recht","n":31,"q":"Sie segeln in der Nordsee bei guter Sicht. Ihnen kommt in stehender Peilung ein Maschinenfahrzeug entgegen, das keine Anstalten macht, seiner Ausweichpflicht nachzukommen. Geben Sie in einer sinnvollen Reihenfolge an, was von Ihnen zu unternehmen ist. Welche dieser Maßnahmen sind zwingend vorgeschrieben?","a":"1. Über Funk versuchen, das andere Fahrzeug auf seine Ausweichpflicht aufmerksam zu machen.\n2. Schallsignal: mindestens fünf kurze, rasch aufeinander folgende Pfeifentöne geben.\n3. Ggf. Ergänzung zu 2.: Lichtsignal von mindestens fünf kurzen, rasch aufeinander folgenden Blitzen.\n4. Manöver des sogenannten \"vorletzten Augenblicks\" fahren.\n5. Manöver des sogenannten \"letzten Augenblicks\" fahren. Zwingend vorgeschrieben sind die Maßnahmen nach 2. und 5."},{"id":"recht-32","s":"recht","n":32,"q":"Auf einem Segelfahrzeug unter Motor sieht man nachts fast recht voraus ein näher kommendes Fahrzeug mit folgender Lichterführung: oben ein weißes Licht, seitlich darunter ein grünes Licht, zeitweise rechts von dem grünen Licht auf gleicher Höhe auch ein rotes Licht. Um was für ein Fahrzeug handelt es sich, was ist von Ihnen und was ist auf dem anderen Fahrzeug zu unternehmen?","a":"Es handelt sich um ein Maschinenfahrzeug von weniger als 50 m Länge, das im Seegang oder durch schlechtes Steuern giert. Man muss annehmen, dass sich zwei Maschinenfahrzeuge auf entgegengesetzten oder fast entgegengesetzten Kursen nähern und die Möglichkeit der Gefahr eines Zusammenstoßes besteht. Beide Fahrzeuge müssen den Kurs nach Steuerbord ändern und dieses durch einen kurzen Ton anzeigen."},{"id":"recht-33","s":"recht","n":33,"q":"Wie muss man sich verhalten, wenn man gezwungen ist, ein Verkehrstrennungsgebiet zu queren?","a":"Kielrichtung (rwK) muss möglichst rechtwinklig zur allgemeinen Verkehrsrichtung zeigen."},{"id":"recht-34","s":"recht","n":34,"q":"Wie muss man sich verhalten, wenn man einen betonnten Schifffahrtsweg (z. B. in der Ostsee) queren will?","a":"Die Ausweichregeln der KVR beachten."},{"id":"recht-35","s":"recht","n":35,"q":"Wie ist die Gefahr eines Zusammenstoßes sicher erkennbar?","a":"Wenn die Kompasspeilung zu einem anderen Fahrzeug steht und sie sich einander nähern."},{"id":"recht-36","s":"recht","n":36,"q":"Wie müssen Sie Ausweichmanöver durchführen?","a":"1. Möglichst frühzeitig,\n2. durchgreifend, sodass das andere Fahrzeug rasch Ihre Absicht erkennen kann, und um sich gut klar zu halten."},{"id":"recht-37","s":"recht","n":37,"q":"Wie müssen Sie sich verhalten, nachdem Sie ein vorgeschriebenes Ausweichmanöver eingeleitet haben?","a":"Der Erfolg des Manövers ist laufend zu überprüfen, bis das andere Fahrzeug klar passiert ist."},{"id":"recht-38","s":"recht","n":38,"q":"Sie segeln mit Wind von Steuerbord und sehen nachts in Luv ein einzelnes rotes Licht, das in stehender Peilung näher kommt.\n1. Was ist das für ein Licht?\n2. Wer muss ausweichen? (Begründung!)","a":"1. Das Licht ist das Backbordlicht eines Segelfahrzeugs in Fahrt.\n2. Das Segelfahrzeug in Luv muss ausweichen, entweder weil es den Wind von Backbord hat oder weil es - wenn mit Wind von Steuerbord segelnd - luvwärts steht."},{"id":"recht-39","s":"recht","n":39,"q":"Sie segeln mit Wind von Backbord und sehen nachts in Luv ein einzelnes grünes Licht, das in stehender Peilung näher kommt.\n1. Was ist das für ein Licht?\n2. Wer muss ausweichen? (Begründung!)","a":"1. Das Licht ist das Steuerbordlicht eines Segelfahrzeugs in Fahrt.\n2. Ihr Fahrzeug muss als leewärtiges Fahrzeug ausweichen, weil Sie (mit Wind von Backbord segelnd) nicht erkennen können, von welcher Seite das andere Fahrzeug den Wind hat."},{"id":"recht-40","s":"recht","n":40,"q":"Sie segeln nachts mit raumem Wind und machen gute Fahrt. Sie sehen an Steuerbord voraus ein einzelnes weißes Licht in (nahezu) stehender Peilung. Näher kommend verschwindet das weiße Licht gelegentlich und es erscheint stattdessen in etwa gleicher Höhe und links davon ein rotes Licht. Jeweils kurzfristig sind beide Lichter gleichzeitig zu sehen.\n1. Worum handelt es sich bei diesen Lichtern?\n2. Wer muss ausweichen? (Begründung!)","a":"1. Man sieht Hecklicht und/oder Backbord-Seitenlicht eines Segelfahrzeugs in Fahrt, das im Seegang giert.\n2. Ihr Fahrzeug nähert sich aus dem Hecksektor des anderen Fahrzeugs. Es steht eben auf dessen Sektorengrenze und muss als überholendes Fahrzeug ausweichen. Im Zweifel (hier Sektorengrenze!) muss man sich als Überholer betrachten."},{"id":"recht-41","s":"recht","n":41,"q":"Sie segeln nachts mit raumem Wind und sehen nahezu achteraus ein Fahrzeug mit der Lichterführung rot-weiß-rot senkrecht übereinander, das näher kommt. Zusätzlich sehen Sie neben zwei weißen Topplichtern links ein grünes und rechts ein rotes Licht auf gleicher Höhe.\n1. Was bedeuten diese Lichter?\n2. Wer muss ausweichen? (Begründung!)","a":"1. Man sieht ein manövrierbehindertes Fahrzeug mit FdW (Topplichter, Seitenlichter).\n2. Dieses Fahrzeug nähert sich im Hecklichtsektor und muss deshalb als Überholer ausweichen."},{"id":"recht-42","s":"recht","n":42,"q":"Welcher Zeitpunkt ist im freien Seeraum entscheidend für die Verantwortlichkeit (hier = Ausweichpflicht!) der Fahrzeuge untereinander?","a":"Der Augenblick des ersten Insichtkommens. Eine spätere Änderung der Lage der Fahrzeuge zueinander verändert nicht die Verantwortlichkeit."},{"id":"recht-43","s":"recht","n":43,"q":"Ein anderes Fahrzeug muss Ihnen ausweichen. Welche Verpflichtung nach KVR haben Sie? Was unternehmen Sie, wenn das andere Fahrzeug nicht ausweicht?","a":"1. Mein Fahrzeug ist \"Kurshalter\", d. h. es muss Kurs und Geschwindigkeit beibehalten.\n2. Mein Fahrzeug darf zur Abwendung eines Zusammenstoßes manövrieren, sobald erkennbar wird, dass das andere Fahrzeug nicht angemessen (= regelgerecht) manövriert (\"Manöver des vorletzten Augenblicks!\")\n3. Mein Fahrzeug muss zweckdienlich manövrieren, wenn ein Manöver des Ausweichpflichtigen allein einen Zusammenstoß nicht mehr vermeiden kann (\"Manöver des letzten Augenblicks!\")"},{"id":"recht-44","s":"recht","n":44,"q":"Welchen Fahrzeugen muss ein Segelfahrzeug ausweichen?","a":"1. Einem manövrierunfähigen Fahrzeug,\n2. einem manövrierbehinderten Fahrzeug,\n3. einem fischenden Fahrzeug,\n4. ggf. einem anderen Segelfahrzeug, abhängig von der Segelstellung in Bezug auf den Wind."},{"id":"recht-45","s":"recht","n":45,"q":"1. Wie muss sich ein Sportfahrzeug gegenüber einem tiefgangbehinderten Fahrzeug verhalten?\n2. Schlagen Sie entsprechende Maßnahmen/Manöver vor.","a":"1. Das Sportfahrzeug muss vermeiden, die sichere Durchfahrt eines tiefgangbehinderten Fahrzeugs zu behindern.\n2. Dieses kann durch eine frühzeitige Kursänderung, Geschwindigkeitsänderung oder beides geschehen."},{"id":"recht-46","s":"recht","n":46,"q":"Wo unterliegt Ihr Segelfahrzeug bzw. Ihre Motoryacht unter 20 m Länge einem Behinderungsverbot?","a":"1. In engen Fahrwassern,\n2. auf dem Einbahnweg eines Verkehrstrennungsgebietes (VTG) gegenüber Maschinenfahrzeugen im VTG."},{"id":"recht-47","s":"recht","n":47,"q":"Welchen Abstand muss man von Minenräumfahrzeugen halten?","a":"Mindestens 1 000 m."},{"id":"recht-48","s":"recht","n":48,"q":"Auf einer Motoryacht A sieht man nachts etwa recht voraus Topplicht und beide Seitenlichter eines Fahrzeugs B. Die Lichter werden rasch heller.\n1. Was ist B?\n2. Wie ist die Situation zu klären?","a":"1. B ist ein Maschinenfahrzeug von weniger als 50 m Länge in Fahrt.\n2. A und B müssen ihren Kurs so nach Steuerbord ändern, dass sie einander an der Backbord-Seite passieren. Dabei müssen A und B das Signal \"ein kurzer Ton\" geben.","qi":["img/q/ca42861c35c3.png"]},{"id":"recht-49","s":"recht","n":49,"q":"Auf einer Motoryacht A erkennt man nachts etwa 2 Strich an Backbord folgende Lichter des Fahrzeugs B, die rasch näher kommen. Die Kompasspeilung zum Fahrzeug B ändert sich dabei nur geringfügig.\n1. Worum handelt es sich bei Fahrzeug B?\n2. Wer muss ausweichen?\n3. Was muss Fahrzeug A tun?","a":"1. B ist ein Maschinenfahrzeug von weniger als 50 m Länge in Fahrt, dessen Steuerbord-Seite man sieht.\n2. B muss ausweichen, weil es die Motoryacht A an seiner Steuerbord-Seite hat.\n3. Die Motoryacht A muss Kurs und Geschwindigkeit beibehalten."},{"id":"recht-50","s":"recht","n":50,"q":"Welchen Fahrzeugen muss eine Motoryacht ausweichen?","a":"1. Manövrierunfähigen Fahrzeugen,\n2. manövrierbehinderten Fahrzeugen,\n3. fischenden Fahrzeugen,\n4. Segelfahrzeugen,\n5. ggf. einem anderen Maschinenfahrzeug."},{"id":"recht-51","s":"recht","n":51,"q":"Auf einer Motoryacht A sieht man nachts etwa querab an Steuerbord ein einzelnes weißes Licht in (nahezu) stehender Kompasspeilung. Näher kommend erkennt man unterhalb des weißen Lichtes und etwas rechts davon ein rotes Licht (Fahrzeug B).\n1. Worum handelt es sich?\n2. Was müssen jeweils beide Fahrzeuge tun? (Begründung!)","a":"1. Topplicht und später Backbord-Seitenlicht eines Maschinenfahrzeuges B von weniger als 50 m Länge in Fahrt.\n2. A muss ausweichen, weil es B an seiner Steuerbord-Seite hat. A muss das Signal \"ein kurzer Ton\" geben.\n3. B muss Kurs und Geschwindigkeit beibehalten.","qi":["img/q/4d61befcd2a6.png"]},{"id":"recht-52","s":"recht","n":52,"q":"Eine Motoryacht, Länge 8 m, treibt nachts manövrierunfähig in der Nordsee und sieht ein großes Fahrzeug direkt auf sich zukommen. Welche Maßnahmen hat die Motoryacht zu ergreifen?","a":"Ein Fahrzeug von weniger als 12 m Länge, das die zwei roten Rundumlichter senkrecht übereinander nicht führt, muss folgende Maßnahmen ergreifen:\n1. Durch jedes andere verfügbare Mittel anzeigen, dass es manövrierunfähig ist, z. B. über UKW -Sprechfunk oder durch ein Schallsignal oder das Lichtsignal lang-kurz-kurz.\n2. Bei weiterer Annäherung das andere Fahrzeug mit einer starken Handlampe anleuchten und so auf sich aufmerksam machen.\n3. Führen eines weißen Rundumlichtes, das mit keinem anderen Licht verwechselt werden kann.\n4. Abfeuern eines Signals \"weißer Stern\" oder \"Blitz-Knall\".\n5. Sofort bei Eintritt der Manövrierunfähigkeit Verkehrszentrale informieren (wenn vorhanden)."},{"id":"recht-53","s":"recht","n":53,"q":"Wie sind Fahrwasser in der Seeschifffahrtsstraßen-Ordnung im Sinne der KVR eingestuft?","a":"Fahrwasser der Seeschifffahrtsstraßen gelten als enge Fahrwasser im Sinne der KVR."},{"id":"recht-54","s":"recht","n":54,"q":"Erläutern Sie den Begriff \"durchgehende Schifffahrt\" auf einem Fahrwasser einer Seeschifffahrtsstraße.","a":"Die durchgehende Schifffahrt umfasst alle Fahrzeuge, die deutlich dem Fahrwasserverlauf einer Seeschifffahrtsstraße folgen. Dies erlaubt nach allgemeiner Verkehrsauffassung ein Abweichen von höchstens ± 10° von der Richtung des Fahrwassers. Dabei ist es gleichgültig, zu welchem Zweck das Fahrzeug betrieben wird."},{"id":"recht-55","s":"recht","n":55,"q":"Was fordern die Grundregeln für das Verhalten im Verkehr?","a":"Jeder Verkehrsteilnehmer\n1. muss die Sicherheit und Leichtigkeit des Verkehrs gewährleisten,\n2. darf andere (nicht nur Verkehrsteilnehmer!) nicht schädigen, gefährden oder mehr als unvermeidbar behindern oder belästigen."},{"id":"recht-56","s":"recht","n":56,"q":"Welche verkehrsrechtliche Verantwortung hat der Schiffsführer?","a":"1. Befolgung der Vorschriften im Verkehr, u. a. KVR, SeeSchStrO.\n2. Ausrüstung/Einrichtung seines Fahrzeugs zum Führen und Zeigen von Lichtern und Signalkörpern und Geben von Schallsignalen."},{"id":"recht-57","s":"recht","n":57,"q":"Was sind Seeschifffahrtsstraßen im Sinne der SeeSchStrO?","a":"Seeschifffahrtsstraßen im Sinne dieser Verordnung sind:\n1. Wasserflächen zwischen der Küstenlinie bei mittlerem Hochwasser oder der seewärtigen Begrenzung der Binnenwasserstraßen und einer Linie von drei Seemeilen seewärts der Basislinie,\n2. die durchgehend durch laterale Zeichen (Tonnen) begrenzten Wasserflächen der seewärtigen Teile der Fahrwasser im Küstenmeer,\n3. Wasserflächen zwischen den Ufern bestimmter Binnenwasserstraßen."},{"id":"recht-58","s":"recht","n":58,"q":"Was sind Fahrwasser im Sinne der SeeSchStrO?","a":"Fahrwasser sind die Teile der Wasserflächen, die durch Tonnen (laterale Zeichen) begrenzt oder gekennzeichnet sind oder die, soweit das nicht der Fall ist, auf den Binnenwasserstraßen für die durchgehende Schifffahrt bestimmt sind."},{"id":"recht-59","s":"recht","n":59,"q":"Welche verkehrsrechtlichen Bestimmungen gelten auf deutschen Seeschifffahrtsstraßen?","a":"Auf deutschen Seeschifffahrtsstraßen gelten:\n1. die KVR,\n2. die Seeschifffahrtsstraßen-Ordnung, ggf. die Bekanntmachungen der Wasser- und Schifffahrtsdirektionen (WSD) Nord und Nordwest,\n3. ggf. die Hafenordnungen."},{"id":"recht-60","s":"recht","n":60,"q":"Wo und unter welcher Bedingung gelten im Geltungsbereich der SeeSchStrO die KVR?","a":"Die KVR gelten im gesamten Geltungsbereich der SeeSchStrO innerhalb und außerhalb der Fahrwasser, soweit die SeeSchStrO nicht ausdrücklich etwas anderes bestimmt (z. B. Vorfahrt, Grundsatz des Vorranges der spezielleren Rechtsvorschrift vor der allgemeineren)."},{"id":"recht-61","s":"recht","n":61,"q":"Wie haben Segelfahrzeuge in einem Fahrwasser der SeeSchStrO untereinander auszuweichen, wenn sie nicht deutlich der Richtung eines Fahrwassers folgen?","a":"Sie haben untereinander nach den Regeln der KVR auszuweichen, wenn sie dadurch vorfahrtberechtigte Fahrzeuge nicht gefährden oder behindern."},{"id":"recht-62","s":"recht","n":62,"q":"Auf der Elbe hören Sie nachts vor sich von einem Fahrzeug, das zusätzlich zu seinen Fahrtlichtern ein rotes Rundumlicht führt, fortwährend das Schallsignal kurz-lang. Um welches Schallsignal handelt es sich, wann ist es zu geben und wie verhalten Sie sich?","a":"Es handelt sich um das Bleib-weg-Signal, das von einem Fahrzeug gegeben wird, bei dem bestimmte gefährliche Güter oder radioaktive Stoffe frei werden oder drohen frei zu werden oder es besteht Explosionsgefahr. Man hat sich mit seinem Fahrzeug möglichst weit von dem anderen Fahrzeug zu entfernen (sicherer Abstand) und darf keine elektrischen Schalter bedienen. Kein offenes Feuer."},{"id":"recht-63","s":"recht","n":63,"q":"Wann ist von einem Fahrzeug auf einer Seeschifffahrtsstraße das \"allgemeine Gefahr- und Warnsignal\" zu geben und wie lautet es?","a":"Gefährdet ein Fahrzeug ein anderes Fahrzeug oder wird es durch dieses selbst gefährdet, hat es, soweit möglich, rechtzeitig das Schallsignal zu geben: ein langer Ton, vier kurze Töne; ein langer Ton, vier kurze Töne."},{"id":"recht-64","s":"recht","n":64,"q":"Nennen Sie die speziellen Verhaltensregeln für Sportfahrzeuge im Nord-Ostsee-Kanal (NOK).","a":"1. Sportfahrzeuge dürfen in der Regel die Zufahrten und den NOK lediglich zur Durchfahrt und ohne Lotsen nur während der Tagfahrzeiten und nicht bei verminderter Sicht benutzen.\n2. Sportfahrzeuge müssen ihre Kanalfahrt so einrichten, dass sie vor Ablauf der Tagfahrzeit eine für Sportfahrzeuge bestimmte Liegestelle erreichen können.\n3. Bei plötzlich auftretender verminderter Sicht dürfen Sportfahrzeuge in den Weichengebieten hinter den Dalben oder an geeigneten Liegestellen festmachen."},{"id":"recht-65","s":"recht","n":65,"q":"Welche speziellen Fahrregeln haben Sportfahrzeuge im Nord-Ostsee-Kanal (NOK) einzuhalten?","a":"1. Das Segeln ist auf dem NOK verboten.\n2. Sportfahrzeuge mit Maschinenantrieb dürfen zusätzlich die Segel setzen.\n3. Ein motorbetriebenes Sportfahrzeug darf nur ein Sportfahrzeug schleppen."},{"id":"recht-66","s":"recht","n":66,"q":"Während der Durchfahrt durch den Nord-Ostsee-Kanal (NOK) wird man auf einem Sportboot von Nebel überrascht. Was ist zu unternehmen?","a":"Schnellstmöglich in einem Weichengebiet hinter den Dalben oder an geeigneten Liegestellen festmachen."},{"id":"recht-67","s":"recht","n":67,"q":"Sie sehen vor dem Einlaufen in den NOK in Brunsbüttel folgende Lichtsignale:\n1. ein unterbrochenes rotes Licht,\n2. ein unterbrochenes weißes Licht über einem unterbrochenen roten Licht,\n3. ein unterbrochenes weißes Licht. Geben Sie die Bedeutung dieser Signale an.","a":"1. Einfahren verboten.\n2. Freigabe wird vorbereitet.\n3. Sportfahrzeuge können einfahren."},{"id":"recht-68","s":"recht","n":68,"q":"Erläutern Sie den Begriff \"Vorfahrt beachten\".","a":"\"Vorfahrt beachten\" begründet eine Wartepflicht. Wer die Vorfahrt zu beachten hat, muss rechtzeitig durch sein Fahrverhalten erkennen lassen, dass er warten wird. Er darf nur weiterfahren, wenn er übersehen kann, dass die Schifffahrt im Fahrwasser nicht beeinträchtigt wird. Ggf. hat der Wartepflichtige seinen Kurs und/oder seine Geschwindigkeit zu ändern (gilt rechtlich nicht als Ausweichen!)."},{"id":"recht-69","s":"recht","n":69,"q":"Erläutern Sie den Begriff \"Vorfahrt haben\".","a":"\"Vorfahrt haben\" gilt nur für ein im Fahrwasser fahrendes oder dem Fahrwasserverlauf folgendes Fahrzeug. Das bedeutet, dass andere Fahrzeuge, die in das Fahrwasser einlaufen wollen, dort drehen oder an- und ablegen wollen, mit diesem Vorhaben warten müssen, bis das vorfahrtberechtigte Fahrzeug vorüber ist. \"Vorfahrt haben\" bedeutet aber nicht: Vorfahrt erzwingen! Ggf. muss ein vorfahrtberechtigtes Fahrzeug Maßnahmen zur Verhinderung einer drohenden Kollision ergreifen."},{"id":"recht-70","s":"recht","n":70,"q":"Wie hat sich ein in das Fahrwasser einlaufendes Fahrzeug gegenüber im Fahrwasser fahrenden Fahrzeugen zu verhalten?","a":"Es muss die Vorfahrt der Fahrzeuge im Fahrwasser beachten, d. h., es muss warten, bis das Fahrwasser frei ist. Es muss rechtzeitig durch sein Fahrverhalten erkennen lassen, dass es warten wird."},{"id":"recht-71","s":"recht","n":71,"q":"Wie hat sich ein den Ankerplatz oder Liegeplatz verlassendes Fahrzeug gegenüber im Fahrwasser fahrenden Fahrzeugen zu verhalten?","a":"Es muss die Vorfahrt der Fahrzeuge im Fahrwasser beachten, d. h. es muss warten, bis das Fahrwasser frei ist. Es muss rechtzeitig durch sein Fahrverhalten erkennen lassen, dass es warten wird."},{"id":"recht-72","s":"recht","n":72,"q":"Welche Fahrregeln muss ein Sportfahrzeug beachten, wenn es der Richtung des Fahrwassers folgt?","a":"Beim Fahren im Fahrwasser muss das Sportfahrzeug sich so nahe am äußeren Rand des Fahrwassers an seiner Steuerbordseite halten, wie dieses ohne Gefahr möglich ist.","qi":["img/q/d62ee857704b.png"]},{"id":"recht-73","s":"recht","n":73,"q":"Was muss ein Sportfahrzeug in Bezug auf das Fahrwasser beachten, wenn es außerhalb des Fahrwassers fährt?","a":"Außerhalb des Fahrwassers ist so zu fahren, dass klar erkennbar ist, dass das Fahrwasser nicht benutzt wird."},{"id":"recht-74","s":"recht","n":74,"q":"Wie müssen sich Segelfahrzeuge verhalten, die, dem Fahrwasserverlauf folgend, sich auf (nahezu) entgegengesetzten Kursen begegnen?","a":"Jedes Fahrzeug muss nach Steuerbord ausweichen."},{"id":"recht-75","s":"recht","n":75,"q":"Was bedeutet \"Queren eines Fahrwassers\" im Sinne der SeeSchStrO?","a":"Queren bedeutet deutliches Abweichen vom Fahrwasserverlauf, nach allgemeiner Verkehrsmeinung mehr als 10° (z. B. Kreuzen eines Segelfahrzeuges über die gesamte oder auch nur teilweise Fahrwasserbreite)."},{"id":"recht-76","s":"recht","n":76,"q":"Wie müssen Sie die Geschwindigkeit Ihres Sportbootes einrichten, wenn Sie außerhalb eines Fahrwassers an Stellen mit erkennbarem Badebetrieb vorbeifahren?","a":"Höchstgeschwindigkeit 8 km/h im Abstand von weniger als 500 m vom Ufer."},{"id":"recht-77","s":"recht","n":77,"q":"Sie sehen auf der Elbe bei Nacht ein Fahrzeug mit der nachfolgenden Lichterführung. Um was für ein Fahrzeug handelt es sich? Was bedeuten die beiden roten und die beiden grünen Lichter senkrecht übereinander?","a":"Manövrierbehindertes Fahrzeug, Länge wahrscheinlich 50 m oder mehr, von vorn mit Fahrt durchs Wasser, das Unterwasserarbeiten ausführt (z. B. baggert). Passierseite an Steuerbord (zwei grüne Rundumlichter übereinander), Passierbehinderung an Backbord-Seite (zwei rote Rundumlichter übereinander).","qi":["img/q/2d3e7060150e.png"]},{"id":"recht-78","s":"recht","n":78,"q":"Sie sehen auf der Elbe bei Tage ein Fahrzeug mit den nachfolgenden schwarzen Signalkörpern, dessen Bugwelle man klar erkennen kann. Um was für ein Fahrzeug handelt es sich? Was bedeuten die beiden schwarzen Bälle und die beiden schwarzen Rhomben senkrecht übereinander?","a":"Entgegenkommendes manövrierbehindertes Fahrzeug von vorn, mit Fahrt durchs Wasser, das Unterwasserarbeiten ausführt (z. B. baggert). Passierseite an Backbord des Baggers (zwei schwarze Rhomben übereinander), Passierbehinderung an Steuerbord-Seite des Baggers (zwei schwarze Bälle übereinander)."},{"id":"recht-79","s":"recht","n":79,"q":"Beim Passieren von Cuxhaven sichten Sie, elbabwärts segelnd, an Ihrer Steuerbord-Seite die Tonne 32a. Um was für eine Tonne handelt es sich, welche Bezeichnung hat die nächste Tonne an der gleichen Seite?","a":"Es handelt sich um eine Backbordfahrwassertonne; die nächste Tonne hat die Aufschrift 32."},{"id":"recht-80","s":"recht","n":80,"q":"Welche besondere Lichterführung/Kennzeichnung ist vorgeschrieben, wenn ein Motorsportfahrzeug ein anderes Sportfahrzeug schleppt?","a":"Motorsportfahrzeuge, die andere Sportfahrzeuge schleppen, gelten nicht als schleppende Maschinenfahrzeuge im Sinne der KVR. Daher keine besondere Lichterführung/Kennzeichnung."},{"id":"recht-81","s":"recht","n":81,"q":"Welche besonderen Bestimmungen gelten auf dem Nord-Ostsee-Kanal (NOK) für Sportfahrzeuge beim Schleppen?","a":"1. Ein motorbetriebenes Sportfahrzeug darf nur ein Sportfahrzeug schleppen.\n2. Das geschleppte Sportfahrzeug darf nur eine Höchstlänge von weniger als 15 m haben.\n3. Die Mindestgeschwindigkeit beim Schleppen muss 9 km/h betragen.","qi":["img/q/9769f8930cb3.png"]},{"id":"recht-82","s":"recht","n":82,"q":"Während einer Revierfahrt erkennen Sie ein Signal an Land, jeweils schwarze Signalkörper:\n1. Was bedeutet dieses Signal?\n2. Welches Signal wird stattdessen nachts gezeigt?","a":"1. Außergewöhnliche Schifffahrtsbehinderung.\n2. Nachts: Rundumlichter rot-rot-grün senkrecht übereinander."},{"id":"recht-83","s":"recht","n":83,"q":"Wer darf laut SeeSchStrO ein Fahrzeug nicht führen oder als Mitglied der Crew eine andere Tätigkeit des Brücken- oder Decksdienstes nicht ausüben (allgemein ohne Zahlen zu beantworten)?","a":"Wer infolge körperlicher oder geistiger Mängel oder des Genusses alkoholischer Getränke oder anderer berauschender Mittel in der sicheren Führung eines Fahrzeugs oder in der sicheren Ausübung einer anderen Tätigkeit des Brücken- oder Decksdienstes behindert ist."},{"id":"recht-84","s":"recht","n":84,"q":"Welche Atem- bzw. Blutalkoholkonzentration darf laut SeeSchStrO nicht erreicht werden, damit kein Verbot für ein Führen eines Fahrzeugs oder als Mitglied der Crew für ein Ausüben des Brückendienstes besteht?","a":"0,25 mg/l oder mehr Alkohol in der Atemluft oder 0,5 Promille oder mehr Alkohol im Blut oder eine Alkoholmenge, die zu einer solchen Atem- oder Blutalkoholkonzentration führt."},{"id":"recht-85","s":"recht","n":85,"q":"Was müssen Sie beim ersten Anlaufen eines ausländischen Hafens beachten?","a":"Die Einreise-, Gesundheits- und Zollformalitäten sind zu erledigen."},{"id":"recht-86","s":"recht","n":86,"q":"Was ist ein Flaggenzertifikat? Für welche Fahrzeuge kann es ausgestellt werden?","a":"Vom BSH ausgestellter Ausweis, mit dem das Recht und die Pflicht zum Führen der Bundesflagge nachgewiesen wird. Für Fahrzeuge unter 15 m Lüa = \"nicht registerpflichtige Fahrzeuge\"."},{"id":"recht-87","s":"recht","n":87,"q":"Was ist das Schiffszertifikat, wer stellt es aus, ab welcher Schiffslänge ist es vorgeschrieben?","a":"Das Schiffszertifikat ist der Nachweis, dass ein Schiff im Seeschiffsregister eingetragen ist. Ausgestellt wird es vom Registergericht, Vorgeschrieben ist es ab 15 m Rumpflänge."},{"id":"recht-88","s":"recht","n":88,"q":"Was versteht man unter dem Begriff \"Küstenmeer\"?","a":"Die seewärts der Küstenlinie bei mittlerem Hochwasser oder der Basislinie gelegenen Meeresgewässer bis zu einer Breite von 12 sm."},{"id":"recht-89","s":"recht","n":89,"q":"Was versteht man unter dem Begriff \"innere Gewässer\"?","a":"Als \"innere Gewässer\" bezeichnet man die Gewässer landwärts der Basislinien."},{"id":"recht-90","s":"recht","n":90,"q":"Was versteht man unter dem Begriff \"Basislinie\" und wo finden Sie diese?","a":"Als Basislinie bezeichnet man die Grenze zwischen den inneren Gewässern (eines Staates) und dem Küstenmeer. Basislinien sind in Seekarten eingezeichnet."},{"id":"recht-91","s":"recht","n":91,"q":"Welche Aufgaben hat die Bundesstelle für Seeunfalluntersuchung?","a":"Amtliche Untersuchung eines schaden- oder gefahrverursachenden Vorkommnisses (Seeunfall) im Zusammenhang mit dem Betrieb eines Schiffes (z. B. Kollision zwischen zwei Fahrzeugen) und Ermittlung der Umstände, durch die es zu dem Seeunfall gekommen ist. Herausgabe von Untersuchungsberichten und insbesondere Sicherheitsempfehlungen zur Verhütung von Seeunfällen."},{"id":"recht-92","s":"recht","n":92,"q":"Wann liegt ein schaden- oder gefahrverursachendes Vorkommnis (Seeunfall) im Sinne des Seesicherheits-Untersuchungs-Gesetzes (SUG) vor? Nennen Sie mindestens 3 Merkmale.","a":"1. Schiffsverlust, Aufgrundlaufen, Kollision eines Schiffes,\n2. Tod oder Verschollenheit oder schwere Verletzung einer Person,\n3. maritimer Umweltschaden oder sonstiger Sachschaden,\n4. Gefahr für einen Menschen oder ein Schiff,\n5. Gefahr eines schweren Schadens an einem Schiff, einem meerestechnischen Bauwerk oder an der Meeresumwelt."},{"id":"recht-93","s":"recht","n":93,"q":"Was müssen Sie nach einem Seeunfall veranlassen? Wie kann es umgesetzt werden?","a":"Den Seeunfall unverzüglich der Bundesstelle für Seeunfalluntersuchung melden. Das kann in einem deutschen Einlaufhafen auch über die Wasserschutzpolizei bzw. im Ausland über die zuständigen Hafenbehörden veranlasst werden."},{"id":"recht-94","s":"recht","n":94,"q":"Welche Angaben müssen der Bundesstelle für Seeunfalluntersuchung gemeldet werden? Nennen Sie mindestens 5 dieser Angaben.","a":"Es sind folgende Angaben zu melden:\nName und derzeitiger Aufenthalt des Meldenden, Ort (geographische Position) und Zeit des Unfalles, Name, Rufzeichen und Flagge des Schiffes sowie Rufnummer des zu diesem Schiff gehörenden mobilen Seefunkdienstes (MMSI), Typ, Verwendungszweck, Name des Betreibers des Schiffes, Name des verantwortlichen Schiffsführers, Herkunfts- und Zielhafen des Schiffes, Anzahl der Besatzungsmitglieder und weiterer Personen an Bord, Umfang des Personen- und Sachschadens, Darstellung des Verlaufs des Vorkommnisses, Angaben über andere Schiffe, die am Unfall beteiligt sind, Wetterbedingungen, Darstellung der Gefahr einer Meeresverschmutzung."},{"id":"recht-95","s":"recht","n":95,"q":"In welcher Vorschrift ist geregelt, welche Angaben der Bundesstelle für Seeunfalluntersuchung bei einem schaden- oder gefahrverursachenden Vorkommnis (Seeunfall) gemeldet werden müssen? Wer ist verantwortlich für die Meldung?","a":"Geregelt in der \"Verordnung über die Sicherung der Seefahrt\". Verantwortlich für die Meldung sind der Schiffsführer oder bei dessen Verhinderung ein anderes Besatzungsmitglied bzw. ggf. auch der Betreiber des Schiffes, falls keine der vorgenannten Personen dazu in der Lage ist."},{"id":"recht-96","s":"recht","n":96,"q":"Was sind Seeämter und was sind ihre Aufgaben?","a":"Seeämter sind bei den Wasser- und Schifffahrtsdirektionen Nord und Nordwest gebildete Untersuchungsausschüsse zur Untersuchung der Frage, ob gegenüber einem Verfahrensbeteiligten ein Fahrverbot ausgesprochen oder ein Befähigungszeugnis bzw. ein amtlicher Führerschein der Sportschifffahrt entzogen werden muss."},{"id":"recht-97","s":"recht","n":97,"q":"Welche behördlichen Veröffentlichungen für Wassersportler geben Ihnen rechtliche Informationen und Hinweise über das Verhalten auf Seeschifffahrtsstraßen?","a":"\"Sicherheit auf dem Wasser, Leitfaden für Wassersportler\". \"Sicherheit im See- und Küstenbereich, Sorgfaltsregeln für Wassersportler\"."},{"id":"recht-98","s":"recht","n":98,"q":"Sie sehen von Ihrem Sportfahrzeug aus in der Nordsee nördlich von Helgoland eine noch unbekannte Gefahr, z. B. einen teibenden Container. Was haben Sie zu unternehmen?","a":"Man muss dies auf dem schnellsten Weg direkt oder über eine Verkehrszentrale bzw. Küstenfunkstelle dem Maritimen Lagezentrum (MLZ) in Cuxhaven als Meldestelle für Unfälle auf See mitteilen."},{"id":"recht-99","s":"recht","n":99,"q":"Wann und wo wird eine Flagge des Gastlandes gehisst?","a":"Beim Einlaufen in die Küstengewässer des Gastlandes unter der Steuerbordsaling."},{"id":"recht-100","s":"recht","n":100,"q":"Wann und wo wird die Bundesflagge geführt?","a":"Auf in Betrieb befindlichen Yachten während der Flaggzeit in den Küstengewässern, auf See und im Hafen am Flaggenstock am Heck, auf segelnden mehrmastigen Yachten auch im Topp des hintersten Mastes (nicht am Achterstag)."},{"id":"recht-101","s":"recht","n":101,"q":"Welche Befahrensregelungen gelten für die Schutzzonen I in den Nationalparks im Deutschen Wattenmeer außerhalb der speziellen Schutzgebiete?","a":"Das Verlassen der Fahrwasser zwischen 3 h nach Hochwasser und 3 h vor dem folgenden Hochwasser ist untersagt. In der übrigen Zeit beträgt für Sportfahrzeuge die Höchstgeschwindigkeit außerhalb des Fahrwassers 8 kn und generell im Fahrwasser 12 kn."},{"id":"recht-102","s":"recht","n":102,"q":"Wo sind die Grenzen der Schutzzonen I und der speziellen Schutzgebiete in den Nationalparks aufgeführt?","a":"In den Seekarten."},{"id":"recht-103","s":"recht","n":103,"q":"Welchen Zweck soll das MARPOL-Übereinkommen erfüllen?","a":"Das MARPOL-Übereinkommen soll die Verschmutzung der Meere verhindern."},{"id":"recht-104","s":"recht","n":104,"q":"Was sind Sondergebiete im Sinne des MARPOL-Übereinkommens in Europa?","a":"Ostsee, Nordsee und Mittelmeer."},{"id":"recht-105","s":"recht","n":105,"q":"Was ist nach dem MARPOL-Übereinkommen für die Sportschifffahrt in Sondergebieten grundsätzlich verboten?","a":"Das Einleiten von Öl, Schiffsabwässern, Schiffsmüll und anderen Schadstoffen."},{"id":"recht-106","s":"recht","n":106,"q":"Gilt das MARPOL-Übereinkommen grundsätzlich auch für Sportfahrzeuge?","a":"Das MARPOL-Übereinkommen gilt grundsätzlich für alle Schiffe, somit auch für Sportfahrzeuge."},{"id":"recht-107","s":"recht","n":107,"q":"Woraus können Sie Informationen über Entsorgungsmöglichkeiten in deutschen Sportboothäfen entnehmen?","a":"Aus der Broschüre \"Entsorgungsmöglichkeiten für Öl, Schiffsmüll und Schiffsabwässer - eine Übersicht für Sport- und Kleinschifffahrt\" des BSH."},{"id":"recht-108","s":"recht","n":108,"q":"Wie ist auf Sportfahrzeugen mit ölhaltigem Bilgenwasser zu verfahren, wenn die Bedingungen, unter denen nach MARPOL das Lenzen zulässig ist, nicht eingehalten werden können?","a":"Es muss im Hafen entsorgt werden."},{"id":"recht-109","s":"recht","n":109,"q":"Was ist hinsichtlich der Entsorgung von Müll in Nord- und Ostsee und im Mittelmeer zu beachten? (Begründung!)","a":"Da Nord-, Ostsee und Mittelmeer Sondergebiete nach MARPOL sind, darf dort kein Müll in die See entsorgt werden."},{"id":"recht-110","s":"recht","n":110,"q":"Welche Müllanteile dürfen in Sondergebieten nicht auf See entsorgt werden?","a":"Synthetische Seile, Netze, Segel, Kunststofftüten u. Ä., Papiererzeugnisse, Lumpen, Glas, Metall, Steingut, Schalungs- oder Verpackungsmaterial. Stand: 01. Juli 2006 © Wasserstraßen- und Schifffahrtsverwaltung des Bundes"},{"id":"wetter-1","s":"wetter","n":1,"q":"Was ist Wind und wie entsteht er?","a":"Wind ist bewegte Luft. Die Bewegung entsteht durch die Druckunterschiede zwischen Hoch- und Tiefdruckgebieten."},{"id":"wetter-2","s":"wetter","n":2,"q":"Was ist der Taupunkt?","a":"Der Taupunkt ist die Temperatur, auf die Luft abgekühlt werden muss, damit sie mit Feuchtigkeit gesättigt ist. Es setzt Kondensation (Taubildung) ein."},{"id":"wetter-3","s":"wetter","n":3,"q":"In welcher Größe wird in der Schifffahrt die Luftfeuchtigkeit allgemein angegeben?","a":"Relative Feuchtigkeit in Prozent."},{"id":"wetter-4","s":"wetter","n":4,"q":"Nennen Sie mindestens 6 Parameter, aus denen sich eine Wetterbeobachtung an Bord zusammensetzt.","a":"Windrichtung, Windstärke, Luftdruck, aktuelles Wetter, Bedeckungsgrad, Wolken, Seegang, Strom, Temperatur und ggf. Luftfeuchte."},{"id":"wetter-5","s":"wetter","n":5,"q":"1. In welcher Maßeinheit wird die Windstärke angegeben?\n2. In welchen Maßeinheiten wird die Windgeschwindigkeit angegeben?","a":"1. Nach der Beaufortskala (Bft).\n2. In kn, m/s und km/h."},{"id":"wetter-6","s":"wetter","n":6,"q":"1. Wie heißen die Linien gleichen Luftdrucks?\n2. In welcher Maßeinheit wird der Luftdruck angegeben?","a":"1. Isobaren.\n2. Hektopascal (hPa) oder vereinzelt auch noch Millibar (mb, teilweise auch mbar)."},{"id":"wetter-7","s":"wetter","n":7,"q":"Welche Gefahren kann ein Gewitter mit sich bringen?","a":"1. Böen bis Orkanstärke,\n2. plötzliche Winddrehungen,\n3. Regen- oder Hagelschauer mit zum Teil starker Sichtminderung,\n4. Blitzschlag."},{"id":"wetter-8","s":"wetter","n":8,"q":"Wann entstehen besonders starke Gewitter?","a":"Besonders zum Ende einer hochsommerlichen Schönwetterperiode im Zusammenhang mit Kaltfronten."},{"id":"wetter-9","s":"wetter","n":9,"q":"Welche Skala wird verwendet für die Angabe der Windrichtung in Seewetterberichten bei\n1. den Vorhersagen und Aussichten,\n2. den Stationsmeldungen?","a":"1. Die 8-teilige mit Auflösung in 45°-Stufen.\n2. Die 16-teilige mit Auflösung in 22,5°-Stufen."},{"id":"wetter-10","s":"wetter","n":10,"q":"Ab welcher Windstärke werden Orkanwarnungen ausgegeben?","a":"Ab Windstärke 10 Bft, erfahrungsgemäß mit Böen über Bft 12."},{"id":"wetter-11","s":"wetter","n":11,"q":"1. Welche Skala wird für die Schätzung der Windstärke verwendet?\n2. Was verstehen Sie unter mäßigem Wind, was unter Starkwind?","a":"1. Die 12-teilige Beaufortskala.\n2. Mäßiger Wind bedeutet Stärke 4 der Beaufortskala, Starkwind 6 und 7 Beaufort."},{"id":"wetter-12","s":"wetter","n":12,"q":"Welche amtlichen Veröffentlichungen enthalten Sendezeiten und Frequenzen für Seewetterberichte\n1. für Europa,\n2. Europa und weltweit?","a":"1. Das \"Handbuch Nautischer Funkdienst\" und der \"Jachtfunkdienst\".\n2. Die \"Admiralty List of Radio Signals\"."},{"id":"wetter-13","s":"wetter","n":13,"q":"Nennen Sie 6 Möglichkeiten, um Wetterinformationen an Bord zu erhalten.","a":"Hörfunksender (UKW, KW, MW, LW), Küstenfunkstellen, Verkehrszentralen, NAVTEX, SafetyNet (Satcom), Online - Dienste (z. B. SEEWIS - Online des Deutschen Wetterdienstes, T- Online), RTTY (Funkfernschreiben), Faskimile (Wetterfax), Faxpolling (z. B. SEEWIS-Fax des Deutschen Wetterdienstes), Telefonabruf, Törnberatung."},{"id":"wetter-14","s":"wetter","n":14,"q":"Welche Bedeutung für die Wetterentwicklung hat ein Halo um die Sonne und ein Hof um den Mond?","a":"Wolkenaufzug, meist Cirrostratus. Ggf. Niederschlag und Wetterverschlechterung."},{"id":"wetter-15","s":"wetter","n":15,"q":"Bei welchen Wolkenformen müssen Sie mit erhöhter Böigkeit rechnen?","a":"Bei Haufenwolken, besonders beim Cumulonimbus (Schauer- und Gewitterwolke)."},{"id":"wetter-16","s":"wetter","n":16,"q":"1. Welche Formen von Wolken gibt es?\n2. Nennen Sie 6 der 10 Haupttypen!","a":"1. Es gibt Haufenwolken und Schichtwolken.\n2. Cirrus, Cirrostratus, Cirrocumulus, Altostratus, Altocumulus, Nimbostratus, Stratocumulus, Stratus, Cumulus, Cumulonimbus."},{"id":"wetter-17","s":"wetter","n":17,"q":"1. Welche Höhen unterscheidet man bei Wolken?\n2. Welche Höhen haben sie etwa in den gemäßigten Breiten?","a":"1. Tiefe, mittelhohe und hohe Wolken.\n2. Tiefe Wolken zwischen 0 und 2 km, mittelhohe Wolken zwischen 2 und 7 km und hohe Wolken zwischen 7 und 13 km."},{"id":"wetter-18","s":"wetter","n":18,"q":"Woraus bestehen hohe Wolken?","a":"Aus kleinen Eiskristallen."},{"id":"wetter-19","s":"wetter","n":19,"q":"Woran erkennt man bei Wolkenbildung eine kräftige Gewitterentwicklung?","a":"Am Cumulonimbus, wenn er in großer Höhe einen ambossförmigen Schirm hat."},{"id":"wetter-20","s":"wetter","n":20,"q":"Welche Wolken kündigen oft schon vormittags kräftige Wärmegewitter an?","a":"Altocumulus castellanus (mittelhohe türmchenartige Haufenwolken)."},{"id":"wetter-21","s":"wetter","n":21,"q":"Wie verhält sich der Wind in Bodennähe auf der Nordhalbkugel zwischen Hoch- und Tiefdruckgebieten?","a":"Er weht rechtsherum aus dem Hochdruckzentrum heraus und linksherum in den Tiefdruckkern hinein."},{"id":"wetter-22","s":"wetter","n":22,"q":"1. Was ist eine Front?\n2. Welche Fronten unterscheidet man im Allgemeinen?","a":"1. Front ist die vordere Grenze einer Luftmasse in Bewegungsrichtung.\n2. Warm-, Kalt- und Okklusionsfronten."},{"id":"wetter-23","s":"wetter","n":23,"q":"Wie verhält sich typischerweise der Luftdruck\n1. vor,\n2. während und\n3. nach dem Durchzuug einer Kaltfront?","a":"1. Der Luftdruck ist gleichbleibend oder fälllt nur wenig.\n2. Während des Durchgangs der Front erreicht der Luftdruck seinen tiefsten Wert.\n3. Der Luftdruck steigt wieder deutlich an."},{"id":"wetter-24","s":"wetter","n":24,"q":"Was lässt sich aus der Darstellung der Isobaren in einer Wetterkarte erkennen?","a":"Windrichtung und Druckgefälle; je enger sie liegen, desto größer ist das Druckgefälle und desto stärker ist der Wind."},{"id":"wetter-25","s":"wetter","n":25,"q":"Warum weht der Wind nicht parallel zu den Isobaren? (Begründung)","a":"Durch die Bodenreibung ist der Wind rückgedreht (gegen den Uhrzeigersinn)."},{"id":"wetter-26","s":"wetter","n":26,"q":"1. Wie weht der Wind über See in Bodennähe um ein Tiefdruckgebiet?\n2. Mit wie viel Grad Änderung in der Windrichtung müssen Sie etwa rechnen?","a":"1. Der Wind weht nicht parallel zu den Isobaren, er ist rückgedreht und weht in das Tief hinein.\n2. Ein bis zwei Strich bzw. ca. 10° bis 20°."},{"id":"wetter-27","s":"wetter","n":27,"q":"1. Wie weht der Wind über See in Bodennähe um ein Hochdruckgebiet?\n2. Mit wie viel Grad Änderung in der Windrichtung müssen Sie etwa rechnen?","a":"1. Der Wind weht nicht parallel zu den Isobaren, er ist rückgedreht und weht aus dem Hoch hinaus.\n2. Ein bis zwei Strich bzw. 10° bis 20°."},{"id":"wetter-28","s":"wetter","n":28,"q":"Welche Verlagerungsgeschwindigkeiten haben Tiefdruckgebiete:\n1. schnelle,\n2. mittlere,\n3. langsame?","a":"1. Schnelle: 30 bis 50 kn.\n2. Mittlere: 15 bis 30 kn.\n3. Langsame: bis 15 kn."},{"id":"wetter-29","s":"wetter","n":29,"q":"Wie entstehen Tiefdruckgebiete?","a":"Durch das Aufeinandertreffen von kalten Luftmassen aus hohen Breiten und subtropischen warmen Luftmassen."},{"id":"wetter-30","s":"wetter","n":30,"q":"Welche Windverhältnisse herrschen in der Nähe des Zentrums eines Hochdruckgebiets?","a":"Meist schwache umlaufende Winde."},{"id":"wetter-31","s":"wetter","n":31,"q":"In welchem Abstand werden Isobaren international dargestellt oder gezeichnet?","a":"Im Abstand von 5 hPa oder im Abstand von 5 mbar.","ai":["img/q/960c96ba6911.png"]},{"id":"wetter-32","s":"wetter","n":32,"q":"Welche Sicht- und Wetterverhältnisse erwarten Sie typischerweise\n1. vor oder nahe der Warmfront,\n2. im Warmsektor,\n3. hinter der Kaltfront?","a":"1. Sichtverschlechterung durch Niederschlag, bedeckt, länger andauernder Regen.\n2. Diesig oder mäßige Sicht, Wolkenauflockerung, zeitweise Regen\n3. Sichtbesserung, meist gute Sicht. Schauer mit zum Teil kräftigen Böen."},{"id":"wetter-33","s":"wetter","n":33,"q":"Welche Windrichtungen erwarten Sie an den Punkten 1, 2, 3, 4, 5 eines Tiefdruckgebiets auf der Nordhalbkugel?","a":"1. Nordost.\n2. Süd.\n3. Südwest.\n4. Nordwest.\n5. Umlaufender Wind."},{"id":"wetter-34","s":"wetter","n":34,"q":"Um welche Arten von Fronten handelt es sich in der Abbildung, die mit 1, 2 und 3 bezeichnet sind?","a":"1. Okklusionsfront (Tiefausläufer).\n2. Warmfront.\n3. Kaltfront.","qi":["img/q/d479e8360d2e.png"]},{"id":"wetter-35","s":"wetter","n":35,"q":"1. Was sind Luftmassengrenzen?\n2. Welche Luftmassengrenzen kennen Sie? Nennen Sie mindestens 2 Beispiele.","a":"1. Luftmassengrenzen sind Fronten. Sie trennen Luftmassen mit unterschiedlicher Temperatur und Luftfeuchtigkeit.\n2. Kaltfront, Warmfront, Okklusion."},{"id":"wetter-36","s":"wetter","n":36,"q":"Mit welchen lokalen Windsystemen müssen Sie insbesondere im Mittelmeer rechnen?","a":"Mit der Land-/Seewind-Zirkulation."},{"id":"wetter-37","s":"wetter","n":37,"q":"Nennen Sie mindestens 3 regionale Windsysteme im Mittelmeer, die beim küstennahen Segeln im Mittelmeer besonders beachtet werden müssen.","a":"Mistral, Scirocco, Bora und Etesien/Meltemi."},{"id":"wetter-38","s":"wetter","n":38,"q":"Mit welchem regionalen Windsystem muss in der Adria gerechnet werden?","a":"Mit Bora."},{"id":"wetter-39","s":"wetter","n":39,"q":"Mit welchem regionalen Windsystem muss in der Ägäis gerechnet werden?","a":"Mit den Etesien/dem Meltemi."},{"id":"wetter-40","s":"wetter","n":40,"q":"Wo bilden sich Tröge um ein Tiefdruckgebiet?","a":"Auf der Rückseite von Tiefdruckgebieten in hochreichender Kaltluft. Ein Trog folgt typischerweise einer Kaltfront."},{"id":"wetter-41","s":"wetter","n":41,"q":"Welche Front wird auch als \"Ausläufer\" bezeichnet?","a":"Die Okklusion."},{"id":"wetter-42","s":"wetter","n":42,"q":"Wodurch und wie entsteht am Tage Seewind?","a":"Das Land erwärmt sich bei Sonneneinstrahlung tagsüber stärker als das Wasser. Über Land steigt die erwärmte Luft auf. Das dabei entstehende Bodentief wird durch Seewind (Wind von See) aufgefüllt."},{"id":"wetter-43","s":"wetter","n":43,"q":"Welche Wolkenform zeigt sich am späten Vormittag über Land am Himmel und kündigt Seewind an?","a":"Haufenwolke (Cumulus)."},{"id":"wetter-44","s":"wetter","n":44,"q":"Welche Windgeschwindigkeiten in Knoten oder Beaufort erreicht der Seewind etwa\n1. im Mittelmeer,\n2. in Nord- und Ostsee?","a":"1. Bis zu 25 kn oder Bft 6.\n2. Bis 15 kn, in Einzelfällen bis 20 kn oder Bft 4/5, in Einzelfällen Bft 5/6."},{"id":"wetter-45","s":"wetter","n":45,"q":"Zu welcher Tageszeit müssen Sie mit Seewind rechnen?","a":"Von Mittag bis zum frühen Abend."},{"id":"wetter-46","s":"wetter","n":46,"q":"Welche Windänderung kann der einsetzende Seewind bewirken?","a":"Er verändert den vorher wehenden Wind zum Teil erheblich in Richtung und Stärke."},{"id":"wetter-47","s":"wetter","n":47,"q":"Wodurch und wie entsteht nachts Landwind?","a":"Das Land kühlt sich bei geringer Bewölkung stark ab. Das Wasser ändert seine Temperatur an der Oberfläche dagegen nur geringfügig. Über dem Wasser steigt daher erwärmte Luft auf. Das dabei entstehende Bodentief wird durch Landwind (Wind von Land) aufgefüllt."},{"id":"wetter-48","s":"wetter","n":48,"q":"Welche Windgeschwindigkeiten erreicht nachts der Landwind?","a":"Er weht allgemein schwächer als der Seewind, etwa 1 bis 10 kn oder Bft 1-3."},{"id":"wetter-49","s":"wetter","n":49,"q":"Wann müssen Sie im Laufe eines Tages mit Landwind rechnen?","a":"Von Mitternacht bis zum frühen Morgen."},{"id":"wetter-50","s":"wetter","n":50,"q":"Im Internet finden Sie auf einer \"Wetterseite\" eine Vorhersagekarte mit Windpfeilen. In welcher Höhe über dem Erdboden/der Wasseroberfläche gelten die vorhergesagten Windgeschwindigkeiten?","a":"Meistens etwa 10 Meter über dem Erdboden/der Wasseroberfläche."},{"id":"wetter-51","s":"wetter","n":51,"q":"Sie segeln mit Ihrer Yacht \"raumschots\". Nach der nächsten Tonne müssen Sie anluven. Wie wird sich die wahre Windgeschwindigkeit auf Ihrem Windmesser/Anemometer entwickeln?","a":"Sie bleib unverändert."},{"id":"wetter-52","s":"wetter","n":52,"q":"Welche Windsituation ist mit der Formulierung \"Nordwest 6\" bezüglich\n1. der Schwankungsbreite in Windrichtung und\n2. der Schwankungsbreite in der Windstärke (Böen) verbunden?","a":"1. Die Schwankung in der Windrichtung kann bis zu 45° um die Hauptwindrichtung betragen, also von Westnordwest (WNW) bis Nordnordwest (NNW).\n2. Es können Böen auftreten, die etwa 1 bis 2 Bft über dem Mittelwind liegen."},{"id":"wetter-53","s":"wetter","n":53,"q":"Was ist mit dem Zusatz \"Schauerböen\" bei der Windvorhersage verbunden?","a":"Besonders während der Passage und auf der Rückseite von Kaltfronten treten in der näheren Umgebung von Schauern Böen auf, die den Mittelwind um 2 Bft überschreiten können."},{"id":"wetter-54","s":"wetter","n":54,"q":"Warum werden Gewitterböen in der Windvorhersage zusätzlich angegeben?","a":"Besonders im Sommer können bei Schwachwindlagen Gewitter mit Böen auftreten, die Sturm- oder Orkanstärke erreichen können."},{"id":"wetter-55","s":"wetter","n":55,"q":"Wie ist der Aufbau von Seewetterberichten?","a":"Hinweise auf Starkwind oder Sturm, Wetterlage, Vorhersagen, Aussichten und Stationsmeldungen."},{"id":"wetter-56","s":"wetter","n":56,"q":"Welche lokalen Effekte, die das vorherrschende Windfeld stark verändern, können in Seewetterberichten nur eingeschränkt berücksichtigt werden? U. a.","a":"Land-/Seewind-Zirkulation, Düsen- und Kapeffekte."},{"id":"wetter-57","s":"wetter","n":57,"q":"1. Wann werden Starkwindwarnungen verbreitet?\n2. Welche Bezeichnung hat die Starkwindwarnung im internationalen Sprachgebrauch?","a":"1. Bei erwarteten oder noch andauernden Windstärken zwischen 6 und 7 Bft.\n2. Near-gale warning."},{"id":"wetter-58","s":"wetter","n":58,"q":"1. Wann werden Sturmwarnungen verbreitet?\n2. Welche Bezeichnung hat die St
