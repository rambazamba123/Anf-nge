<!DOCTYPE html>
<html lang="de" data-day="tag">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3426">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Skipper – SBF See</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe9e6; --paper:#fbf6ec; --paper-edge:#e7dbc4; --ink:#2a2019; --muted:#6c5f52; --line:#e1d5bf;
  --wood:#4a3426; --wood-d:#33241a; --lamp:#f0b53e; --sea:#2d5f6a; --sea-ink:#f7f1e3;
  --stb:#3c8c5a; --stb-soft:#dcefe2; --bb:#c2473b; --bb-soft:#f7dfda;
  --hfont:"Baloo 2","Trebuchet MS",sans-serif; --bfont:"Nunito","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html[data-day="morgen"]{--bg:#e4ebee}
html[data-day="abend"]{--bg:#ecdfd2}
html[data-day="nacht"]{--bg:#15212a; --paper:#22303a; --paper-edge:#2f414d; --ink:#f1e8d8; --muted:#a9b3b6; --line:#344854;
  --sea:#3d7c88; --stb:#5bb37c; --stb-soft:#1d3a2a; --bb:#e0675c; --bb-soft:#3e2320}
html[data-theme="hell"]{--bg:#dfe9e6; --paper:#fbf6ec; --paper-edge:#e7dbc4; --ink:#2a2019; --muted:#6c5f52; --line:#e1d5bf; --sea:#2d5f6a; --stb:#3c8c5a; --stb-soft:#dcefe2; --bb:#c2473b; --bb-soft:#f7dfda}
html[data-theme="dunkel"]{--bg:#15212a; --paper:#22303a; --paper-edge:#2f414d; --ink:#f1e8d8; --muted:#a9b3b6; --line:#344854; --sea:#3d7c88; --stb:#5bb37c; --stb-soft:#1d3a2a; --bb:#e0675c; --bb-soft:#3e2320}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.55 var(--bfont);-webkit-font-smoothing:antialiased;transition:background .6s}
h1,h2,h3{font-family:var(--hfont);font-weight:700;line-height:1.1;margin:0 0 .35em;letter-spacing:-.005em}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 .8em}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:.9rem}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;border-radius:14px;padding:.75em 1.15em;background:var(--sea);color:var(--sea-ink);font-weight:700;min-height:50px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.lamp{background:var(--lamp);color:#3a2610}
.btn.wide{width:100%}
.btn.small{min-height:40px;padding:.4em .9em;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:default}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
/* Logbuch-Papier */
.card{background:var(--paper);border:1px solid var(--paper-edge);border-radius:18px;padding:16px 16px 14px;margin:0 0 14px}
.card h3{margin-bottom:.4em}
label{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:.7em .8em;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--sea)}
textarea{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.45em .9em;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--sea);background:var(--sea);color:var(--sea-ink)}
.status{min-height:1.4em;font-size:.92rem;margin:8px 0 0}
.status.ok{color:var(--stb)} .status.err{color:var(--bb)}

/* ---------- Szenen ---------- */
.scene{position:relative;margin:0 -16px 14px;aspect-ratio:4/3;overflow:hidden;background:var(--skyT)}
.scene svg{display:block;width:100%;height:100%}
@media (min-width:600px){.scene{margin:12px 0 14px;border-radius:22px}}
.hs{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px 6px 8px;min-height:36px;background:rgba(255,250,240,.95);color:#2a2019;font:700 .88rem var(--bfont);box-shadow:0 2px 0 rgba(42,32,25,.18)}
.hs.left{transform:translate(-100%,-50%)}
.hs i{width:11px;height:11px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 3px rgba(240,181,62,.35)}
.scene.hub{aspect-ratio:10/9}
.spot{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:3px 9px;min-height:26px;background:rgba(255,250,240,.88);color:#2a2019;font:700 .74rem var(--bfont);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.spot.l{transform:translate(0,-50%)} .spot.r{transform:translate(-100%,-50%)}
.cabin .ch{cursor:pointer}
.wx-tag{position:absolute;left:10px;bottom:8px;font-size:.75rem;font-weight:700;color:#fff;background:rgba(20,30,40,.35);padding:2px 9px;border-radius:999px}
/* Himmel, Wetter */
.stars{opacity:0;transition:opacity 1s} [data-day="nacht"] .stars{opacity:1}
.moon-cut{opacity:0} [data-day="nacht"] .moon-cut{opacity:1}
[data-wx="regen"] .sky-o,[data-wx="sturm"] .sky-o,[data-wx="nebel"] .sky-o{opacity:.25}
.rain,.fog{display:none}
[data-wx="regen"] .rain,[data-wx="sturm"] .rain{display:inline}
[data-wx="nebel"] .fog{display:inline}
.port-rain{display:none} [data-wx="regen"] .port-rain,[data-wx="sturm"] .port-rain{display:inline}
[data-wx="nebel"] .port-fog{opacity:.55}
.lh .beam{opacity:0} [data-day="nacht"] .lh .beam,[data-day="abend"] .lh .beam{animation:beam 6s linear infinite}
[data-day="nacht"] .navl{filter:drop-shadow(0 0 3px currentColor)}
.navl.red{color:#ff5a4a} .navl.white{color:#fff6c8}
[data-day="nacht"] .glow{opacity:1.6} .cabin[data-day="tag"] .glow{opacity:.55}
  .stage .lh .beam{display:none}
@keyframes beam{0%,100%{opacity:0}45%,55%{opacity:.22}}
@media (prefers-reduced-motion:no-preference){
  .wv{animation:wvx 7s linear infinite}
  .w2{animation-duration:9s} .w3{animation-duration:11s}
  [data-wx="windig"] .wv,[data-wx="sturm"] .wv{animation-duration:2.6s}
  [data-wx="windig"] .w3,[data-wx="sturm"] .w3{animation-duration:3.4s}
  .pw{animation:wvx 5s linear infinite} [data-wx="windig"] .pw,[data-wx="sturm"] .pw{animation-duration:1.8s}
  .clouds{animation:drift 40s ease-in-out infinite alternate}
  [data-wx="windig"] .clouds,[data-wx="sturm"] .clouds{animation-duration:9s}
  .rocker{transform-box:fill-box;transform-origin:50% 90%;animation:bob 5s ease-in-out infinite}
  [data-wx="windig"] .rocker{animation:rock 4.2s ease-in-out infinite}
  [data-wx="sturm"] .rocker{animation:rock2 3.2s ease-in-out infinite}
  .cabin .rocker{animation:none}
  .cabin[data-wx="windig"] .rocker{animation:rockS 5s ease-in-out infinite}
  .cabin[data-wx="sturm"] .rocker{animation:rockS 3.6s ease-in-out infinite}
  .lamp-sw{transform-box:view-box;transform-origin:200px 0;animation:swing 5s ease-in-out infinite}
  [data-wx="windig"] .lamp-sw,[data-wx="sturm"] .lamp-sw{animation-duration:2.8s}
  .flag{transform-box:fill-box;transform-origin:0 50%;animation:flap 1.6s ease-in-out infinite}
  [data-wx="windig"] .flag,[data-wx="sturm"] .flag{animation-duration:.45s}
  .buoy{animation:buoy 3.4s ease-in-out infinite}
  .fall{animation:fall .7s linear infinite} .stage .fall{animation:fall2 .9s linear infinite}
  .fog rect{animation:fogx 30s ease-in-out infinite alternate} .fog .f2{animation-duration:42s}
  .steam{animation:steam 3s ease-in-out infinite}
  .ch .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
  .ch[data-ch="smilla"] .eyes,.ch[data-ch="piet"] .eyes{animation-duration:6.1s;animation-delay:-2s}
  .ch[data-ch="klabauter"] .eyes,.ch[data-ch="backbord"] .eyes{animation-duration:3.9s;animation-delay:-1s}
  .ch[data-ch="kroeger"] .eyes{animation-duration:7.3s}
  .ch.talking .bod{transform-box:fill-box;transform-origin:50% 100%;animation:talkbob .3s ease-in-out infinite alternate}
  .ch[data-ch="backbord"] .glow{animation:pulse 2s ease-in-out infinite}
  .crab{animation:none} .crab>*{} .mouse{transform-box:fill-box;animation:peek 9s ease-in-out infinite}
  .ch .smoke{transform-box:fill-box;transform-origin:50% 100%;animation:smoke 4s ease-in-out infinite}
}
@keyframes wvx{to{transform:translateX(-50px)}}
@keyframes drift{to{transform:translateX(36px)}}
@keyframes bob{50%{transform:translateY(1.5px)}}
@keyframes rock{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg) translateY(2px)}}
@keyframes rock2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3.2deg) translateY(3px)}}
@keyframes rockS{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.7deg)}}
@keyframes swing{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.4deg)}}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82) skewY(4deg)}}
@keyframes buoy{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes fall{to{transform:translate(-26px,300px)}}
@keyframes fall2{to{transform:translate(-40px,640px)}}
@keyframes fogx{to{transform:translateX(90px)}}
@keyframes steam{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.7;transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes talkbob{to{transform:translateY(-1.8px)}}
@keyframes pulse{50%{opacity:.5}}
@keyframes scurry{0%,80%,100%{transform:translateX(0)}88%{transform:translateX(-14px)}94%{transform:translateX(6px)}}
@keyframes peek{0%,70%,100%{transform:translateY(0)}78%,92%{transform:translateY(-5px)}}
@keyframes smoke{0%{transform:translateY(3px);opacity:.2}50%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
/* Figuren */
.ch .mouth .o{transform-box:fill-box;transform-origin:center;transform:scaleY(.2);opacity:0}
.ch.talking .mouth .o{opacity:1;animation:yap .17s ease-in-out infinite alternate}
.ch.talking .mouth .c{opacity:0}
@keyframes yap{from{transform:scaleY(.25)}to{transform:scaleY(1.1)}}
.gaze{transition:transform .5s}
.look-r .gaze{transform:translateX(2.6px)} .look-l .gaze{transform:translateX(-2.6px)}
.actor{transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.tilt-r{transform:rotate(5deg)} .tilt-l{transform:rotate(-5deg)}
.hopper{transform-box:fill-box;transform-origin:50% 100%}
.hop{animation:hop .55s ease-out}
@keyframes hop{40%{transform:translateY(-16px)}}
svg.ch{display:block}
/* Sprechblase */
.bubble{pointer-events:none;position:absolute;top:3%;left:4%;max-width:74%;background:#fffaf0;color:#2a2019;border-radius:16px;padding:7px 12px 9px;font-size:.95rem;line-height:1.35;box-shadow:0 3px 0 rgba(42,32,25,.18);z-index:3}
.bubble.right{left:auto;right:4%}
.bubble b{display:block;font:700 .9rem var(--hfont);color:var(--who,#2a2019)}
.bubble span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bubble::after{content:"";position:absolute;bottom:-9px;left:var(--tail,22%);border:9px solid transparent;border-top-color:#fffaf0;border-bottom:0}
/* ---------- Intro / Startbild ---------- */
.stage{position:fixed;inset:0;z-index:40;background:var(--skyT);overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
#cam{transform-box:view-box;transform-origin:200px 520px;transform:scale(.42) translateY(-470px)}
@media (prefers-reduced-motion:no-preference){#cam{transition:transform 10s cubic-bezier(.35,.1,.25,1)}}
#cam.near{transform:none}
.stage .bubble{top:calc(env(safe-area-inset-top,0px) + 6%);max-width:84%;font-size:1.05rem}
.stage .skip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:4}
.overlay{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent 30%,rgba(18,24,30,.55))}
.overlay .panel{background:var(--paper);color:var(--ink);border-radius:22px;padding:18px;max-width:520px;margin:0 auto;width:100%}
.title{font:700 3.4rem/0.95 var(--hfont);color:#fffaf0;text-shadow:0 3px 0 rgba(0,0,0,.18);margin:0 0 6px}
.splash .lead{color:#fffaf0;font-weight:700;margin:0 0 18px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.tapzone{position:fixed;inset:0;z-index:44;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));background:rgba(18,24,30,.18);border:0;width:100%}
.tapzone span{background:#fffaf0;color:#2a2019;font:700 1.1rem var(--hfont);padding:12px 22px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.tapzone span{animation:breathe 2.4s ease-in-out infinite}}
@keyframes breathe{50%{transform:scale(1.05)}}
details summary{cursor:pointer;font-weight:700}
/* ---------- Kurs bis zur Prüfung ---------- */
.course{display:flex;gap:14px;align-items:center;margin:0 0 6px}
.course .big{font:700 3rem/0.9 var(--hfont)}
.track{position:relative;height:40px;margin:10px 0 2px}
.track .ln{position:absolute;left:0;right:12px;top:22px;border-top:2px dashed var(--line)}
.track .done{position:absolute;left:0;top:21px;height:4px;background:var(--lamp);border-radius:2px}
.track .boatI{position:absolute;top:2px;width:30px;height:30px;margin-left:-15px}
.track .goal{position:absolute;right:-4px;top:6px;width:22px;height:26px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.today b{font:700 1.5rem var(--hfont)}
/* ---------- Quiz ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 10px}
.tag{font-size:.82rem;color:var(--muted);font-weight:600}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--sea);transition:width .3s}
.qtext{font-size:1.12rem;font-weight:700;margin-bottom:12px}
.qimg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.qimg img{border-radius:10px;border:1px solid var(--line);background:#fff;max-height:200px}
.sig{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.sig .tones{font-size:1.5rem;letter-spacing:.14em;font-weight:700}
.sig .tones .on{color:var(--lamp)}
.ans{display:block;width:100%;text-align:left;padding:.8em 1em;margin:0 0 8px;border:2px solid var(--line);border-radius:14px;background:var(--paper);line-height:1.4;color:var(--ink)}
.ans.ok{border-color:var(--stb);background:var(--stb-soft)}
.ans.no{border-color:var(--bb);background:var(--bb-soft)}
.ans[aria-pressed="true"]{border-color:var(--sea);box-shadow:inset 0 0 0 1px var(--sea)}
.ans:disabled{cursor:default}
.fb{margin-top:6px}
.diff{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:.95rem}
.diff mark{background:none;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.diff .w mark{color:var(--bb)} .diff .r mark{color:var(--stb)}
.crewrow{display:flex;align-items:flex-end;gap:8px;min-height:58px;margin:6px 0 0}
.crewrow svg{width:46px;height:auto}
.crewrow .say{flex:1;font-size:.9rem;background:var(--paper);border:1px solid var(--paper-edge);border-radius:12px 12px 12px 4px;padding:6px 10px;align-self:center}
.lesson p{font-size:1.04rem}
.lesson ul{padding-left:1.2em;margin:0 0 .8em}
.fact{border-left:4px solid var(--lamp);padding:.4em .9em;margin:.6em 0 1em;background:var(--bg);border-radius:0 10px 10px 0}
.think{color:var(--muted);font-style:italic}
.exambar{display:flex;align-items:center;gap:12px;margin:14px 0 10px}
.exambar svg{width:52px;height:auto;flex:none}
.exambar .time{font:700 1.6rem var(--hfont);margin-left:auto}
.exambar .time.low{color:var(--bb)}
.result{display:flex;gap:14px;align-items:center}
.result svg{width:96px;height:auto;flex:none}
.result .big{font:700 2.6rem/1 var(--hfont)}
.pass{color:var(--stb)} .fail{color:var(--bb)}
/* ---------- Kajüte ---------- */
.talkbar{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.micbig{width:68px;height:68px;border-radius:50%;border:0;background:var(--lamp);color:#3a2610;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.micbig svg{width:30px;height:30px}
.micbig.on{background:var(--bb);color:#fff}
@media (prefers-reduced-motion:no-preference){.micbig.on{animation:ring 1.3s infinite}}
@keyframes ring{50%{box-shadow:0 0 0 10px rgba(194,71,59,.22)}}
.talkstate{flex:1;font-weight:700;line-height:1.3}
.talkstate small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.interim{font-style:italic;color:var(--muted);min-height:1.3em;margin:-4px 0 10px}
.log{display:flex;flex-direction:column;gap:8px}
.log .l{padding:8px 12px;border-radius:14px;background:var(--paper);border:1px solid var(--paper-edge);max-width:92%}
.log .l b{font:700 .9rem var(--hfont);display:block}
.log .l.u{align-self:flex-end;background:var(--sea);color:var(--sea-ink);border-color:transparent}
.composer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 12px;z-index:6;border-top:1px solid var(--line)}
.composer .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:120px;flex:1;padding:.6em .8em}
.stories .st{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.stories .st:first-child{border-top:0}
.line{display:flex;gap:10px;margin:0 0 8px;padding:6px 8px;border-radius:12px}
.line.now{background:var(--bg)}
.line .who{flex:0 0 76px;font:700 .95rem var(--hfont)}
/* ---------- Navigation (Planken) ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--wood);background-image:repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.18) 118px 120px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;min-height:66px;color:#e9dcc4;font:700 .82rem var(--bfont);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--lamp)}
nav.tabs svg{width:26px;height:26px}
/* Einstellungen */
.set h2{margin-top:22px}
.voice-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.voice-row:first-of-type{border-top:0}
.voice-row svg{width:52px;height:auto}
.crewpick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.crewpick button{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:10px;text-align:left;color:var(--ink)}
.crewpick button[aria-pressed="true"]{border-color:var(--sea);box-shadow:inset 0 0 0 1px var(--sea)}
.crewpick svg{width:64px;height:auto;margin:0 auto 4px}
.crewpick b{font:700 1rem var(--hfont);display:block}
.crewpick small{color:var(--muted);display:block;line-height:1.3}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin-top:5px}
.bar .m{background:var(--stb)} .bar .l{background:var(--lamp)}
.topic{margin:0 0 12px}

sser“ und Internationales Signalbuch.","Internationales Signalbuch und Verordnung über die Sicherung der Seefahrt."]},{"n":59,"q":"Unter welchen Voraussetzungen darf ein Sportboot mit Elektromotor ohne Fahrerlaubnis geführt werden?","a":["Die Antriebsleistung beträgt höchstens 7,5 Kilowatt Betriebsart S1 (Dauerbetrieb).","Es darf immer ohne Fahrerlaubnis geführt werden, unabhängig von der Antriebsleistung.","Bis zu einer Antriebsleistung von 11,03 Kilowatt Betriebsart S1 (Dauerbetrieb).","Es darf nie ohne Fahrerlaubnis geführt werden, unabhängig von der Antriebsleistung."]},{"n":60,"q":"Welche Vorkehrungen sind für das längere Verlassen des Fahrzeugs zu treffen?","a":["Alle Seeventile schließen und den Hauptschalter des Bordnetzes ausschalten.","Kraftstoff- und Wassertank auffüllen und das Bordnetz aufladen.","Tagestank schließen und Kraftstofffilter entwässern.","Fahrzeug seefest hinterlassen und den Hafenmeister verständigen."]},{"n":61,"q":"Wie ist ein enges Gewässer zu befahren, wenn man sich am Ufer festgemachten Fahrzeugen nähert?","a":["Verringerung der Geschwindigkeit, um schädlichen Sog und Wellenschlag zu vermeiden.","Beibehaltung der Geschwindigkeit, um durch Gleitfahrt schädlichen Sog und Wellenschlag auszuschließen.","Verringerung der Geschwindigkeit und nötigenfalls vom Rechtsfahrgebot abweichen.","Auf Höhe der festgemachten Fahrzeuge aufstoppen und überprüfen, dass kein Dritter behindert oder geschädigt wird."]},{"n":62,"q":"Wo sollen die Gasbehälter einer Flüssiggasanlage gelagert werden?","a":["Möglichst an Deck, geschützt vor Sonneneinstrahlung, sonst in einem besonders abgeschlossenen Raum für Gasbehälter, der in Bodenhöhe eine Öffnung nach außenbords hat.","Möglichst unten im Schiff, geschützt vor Sonneneinstrahlung, sonst in einem besonders abgeschlossenen Raum für Gasbehälter, der in Bodenhöhe eine Öffnung nach außenbords hat.","Möglichst auf dem Vorschiff, geschützt vor Sonneneinstrahlung, sonst in einem besonders abgeschlossenen Raum für Gasbehälter, der in Bodenhöhe eine Öffnung nach außenbords hat.","Möglichst an Deck, geschützt vor Sonneneinstrahlung, sonst in einem besonders abgeschlossenen Raum für Gasbehälter, der oben belüftet ist."]},{"n":63,"q":"Warum sind die Flüssiggase Propan und Butan an Bord besonders gefährlich?","a":["Beide Gase sind schwerer als Luft und bilden mit Luft ein explosives Gemisch.","Beide Gase sind leichter als Luft und bilden mit Luft ein explosives Gemisch.","Beide Gase sind schwerer als Wasser und bilden mit Wasser ein explosives Gemisch.","Beide Gase sind schwerer als Luft und bilden mit Wasser ein explosives Gemisch."]},{"n":64,"q":"Was ist zu tun, wenn Flüssiggas in das Innere des Bootes gelangt?","a":["Gaszuführung absperren und für Lüftung sorgen. Außerdem keine elektrischen Schalter betätigen und keinen Funk und keine Mobiltelefone benutzen.","Gasleitung entleeren und für Lüftung sorgen. Außerdem keine elektrischen Schalter betätigen und keine Telefone benutzen.","Gaszuführung absperren und für Lüftung sorgen. Außerdem keine elektrischen Schalter betätigen und per Telefon Hilfe holen.","Gasleitung entleeren und die Gasfreiheit mit dem Feuerzeug prüfen sowie über Funk oder Mobiltelefon Hilfe anfordern."]},{"n":65,"q":"Was ist vor Inbetriebnahme einer Flüssiggasanlage zu prüfen?","a":["Die Anlage muss abgenommen sein, Leitungen und Anschlüsse müssen dicht sein. Haupthahn und andere Absperrventile sind zu öffnen.","Die Anlage muss abgenommen sein, die Inbetriebnahme darf nur durch eine besonders geprüfte Person erfolgen.","Die Anlage muss abgenommen sein und jährlich überprüft werden. Die Inbetriebnahme darf nur durch eine besonders geprüfte Person erfolgen.","Die Abnahme der Anlage darf nicht länger als drei Jahre zurückliegen. Haupthahn und andere Absperrventile sind zu öffnen."]},{"n":66,"q":"Was ist zu beachten, wenn eine Flüssiggasanlage außer Betrieb gesetzt wird?","a":["Haupthahn und Absperrventile sind zu schließen.","Die Anlage ist gasfrei zu machen.","Gasflasche fachgerecht entsorgen.","Der Flüssiggasbehälter ist vollständig zu entleeren."]},{"n":67,"q":"Wie oft muss man aufblasbare Rettungsmittel warten lassen?","a":["Entsprechend der Herstellerangabe, mindestens alle 2 Jahre.","Jährlich und nach jedem Einsatz oder Übungsgebrauch.","Entsprechend der Herstellerangabe, mindestens alle 3 Jahre.","Jährlich, jeweils vor Beginn der Wassersportsaison."]},{"n":68,"q":"Welcher Feuerlöscher ist für Sportboote zweckmäßig und wie oft muss man einen Feuerlöscher überprüfen lassen?","a":["ABC-Pulver- und Schaumlöscher, mindestens alle 2 Jahre.","Feuerlöscher mit Löschschaum, mindestens einmal pro Jahr.","CO2-Feuerlöscher, mindestens alle 2 Jahre.","ABC-Pulverlöscher, mindestens einmal pro Jahr."]},{"n":69,"q":"Welche Maßnahmen muss man ergreifen, um einen Brand mit dem Feuerlöscher wirksam zu bekämpfen?","a":["Luftzufuhr verhindern, Feuerlöscher erst am Brandherd einsetzen und das Feuer möglichst von unten bekämpfen.","Rauchabzug sicherstellen und Feuerlöscher rechtzeitig einsetzen, dabei den Löschstrahl möglichst in die lodernden Flammen halten.","Luftzufuhr verhindern und den Feuerlöscher mit sparsamen Löschstrahlstößen einsetzen, dabei das Feuer möglichst von oben bekämpfen.","Handhabungshinweise durchlesen und den Feuerlöscher sofort einsetzen, dabei das Feuer möglichst von unten bekämpfen."]},{"n":70,"q":"Wie hat man sich nach einem Zusammenstoß zu verhalten?","a":["Hilfe leisten und so lange am Unfallort bleiben, bis ein weiterer Beistand nicht mehr erforderlich ist; alle erforderlichen Daten austauschen.","Hilfe leisten und so lange am Unfallort bleiben, bis ein weiterer Beistand nicht mehr erforderlich ist; die Wasserschutzpolizei benachrichtigen.","Hilfe leisten und so lange am Unfallort bleiben, bis ein weiterer Beistand nicht mehr erforderlich ist; Notsignal geben.","Hilfe leisten und so lange am Unfallort bleiben, bis ein weiterer Beistand nicht mehr erforderlich ist; Verschlusszustand herstellen."]},{"n":71,"q":"Welche Faktoren sind hauptsächlich für das Wettergeschehen, also für Wind und Niederschläge, ausschlaggebend?","a":["Luftdruckänderung, Luftfeuchtigkeit und Temperatur.","Luftdruckänderung, Sonneneinstrahlung und Höhenlage.","Luftdruckänderung, Luftfeuchtigkeit und Jahreszeit.","Luftdruckänderung, Tageszeit und Temperatur."]},{"n":72,"q":"In welcher Situation dürfen Notsignale gegeben werden?","a":["Wenn Gefahr für Leib oder Leben von Personen besteht und daher Hilfe benötigt wird.","Wenn Gefahr für Leib oder Leben von Personen besteht oder das Schiff nicht mehr sicher manövriert werden kann.","Wenn Gefahr für Leib oder Leben von Personen oder erhebliche Sachwerte besteht und daher Hilfe benötigt wird.","Wenn Gefahr für Leib oder Leben von Personen, erhebliche Sachwerte oder die maritime Umwelt besteht."]},{"n":73,"q":"Wo gelten die Kollisionsverhütungsregeln (KVR)?","a":["Auf der Hohen See und auf den mit dieser zusammenhängenden, von Seeschiffen befahrbaren Gewässern.","Auf der Hohen See und den deutschen Seeschifffahrtsstraßen, die von Seeschiffen befahren werden.","Auf den Seeschifffahrtsstraßen und den küstennahen deutschen Seegewässern, die von Seeschiffen befahren werden.","Auf der Hohen See und den von Seeschiffen befahrbaren Randmeeren, mit Ausnahme der Verkehrstrennungsgebiete."]},{"n":74,"q":"Was gilt, wenn eine Bestimmung der Seeschifffahrtsstraßen-Ordnung (SeeSchStrO) mit den Kollisionsverhütungsregeln (KVR) im Widerspruch steht?","a":["Die Vorschrift der Seeschifffahrtsstraßen-Ordnung.","Die Vorschrift der Kollisionsverhütungsregeln (KVR).","Die Grundregeln für das Verhalten im Verkehr.","Die Vorschrift der Schifffahrtsordnung Emsmündung."]},{"n":75,"q":"Welche Sportboote sind von der Fahrerlaubnispflicht auf den Seeschifffahrtsstraßen ausgenommen?","a":["Sportboote ohne Antriebsmaschine oder solche mit einer größten, nicht überschreitbaren Nutzleistung von 11,03 Kilowatt (15 PS) bei Verwendung eines Verbrennungsmotors bzw. 7,5 Kilowatt bei Verwendung eines Elektromotors Betriebsart S1 (Dauerbetrieb) oder weniger.","Sportboote unter Segel mit einer Rumpflänge unter 20 m und solche deren Antriebsmaschine nicht benutzt wird.","Sportboote mit Antriebsmaschine mit einer größeren Nutzleistung als 11,03 Kilowatt (15 PS) bei Verwendung eines Verbrennungsmotors bzw. 7,5 Kilowatt bei Verwendung eines Elektromotors Betriebsart S1 (Dauerbetrieb).","Sportboote, die entweder vor Anker liegen oder an Land festgemacht sind oder auf Grund sitzen."]},{"n":76,"q":"Wer ist für die Befolgung der Verkehrsvorschriften verantwortlich?","a":["Der Fahrzeugführer oder sein Stellvertreter.","Der Fahrzeugführer und sein Stellvertreter.","Der Fahrzeugführer und jeder sonst Verantwortliche.","Der Fahrzeugführer oder jeder sonst Verantwortliche."]},{"n":77,"q":"Was bedeutet \"seemännische Sorgfaltspflicht\"?","a":["Die Verpflichtung zur Beachtung von Vorsichtsmaßregeln über die Verkehrsvorschriften hinaus, die Seemannsbrauch oder besondere Umstände des Falles erfordern.","Die Verpflichtung zur Beachtung der Seeschifffahrtsstraßen-Ordnung (SeeSchStrO), der Kollisionsverhütungsregeln (KVR), der Grundregeln für das Verhalten im Verkehr und der Ausweichregeln mit dem Manöver des letzten Augenblicks.","Die Verpflichtung zur Beachtung der Vorsichtsmaßregeln und Sicherheitsregeln der Verkehrsvorschriften und der Grundregeln für das Verhalten im Verkehr.","Die Verpflichtung zur Beachtung von Vorsichtsmaßregeln der Kollisionsverhütungsregeln (KVR), der Grundregeln für das Verhalten im Verkehr und der Ausweichregeln mit dem Manöver des letzten Augenblicks."]},{"n":78,"q":"Welche Sicherheitsmaßnahmen hat der Fahrzeugführer im Rahmen seiner seemännischen Sorgfaltspflicht vor Fahrtantritt zum Schutze und für die Sicherheit der Personen an Bord zu treffen?","a":["Der Fahrzeugführer hat die Besatzungsmitglieder und Gäste über die Sicherheitsvorkehrungen an Bord zu unterrichten, in die Handhabung der Rettungs- und Feuerlöschmittel einzuweisen und auf geeignete Maßnahmen gegen das Überbordfallen hinzuweisen, zudem darauf, dass ständig angelegte Rettungswesten die Überlebenschancen im Wasser erhöhen.","Der Fahrzeugführer muss die Besatzungsmitglieder und Gäste anweisen, dass sie sich über die Sicherheitsvorkehrungen an Bord informieren, sich die Gebrauchsanweisungen der Rettungs- und Feuerlöschmittel ansehen und auf geeignete Maßnahmen gegen das Überbordfallen achten, zudem darauf, dass ständig angelegte Rettungswesten die Überlebenschancen im Wasser erhöhen.","Der Fahrzeugführer hat die verantwortlichen Besatzungsmitglieder über die Sicherheitsvorkehrungen an Bord zu unterrichten, in die Handhabung der Rettungs- und Feuerlöschmittel einzuweisen und auf geeignete Maßnahmen gegen das Überbordfallen hinzuweisen, zudem darauf, dass ständig angelegte Rettungswesten die Überlebenschancen im Wasser erhöhen.","Der Fahrzeugführer hat die Gäste an Bord über die Sicherheitsvorkehrungen an Bord zu unterrichten, in die Handhabung der Rettungs- und Feuerlöschmittel einzuweisen und auf geeignete Maßnahmen gegen das Überbordfallen hinzuweisen, zudem darauf, dass ständig angelegte Rettungswesten die Überlebenschancen im Wasser erhöhen."]},{"n":79,"q":"Was bedeutet das \"Manöver des letzten Augenblicks\"?","a":["Ausweichmanöver des Kurshalters.","Ausweichmanöver des Ausweichpflichtigen.","Ausweichmanöver des Kurshalters und des Ausweichpflichtigen.","Ausweichmanöver des Kurshalters oder des Ausweichpflichtigen."]},{"n":80,"q":"Wann ist das \"Manöver des letzten Augenblicks\" durchzuführen?","a":["Es muss durchgeführt werden, wenn ein Zusammenstoß durch Manöver des Ausweichpflichtigen allein nicht mehr vermieden werden kann.","Es muss durchgeführt werden, wenn ein Zusammenstoß durch Manöver des Kurshalters allein nicht mehr vermieden werden kann.","Es muss im letzten Augenblick von jedem durchgeführt werden, wenn ein Zusammenstoß sonst nicht mehr vermieden werden kann.","Es muss kurz vor der Kollision durchgeführt werden, wenn sonst ein Zusammenstoß durch Manöver des Kurshalters allein nicht mehr vermieden werden kann."]},{"n":81,"q":"Wann gilt ein Fahrzeug als überholendes Fahrzeug?","a":["Wenn es sich einem anderen Fahrzeug aus einer Richtung von mehr als 22,5° achterlicher als querab (Bereich des Hecklichtes) nähert.","Wenn es sich einem anderen Fahrzeug aus einer Richtung von mehr als 112,5° achterlicher als querab (Bereich der Seitenlichter) nähert.","Wenn es sich einem anderen Fahrzeug gegenüber in einer Richtung von mehr als 22,5° achterlicher als querab (Bereich des Hecklichtes) befindet.","Wenn es an einem anderen Fahrzeug aus einer achterlichen Richtung von mehr als 22,5° querab kommend (Bereich des Topplichtes) vorbeifährt."]},{"n":82,"q":"Wann ist ein Fahrzeug manövrierunfähig?","a":["Wenn es wegen außergewöhnlicher Umstände, z. B. Ausfall der Ruder- oder Maschinenanlage, nicht so wie vorgeschrieben manövrieren und daher einem anderen Fahrzeug nicht ausweichen kann.","Wenn es wegen der Art seines Einsatzes behindert ist und deshalb nicht so wie vorgeschrieben manövrieren und daher einem anderen Fahrzeug nicht ausweichen kann.","Wenn es wegen seines Tiefgangs im Verhältnis zu der vorhandenen Tiefe und Breite des befahrbaren Gewässers erheblich behindert ist, von seinem zu verfolgenden Kurs abzuweichen.","Wenn es mit Netzen, Leinen, Schleppnetzen oder anderen Fanggeräten fischt, welche die Manövrierfähigkeit einschränken."]},{"n":83,"q":"Wann ist ein Fahrzeug manövrierbehindert?","a":["Wenn es wegen der Art seines Einsatzes behindert ist und deshalb nicht so wie vorgeschrieben manövrieren und daher einem anderen Fahrzeug nicht ausweichen kann.","Wenn es wegen außergewöhnlicher Umstände, z. B. Ausfall der Ruder- oder Maschinenanlage, nicht so wie vorgeschrieben manövrieren und daher einem anderen Fahrzeug nicht ausweichen kann.","Wenn es wegen seines Tiefgangs im Verhältnis zu der vorhandenen Tiefe und Breite des befahrbaren Gewässers erheblich behindert ist, von seinem zu verfolgenden Kurs abzuweichen.","Wenn es mit Netzen, Leinen, Schleppnetzen oder anderen Fanggeräten fischt, welche die Manövrierfähigkeit einschränken."]},{"n":84,"q":"Welche besonderen Maßnahmen sind bei verminderter Sicht zu treffen?","a":["Es muss mit sicherer, den verminderten Sichtverhältnissen angepasster Geschwindigkeit gefahren werden, es müssen Schallsignale gegeben werden, es müssen Positionslichter eingeschaltet werden und es muss gehörig Ausguck gegangen werden.","Es muss mit sicherer, den verminderten Sichtverhältnissen angepasster Geschwindigkeit gefahren werden, es müssen Schallsignale gegeben werden, das Radargerät muss eingeschaltet werden und es muss Ausguck gegangen werden.","Es muss mit sicherer, den verminderten Sichtverhältnissen angepasster Geschwindigkeit gefahren werden, es müssen Schallsinale gegeben werden, es müssen Positionslichter eingeschaltet werden und es muss der Radarreflektor eingesetzt werden.","Es muss mit verminderter Geschwindigkeit gefahren werden, es müssen Schallsignale gegeben werden, es müssen Positionslichter eingeschaltet werden und es muss das AIS (Automatic Identifikation System) eingeschaltet werden."]},{"n":85,"q":"Welche Vorschriften regeln die Ausrüstung, Anordnung und Anbringung der Positionslaternen, Sichtzeichen und Schallsignalanlagen auf Fahrzeugen?","a":["Die Kollisionsverhütungsregeln (KVR), die Seeschifffahrtsstraßen-Ordnung (SeeSchStrO) und die Schifffahrtsordnung Emsmündung (EmsSchO).","Die Kollisionsverhütungsregeln (KVR), die Seeschifffahrtsstraßen-Ordnung (SeeSchStrO) und die Sportbootführerscheinverordnung.","Die Kollisionsverhütungsregeln (KVR), die Seeschifffahrtsstraßen-Ordnung (SeeSchStrO) und die Schiffssicherheitsverordnung.","Die Kollisionsverhütungsregeln (KVR), die Seeschifffahrtsstraßen-Ordnung (SeeSchStrO) und die Verordnung zur Sicherung der Seefahrt."]},{"n":86,"q":"Welche Positionslaternen und Schallsignalanlagen dürfen auf Sportbooten unter deutscher Flagge verwendet werden?","a":["Solche, deren Baumuster vom Bundesamt für Seeschifffahrt und Hydrographie (BSH) zur Verwendung zugelassen sind oder eine als gleichwertig anerkannte Zulassung eines EU-Staates besitzen.","Solche, die die vorgeschriebene Mindesttragweite von drei Seemeilen, die Größe und Farbgebung bzw. Lautstärke erreichen und mit einer Bescheinigung einer Klassifikationsgesellschaft versehen sind.","Solche, die gemäß der Kollisionsverhütungsregeln (KVR), der Seeschifffahrtsstraßen-Ordnung (SeeSchStrO) und der Schifffahrtsordnung Emsmündung (EmsSchO) vorgeschrieben sind und ein CE-Zeichen haben.","Solche, die vom Technischen Überwachungsverein (TÜV) geprüft und mit dem Zeichen für geprüfte Sicherheit (GS) versehen sind."]},{"n":87,"q":"Was sind \"Verkehrstrennungsgebiete\"?","a":["Es sind bekannt gemachte Schifffahrtswege, die durch Trennlinien oder Trennzonen in Einbahnwege geteilt sind.","Es sind bekannt gemachte Fahrwasser, die durch Trennlinien oder Trennzonen in Einbahnwege geteilt sind.","Es sind bekannt gemachte Seeschifffahrtsstraßen, die durch Trennlinien oder Trennzonen in Einbahnwege geteilt sind.","Es sind bekannt gemachte Bundeswasserstraßen, die durch Trennlinien oder Trennzonen in Einbahnwege geteilt sind."]},{"n":88,"q":"Wie sind Verkehrstrennungsgebiete zu befahren?","a":["Sie dürfen jeweils nur in der allgemeinen Verkehrsrichtung rechts der Trennlinie oder Trennzone befahren werden.","Sie dürfen jeweils nur in Fahrtrichtung links der Trennlinie oder Trennzone befahren werden.","Sie dürfen innerhalb der äußeren Trennlinien nur in einer Fahrtrichtung befahren werden.","Sie dürfen nur vom Anfang bis zum Ende und jeweils nur in Fahrtrichtung rechts der Trennzone befahren werden."]},{"n":89,"q":"Was bedeutet \"in Sicht befindlich\"?","a":["Wenn jedes Fahrzeug vom anderen optisch wahrgenommen werden kann.","Wenn jeder Fahrzeugführer vom anderen optisch wahrgenommen werden kann.","Wenn beide Fahrzeuge optisch wahrgenommen werden können.","Wenn jedes Fahrzeug auch bei unsichtigem Wetter optisch wahr s Maschinenfahrzeug muss Kurs und Geschwindigkeit beibehalten.","Das Maschinenfahrzeug muss seinen Kurs nach Steuerbord ändern.","Das Maschinenfahrzeug muss vorsichtig manövrieren, bis die Gefahr vorüber ist."]},{"n":132,"q":"Wie hat sich ein Segelfahrzeug im freien Seeraum oder außerhalb des Fahrwassers gegenüber einem in Sicht befindlichen fischenden Fahrzeug zu verhalten, wenn die Möglichkeit der Gefahr eines Zusammenstoßes besteht?","a":["Das Segelfahrzeug muss ausweichen.","Das Segelfahrzeug muss seinen Kurs nach Steuerbord ändern.","Das Segelfahrzeug darf die sichere Durchfahrt nicht behindern.","Das Segelfahrzeug muss Kurs und Geschwindigkeit zunächst beibehalten."]},{"n":133,"q":"Wie muss man sich gegenüber diesem Fahrzeug verhalten?","a":["Die sichere Durchfahrt des Fahrzeugs darf nicht behindert werden.","Das Fahrzeug muss an Steuerbord passiert werden.","Sog und Wellenschlag vermeiden.","Kurs und Geschwindigkeit beibehalten."],"img":["img/q/c17a3b323758.jpg"]},{"n":134,"q":"Wie muss man sich gegenüber diesem Fahrzeug verhalten?","a":["Die sichere Durchfahrt des Fahrzeugs darf nicht behindert werden.","Das Fahrzeug muss an Steuerbord passiert werden.","Sog und Wellenschlag vermeiden.","Kurs und Geschwindigkeit beibehalten."],"img":["img/q/0308302af33c.jpg"]},{"n":135,"q":"Wie verhält sich der Kurshaltepflichtige vor Einleitung des Manövers des letzten Augenblicks gegenüber einem ausweichpflichtigen Fahrzeug?","a":["Kurs und Geschwindigkeit zunächst beibehalten und dem Ausweichpflichtigen besondere Aufmerksamkeit widmen.","Kurs oder Geschwindigkeit anpassen und dem Ausweichpflichtigen besondere Aufmerksamkeit widmen.","Kurs nach Steuerbord ändern. Geschwindigkeit verringern und dem Ausweichpflichtigen besondere Aufmerksamkeit widmen.","Kurs nach Steuerbord ändern, Geschwindigkeit zunächst beibehalten und dem Ausweichpflichtigen besondere Aufmerksamkeit widmen."]},{"n":136,"q":"Wie muss sich ein Ausweichpflichtiger gegenüber einem Kurshalter verhalten?","a":["Das Ausweichmanöver muss frühzeitig, durchgreifend und klar erkennbar durchgeführt werden.","Der Kurs muss bei Annäherung an den Kurshalter Schritt für Schritt so angepasst werden, dass das Heck des Anderen sicher umfahren wird.","Das Manöver des letzten Augenblicks ist durchzuführen. Es muss so ausgewichen werden, wie es zur Vermeidung eines Zusammenstoßes am dienlichsten ist.","Die Fahrt ist auf das für die Steuerfähigkeit erforderliche Mindestmaß zu reduzieren; im Zweifelsfall muss ganz aufgestoppt werden."]},{"n":137,"q":"Wie hat sich ein überholendes Fahrzeug zu verhalten?","a":["Es hat dem zu überholenden Fahrzeug auszuweichen.","Es muss den größtmöglichen Abstand zum überholten Fahrzeug einhalten und Sog und Wellenschlag vermeiden.","Es darf die sichere Durchfahrt des zu überholenden Fahrzeugs nicht behindern.","Es muss vor dem Überholen ein Schallsignal abgeben, um die Zustimmung des zu überholenden Fahrzeugs einzuholen."]},{"n":138,"q":"Wie hat man sich zu verhalten, wenn man bei verminderter Sicht anscheinend vorlicher als querab das Schallsignal eines anderen Fahrzeugs hört?","a":["Es ist ebenfalls ein Schallsignal abzugeben und die Fahrt soweit zu verlangsamen, dass die Steuerfähigkeit noch erhalten bleibt. Erforderlichenfalls ist ganz aufzustoppen. In jedem Fall ist vorsichtig zu manövrieren, bis die Gefahr eines Zusammenstoßes vorüber ist.","Es ist ebenfalls ein Schallsignal abzugeben und frühzeitig, durchgreifend und klar erkennbar auszuweichen.","Es sind mindestens fünf kurze Töne mit der Pfeife abzugeben und das Manöver des letzten Augenblicks durchzuführen. Dabei ist so zu manövrieren, wie es zur Vermeidung eines Zusammenstoßes am dienlichsten ist.","Es ist ebenfalls ein Schallsignal abzugeben. Kurs und Geschwindigkeit sind so lange beizubehalten, bis das andere Fahrzeug in Sicht kommt. Dann ist die Ausweichsituation nach KVR zu prüfen und man muss sich entsprechend verhalten."]},{"n":139,"q":"Wie verhält man sich als Kurshalter, wenn man feststellt, dass ein anderes Fahrzeug seiner Ausweichpflicht nicht nachkommt und die Gefahr einer unmittelbaren Kollision bevorsteht?","a":["Man gibt mindestens fünf kurze Töne mit der Pfeife ab und führt das \"Manöver des letzten Augenblicks\" durch. Dabei ist so zu manövrieren, wie es zur Vermeidung eines Zusammenstoßes am dienlichsten ist.","Man gibt ein Schallsignal (vier kurze Töne) ab und verlangsamt die Fahrt soweit, dass die Steuerfähigkeit noch erhalten bleibt. Erforderlichenfalls ist ganz aufzustoppen. In jedem Fall ist vorsichtig zu manövrieren, bis die Gefahr eines Zusammenstoßes vorüber ist.","Man gibt mindestens fünf kurze Töne mit der Pfeife ab und reduziert die Geschwindigkeit, um Sog und Wellenschlag zu vermeiden.","Man behält Kurs und Geschwindigkeit zunächst bei und widmet dem Ausweichpflichtigen besondere Aufmerksamkeit."]},{"n":140,"q":"Welche Bedeutung hat folgendes Schallsignal?","a":["Ein ausweichpflichtiges Fahrzeug wird auf seine Ausweichpflicht aufmerksam gemacht.","Allgemeines Gefahren- und Warnsignal.","Bleib-Weg-Signal, Explosionsgefahr durch gefährliche Güter. Sofort den Gefahrenbereich verlassen. Feuer und Zündfunken vermeiden.","Seeschifffahrtsstraße gesperrt. Weiterfahrt verboten, sofort aufstoppen."],"sig":"mindestens ● ● ● ● ●"},{"n":141,"q":"Welche Bedeutung hat folgendes Schallsignal?","a":["Ein Ankerlieger macht ein sich näherndes Fahrzeug auf eine gefährliche Annäherung aufmerksam.","Die Maschine des Fahrzeugs läuft rückwärts.","Schutzbedürftige Anlage; Geschwindigkeit reduzieren, Sog und Wellenschlag vermeiden.","Maschinenfahrzeug, das seine Maschinen gestoppt hat und keine Fahrt durchs Wasser macht."],"sig":"● ▬ ●"},{"n":142,"q":"Was ist bei der Benutzung eines Verkehrstrennungsgebietes zu beachten?","a":["Auf dem entsprechenden Einbahnweg in der allgemeinen Verkehrsrichtung fahren, soweit wie möglich von der Trennzone/ Trennlinie klar halten, in der Regel an den Enden des Einbahnweges ein- oder auslaufen, seitliches Ein- oder Auslaufen in möglichst kleinem Winkel zur allgemeinen Verkehrsrichtung.","Auf dem entsprechenden Einbahnweg in Verkehrsrichtung links von der Trennzone fahren, so nah wie möglich an der Trennzone/Trennlinie fahren, in der Regel an den Enden des Einbahnweges ein- oder auslaufen, seitliches Ein- oder Auslaufen in möglichst rechtem Winkel zur allgemeinen Verkehrsrichtung.","Die Benutzung von Verkehrstrennungsgebieten ist für Segelfahrzeuge sowie für Maschinenfahrzeuge unter 20 m Länge nicht gestattet. Diese Fahrzeuge haben sich soweit wie möglich von Verkehrstrennungsgebieten klar zu halten und müssen durch ihren Kurs klar zu erkennen geben, dass sie ein Verkehrstrennungsgebiet nicht benutzen.","Auf den entsprechenden Einbahnwegen in der allgemeinen Verkehrsrichtung fahrende Fahrzeuge müssen sich soweit wie möglich von der Trennzone/Trennlinie klar halten und haben Vorfahrt gegenüber allen Fahrzeugen, die in ein Verkehrstrennungsgebiet einlaufen oder ein solches queren."]},{"n":143,"q":"Was ist hinsichtlich des Querens eines Verkehrstrennungsgebietes zu beachten?","a":["Das Queren ist möglichst zu vermeiden. Falls gequert werden muss, hat dies möglichst mit der Kielrichtung im rechten Winkel zur allgemeinen Verkehrsrichtung zu erfolgen. Die Kielrichtung des querenden Fahrzeugs muss auch dann einen rechten Winkel zur allgemeinen Verkehrsrichtung bilden, wenn das Fahrzeug durch Wind oder Strom versetzt wird.","Das Queren ist möglichst zu vermeiden. Falls gequert werden muss, hat dies möglichst mit einem rechtweisenden Kurs zur allgemeinen Verkehrsrichtung zu erfolgen. Der rechtweisende Kurs des querenden Fahrzeugs muss auch dann einen rechten Winkel zur allgemeinen Verkehrsrichtung bilden, wenn das Fahrzeug durch Wind oder Strom versetzt wird.","Das Queren von Verkehrstrennungsgebieten ist für Segelfahrzeuge sowie für Maschinenfahrzeuge unter 20 m Länge verboten. Diese Fahrzeuge haben sich soweit wie möglich von den Enden der Verkehrstrennungsgebiete klar zu halten und müssen durch ihren Kurs zu erkennen geben, dass sie ein Verkehrstrennungsgebiet nicht queren.","Das Queren ist möglichst zu vermeiden. Falls gequert werden muss, hat dies mit der Kielrichtung in einem möglichst spitzen Winkel zur allgemeinen Verkehrsrichtung zu erfolgen. Die Kielrichtung des querenden Fahrzeugs muss auch dann einen möglichst spitzen Winkel zur allgemeinen Verkehrsrichtung bilden, wenn das Fahrzeug durch Wind oder Strom versetzt wird."]},{"n":144,"q":"In welcher Vorschrift findet man die Regeln zum Befahren von Verkehrstrennungsgebieten?","a":["In den Kollisionsverhütungsregeln.","In der Seeschifffahrtsstraßen-Ordnung.","In den Kollisionsverhütungsregeln und der Seeschifffahrtsstraßen-Ordnung.","In den \"Bekanntmachungen der Generaldirektion Wasserstraßen und Schifffahrt (GDWS)\"."]},{"n":145,"q":"Wie hat sich ein Maschinenfahrzeug bei Kollisionsgefahr in einem Einbahnweg eines Verkehrstrennungsgebietes gegenüber einem Maschinenfahrzeug zu verhalten, das den Einbahnweg von Steuerbord kommend quert?","a":["Es muss dem anderen Fahrzeug ausweichen.","Es darf die sichere Durchfahrt des Maschinenfahrzeugs nicht behindern.","Dem querenden Fahrzeug hat es besondere Aufmerksamkeit zu widmen.","Es muss das Manöver des letzten Augenblicks durchführen."]},{"n":146,"q":"Wie hat sich ein Segelfahrzeug beim Queren eines Verkehrstrennungsgebietes gegenüber einem Maschinenfahrzeug zu verhalten, das auf einem Einbahnweg in der allgemeinen Verkehrsrichtung fährt?","a":["Es darf die sichere Durchfahrt des Maschinenfahrzeugs nicht behindern.","Es unterliegt der Kurshaltepflicht. Kurs und Geschwindigkeit sind beizubehalten.","Es muss warten. Alle dem Einbahnweg folgenden Fahrzeuge haben Vorfahrt.","Es hat Vorfahrt. Alle dem Einbahnweg folgenden Fahrzeuge müssen warten."]},{"n":147,"q":"Wie haben sich Fahrzeuge von weniger als 20 m Länge oder Segelfahrzeuge in Verkehrstrennungsgebieten zu verhalten?","a":["Sie dürfen die sichere Durchfahrt eines dem Einbahnweg folgenden Maschinenfahrzeugs nicht behindern.","Sie gelten als Kleinfahrzeuge und dürfen Verkehrstrennungsgebiete nicht befahren.","Sie gelten als Kleinfahrzeuge und dürfen Verkehrstrennungsgebiete nur am Tage und bei guter Sicht befahren.","Sie dürfen die Trennzone befahren, damit der durchgehende Verkehr nicht behindert wird."]},{"n":148,"q":"Was ist das für ein Fahrzeug und was ist zu beachten?","a":["Ein manövrierbehindertes Fahrzeug, das baggert oder Unterwasserarbeiten ausführt und dabei die Schifffahrt behindert. Es ist an der Seite zu passieren, an der zwei schwarze Rhomben senkrecht übereinander angeordnet sind.","Ein manövrierbehindertes Fahrzeug, das die Schifffahrt behindert. Es ist an der Seite zu passieren, an der zwei schwarze Bälle senkrecht übereinander angeordnet sind.","Ein manövrierbehindertes Fahrzeug, das baggert oder Unterwasserarbeiten ausführt und dabei die Schifffahrt behindert. Es ist an der Seite zu passieren, die in meiner Fahrtrichtung rechts liegt.","Ein manövrierbehindertes Fahrzeug, das baggert oder Unterwasserarbeiten ausführt und dabei die Schifffahrt behindert. Es darf an keiner Seite passiert werden."],"img":["img/q/4882083f309a.jpg"]},{"n":149,"q":"Was ist das für ein Fahrzeug und was ist zu beachten?","a":["Ein manövrierbehindertes Fahrzeug mit Fahrt durchs Wasser, das baggert oder Unterwasserarbeiten ausführt und dabei die Schifffahrt nicht behindert. Es ist an der Seite zu passieren, die in Fahrtrichtung rechts liegt.","Ein manövrierbehindertes Fahrzeug mit Fahrt durchs Wasser, das baggert oder Unterwasserarbeiten ausführt und dabei die Schifffahrt behindert. Es ist an der Seite zu passieren, die in Fahrtrichtung links liegt.","Ein manövrierunfähiges Fahrzeug mit Fahrt durchs Wasser, das baggert oder Unterwasserarbeiten ausführt und dabei die Schifffahrt behindert. Es ist an der Seite zu passieren, die in Fahrtrichtung rechts liegt.","Ein manövrierbehindertes Fahrzeug mit Fahrt durchs Wasser, das baggert oder Unterwasserarbeiten ausführt und dabei die Schifffahrt behindert. Es darf an beiden Seiten passiert werden."],"img":["img/q/ee03447b38cf.jpg"]},{"n":150,"q":"Was ist das für ein Fahrzeug und was ist zu beachten?","a":["Ein manövrierbehindertes Fahrzeug ohne Fahrt durchs Wasser, das baggert oder Unterwasserarbeiten ausführt und dabei die Schifffahrt behindert. Es ist an der Seite zu passieren, an der zwei grüne Rundumlichter senkrecht übereinander angeordnet sind.","Ein manövrierbehindertes Fahrzeug ohne Fahrt durchs Wasser, das die Schifffahrt behindert. Es ist an der Seite zu passieren, an der zwei rote Rundumlichter senkrecht übereinander angeordnet sind.","Ein manövrierbehindertes Fahrzeug ohne Fahrt durchs Wasser, das baggert oder Unterwasserarbeiten ausführt und dabei die Schifffahrt behindert. Es ist an der Seite zu passieren, die in Fahrtrichtung links liegt.","Ein manövrierbehindertes Fahrzeug ohne Fahrt durchs Wasser, das baggert oder Unterwasserarbeiten ausführt und dabei die Schifffahrt behindert. Es ist an der Steuerbordseite des Fahrwassers (Rechtsfahrgebot) zu passieren."],"img":["img/q/9f538b6881cd.jpg"]},{"n":151,"q":"Was ist das für ein Fahrzeug und was ist zu beachten?","a":["Fahrzeug mit gefährlichen Gütern, Abstand halten, Rauchen und offenes Feuer verboten.","Fahrzeug des öffentlichen Dienstes. Es darf von den Verkehrsregeln abweichen.","Fahrzeug in Seenot. Hilfe leisten bzw. weitere Hilfe anfordern.","Fahrzeug mit Taucher im Einsatz. Großen Abstand halten."],"img":["img/q/9d4008110784.jpg"]},{"n":152,"q":"Wo ist festgelegt, welche Wasserflächen Seeschifffahrtsstraßen sind?","a":["Seeschifffahrtsstraßen-Ordnung und Schifffahrtsordnung Emsmündung.","Seeschifffahrtsstraßen-Ordnung und Kollisionsverhütungsregeln.","Kollisionsverhütungsregeln und Schifffahrtsordnung Emsmündung.","Kollisionsverhütungsregeln und Seeaufgabengesetz."]},{"n":153,"q":"Welche örtlichen Sondervorschriften zusätzlich zur Seeschifffahrtsstraßen-Ordnung (SeeSchStrO) und zur Schifffahrtsordnung Emsmündung (EmsSchO) gibt es und was ist darin geregelt?","a":["Die Bekanntmachungen der Generaldirektion Wasserstraßen und Schifffahrt (GDWS), die besondere örtliche Regelungen enthalten und Hinweise für die einzelnen Seeschifffahrtsstraßen geben.","Die Nachrichten für Seefahrer (NfS), herausgegeben vom Bundesamt für Seeschifffahrt und Hydrographie, sowie die Bekanntmachungen für Seefahrer (BfS) der örtlich zuständigen Wasserstraßen- und Schifffahrtsämter, die auf alle Veränderungen hinsichtlich Betonnung, Befeuerung, Wracks und Untiefen sowie auf die Schifffahrt betreffende Maßnahmen und Ereignisse hinweisen.","Die Bekanntmachung der Generaldirektion Wasserstraßen und Schifffahrt (GDWS) sowie die nautische Veröffentlichung \"Sicherheit auf dem Wasser\", herausgegeben durch das Bundesministerium für Digitales und Verkehr (BMDV), mit wichtigen Regeln und Tipps für Wassersportler.","Das Seesicherheitsuntersuchungsgesetz sowie die Verordnung über die Sicherung der Seefahrt, die jeweils wichtige Vorschriften über das Verhalten nach einem Zusammenstoß auf den jeweiligen Seeschifffahrtsstraßen enthalten."]},{"n":154,"q":"Was ist das für ein Fahrzeug und was ist zu beachten?","a":["Fahrzeug des öffentlichen Dienstes im Einsatz. Es darf von den Verkehrsvorschriften abweichen.","Fahrzeug der Bundesmarine im Einsatz. Es hat Munition oder andere Gefahrgüter an Bord.","Lotsenfahrzeug mit Sonderrechten im Einsatz. Es darf vom Rechtsfahrgebot abweichen.","Tiefgangbehindertes Fahrzeug. Es darf nicht behindert werden."],"img":["img/q/b1a14854c024.jpg"]},{"n":155,"q":"Wer gibt das Sichtzeichen \"Leuchtkugeln mit weißen Sternen\" und was ist zu beachten?","a":["Fahrzeug der Bundeswehr, der Bundespolizei oder Maschinenfahrzeug, das Schießscheiben schleppt bei Übungen. Man hält sich frei.","Fahrzeug, das mit Netzen, Leinen, Schleppnetzen oder anderen Fanggeräten fischt und auf sich aufmerksam macht. Ausreichenden Abstand halten.","Fahrzeug in Seenot, das auf sich aufmerksam macht. Hilfe leisten, ggf. weitere Hilfe anfordern.","Maschinenfahrzeug über 50 m Länge bei der Anforderung eines Lotsen. Man behält Kurs und Geschwindigkeit bei."]},{"n":156,"q":"Was sind Fahrwasser im Sinne der Seeschifffahrtsstraßen-Ordnung (SeeSchStrO) und der Schifffahrtsordnung Emsmündung (EmsSchO)?","a":["Es sind Wasserflächen, die durchgehend durch Fahrwasserseitenbezeichnung begrenzt oder gekennzeichnet sind, binnenwärts der Flussmündungen auch nicht gekennzeichnete Wasserflächen, die für die durchgehende Schifffahrt bestimmt sind.","Es sind Wasserflächen, die für Seeschiffe zugelassen sind; binnenwärts der Flussmündungen sind auch Binnenschiffe und Sportboote zugelassen.","Es sind Wasserflächen, die durchgehend durch Fahrwasserseitenbezeichnung begrenzt oder gekennzeichnet sind und auf denen das Wasserskifahren sowie das Fahren mit Wassermotorrädern erlaubt ist, sofern die durchgehende Schifffahrt nicht behindert wird.","Es sind Wasserflächen, die durchgehend durch Fahrwasserseitenbezeichnung begrenzt oder gekennzeichnet sind und auf denen die Sportbootführerscheinverordnung Gültigkeit hat."]},{"n":157,"q":"Welches ist - außer in Wattgebieten - die Steuerbordseite eines Fahrwassers?","a":["Es ist die Seite, die ein von See kommendes Schiff an seiner Steuerbordseite hat.","Es ist die Seite, die ein von See kommendes Schiff an seiner Backbordseite hat.","Es ist die Seite, die von See kommend mit roten Tonnen bezeichnet ist.","Es ist die Seite, auf der die Tonnen mit fortlaufenden geraden Zahlen gekennzeichnet sind."]},{"n":158,"q":"Welche verkehrsrechtliche Verpflichtung hat ein Fahrzeugführer nach § 3 der Seeschifffahrtsstraßen-Ordnung (SeeSchStrO), dessen Fahrzeug mit einer UKW-Funkanlage ausgerüstet ist?","a":["Er ist verpflichtet, die von der Verkehrszentrale gegebenen Verkehrsinformationen und -unterstützungen abzuhören und zu berücksichtigen.","Er ist verpflichtet, bei der Nutzung einer UKW-Funkanlage im Besitz des entsprechenden Funkzeugnisses zu sein.","Er ist verpflichtet, bei verminderter Sicht regelmäßig seinen Schiffsnamen und seine Position der Verkehrszentrale mitzuteilen.","Er ist verpflichtet, die Funkanlage während der Fahrt in Betrieb zu halten und alle sein Fahrzeug betreffenden Mitteilungen im Schiffslogbuch festzuhalten."]},{"n":159,"q":"Welches Licht muss ein Fahrzeug unter Segel von weniger als 12 m Länge oder ein Fahrzeug unter Ruder auf der Seeschifffahrtsstraße führen, wenn es die nach den Kollisionsverhütungsregeln (KVR) vorgeschriebenen Lichter nicht führen kann?","a":["Ein weißes Rundumlicht.","Ein rotes Rundumlicht.","Ein weißes Topplicht.","Eine Dreifarbenlaterne."]},{"n":160,"q":"Wann darf ein Maschinenfahrzeug von weniger als 7 m Länge auf Seeschifffahrtsstraßen nicht fahren, wenn es die nach den Kollisionsverhütungsregeln (KVR) vorgeschriebenen Lichter nicht führen kann?","a":["Es darf in der Zeit, in der die Lichterführung vorgeschrieben ist, nicht fahren, es sei denn, dass ein Notstand vorliegt.","Es darf in der Zeit zwischen Sonnenaufgang und Sonnenuntergang nicht fahren.","Es darf in der Zeit, in der die Lichterführung vorgeschrieben ist, nur dann fahren, wenn ein betriebsbedingtes Signalhorn an Bord ist.","Es darf in der Zeit zwischen Sonnenuntergang und Sonnenaufgang nicht fahren."]},{"n":161,"q":"Welches Schallsignal ist beim Einlaufen in Fahrwasser und Häfen zu geben, wenn die Verkehrslage es erfordert?","a":["Ein langer Ton.","Ein kurzer Ton.","Ein kurzer und ein langer Ton.","Ein langer und ein kurzer Ton."]},{"n":162,"q":"Welche Bedeutung hat folgendes Schallsignal?","a":["Allgemeines \"Gefahr- und Warnsignal\".","Sperrung der Seeschifffahrtsstraße.","Sofort anhalten (Fahrzeug des öffentlichen Dienstes).","Brücke/Schleuse kann vorübergehend nicht geöffnet werden."],"sig":"▬ ● ● ● ●   ▬ ● ● ● ●"},{"n":163,"q":"Wie lautet das \"allgemeine Gefahr- und Warnsignal\"?","a":["Zwei Gruppen von je einem langen und vier kurzen Tönen.","Zwei Gruppen von je drei langen Tönen.","Zwei Gruppen von je vier kurzen Tönen.","Zwei Gruppen von je einem kurzen und vier langen Tönen."]},{"n":164,"q":"Wann ist das \"allgemeine Gefahr- und Warnsignal\" zu geben?","a":["Wenn ein Fahrzeug ein anderes Fahrzeug gefährdet oder durch dieses selbst gefährdet wird.","Wenn ein Fahrzeug ein anderes Fahrzeug im Fahrwasser an Steuerbord überholen will.","Wenn ein Fahrzeug einem anderen Fahrzeug nicht ausweichen kann.","Wenn ein Fahrzeug ein anderes Fahrzeug zur Hilfeleistung auffordert."]},{"n":165,"q":"Wie haben sich Fahrzeuge zu verhalten, die in ein Fahrwasser einlaufen, ein Fahrwasser queren, im Fahrwasser drehen oder ihre Anker- und Liegeplätze verlassen?","a":["Sie haben die Vorfahrt der dem Fahrwasserverlauf folgenden Fahrzeuge zu beachten.","Sie haben die Vorfahrt vor den Fahrzeugen im Fahrwasser.","Sie haben einen kurzen Ton als Achtungssignal abzugeben.","Sie haben ihr Manöver so durchzuführen, dass andere Fahrzeuge nicht behindert werden."]},{"n":166,"q":"Wie haben Segelfahrzeuge im Fahrwasser, die nicht deutlich der Richtung eines Fahrwassers folgen, untereinander auszuweichen?","a":["Sie haben untereinander nach den Regeln der KVR auszuweichen, wenn sie dadurch vorfahrtberechtigte Fahrzeuge nicht gefährden oder behindern.","Sie haben untereinander nach den Regeln der Seeschifffahrtsstraßen-Ordnung auszuweichen, wenn sie dadurch vorfahrtberechtigte Fahrzeuge nicht gefährden oder behindern.","Sie haben untereinander nach den Regeln der Schifffahrtsordnung Emsmündung auszuweichen, wenn sie dadurch vorfahrtberechtigte Fahrzeuge nicht gefährden oder behindern.","Sie haben untereinander nach den Regeln der Binnenschifffahrtsstraßen-Ordnung auszuweichen, wenn sie dadurch vorfahrtberechtigte Fahrzeuge nicht gefährden oder behindern."]},{"n":167,"q":"Welche Ausweichregeln gelten außerhalb des Fahrwassers?","a":["Die Regeln der KVR.","Die Regeln der Seeschifffahrtsstraßen-Ordnung.","Die Regeln der Schifffahrtsordnung Emsmündung.","Die Regeln der Binnenschifffahrtsstraßen-Ordnung."]},{"n":168,"q":"Wo ist das Überholen verboten?","a":["An Engstellen, unübersichtlichen Krümmungen, in Schleusenbereichen, innerhalb durch Überholverbotszeichen gekennzeichneter Strecken, in der Nähe nicht frei fahrender Fähren in Fahrt.","An Engstellen, unübersichtlichen Krümmungen, in Schleusenbereichen, innerhalb durch Überholverbotszeichen gekennzeichneter Strecken, in der Nähe nicht frei fahrender Fähren in Fahrt und außerhalb des Fahrwassers.","An Engstellen, unübersichtlichen Krümmungen, in Schleusenbereichen, innerhalb durch Überholverbotszeichen gekennzeichneter Strecken, in der Nähe nicht frei fahrender Fähren in Fahrt, und in Verkehrstrennungsgebieten.","An Engstellen, unübersichtlichen Krümmungen, innerhalb durch Überholverbotszeichen gekennzeichneter Strecken und in Nationalparks und besonders ausgewiesenen Naturschutzgebieten."]},{"n":169,"q":"Wo darf Wasserski gelaufen, Wassermotorrad gefahren oder mit einem Segelsurfbrett gefahren werden?","a":["Außerhalb des Fahrwassers, wenn es nicht von der Generaldirektion Wasserstraßen und Schifffahrt (GDWS) durch Bekanntmachung verboten ist. Im Fahrwasser auf Abschnitten, die durch die GDWS bekanntgemacht oder durch blaue Tafeln mit dem weißen Symbol eines Wasserskiläufers, eines Wassermotorrades oder eines Segelsurfers bezeichnet sind.","Außerhalb der Seeschifffahrtsstraße, wenn es nicht von der Generaldirektion Wasserstraßen und Schifffahrt (GDWS) durch Bekanntmachung verboten ist. Innerhalb der Seeschifffahrtsstraße auf Abschnitten, die durch die GDWS bekanntgemacht oder durch blaue Tafeln mit dem weißen Symbol eines Wasserskiläufers, eines Wassermotorrades oder eines Segelsurfers bezeichnet sind.","Auf der hohen See und auf den mit dieser zusammenhängenden, von Seeschiffen befahrbaren Gewässern, sofern dabei ein Abstand von mindestens 100 m zum Ufer eingehalten wird.","Im Fahrwasser, wenn es nicht von der Generaldirektion Wasserstraßen und Schifffahrt (GDWS) durch Bekanntmachung verboten ist. Außerhalb des Fahrwassers auf Abschnitten, die durch die GDWS bekanntgemacht oder durch blaue Tafeln mit dem weißen Symbol eines Wasserskiläufers, eines Wassermotorrades oder eines Segelsurfers bezeichnet sind."]},{"n":170,"q":"Wie haben sich Führer von Zugbooten der Wasserskiläufer bzw. Wassermotorradfahrer und Segelsurfer bei der Annäherung an andere Fahrzeuge zu verhalten?","a":["Sie haben auszuweichen.","Sie haben bei Annäherung an andere Fahrzeuge aufzustoppen und Sog und Wellenschlag zu vermeiden.","Sie haben Vorfahrt und müssen vor dem Bug des anderen Fahrzeugs kreuzen.","Sie müssen Kurs und Geschwindigkeit beibehalten."]},{"n":171,"q":"Wo ist das Ankern verboten?","a":["Im Fahrwasser, an Engstellen und in unübersichtlichen Krümmungen; im Umkreis von 300 m von schwimmenden Geräten, Wracks und sonstigen Schifffahrtshindernissen, Kabeltonnen und sonstigen Stellen für militärische und zivile Zwecke; vor Hafeneinfahrten, Schleusen, Anlegestellen und Sielen sowie in den Zufahrten des Nord-Ostsee-Kanals; innerhalb von Fähr\u0002und Brückenstrecken; 300 m vor und hinter Ankerverbotszeichen.","Im Fahrwasser, auf Seeschifffahrtsstraßen, an Engstellen und in unübersichtlichen Krümmungen; im Umkreis von 300 m von schwimmenden Geräten, Wracks und sonstigen Schifffahrtshindernissen, Kabeltonnen und sonstigen Stellen für militärische und zivile Zwecke; vor Hafeneinfahrten, Schleusen, Anlegestellen und Sielen sowie in den Zufahrten des Nord-Ostsee-Kanals; innerhalb von Fähr- und Brückenstrecken; 300 m vor und hinter Ankerverbotszeichen.","Im Fahrwasser, an Engstellen und in unübersichtlichen Krümmungen; im Umkreis von 300 m von schwimmenden Geräten, Kabeltonnen und sonstigen Stellen für militärische und zivile Zwecke; vor Hafeneinfahrten, Schleusen, Anlegestellen und Sielen sowie in den Zufahrten des Nord-Ostsee-Kanals und in Vogelschutz- und Naturschutzgebieten sowie generell innerhalb von Nationalparks.","Im Fahrwasser, wenn es durch die Generaldirektion Wasserstraßen und Schifffahrt (GDWS) bekanntgemacht worden ist. Außerhalb des Fahrwassers auf Abschnitten, die durch die GDWS bekanntgemacht oder durch entsprechende Sichtzeichen bezeichnet sind."]},{"n":172,"q":"Was ist zu unternehmen, um die Schifffahrt zu warnen, wenn das eigene Fahrzeug gesunken ist und ein Schifffahrtshindernis darstellt?","a":["Man informiert die Schifffahrtspolizeibehörde und gibt nach Möglichkeit die Position an.","Man informiert die Deutsche Gesellschaft zur Rettung Schiffbrüchiger, damit das Hindernis gekennzeichnet werden kann.","Man gibt ein Seenotsignal ab.","Man informiert das Bundesamt für Seeschifffahrt und Hydrographie und gibt nach Möglichkeit die Position an."]},{"n":173,"q":"Bei welchem Signal dürfen Sportfahrzeuge in die Schleusen des Nord-Ostsee-Kanals einfahren?","a":["Wenn ein weißes unterbrochenes Licht gezeigt wird.","Wenn ein weißes Funkellicht gezeigt wird.","Wenn zwei grüne Lichter nebeneinander gezeigt werden.","Wenn ein grünes Gleichtaktlicht gezeigt wird."]},{"n":174,"q":"Wo findet man Regeln für das Durchfahren des Nord-Ostsee-Kanals (NOK)?","a":["Ergänzende Vorschriften für den NOK in der Seeschifffahrtsstraßen-Ordnung sowie in den Bekanntmachungen der Generaldirektion Wasserstraßen und Schifffahrt (GDWS).","Ergänzende Vorschriften für den NOK in der Seeschifffahrtsstraßen-Ordnung sowie in den Kollisionsverhütungsregeln.","Ergänzende Vorschriften für den NOK in der Seeschifffahrtsstraßen-Ordnung sowie in der Sportbootführerscheinverordnung.","Ergänzende Vorschriften für den NOK in der Seeschifffahrtsstraßen-Ordnung sowie im Seeaufgabengesetz."]},{"n":175,"q":"Was bedeuten im Nord-Ostsee-Kanal an einem Weichensignalmast drei unterbrochene rote Lichter übereinander und was ist zu beachten?","a":["Ausfahren für alle Fahrzeuge verboten; Aufhebung des Signals abwarten.","Schutzbedürftige Anlage; Geschwindigkeit reduzieren, Sog und Wellenschlag vermeiden.","Dauernde Sperrung der Seeschifffahrtsstraße; Weiterfahrt verboten.","Dauernde Sperrung einer Teilstrecke der Seeschifffahrtsstraße; Weiterfahrt in der Teilstrecke verboten."]},{"n":176,"q":"Welche Bedeutung hat folgendes Tafelzeichen?","a":["Die Geschwindigkeit durch das Wasser in km/h, auf dem Nord-Ostsee-Kanal (NOK) über Grund in km/h, die nicht überschritten werden darf.","Mindestabstand in Metern, der in der nachfolgenden Strecke vom Aufstellungsort der Tafel an eingehalten werden muss.","Die Geschwindigkeit durch das Wasser in sm/h (Knoten) auf dem Nord-Ostsee-Kanal (NOK) über Grund in sm/h, die nicht überschritten werden darf.","Mindestabstand zu anderen Fahrzeugen in Metern, der im bekanntgemachten Streckenabschnitt nicht unterschritten werden darf."],"img":["img/q/669c994547c5.jpg"]},{"n":177,"q":"Welche Bedeutung haben folgende Sichtzeichen?","a":["Schutzbedürftige Anlage.","Dauernde Sperrung einer Teilstrecke der Seeschifffahrtsstraße.","Dauernde Sperrung der Seeschifffahrtsstraße.","Außergewöhnliche Schifffahrtsbehinderung."],"img":["img/q/0234376ccd1d.jpg","img/q/a9a8cf0b981b.jpg"]},{"n":178,"q":"Welche Bedeutung hat folgendes Schallsignal und was ist zu beachten?","a":["Brücke, Sperrwerk, Schleuse kann vorübergehend nicht geöffnet werden; Fahrt unterbrechen, Freigabe abwarten.","Ein Ausweichpflichtiger wird vom Vorfahrtberechtigten auf seine Ausweichpflicht hingewiesen; sofort Ausweichmanöver einleiten.","Bleib-weg-Signal, Gefahr durch gefährliche Ladung; sofort den Gefahrenbereich verlassen. Offenes Feuer vermeiden (Explosionsgefahr).","Brücke, Sperrwerk, Schleuse wird zur Öffnung vorbereitet; Fahrt fortsetzen."],"sig":"● ● ● ●"},{"n":179,"q":"Welche Bedeutung hat folgendes Sichtzeichen?","a":["Geschwindigkeit von 8 km/h Fahrt durch das Wasser, die innerhalb eines Bereiches von 500 m von der jeweiligen Uferlinie wegen Badebetriebs nicht überschritten werden darf.","Kennzeichnung besonderer Gebiete und Stellen, z. B. Warngebiete; die Bedeutung kann der Seekarte entnommen und aus der Beschriftung des Schifffahrtszeichens erkannt werden.","Geschwindigkeit von 8 sm/h Fahrt durch das Wasser, die innerhalb eines Mindestabstandes von 500 m von der jeweiligen Uferlinie wegen Badebetriebs nicht überschritten werden darf.","Buhnenbauwerk, Gefahr durch Sog und Wellenschlag. Insbesondere auf Badebetrieb und Schwimmer achten."],"img":["img/q/7b439bc53852.jpg"]},{"n":180,"q":"Welche Bedeutung hat folgendes Schifffahrtszeichen?","a":["Gesperrt für alle Maschinenfahrzeuge und Wassermotorräder wegen Badebetriebs.","Höchstgeschwindigkeit von 4,3 Knoten Fahrt durch das Wasser, die innerhalb von 500 m von der jeweiligen Uferlinie wegen Badebetriebs nicht überschritten werden darf.","Einzelgefahrenstelle, erkennbar an ihrer Farbgebung, die an allen Seiten mit einer maximalen Geschwindigkeit von 4,3 Knoten passiert werden kann.","Kennzeichnung besonderer Gebiete und Stellen, z. B. Warngebiet."],"img":["img/q/f004a3dc70c1.jpg"]},{"n":181,"q":"Welche Höchstgeschwindigkeit darf vor Stellen mit erkennbarem Badebetrieb - außerhalb des Fahrwassers - in einem Abstand von 500 m und weniger vom Ufer nicht überschritten werden?","a":["4,3 Knoten.","3,4 Knoten.","4,8 Knoten.","3,8 Knoten."]},{"n":182,"q":"Welche Bedeutung hat folgendes Schifffahrtszeichen?","a":["Kennzeichnung von besonderen Gebieten und Stellen.","Kennzeichnung von Sperrgebieten.","Kennzeichnung von Schießgebieten.","Kennzeichnung von Badegebieten."],"img":["img/q/7b79b93c0819.jpg"]},{"n":183,"q":"Woran ist ein militärisches Warngebiet zu erkennen, das wegen Schießübungen für die Schifffahrt gesperrt ist?","a":["An bestimmten Tag- und Nachtsignalen, die nach der Sperr- und Warngebietsverordnung der Generaldirektion Wasserstraßen und Schifffahrt (GDWS) für militärische Sperr- und Warngebiete an entsprechenden Signalstellen und auf Sicherungsfahrzeugen gezeigt werden.","An bestimmten Tag- und Nachtsignalen, die nach der Rheinpolizeiverordnung der Generaldirektion Wasserstraßen und Schifffahrt (GDWS) für militärische Sperr- und Warngebiete an entsprechenden Signalstellen am Ufer und auf const SKS_DATA = [{"id":"nav-1","s":"nav","n":1,"q":"Worauf müssen Sie als Schiffsführer vor Reiseantritt hinsichtlich der Seekarten und Seebücher achten?","a":"Auf Vollständigkeit der Unterlagen und deren Berichtigung auf den neuesten Stand."},{"id":"nav-2","s":"nav","n":2,"q":"Warum muss in der GPS-Navigation das jeweilige Kartendatum unbedingt berücksichtigt werden?","a":"Weil sich das von GPS verwendete Bezugssystem WGS 84 (World Geodetic System 1984) von anderen verwendeten Bezugssystemen (Kartendatum) unterscheiden kann."},{"id":"nav-3","s":"nav","n":3,"q":"Welche Differenzen können zwischen WGS 84 und anderen Bezugssystemen auftreten?","a":"Die Differenzen von φ und λ liegen im Allgemeinen in der Größenordnung von 0,1 kbl bis 1 kbl, also etwa von 20 bis 200 m. Es können größere Unterschiede auftreten."},{"id":"nav-4","s":"nav","n":4,"q":"Wo finden Sie in der Seekarte Angaben über das benutzte Bezugssystem und ggf. entsprechende Korrekturhinweise?","a":"Am Kartenrand unter dem Titel."},{"id":"nav-5","s":"nav","n":5,"q":"Wie lautet ggf. der Korrekturhinweis bezüglich GPS in der Seekarte, wenn das benutzte Kartendatum (z. B. ED 50) und WGS 84 nicht übereinstimmen?","a":"Durch Satellitennavigation (z. B. GPS) erhaltene Positionen im WGS 84 sind 0,... Minuten nordwärts/südwärts und 0,... Minuten westwärts/ostwärts zu verlegen, um mit dieser Karte übereinzustimmen."},{"id":"nav-6","s":"nav","n":6,"q":"Woran erkennen Sie, bis wann eine deutsche Seekarte \"amtlich\" berichtigt ist?","a":"Am Berichtigungsstempel des BSH oder einer amtlichen Seekartenberichtigungsstelle."},{"id":"nav-7","s":"nav","n":7,"q":"Woran erkennen Sie, bis wann eine britische Seekarte \"amtlich\" berichtigt ist?","a":"Am Berichtigungsstempel auf der Rückseite der Seekarte."},{"id":"nav-8","s":"nav","n":8,"q":"Was bedeutet der Stempel auf der britischen Seekarte: Corrected up to N.T.M. 3595 1998?","a":"Seekarte ist berichtigt bis zur Mitteilung Nummer 3595 der Admiralty Notices to Mariners (N.T.M.) in 1998."},{"id":"nav-9","s":"nav","n":9,"q":"Welche Angaben enthalten die Nachrichten für Seefahrer (NfS)?","a":"In den NfS werden für die sichere Schiffsführung wichtige Maßnahmen, Ereignisse und Veränderungen auf den Seeschifffahrtsstraßen, auf der Hohen See sowie in den Hoheitsgewässern anderer Staaten im europäischen und angrenzenden Bereich bekannt gegeben."},{"id":"nav-10","s":"nav","n":10,"q":"In welcher Sprache werden die Nachrichten für Seefahrer (NfS) verfasst?","a":"Die Angaben erfolgen in deutscher und in englischer Sprache."},{"id":"nav-11","s":"nav","n":11,"q":"Welche Angaben enthalten deutsche und britische Leuchtfeuerverzeichnisse?","a":"Beschreibung der Leuchtfeuer, Feuerschiffe und Großtonnen sowie deren geographische Lage."},{"id":"nav-12","s":"nav","n":12,"q":"Welche schwimmenden Schifffahrtszeichen werden in der britischen List of Lights und in deutschen Leuchtfeuerverzeichnissen nicht angegeben?","a":"Tonnen kleiner als 8 m Höhe."},{"id":"nav-13","s":"nav","n":13,"q":"Wo finden Sie Angaben über die Merkmale der Schifffahrtszeichen?","a":"1. In den Leuchtfeuerverzeichnissen bzw. in der List of Lights sowie auszugsweise in den Seekarten.\n2. In der Karte 1/ INTInternational Hydrographic 1 des BSH.\n3. Schwimmende Schifffahrtszeichen zusätzlich in der Anlage I zur SeeSchStrO (z. B. Tonnen des Lateral- bzw. Kardinalsystems)."},{"id":"nav-14","s":"nav","n":14,"q":"Worauf beziehen sich die Höhenangaben der Leuchtfeuer in Leuchtfeuerverzeichnissen in der Nord- und Ostsee?","a":"In Gewässern mit Gezeiten (z. B. Nordsee) auf mittleres Hochwasser, in gezeitenlosen Gewässern (z. B. Ostsee) auf mittleren Wasserstand."},{"id":"nav-15","s":"nav","n":15,"q":"Wo finden Sie Angaben über Brückensignale?","a":"In den See- und Hafenhandbüchern und in den Seekarten."},{"id":"nav-16","s":"nav","n":16,"q":"Welche Themen (Grobgliederung) enthalten die Seehandbücher des BSH?","a":"1. Schifffahrtsangelegenheiten,\n2. Naturverhältnisse,\n3. Küstenkunde und Segelanweisungen."},{"id":"nav-17","s":"nav","n":17,"q":"Wie werden Richtungsangaben in nautischen Veröffentlichungen gemacht?","a":"1. Rechtweisend in Grad,\n2. im Uhrzeigersinn (rechtsherum) zählend."},{"id":"nav-18","s":"nav","n":18,"q":"In welchem Quadranten liegt der rote Warnsektor eines Leitfeuers mit der Angabe rot 030°-042° (Begründung!)","a":"Im Südwest-Quadranten. Angegeben sind die Peilungen zum Leuchtfeuer."},{"id":"nav-19","s":"nav","n":19,"q":"Was sind Leitfeuer (direction lights)?","a":"Leitfeuer sind Einzelfeuer, die durch Sektoren verschiedener Farbe oder Kennung (Leit- oder Warnsektoren) im Allgemeinen ein Fahrwasser, eine Hafeneinfahrt oder einen freien Seeraum zwischen Untiefen bezeichnen."},{"id":"nav-20","s":"nav","n":20,"q":"1. Was sind Richtfeuer (leading lights)?\n2. Wann befindet man sich in einer Richtlinie eines Richtfeuers?","a":"1. Richtfeuer sind Feuer, die als Unter- und Oberfeuer in Deckpeilung als Richtlinie beispielsweise einen Kurs im Fahrwasser, durch eine Hafeneinfahrt oder im freien Seeraum zwischen Untiefen bezeichnen.\n2. Ein Schiff befindet sich in der Richtlinie, wenn Unter- und Oberfeuer senkrecht unter-/übereinander erscheinen."},{"id":"nav-21","s":"nav","n":21,"q":"Was ist ein Torfeuer?","a":"Ein Torfeuer besteht aus zwei Feuern gleicher Höhe, gleicher Lichtstärke und gleicher Kennung, die zu beiden Seiten der Fahrwasserachse einander genau gegenüber (rechtwinklig zur Fahrwasserachse) und von der Fahrwasserachse gleich weit entfernt angeordnet sind."},{"id":"nav-22","s":"nav","n":22,"q":"Was ist die \"Tragweite\" eines Feuers?","a":"Unter Tragweite versteht man denjenigen Abstand, in dem ein Feuer einen eben noch deutlichen Lichteindruck im Auge des Beobachters hervorruft."},{"id":"nav-23","s":"nav","n":23,"q":"Was ist die \"Nenntragweite\" eines Feuers?","a":"Nenntragweite ist die Tragweite eines Feuers für einen definierten Wert bei einer meteorologischen Sichtweite am Tage von 10 sm."},{"id":"nav-24","s":"nav","n":24,"q":"Wovon hängt die \"Tragweite\" eines Feuers ab?","a":"Sie hängt u. a. ab\n1. von der Lichtstärke (Helligkeit) des Feuers und\n2. vom Sichtwert (Lichtdurchlässigkeit der Atmosphäre)."},{"id":"nav-25","s":"nav","n":25,"q":"In der Seekarte finden Sie bei einem Leuchtfeuer die Eintragung: 18 M. Was bedeutet diese Angabe?","a":"Es ist die Nenntragweite, hier 18 Seemeilen."},{"id":"nav-26","s":"nav","n":26,"q":"Was ist die \"Sichtweite\" eines Feuers? Wovon hängt sie ab?","a":"Sichtweite ist die Entfernung, auf die ein Leuchtfeuer über die Erdkrümmung (Kimm) hinweg vom Beobachter gesehen werden kann. Sie hängt ab\n1. von der Feuerhöhe und\n2. von der Augeshöhe des Beobachters."},{"id":"nav-27","s":"nav","n":27,"q":"Wie müssen sich Tragweite und Sichtweite zueinander verhalten, damit das Verfahren zur Ortsbestimmung \"Feuer in der Kimm\" angewandt werden kann?","a":"Die Tragweite muss mindestens gleich der Sichtweite sein."},{"id":"nav-28","s":"nav","n":28,"q":"Wo findet man Tabellen zur Ermittlung des Abstandes eines Feuers in der Kimm?","a":"In deutschen und britischen Leuchtfeuerverzeichnissen."},{"id":"nav-29","s":"nav","n":29,"q":"Wo sind die in Seekarten verwendeten Symbole und Abkürzungen erklärt?","a":"In der Karte 1/INT des BSH."},{"id":"nav-30","s":"nav","n":30,"q":"Wer veröffentlicht die Bekanntmachungen für Seefahrer (BfS) und was umfassen diese Veröffentlichungen?","a":"1. Die BfS werden von den jeweils zuständigen Behörden der Wasser- und Schifffahrtsverwaltung des Bundes bzw. der Länder veröffentlicht.\n2. Sie enthalten alle wichtigen Maßnahmen und Ereignisse auf den Seeschifffahrtsstraßen und der ausschließlichen Wirtschaftszone Deutschlands."},{"id":"nav-31","s":"nav","n":31,"q":"Wie werden die Bekanntmachungen für Seefahrer (BfS) der Sportschifffahrt zur Kenntnis gebracht?","a":"Die BfS werden an den amtlichen Aushangstellen (z. B. bei Wasser- und Schifffahrtsämtern, Hafenverwaltungen, WSP - Dienststellen, Schleusen, Yachthäfen) für das betreffende Seegebiet, in dem die Aushangstelle liegt, und für die angrenzenden Reviere und Gebiete sowie im Internet unter www.elwis.de zur Kenntnis gebracht."},{"id":"nav-32","s":"nav","n":32,"q":"Zählen Sie die am häufigsten vorkommenden Ereignisse und Maßnahmen auf, über die die Bekanntmachungen für Seefahrer (BfS) unterrichten.","a":"1. Änderungen an Befeuerung, Betonnung und Landmarken,\n2. veränderte Wassertiefen,\n3. Wracke, Schifffahrtshindernisse, Rohrleitungen usw.,\n4. Bauarbeiten, Baggerarbeiten, militärische Übungen und damit zusammenhängende Sperrungen oder Behinderungen."},{"id":"nav-33","s":"nav","n":33,"q":"Wer gibt die nautischen Warnnachrichten (NWN) heraus und von wem werden sie verbreitet?","a":"Nautische Warnnachrichten (NWN) werden von den Verkehrszentralen für deren Zuständigkeitsbereich und von dem ständig besetzten Seewarndienst Emden für das gesamte deutsche Warngebiet zur Verbreitung über Funk herausgegeben. Der Rundfunksender Deutschlandfunk verbreitet alle über Funk abgegebenen NWN."},{"id":"nav-34","s":"nav","n":34,"q":"Was bedeutet der Zusatz \"vital\" bei einer nautischen Warnnachricht (NWN)?","a":"Die NWN erhält den Zusatz \"vital\", wenn die Warnung auf eine lebensbedrohende Gefahr hinweist."},{"id":"nav-35","s":"nav","n":35,"q":"Welche Besonderheit bezüglich des Zusatzes \"vital\" bei einer nautischen Warnnachricht (NWN) gibt es für die Sportschifffahrt?","a":"Vitale nautische Warnnachrichten für die Sportschifffahrt werden während der Zeit vom 1. April bis zum 31. Oktober zur Verbreitung über ausgewählte private und öffentlich-rechtliche Rundfunkanstalten weitergeleitet."},{"id":"nav-36","s":"nav","n":36,"q":"Wer gibt die Nachrichten für Seefahrer (NfS) heraus und wie und wie oft erfolgt die Herausgabe?","a":"Die NfS werden vom BSH in Heftform und im Internet herausgegeben und erscheinen einmal wöchentlich."},{"id":"nav-37","s":"nav","n":37,"q":"Welche Unterlage steht Ihnen zur Verfügung zur Berichtigung von britischen Seekarten, die nicht von den Nf
