}

/* ---------- Canvas-Grundgerüst für die Fahrspiele ---------- */
function canvasGame(title, rule) {
  gameShell(title, `<div class="gamewrap"><canvas id="gc"></canvas><div class="gameover hidden" id="gover"></div></div><p class="small muted" style="margin:8px 2px">${rule}</p>`);
  const c = $('#gc'), wrap = c.parentElement, dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.min(520, wrap.clientWidth), H = Math.min(560, Math.round(window.innerHeight * .62));
  c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const boat = {x: W / 2, y: H - 70, tx: W / 2};
  const setX = clientX => { const r = c.getBoundingClientRect(); boat.tx = Math.max(24, Math.min(W - 24, clientX - r.left)); };
  c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); setX(e.clientX); });
  c.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') setX(e.clientX); });
  return {c, ctx, W, H, boat};
}
function drawBoatTop(ctx, x, y) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#fbf6ec'; ctx.beginPath(); ctx.moveTo(0, -30); ctx.quadraticCurveTo(16, -8, 13, 24); ctx.lineTo(-13, 24); ctx.quadraticCurveTo(-16, -8, 0, -30); ctx.fill();
  ctx.fillStyle = '#3d5f8f'; ctx.fillRect(-9, 0, 18, 12); ctx.fillStyle = '#5a3e2a'; ctx.fillRect(-1.5, -18, 3, 26); ctx.restore();
}
function drawWater(ctx, W, H, t) {
  ctx.fillStyle = '#2f6f8f'; ctx.fillRect(0, 0, W, H); ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2;
  for (let y = (t * .06) % 40 - 40; y < H; y += 40) { ctx.beginPath(); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, y + Math.sin((x + y) / 30) * 3); ctx.stroke(); }
}
function gameOver(score, key, again) {
  stopGames(); const nb = best(key, score), o = $('#gover'); if (!o) return;
  o.innerHTML = `<h2 style="margin:0 0 4px">${score} Punkte</h2><p class="muted" style="margin:0 0 10px">${nb ? 'Neuer Rekord!' : `Rekord: ${(S.best && S.best[key]) || 0}`}</p><button class="btn lamp" id="again">Nochmal</button>`;
  o.classList.remove('hidden'); $('#again').onclick = again;
}

/* ---------- Tonnen-Slalom (Betonnungssystem A, Einlaufen von See) ----------
   Rote Tonne (Stumpftonne, gerade Nummer) bleibt an Backbord, also links vom Boot.
   Grüne Tonne (Spitztonne, ungerade Nummer) bleibt an Steuerbord, also rechts vom Boot. */
function buoyGame() {
  const g = canvasGame('Tonnen-Slalom', 'Du läufst von See in den Hafen ein. Zieh das Boot so, dass rote Tonnen links (Backbord) und grüne Tonnen rechts (Steuerbord) an dir vorbeiziehen.');
  const {ctx, W, H, boat} = g; let buoys = [], score = 0, lives = 3, t0 = performance.now(), last = t0, spawn = 0, msg = '', msgT = 0, num = 1;
  const step = now => {
    const dt = Math.min(50, now - last); last = now; const t = now - t0, speed = .11 + Math.min(.12, t / 120000);
    spawn -= dt; if (spawn <= 0) { const red = Math.random() < .5; buoys.push({x: W * (.25 + Math.random() * .5), y: -30, red, n: red ? (num % 2 ? num + 1 : num) : (num % 2 ? num : num + 1), done: false}); num += 1; spawn = 1500 - Math.min(700, t / 60); }
    boat.x += (boat.tx - boat.x) * .25;
    drawWater(ctx, W, H, t);
    buoys.forEach(b => {
      b.y += speed * dt;
      ctx.save(); ctx.translate(b.x, b.y);
      ctx.fillStyle = b.red ? '#d33a2c' : '#2e9a52';
      if (b.red) { ctx.fillRect(-11, -14, 22, 26); ctx.fillRect(-6, -24, 12, 8); } else { ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(13, 12); ctx.lineTo(-13, 12); ctx.fill(); }
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(String(b.n), 0, 8); ctx.restore();
      if (!b.done && b.y >= boat.y) {
        b.done = true; const dx = boat.x - b.x;
        if (Math.abs(dx) < 24) { lives--; msg = 'Rumms! Nicht rammen.'; AUD.crash(); }
        else if ((b.red && dx > 0) || (!b.red && dx < 0)) { score++; AUD.sfx('richtig', {vol: .35}); }
        else { lives--; msg = b.red ? 'Rote Tonne an Backbord lassen: Sie muss links von dir sein.' : 'Grüne Tonne an Steuerbord lassen: Sie muss rechts von dir sein.'; AUD.sfx('falsch', {vol: .35}); }
        msgT = now;
      }
    });
    buoys = buoys.filter(b => b.y < H + 40);
    drawBoatTop(ctx, boat.x, boat.y);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`${score} Punkte`, 12, 24); ctx.textAlign = 'right'; ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 12, 24);
    if (msg && now - msgT < 2200) { ctx.fillStyle = 'rgba(20,30,40,.75)'; ctx.fillRect(10, H - 30, W - 20, 24); ctx.fillStyle = '#fffaf0'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(msg, W / 2, H - 13); }
    if (lives <= 0) return gameOver(score, 'buoy', buoyGame);
    gameLoop = requestAnimationFrame(step);
  };
  gameLoop = requestAnimationFrame(step);
}

/* ---------- Fischfang ---------- */
function fishGame() {
  const g = canvasGame('Fischfang', 'Zieh das Boot hin und her. Fang die Fische, weich Treibholz und Quallen aus.');
  const {ctx, W, H, boat} = g; let items = [], score = 0, lives = 3, t0 = performance.now(), last = t0, spawn = 0;
  const step = now => {
    const dt = Math.min(50, now - last); last = now; const t = now - t0, speed = .12 + Math.min(.16, t / 90000);
    spawn -= dt; if (spawn <= 0) { const r = Math.random(); items.push({x: 20 + Math.random() * (W - 40), y: -20, k: r < .62 ? 'fish' : r < .82 ? 'wood' : 'jelly', w: Math.random() * 6}); spawn = 750 - Math.min(400, t / 80); }
    boat.x += (boat.tx - boat.x) * .3;
    drawWater(ctx, W, H, t);
    items.forEach(it => {
      it.y += speed * dt * (it.k === 'jelly' ? .7 : 1); const wob = Math.sin((t / 300) + it.w) * (it.k === 'fish' ? 6 : 2);
      ctx.save(); ctx.translate(it.x + wob, it.y);
      if (it.k === 'fish') { ctx.fillStyle = '#e8954a'; ctx.beginPath(); ctx.ellipse(0, 0, 12, 6, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(18, -6); ctx.lineTo(18, 6); ctx.fill(); ctx.fillStyle = '#2b2118'; ctx.beginPath(); ctx.arc(-6, -1, 1.4, 0, 7); ctx.fill(); }
      else if (it.k === 'wood') { ctx.fillStyle = '#7a4e33'; ctx.fillRect(-18, -5, 36, 10); ctx.fillStyle = '#5a3a24'; ctx.fillRect(-14, -2, 6, 4); }
      else { ctx.fillStyle = 'rgba(190,120,220,.85)'; ctx.beginPath(); ctx.arc(0, 0, 10, Math.PI, 0); ctx.fill(); ctx.strokeStyle = 'rgba(190,120,220,.85)'; ctx.lineWidth = 2; for (let k = -6; k <= 6; k += 4) { ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k + Math.sin(t / 200 + k) * 2, 12); ctx.stroke(); } }
      ctx.restore();
      if (!it.hit && Math.abs(it.y - boat.y) < 22 && Math.abs(it.x + wob - boat.x) < 26) {
        it.hit = true; it.y = H + 99;
        if (it.k === 'fish') { score++; AUD.sfx('richtig', {vol: .3}); } else { lives--; AUD.sfx('falsch', {vol: .35}); }
      }
    });
    items = items.filter(it => it.y < H + 30);
    drawBoatTop(ctx, boat.x, boat.y);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`${score} Fische`, 12, 24); ctx.textAlign = 'right'; ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 12, 24);
    if (lives <= 0) return gameOver(score, 'fish', fishGame);
    gameLoop = requestAnimationFrame(step);
  };
  gameLoop = requestAnimationFrame(step);
}

/* ---------- Manöver: Gashebel mit drei Stellungen, Ruder per Wischen ----------
   Aufgaben wie in der praktischen Prüfung: Ablegen, Anlegen, Mensch über Bord, Wenden auf engem Raum. */
const MANEUVERS = [
  {id: 'ablegen', name: 'Ablegen', tip: 'Leg vom Steg ab und fahr durch das Tor. Erst kurz rückwärts, dann vorwärts in die Mitte.', start: {x: 60, y: .62, h: -Math.PI / 2}, goal: {kind: 'gate', x: .5, y: .12}, dock: 'left'},
  {id: 'anlegen', name: 'Anlegen', tip: 'Fahr langsam an den Steg und stoppe parallel daneben. Nicht schneller als Schritttempo!', start: {x: .5, y: .9, h: -Math.PI / 2}, goal: {kind: 'dock'}, dock: 'left'},
  {id: 'mob', name: 'Mensch über Bord', tip: 'Jemand ist über Bord! Fahr ihn an und stopp direkt neben ihm, möglichst mit der Nase gegen den Wind.', start: {x: .5, y: .88, h: -Math.PI / 2}, goal: {kind: 'mob', x: .55, y: .3}},
  {id: 'wenden', name: 'Wenden auf engem Raum', tip: 'Dreh das Boot in der engen Box um 180 Grad: vor und zurück, Ruder jeweils umlegen.', start: {x: .5, y: .5, h: -Math.PI / 2}, goal: {kind: 'turn'}, box: true},
];
function maneuverGame() {
  let mi = S.best && S.best.manIdx ? S.best.manIdx % MANEUVERS.length : 0;
  const run = () => {
    const m = MANEUVERS[mi];
    gameShell('Manöver: ' + m.name, `<div class="gamewrap"><canvas id="gc"></canvas><div class="lever" id="lever"><b style="top:6px">voll</b><b style="top:66px">neutral</b><b style="top:128px">zurück</b><i style="top:58px"></i></div><button class="motorbtn" id="motbtn" aria-pressed="false">Motor<br>starten</button><div class="gameover hidden" id="gover"></div></div>
      <p class="small muted" style="margin:8px 2px">${esc(m.tip)} <b>Steuern:</b> Erst den Motor starten (nur in Neutral). Dann den Hebel stufenlos schieben: aus der Mitte nach oben legt den Vorwärtsgang ein, je weiter, desto mehr Gas. Nach unten rückwärts. Über das Wasser wischen legt das Ruder.</p>`);
    const c = $('#gc'), wrap = c.parentElement, dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.min(520, wrap.clientWidth), H = Math.min(560, Math.round(window.innerHeight * .62));
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px'; const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
    const boat = {x: (m.start.x < 1 ? m.start.x * W : m.start.x), y: m.start.y * H, h: m.start.h, v: 0, rudder: 0, gear: 0, turned: 0, motor: false};
    const wind = Math.random() * Math.PI * 2, mob = m.goal.kind === 'mob' ? {x: m.goal.x * W, y: m.goal.y * H} : null;
    const dock = m.dock ? {x: 0, y: H * .35, w: 26, h: H * .45} : null;
    let t0 = performance.now(), last = t0, done = false, msg = '', msgT = 0, bumps = 0;
    /* Gashebel */
    const lever = $('#lever'), knob = lever.querySelector('i');
    /* Stufenlos: Mitte = neutral (kleine Raste), oben bis voll voraus, unten bis voll zurück */
    const setGear = g => {
      const was = boat.gear; boat.gear = g; knob.style.top = (58 - g * 52) + 'px';
      if ((was === 0) !== (g === 0)) { AUD.click(); if (boat.motor && g !== 0) { msg = g > 0 ? 'Vorwärtsgang eingelegt' : 'Rückwärtsgang eingelegt'; msgT = performance.now(); } }
      if (!boat.motor && g !== 0 && was === 0) { msg = 'Der Motor läuft noch nicht'; msgT = performance.now(); }
      if (boat.motor) AUD.loop('motorLauf', .18 + Math.abs(g) * .3);
    };
    const onLever = e => { const r = lever.getBoundingClientRect(), y = (e.clientY - r.top) / r.height; let g = Math.max(-1, Math.min(1, (.5 - y) / .4)); if (Math.abs(g) < .14) g = 0; else g = Math.sign(g) * (Math.abs(g) - .14) / .86; setGear(Math.round(g * 20) / 20); };
    /* Motor an und aus. Starten nur in Neutral, wie auf dem echten Boot (Startsperre). */
    const mb = $('#motbtn');
    mb.onclick = () => {
      if (!boat.motor) {
        if (boat.gear !== 0) { msg = 'Erst auf Neutral, dann starten'; msgT = performance.now(); AUD.click(); return; }
        boat.motor = true; AUD.sfx('motorStart', {vol: .45}); setTimeout(() => { if (boat.motor && !done) AUD.loop('motorLauf', .18); }, 900);
        msg = 'Motor läuft. Kühlwasserstrahl kommt.'; msgT = performance.now();
      } else { boat.motor = false; AUD.loop('motorLauf', 0); msg = 'Motor aus'; msgT = performance.now(); AUD.click(); }
      mb.setAttribute('aria-pressed', String(boat.motor)); mb.innerHTML = boat.motor ? 'Motor<br>aus' : 'Motor<br>starten';
    };
    lever.addEventListener('pointerdown', e => { lever.setPointerCapture(e.pointerId); onLever(e); });
    lever.addEventListener('pointermove', e => { if (e.buttons) onLever(e); });
    /* Ruder per Wischen */
    let sx = null;
    c.addEventListener('pointerdown', e => { sx = e.clientX; });
    c.addEventListener('pointerup', e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) < 18) { boat.rudder = 0; msg = 'Ruder mittschiffs'; } else { boat.rudder = Math.max(-1, Math.min(1, dx / 90)); msg = dx > 0 ? 'Ruder Steuerbord' : 'Ruder Backbord'; } msgT = performance.now(); AUD.click(); });
    const finish = (ok, text) => { done = true; stopGames(); AUD.sfx(ok ? 'richtig' : 'falsch', {vol: .5}); const o = $('#gover'); o.innerHTML = `<h2 style="margin:0 0 4px">${ok ? 'Manöver geschafft!' : 'Noch mal'}</h2><p class="muted" style="margin:0 0 10px">${esc(text)}</p><div class="row"><button class="btn lamp" id="again">${ok ? 'Nächstes Manöver' : 'Nochmal'}</button></div>`; o.classList.remove('hidden'); $('#again').onclick = () => { if (ok) mi = (mi + 1) % MANEUVERS.length; S.best = S.best || {}; S.best.manIdx = mi; if (ok) best('man', (S.best.man || 0) + 1); save(); run(); }; };
    const step = now => {
      const dt = Math.min(50, now - last) / 1000; last = now; const t = now - t0;
      /* Fahrdynamik: Gas beschleunigt, Wasser bremst, Ruder wirkt nur mit Fahrt (rückwärts umgekehrt) */
      const pow = boat.motor ? (boat.gear > 0 ? boat.gear * 60 : boat.gear * 38) : 0; boat.v += (pow - boat.v) * (pow ? .9 : 1.2) * dt;

      {s: 'K', t: 'Das Manöver des letzten Augenblicks ist das {A:79} Es kommt dann, {A:80} Also wenn der andere nicht reagiert und es eng wird: selbst handeln.'},
      {s: 'T', t: 'Letzter Augenblick! Jetzt!'},
      {s: 'K', t: 'Na, was meinst du: Was bedeutet das Manöver des letzten Augenblicks?'},
      {s: 'Q', n: 79},
      {s: 'K', t: 'Beim nächsten Mal: Überholer, Behinderte und Nebel.'},
    ]},
    {id: 'sbf-09', title: 'Überholer, Behinderte und Nebel', topics: ['s1'], qs: [81, 82, 83, 84, 85, 86, 87, 88, 89, 90], minutes: 5, lines: [
      {s: 'M', t: 'Käpt\'n, ab wann bin ich eigentlich Überholer? Ich komme ja immer irgendwie von hinten.'},
      {s: 'K', t: 'Die Regel ist präzise: {A:81} Mehr als zwei Strich achterlicher als querab, das ist der Winkel, in dem der andere nachts nur dein Hecklicht sieht.'},
      {s: 'T', t: 'Hecklicht! Hecklicht!'},
      {s: 'M', t: 'Und was ist der Unterschied zwischen manövrierunfähig und manövrierbehindert? Das verwechsle ich dauernd.'},
      {s: 'K', t: 'Manövrierunfähig: {A:82} Da ist etwas kaputt. Manövrierbehindert: {A:83} Da ist jemand bei der Arbeit, Bagger, Kabelleger, Taucher.'},
      {s: 'K', t: 'Na, was meinst du: Wann gilt ein Fahrzeug als überholendes Fahrzeug?'},
      {s: 'Q', n: 81},
      {s: 'M', t: 'Nebel. Was machst du als Erstes, wenn die Sicht zu ist?'},
      {s: 'K', t: '{A:84} Langsam, Ohren auf, Pfeife bereit.'},
      {s: 'M', t: 'Thema Laternen: Darf ich mir irgendeine im Baumarkt kaufen?'},
      {s: 'K', t: 'Nein. Welche Vorschriften gelten? {A:85} Und zugelassen sind {A:86}'},
      {s: 'M', t: 'Und diese Autobahnen auf See, die Verkehrstrennungsgebiete?'},
      {s: 'K', t: '{A:87} Befahren: {A:88} Also immer rechts, wie auf der Autobahn.'},
      {s: 'T', t: 'Rechts fahren! Rechts!'},
      {s: 'M', t: 'Zwei Begriffe noch: in Sicht befindlich und sichere Geschwindigkeit.'},
      {s: 'K', t: 'In Sicht befindlich heißt: {A:89} Und sichere Geschwindigkeit: {A:90} Na, was meinst du: Was bedeutet in Sicht befindlich?'},
      {s: 'Q', n: 89},
      {s: 'K', t: 'Nächstes Mal lernen wir, Lichter zu lesen.'},
    ]},
    {id: 'sbf-10', title: 'Lichter lesen, Teil eins', topics: ['s2'], qs: [95, 96, 100, 101, 113, 114, 115], minutes: 4, lines: [
      {s: 'K', t: 'Nachtfahrt. Da draußen sind nur Lichter, und jedes erzählt eine Geschichte. Smilla, was führt ein Schlepphänger?'},
      {s: 'M', t: 'Geschleppte Fahrzeuge führen {A:95} Also wie ein Segler: kein weißes Topplicht.'},
      {s: 'K', t: 'Und am Tag zeigt der Schleppverband einen schwarzen Rhombus auf jedem Fahrzeug, wenn er {A:96}'},
      {s: 'T', t: 'Rhombus! Rhombus!'},
      {s: 'K', t: 'Jetzt das Wichtigste für die Nacht. Zwei rote Rundumlichter übereinander heißt: Ich kann nicht ausweichen. Manövrierunfähige Fahrzeuge ab 12 Metern in Fahrt führen {A:100}'},
      {s: 'M', t: 'Und wenn sie trotzdem noch durchs Wasser laufen?'},
      {s: 'K', t: 'Dann {A:101} Also rot rot, und die Seitenlichter dazu.'},
      {s: 'K', t: 'Na, was meinst du: Welche Lichter führt ein manövrierunfähiges Fahrzeug ab 12 Metern in Fahrt, ohne Fahrt durchs Wasser?'},
      {s: 'Q', n: 100},
      {s: 'M', t: 'Wer führt denn nur Seitenlichter und Hecklicht, ohne das weiße Topplicht?'},
      {s: 'K', t: '{A:113} Siehst du nachts rot, grün und keinen weißen Punkt darüber, ist es kein Motorboot.'},
      {s: 'M', t: 'Und der Ankerlieger im Hafen?'},
      {s: 'K', t: 'Unter 50 Metern führt er {A:114} Große Pötte ab 100 Metern machen es anders, da leuchtet das ganze Deck: {A:115}'},
      {s: 'T', t: 'Weiß rundum! Weiß rundum!'},
      {s: 'K', t: 'Na, was meinst du: Welche Fahrzeuge führen nur Seitenlichter und ein weißes Hecklicht?'},
      {s: 'Q', n: 113},
      {s: 'K', t: 'Beim nächsten Mal die Spezialisten: Grundsitzer, Fischer und Tiefgangbehinderte.'},
    ]},
    {id: 'sbf-11', title: 'Lichter lesen, Teil zwei', topics: ['s2'], qs: [91, 92, 93, 94, 97, 98, 99, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112], minutes: 4, lines: [
      {s: 'M', t: 'Ich hab die Bilder aus dem Katalog mitgebracht. Käpt\'n, erklär mir die Logik, dann muss ich nicht alles auswendig lernen.'},
      {s: 'K', t: 'Die Logik: Ein Maschinenfahrzeug unter 50 Metern hat ein weißes Topplicht, Seitenlichter, Hecklicht. Ab 50 Metern kommt ein zweites Topplicht dazu, weiter achtern und höher.'},
      {s: 'M', t: 'Also: ein Topplicht, klein. Zwei Topplichter, groß.'},
      {s: 'K', t: 'Genau. Rot über rot: manövrierunfähig. Rot weiß rot: manövrierbehindert, der arbeitet. Rot über rot über rot: tiefgangbehindert, der kann nicht ausweichen, weil zu tief.'},
      {s: 'T', t: 'Rot weiß rot! Arbeitet!'},
      {s: 'M', t: 'Und der Grundsitzer?'},
      {s: 'K', t: 'Der zeigt die Ankerlichter plus zwei rote Rundumlichter übereinander. Ab 50 Metern zwei weiße Ankerlichter, vorne höher als hinten.'},
      {s: 'M', t: 'Und am Tag, ohne Lichter?'},
      {s: 'K', t: 'Dann hängen Signalkörper im Mast. Zwei Bälle übereinander: manövrierunfähig. Ball, Rhombus, Ball: manövrierbehindert. Drei Bälle: Grundsitzer. Ein Zylinder: tiefgangbehindert. Zwei Kegel mit den Spitzen zueinander: Fischer bei der Arbeit. Und der Rhombus auf jedem Fahrzeug: {A:96}'},
      {s: 'M', t: 'Fischer?'},
      {s: 'K', t: 'Trawler, also Schleppnetz: grün über weiß. Andere Fischer, etwa mit Treibnetz: rot über weiß. Merksatz von Smilla, bitte.'},
      {s: 'M', t: 'Grün über weiß, der Trawler schleppt fleißig. Rot über weiß, der Fischer bleibt stehen.'},
      {s: 'K', t: 'Na, was meinst du: Welches Fahrzeug führt die Lichter bei Frage einhundert?'},
      {s: 'Q', n: 100},
      {s: 'K', t: 'Und für die Prüfung gilt: Schau dir die Bilder im Lernteil an. Die Logik hast du jetzt, die Bilder liefert die Übungsrunde.'},
      {s: 'Q', n: 113},
      {s: 'K', t: 'Nächstes Mal wird es neblig: Töne statt Lichter.'},
    ]},
    {id: 'sbf-12', title: 'Töne im Nebel', topics: ['s3', 'b1'], qs: [4, 5, 116, 117, 118, 119, 120, 121, 122, 123, 124], minutes: 5, lines: [
      {s: 'K', t: 'Nebel über der Elbe. Du siehst nichts, aber du hörst alles. Erst die Grundlagen: Ein kurzer Ton dauert {A:4} Ein langer Ton {A:5}'},
      {s: 'T', t: 'Tuuuut! Das war lang!'},
      {s: 'M', t: 'Und was sagt mir ein langer Ton alle zwei Minuten?'},
      {s: 'K', t: 'Das ist {A:116} Zwei lange Töne hintereinander: {A:117}'},
      {s: 'M', t: 'Und lang, kurz, kurz?'},
      {s: 'K', t: 'Das rufen die, die nicht ausweichen können oder behindert sind: {A:118} Hinten dran antwortet manchmal lang, kurz, kurz, kurz, das ist {A:119}'},
      {s: 'K', t: 'Na, was meinst du: Ein langer Ton mindestens alle zwei Minuten, wer ist das?'},
      {s: 'Q', n: 116},
      {s: 'M', t: 'Und wir als Segler, 12 Meter lang, im Nebel?'},
      {s: 'K', t: '{A:120} Also wie die Behinderten, lang, kurz, kurz. Und unter 12 Metern: {A:121}'},
      {s: 'M', t: 'Und vor Anker?'},
      {s: 'K', t: 'Unter 100 Metern: {A:122} Ab 100 Metern: {A:123} Und zusätzlich darf jeder Ankerlieger warnen: {A:124}'},
      {s: 'T', t: 'Kurz, lang, kurz! Hier liege ich!'},
      {s: 'K', t: 'Na, was meinst du: Welches Schallsignal gibt ein Segelfahrzeug ab 12 Metern bei verminderter Sicht?'},
      {s: 'Q', n: 120},
      {s: 'K', t: 'Nächste Folge: Wer weicht wem aus?'},
    ]},
    {id: 'sbf-13', title: 'Wer weicht wem aus', topics: ['s4'], qs: [125, 126, 127, 128, 129, 130, 131, 132, 133, 134, 135, 136, 137], minutes: 5, lines: [
      {s: 'K', t: 'Die wichtigste Frage auf See: Kracht es gleich? Woran erkennst du das, Smilla?'},
      {s: 'M', t: '{A:125} Bleibt die Peilung gleich und der Abstand wird kleiner, dann treffen wir uns.'},
      {s: 'K', t: 'Zwei Segler, freier Seeraum, Wind von derselben Seite: {A:126} Zwei Maschinenfahrzeuge auf Gegenkurs: {A:127}'},
      {s: 'T', t: 'Luv weicht Lee! Luv weicht Lee!'},
      {s: 'M', t: 'Und Motorboot gegen Segler?'},
      {s: 'K', t: 'Im freien Seeraum: {A:128} Und das gilt für das Motorboot genauso gegenüber Fischern, Manövrierunfähigen und Manövrierbehinderten: {A:129} Aber der Segler ist nicht der König. Gegenüber einem manövrierunfähigen oder behinderten Fahrzeug: {A:132}'},
      {s: 'K', t: 'Na, was meinst du: Woran erkennt man die Gefahr eines Zusammenstoßes?'},
      {s: 'Q', n: 125},
      {s: 'M', t: 'Und die großen Pötte, die am Fahrwasser hängen?'},
      {s: 'K', t: 'Bei tiefgangbehinderten Fahrzeugen und bei den Großen im Fahrwasser gilt: {A:133} Da bist du mit deinem Jollenkreuzer einfach weg.'},
      {s: 'M', t: 'Als Kurshalter mache ich erst mal nichts?'},
      {s: 'K', t: 'Richtig, {A:135} Und der Ausweichpflichtige? {A:136} Keine Zentimeterkorrektur, sondern ein Manöver, das der andere sieht.'},
      {s: 'M', t: 'Und der Überholer?'},
      {s: 'K', t: '{A:137} Immer. Egal ob Segel oder Motor.'},
      {s: 'T', t: 'Überholer weicht aus!'},
      {s: 'K', t: 'Na, was meinst du: Wie muss sich ein Ausweichpflichtiger gegenüber dem Kurshalter verhalten?'},
      {s: 'Q', n: 136},
      {s: 'K', t: 'Nächstes Mal: Signale geben und Verkehrstrennungsgebiete.'},
    ]},
    {id: 'sbf-14', title: 'Fünf kurze Töne', topics: ['s4'], qs: [138, 139, 140, 141, 142, 143, 144, 145, 146, 147, 148, 149, 150, 151, 152], minutes: 5, lines: [
      {s: 'M', t: 'Nebel, und ich höre ein Signal irgendwo vor mir. Was jetzt?'},
      {s: 'K', t: '{A:138} Im Zweifel stoppen und lauschen.'},
      {s: 'M', t: 'Und bei klarer Sicht: Der andere müsste ausweichen, tut es aber nicht.'},
      {s: 'K', t: 'Dann {A:139} Fünf kurze Töne heißen: {A:140} Und ein Ankerlieger, der dir kurz, lang, kurz gibt: {A:141}'},
      {s: 'T', t: 'Fünf kurze! Hallo, aufwachen!'},
      {s: 'K', t: 'Na, was meinst du: Welche Bedeutung haben fünf kurze Töne?'},
      {s: 'Q', n: 140},
      {s: 'M', t: 'Verkehrstrennungsgebiet. Wie fahre ich da rein?'},
      {s: 'K', t: '{A:142} Queren: {A:143} Die Regeln dazu stehen {A:144}'},
      {s: 'M', t: 'Und wenn es auf dem Einbahnweg eng wird?'},
      {s: 'K', t: 'Maschinenfahrzeug bei Kollisionsgefahr: {A:145} Segler beim Queren: {A:146} Und allgemein für Fahrzeuge unter 20 Metern und Segler: {A:147}'},
      {s: 'M', t: 'Und der Bagger mitten im Fahrwasser, mit Bällen und Rhomben an der Rah?'},
      {s: 'K', t: 'Ball, Rhombus, Ball senkrecht übereinander heißt manövrierbehindert. Zeigt er seitlich noch zwei Bälle und zwei Rhomben, sagt er dir, wo es nicht geht und wo es geht: Die Seite mit den zwei Rhomben ist frei, die mit den zwei Bällen ist gesperrt. Das ist {A:148}'},
      {s: 'M', t: 'Rhombus frei, Ball gesperrt. Merk ich mir.'},
      {s: 'M', t: 'Ich hab mal ein Schiff mit einem roten Licht oder einer roten Flagge gesehen, und der Käpt\'n hat die Pfeife ausgemacht.'},
      {s: 'K', t: 'Das war {A:151} Rauchen verboten in der Nähe, logisch.'},
      {s: 'T', t: 'Pfeife aus! Pfeife aus!'},
      {s: 'M', t: 'Und wo steht eigentlich, welche Gewässer Seeschifffahrtsstraßen sind?'},
      {s: 'K', t: 'In der {A:152} Na, was meinst du: Wie quert man ein Verkehrstrennungsgebiet?'},
      {s: 'Q', n: 143},
      {s: 'K', t: 'Nächste Folge: Was im Fahrwasser gilt.'},
    ]},
    {id: 'sbf-15', title: 'Im Fahrwasser', topics: ['s5'], qs: [153, 154, 155, 156, 157, 158, 159, 160, 161, 165, 166, 167], minutes: 5, lines: [
      {s: 'K', t: 'Heute fahren wir die Elbe hoch. Was ist überhaupt ein Fahrwasser, Smilla?'},
      {s: 'M', t: '{A:156} Also das, was zwischen den Tonnen liegt.'},
      {s: 'K', t: 'Und welche Seite ist Steuerbord? {A:157} Merk dir: Von See kommend ist rechts Steuerbord, egal wie der Fluss sich windet.'},
      {s: 'T', t: 'Von See kommend! Von See!'},
      {s: 'M', t: 'Örtliche Sondervorschriften, wo stehen die?'},
      {s: 'K', t: 'In {A:153} Und die Verkehrszentrale im Funk? {A:158} Die haben den Überblick, du nicht.'},
      {s: 'K', t: 'Na, was meinst du: Welches ist die Steuerbordseite eines Fahrwassers?'},
      {s: 'Q', n: 157},
      {s: 'M', t: 'Blaues Blinklicht und ein weißer Stern am Himmel. Was ist los?'},
      {s: 'K', t: 'Blau blinkend: {A:154} Weiße Leuchtkugeln: {A:155} Beides heißt: Platz machen.'},
      {s: 'M', t: 'Nachts im Fahrwasser, kleiner Segler unter 12 Metern?'},
      {s: 'K', t: 'Da führt er {A:159} Und ein Motorboot unter 7 Metern? {A:160} Nachts hat der kleine Flitzer im Fahrwasser nichts verloren.'},
      {s: 'M', t: 'Beim Einlaufen in den Hafen, wenn ich nicht um die Ecke sehe?'},
      {s: 'K', t: '{A:161} Und wer einläuft oder quert: {A:165} Segler, die quer zum Fahrwasser kreuzen: {A:166} Außerhalb des Fahrwassers gelten {A:167}'},
      {s: 'T', t: 'Ein langer Ton! Tuuuut!'},
      {s: 'K', t: 'Na, was meinst du: Wie verhalten sich Fahrzeuge, die ins Fahrwasser einlaufen oder es queren?'},
      {s: 'Q', n: 165},
      {s: 'K', t: 'Nächstes Mal: Verbote, Kanal und Schleusen.'},
    ]},
    {id: 'sbf-16', title: 'Verbote, Kanal und Schleusen', topics: ['s5'], qs: [168, 169, 170, 171, 172, 173, 174, 175, 176, 178], minutes: 5, lines: [
      {s: 'M', t: 'Überholen verboten. Wo genau?'},
      {s: 'K', t: '{A:168} Kurz gesagt: überall, wo du nicht siehst, was kommt.'},
      {s: 'M', t: 'Und Wasserski, Jetski, Surfbretter?'},
      {s: 'K', t: 'Nur {A:169} Und die Zugboote und Surfer gegenüber allen anderen? {A:170}'},
      {s: 'T', t: 'Surfer weicht aus! Surfer!'},
      {s: 'M', t: 'Ankern verboten, wo?'},
      {s: 'K', t: '{A:171} Und wenn das eigene Boot gesunken ist und für andere gefährlich wird: {A:172}'},
      {s: 'K', t: 'Na, was meinst du: Wo ist das Überholen verboten?'},
      {s: 'Q', n: 168},
      {s: 'M', t: 'Nord-Ostsee-Kanal. Ich stehe vor der Schleuse. Wann darf ich rein?'},
      {s: 'K', t: '{A:173} Die Regeln dafür findest du in den {A:174} Drei unterbrochene rote Lichter am Weichenmast heißen: {A:175}'},
      {s: 'M', t: 'Und die Geschwindigkeitstafel im Kanal?'},
      {s: 'K', t: 'Die zeigt {A:176} Hörst du an einer Brücke oder Schleuse das besondere Schallsignal: {A:178}'},
      {s: 'T', t: 'Warten! Warten!'},
      {s: 'K', t: 'Na, was meinst du: Bei welchem Signal dürfen Sportboote in die Kanalschleusen einfahren?'},
      {s: 'Q', n: 173},

    {id: 'sbf-17', title: 'Zeichen, Flaggen und Sperren', topics: ['s5'], qs: [162, 163, 164, 177, 179, 180, 181, 182, 183, 184, 185, 186, 187, 188, 189], minutes: 5, lines: [
      {s: 'K', t: 'Heute wird es laut. Das allgemeine Gefahr- und Warnsignal lautet: {A:163} Und es wird gegeben, {A:164}'},
      {s: 'T', t: 'Lang kurz kurz kurz kurz! Zweimal!'},
      {s: 'M', t: 'Das klingt wie ein wütender Wecker.'},
      {s: 'K', t: 'Soll es auch. Na, was meinst du: Wie lautet das allgemeine Gefahr- und Warnsignal?'},
      {s: 'Q', n: 163},
      {s: 'M', t: 'Jetzt die Tafeln. Vor dem Badestrand?'},
      {s: 'K', t: 'Die Tafel heißt: {A:180} Und ohne Tafel, vor erkennbarem Badebetrieb außerhalb des Fahrwassers, gilt {A:181} Die Tafel mit der Acht: {A:179}'},
      {s: 'M', t: 'Und die anderen Zeichen? Schutzbedürftige Anlage, besondere Gebiete?'},
      {s: 'K', t: 'Die einen bedeuten {A:177} Die anderen: {A:182} Und militärische Warngebiete erkennst du {A:183} Sperrgebiet: {A:184}'},
      {s: 'T', t: 'Sperrgebiet! Nicht rein!'},
      {s: 'M', t: 'Flaggen. Das eine Signal hieß Anhalten.'},
      {s: 'K', t: 'Genau, {A:185} Und das Schallsignal der Polizei bedeutet: {A:186} Dauernde Sperrung der Straße: {A:187} Als Schallsignal: {A:188} Und außergewöhnliche Behinderung: {A:189}'},
      {s: 'K', t: 'Na, was meinst du: Welche Höchstgeschwindigkeit gilt vor Stellen mit erkennbarem Badebetrieb?'},
      {s: 'Q', n: 181},
      {s: 'K', t: 'Nächstes Mal: Tonnen am Fahrwasserrand.'},
    ]},
    {id: 'sbf-18', title: 'Tonnen am Rand', topics: ['s6'], qs: [190, 191, 192, 193, 194, 195, 196, 197, 198, 199], minutes: 4, lines: [
      {s: 'M', t: 'Meine Lieblingsfolge, weil ich hier mal durchgefallen bin. Tonnen.'},
      {s: 'K', t: 'Dann erzähl du. Rot und grün?'},
      {s: 'M', t: 'Grün, spitz, ungerade Nummern: {A:191} Rot, stumpf, gerade Nummern: {A:192} Von See kommend.'},
      {s: 'T', t: 'Grün rechts, rot links, rein in den Hafen!'},
      {s: 'K', t: 'Und die rot-weiß gestreifte Kugel mitten drin?'},
      {s: 'M', t: 'Das ist die {A:190} Da kannst du drauf zufahren, darfst aber nicht drauf bleiben.'},
      {s: 'K', t: 'Na, was meinst du: Welche Bedeutung hat die grüne, spitze Tonne?'},
      {s: 'Q', n: 191},
      {s: 'M', t: 'Jetzt die gemeinen: Tonnen mit einem breiten Band in der anderen Farbe.'},
      {s: 'K', t: 'Grün mit rotem Band: {A:195} Rot mit grünem Band: {A:196} Die Grundfarbe sagt, wo das Hauptfahrwasser weitergeht.'},
      {s: 'M', t: 'Und nachts?'},
      {s: 'K', t: 'Steuerbordtonnen: {A:198} Backbordtonnen: {A:199} Die Kennung in der Karte liest sich so: Oc zwei R Whis heißt {A:197}'},
      {s: 'T', t: 'Heultonne! Uuuuh!'},
      {s: 'K', t: 'Na, was meinst du: Grüne Tonne mit rotem Band, was bedeutet sie?'},
      {s: 'Q', n: 195},
      {s: 'K', t: 'Nächstes Mal: Gefahr in vier Himmelsrichtungen.'},
    ]},
    {id: 'sbf-19', title: 'Gefahr in vier Himmelsrichtungen', topics: ['s6'], qs: [200, 201, 202, 203, 204, 205, 206, 207, 208, 209], minutes: 4, lines: [
      {s: 'K', t: 'Kardinaltonnen. Schwarz-gelb, mit zwei Kegeln oben. Smilla, wie liest man die?'},
      {s: 'M', t: 'Die Kegel zeigen, wo das tiefe Wasser ist. Beide Spitzen nach oben: Nord, {A:200} Beide nach unten: Süd, {A:202}'},
      {s: 'K', t: 'Spitzen auseinander, wie ein Ei: Ost, {A:201} Spitzen zueinander, wie eine Taille: West, {A:203}'},
      {s: 'T', t: 'Nord oben, Süd unten!'},
      {s: 'K', t: 'Und nachts blinken sie wie eine Uhr. Dauernd funkeln: {A:204} Drei Blitze: {A:205} Sechs plus ein langer: {A:206} Neun: {A:207}'},
      {s: 'M', t: 'Drei Uhr Osten, sechs Uhr Süden, neun Uhr Westen. Zwölf Uhr Norden funkelt durch.'},
      {s: 'K', t: 'Na, was meinst du: Was bedeutet die Kardinaltonne mit beiden Spitzen nach oben?'},
      {s: 'Q', n: 200},
      {s: 'M', t: 'Und die schwarz-rote mit zwei Bällen?'},
      {s: 'K', t: 'Das ist {A:208} Nachts: Fl zwei, also {A:209} Zwei Bälle, zwei Blitze, Einzelgefahr.'},
      {s: 'T', t: 'Zwei Bälle, zwei Blitze!'},
      {s: 'K', t: 'Na, was meinst du: Welche Bedeutung hat das Feuer mit der Kennung Fl zwei?'},
      {s: 'Q', n: 209},
      {s: 'K', t: 'Nächste Folge: Feuer, die den Weg weisen.'},
    ]},
    {id: 'sbf-20', title: 'Feuer, die den Weg weisen', topics: ['s6', 's7'], qs: [210, 211, 212, 213, 214, 215, 220, 221, 222, 223, 224], minutes: 5, lines: [

  const s = S.chap[u.id]; if (s && s.stage) return s.stage;
  const seen = u.qs.filter(n => st(n)).length;
  return seen >= Math.ceil(u.qs.length * .8) ? 'fertig' : 'neu';
}
const STAGE_NAMES = {neu: 'noch offen', vorab: 'geraten, Erklärung fehlt', erklaert: 'Abschluss-Quiz fehlt', fertig: 'geschafft'};

function startUnit(u) {
  const stg = unitStage(u);
  LOG.add('lernen', 'Kapitel ' + u.id + ' (' + stg + ')');
  if (stg === 'neu') return runVorab(u);
  if (stg === 'vorab') return explainUnit(u);
  if (stg === 'erklaert') return runAbschluss(u);
  runQuiz(shuffle(u.qs.map(n => QN[n])), 'Wiederholung: ' + u.label);
}
function runVorab(u) {
  AUD.sfx('glocke', {vol: .5});
  runQuiz(u.qs.map(n => QN[n]), 'Vorab-Quiz', 'learn', {
    noRequeue: true,
    hint: 'Einfach raten! Fehler sind hier ausdrücklich erwünscht. Danach erklärt dir die Crew genau das, was du noch nicht wusstest.',
    doneLabel: 'Weiter zur Erklärung',
    onDone: r => {
      S.chap[u.id] = {stage: r.wrong.length ? 'vorab' : 'fertig', miss: r.wrong, t: today()}; if (!r.wrong.length) markPath('unit'); save();
      if (r.wrong.length) explainUnit(u); else { toast('Alles gewusst. Respekt! Das Kapitel ist geschafft.'); setTab('cabin'); }
    },
  });
}
function runAbschluss(u) {
  const miss = (S.chap[u.id] && S.chap[u.id].miss) || [];
  runQuiz(shuffle(miss.map(n => QN[n]).filter(Boolean)), 'Abschluss-Quiz', 'learn', {
    doneLabel: 'Zurück in die Kajüte',
    onDone: () => { S.chap[u.id] = {...(S.chap[u.id] || {}), stage: 'fertig'}; markPath('unit'); save(); setTab('cabin'); },
  });
}
function explainUnit(u) {
  subScreen(); place = 'quiz'; soundFor('quiz');
  const miss = ((S.chap[u.id] && S.chap[u.id].miss) || []).map(n => QN[n]).filter(Boolean);
  const K = S.crew.K;
  app.innerHTML = `<div class="qhead"><div class="tag">Erklärung · ${esc(u.label)}</div><button class="btn small ghost" id="back">Kajüte</button></div>
    <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:8px">${charSVG(K)}<h1 style="margin:0">${esc(nameOf('K'))} erklärt</h1></div>
    <p class="muted small" style="margin:0 0 10px">Nur die ${miss.length} Fragen, die beim Raten noch nicht saßen.</p>
    <div class="card lesson" id="les"><p class="think">${esc(nameOf('K'))} stopft die Pfeife und überlegt…</p></div>
    <div class="card hidden" id="openq"></div>
    <div class="row"><button class="btn ghost hidden" id="read">Vorlesen</button><button class="btn lamp" id="nx">Zum Abschluss-Quiz</button></div>`;
  app.querySelector('svg.ch').style.width = '70px';
  $('#back').onclick = () => setTab('cabin');
  $('#nx').onclick = () => { VOX.stop('weiter zum Abschluss'); S.chap[u.id] = {...(S.chap[u.id] || {}), stage: 'erklaert'}; save(); runAbschluss(u); };
  const box = $('#les');
  const fallback = () => { box.innerHTML = `<h3>Die richtigen Antworten</h3><ul>${miss.map(q => `<li><strong>${esc(q.q)}</strong><br>${esc(ansText(q))}</li>`).join('')}</ul>`; };
  if (!apiKey()) { fallback(); return; }
  ai(`Diese Katalogfragen hat der Lernende beim Raten noch nicht gewusst:\n${miss.map(catLine).join('\n')}\n\nErkläre jetzt genau diese Inhalte in deiner Art, etwa ${Math.min(320, 90 + miss.length * 35)} Wörter. Nicht auswendig lernen lassen, sondern verstehen: Zusammenhänge, Bilder, Merkhilfen. Markiere wichtige Begriffe mit **fett**. Schreibe ganz am Ende in eine eigene Zeile genau eine offene Verständnisfrage an den Lernenden im Format: FRAGE: <Frage>`, {system: leadPersona(), onText: tx => { box.innerHTML = md(tx.split(/\nFRAGE:/)[0]); }})
    .then(tx => {
      const [body, fq] = tx.split(/\n?FRAGE:\s*/);
      box.innerHTML = md(body); clampLong(box);
      const r = $('#read'); if (r) { r.classList.remove('hidden'); r.onclick = () => { AUD.unlock(); VOX.stop('vorlesen neu'); VOX.say(K, body.replace(/\*\*/g, ''), 'live'); }; }
      if (fq && fq.trim()) openQuestion(fq.trim(), miss);
    })
    .catch(e => { fallback(); box.insertAdjacentHTML('afterbegin', `<p class="muted">${esc(aiErr(e))}</p>`); });
}
/* Eine offene Frage mit eigener Antwort (Text oder Sprache) */
function openQuestion(question, miss) {
  const c = $('#openq'); if (!c) return; c.classList.remove('hidden');
  c.innerHTML = `<div class="tag">Frage vom ${esc(ROLE_NAMES.K)}</div><p style="font-weight:700;margin:4px 0 8px">${esc(question)}</p>
    <textarea id="oa" placeholder="Antworte in deinen eigenen Worten…"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="oasend">Antworten</button>${VOX.canListen ? `<button class="btn ghost" id="oamic">Sprechen</button>` : ''}<button class="btn ghost" id="oaskip">Überspringen</button></div>
    <div id="oafb" class="lesson" style="margin-top:8px"></div>`;
  $('#oaskip').onclick = () => c.classList.add('hidden');
  const mic = $('#oamic'); if (mic) mic.onclick = async () => { AUD.unlock(); VOX.stop('sprechen statt tippen'); mic.textContent = 'Ich höre zu…'; mic.disabled = true; const r = await VOX.listen({onInterim: t => { $('#oa').value = t; }}).done; mic.textContent = 'Sprechen'; mic.disabled = false; if (r.text) $('#oa').value = r.text; };
  $('#oasend').onclick = async () => {
    const ans = $('#oa').value.trim(); if (!ans) return;
    const fb = $('#oafb'); fb.innerHTML = '<p class="think">Hm, mal sehen…</p>'; $('#oasend').disabled = true;
    try {
      const tx = await ai(`Verständnisfrage: ${question}\nAntwort des Lernenden: ${ans}\nPassende Katalogfragen mit verbindlicher Antwort:\n${miss.map(catLine).join('\n')}\nBewerte in 2 bis 3 kurzen Sätzen in deiner Art: Was stimmt, was fehlt oder ist falsch? Beginne mit "Richtig.", "Fast." oder "Nicht ganz."`, {system: leadPersona(), modelTier: 'quick', maxTokens: 220, onText: t => { fb.innerHTML = md(t); }});
      fb.innerHTML = md(tx); AUD.unlock(); VOX.say(S.crew.K, tx.replace(/\*\*/g, ''), 'live');
    } catch (e) { fb.innerHTML = `<p class="muted">${esc(aiErr(e))}</p>`; }
    $('#oasend').disabled = false;
  };
}
function reviewSession(title = 'Wiederholung', opts = {}) {
  const due = shuffle(Q.filter(q => isDue(q.n))).slice(0, Math.max(10, computePlan().cap));
  if (!due.length) return extraRound(opts);
  runQuiz(due, title, 'learn', opts);
}
/* Tagespfad: drei Etappen pro Tag, ein "Weiter" */
const coverage = () => Q.length ? Q.filter(q => st(q.n)).length / Q.length : 0;
function markPath(k) { todayPath(); S.path[k] = true; }
function todayPath() {
  const d = today(), due = Q.filter(q => isDue(q.n)).length;
  if (!S.path || S.path.day !== d || S.path.course !== S.course) S.path = {day: d, course: S.course, dueStart: due, review: false, unit: false, extra: false};
  const p = S.path, cov = coverage(), last = (S.exams || []).slice(-1)[0];
  const next = UNITS.find(u => ['vorab', 'erklaert'].includes(unitStage(u))) || UNITS.find(u => unitStage(u) === 'neu');
  const examDue = cov >= .6 && (!last || today() - last.day >= 3);
  const doneOpts = k => ({doneLabel: 'Zurück in die Kajüte', onDone: () => { markPath(k); save(); setTab('cabin'); }});
  return [
    {id: 'review', label: p.dueStart > 0 ? `Wiederholen (${due} fällig)` : 'Aufwärmen: 8 gemischte Fragen', done: p.review,
      run: () => due > 0 ? reviewSession('Wiederholung', doneOpts('review')) : warmup(doneOpts('review'))},
    {id: 'unit', label: next ? (unitStage(next) === 'neu' ? 'Neu: ' : 'Weiter: ') + next.label : (COURSE.kind === 'mc' ? 'Prüfungsfallen' : 'Wackelkandidaten'), done: p.unit,
      run: () => next ? startUnit(next) : trapRound(doneOpts('unit'))},
    {id: 'extra', label: examDue ? 'Probeprüfung bei Kapitän Harms' : 'Kajütenfunk: eine Folge', done: p.extra,
      run: () => examDue ? examIntro() : setTab('funk')},
  ];
}
function warmup(opts = {}) {
  const seen = Q.filter(q => st(q.n)), pool = seen.length >= 8 ? seen : Q;
  runQuiz(shuffle(pool).slice(0, 8), 'Aufwärmen', 'learn', opts);
}
function extraRound(opts = {}) {
  const pool = Q.filter(q => st(q.n)); if (!pool.length) return startUnit(UNITS[0]);
  runQuiz(shuffle(pool).sort((a, b) => st(b.n).w - st(a.n).w).slice(0, 10), 'Extrarunde', 'learn', opts);
}
/* Prüfungsfallen: Fragen, deren falsche Antworten der richtigen zum Verwechseln ähneln */
function trapRound(opts = {}) {
  if (COURSE.kind !== 'mc') { const weak = Q.filter(q => st(q.n) && st(q.n).w > 0).sort((a, b) => st(b.n).w - st(a.n).w).slice(0, 10); return weak.length ? runQuiz(weak, 'Deine Wackelkandidaten', 'learn', opts) : extraRound(opts); }
  const weak = Q.filter(q => st(q.n) && st(q.n).w > 0).sort((a, b) => st(b.n).w - st(a.n).w).slice(0, 5);
  const set = [...new Set([...weak, ...shuffle(TRAPS)])].slice(0, 10);
  runQuiz(set, 'Prüfungsfallen', 'learn', opts);
}

/* ---------- Was soll ich als Nächstes lernen? Der Käpt'n empfiehlt genau eine Sache. ---------- */
function recommendNext() {
  const due = Q.filter(q => isDue(q.n)).length, left = daysLeft(), chance = passChance(), dl = daily(), cap = computePlan().cap;
  const open = UNITS.find(u => ['vorab', 'erklaert'].includes(unitStage(u)));
  const next = UNITS.find(u => unitStage(u) === 'neu');
  const last = (S.exams || []).slice(-1)[0];
  if (open) return {label: `${open.label} zu Ende bringen`, say: `Wir haben ${open.label} angefangen. Das bringen wir erst sauber zu Ende, halbe Sachen gibt es auf See nicht.`, run: () => startUnit(open)};
  if (due >= 12) return {label: `${due} Wiederholungen`, say: `Erst wird aufgeklart: ${due} Fragen wollen wiederholt werden. Danach gibt es Neues.`, run: () => reviewSession()};
  if (left <= 10 && coverage() >= .6 && chance < .95 && (!last || today() - last.day >= 2)) return {label: 'Probeprüfung bei Kapitän Harms', say: `Noch ${left} Tage bis zur Prüfung. Zeit, dass Kapitän Harms dich mal richtig prüft.`, run: examIntro};
  if (next && dl.answered < cap) return {label: `Neu: ${next.label}`, say: `Als Nächstes nehmen wir uns ${next.label} vor. Erst rätst du, dann erkläre ich dir den Rest.`, run: () => startUnit(next)};
  if (due > 0) return {label: `${due} Wiederholungen`, say: `Bevor Feierabend ist: ${due} Fragen wollen noch einmal wiederholt werden.`, run: () => reviewSession()};
  if (!next) return COURSE.kind === 'mc' ? {label: 'Prüfungsfallen üben', say: 'Alle Kapitel hast du durch. Jetzt üben wir die gemeinen Fallen, bei denen die falschen Antworten fast gleich klingen.', run: trapRound} : {label: 'Wackelkandidaten üben', say: 'Alle Kapitel hast du durch. Jetzt nehmen wir uns die Fragen vor, die noch wackeln.', run: trapRound};
  return {label: 'Feierabend oder Extrarunde', say: `Für heute hast du dein Pensum geschafft. Wenn du noch Lust hast, machen wir eine Extrarunde.`, run: extraRound};
}

/* ---------- Auswahl der Prüfungsfragen: zuletzt gezeigte meiden, Schwächen etwas öfter ---------- */
function examPick() {
  const hist = S.examHist || [], recent = new Set(hist.slice(-60));
  const weight = q => { const s = st(q.n); let x = 1; if (!s) x += .5; else { x += Math.min(3, s.w * .8); if (s.b < 3) x += .7; } return recent.has(q.n) ? x * .12 : x; };
  const pick = (has, count) => {
    const pool = Q.filter(has), out = [];
    while (out.length < count && pool.length) {
      const ws = pool.map(weight), tot = ws.reduce((a, b) => a + b, 0); let r = Math.random() * tot, i = 0;
      while (i < pool.length - 1 && r > ws[i]) { r -= ws[i]; i++; }
      out.push(pool[i]); pool.splice(i, 1);
    }
    return out;
  };
  const qs = COURSE.exam.parts.flatMap(p => pick(p.has, p.count));
  S.examHist = hist.concat(qs.map(q => q.n)).slice(-90); save();
  return shuffle(qs);
}

/* ---------- Podcast: Kapitel für Kapitel, wenig Wiederholung, bis alles einmal dran war ---------- */
function pickStoryQs(topicId) {
  const used = new Set(S.storyQs || []), inT = t => q => t.has(q);
  let base = topicId && topicId !== 'auto' ? TOPICS.find(t => t.id === topicId) : null;
  if (!base) base = TOPICS.find(t => Q.some(q => inT(t)(q) && st(q.n) && !used.has(q.n))) || TOPICS.find(t => Q.some(q => inT(t)(q) && !used.has(q.n))) || TOPICS[0];
  let pool = Q.filter(q => inT(base)(q) && !used.has(q.n));
  if (pool.length < 4) for (const rid of RELATED[base.id] || []) { const rt = TOPICS.find(t => t.id === rid); pool = pool.concat(Q.filter(q => inT(rt)(q) && !used.has(q.n))); if (pool.length >= 5) break; }
  if (!pool.length) { S.storyQs = (S.storyQs || []).filter(n => !inT(base)(QN[n] || {n: 0})); pool = Q.filter(inT(base)); }
  const seenFirst = pool.filter(q => st(q.n)).concat(pool.filter(q => !st(q.n)));
  return {topic: base, qs: seenFirst.slice(0, 5).sort((a, b) => a.n - b.n)};
}

/* ---------- Bottom-Sheet für Menüs ---------- */
function sheet(html) {
  closeSheet();
  const w = document.createElement('div'); w.className = 'sheetwrap'; w.id = 'sheet';
  w.innerHTML = `<div class="sheetbg" data-close></div><div class="sheet" role="dialog" aria-modal="true"><button class="sheetx" data-close aria-label="Schließen">✕</button>${html}</div>`;
  document.body.appendChild(w);
  w.querySelectorAll('[data-close]').forEach(e => e.onclick = closeSheet);
  return w;
}
function closeSheet() { const s = $('#sheet'); if (s) s.remove(); }
const menuBtn = (id, label, sub) => `<button class="menuitem" data-m="${id}"><b>${label}</b>${sub ? `<small>${sub}</small>` : ''}</button>`;
/* Jedes Antippen ein anderes Miau, nie zweimal dasselbe hintereinander */
let lastMeow = -1;
function meow() { let k; do { k = Math.random() * 3 | 0; } while (k === lastMeow); lastMeow = k; AUD.sfx(['katze', 'katze2', 'katze3'][k], {vol: .6}); }

  const c = CREW[cidv], role = c.role;
  if (cidv === 'backbord') meow(); else if (cidv === 'klabauter') AUD.sfx('papagei', {vol: .5}); else AUD.click();
  const head = `<div class="sheethead">${charSVG(cidv)}<div><h2 style="margin:0">${esc(c.short)}</h2><p class="small muted" style="margin:0">${esc(c.blurb)}</p></div></div><div id="msay" class="menusay hidden"></div>`;
  let items = '';
  if (role === 'K') items = menuBtn('next', 'Was soll ich als Nächstes lernen?', 'Der Käpt\'n empfiehlt genau eine Sache.') + menuBtn('strat', 'Wie lerne ich am besten?', 'Strategie für deine Lage') + menuBtn('topic', 'Erklär mir ein Kapitel') + menuBtn('talk', 'Einfach klönen', 'Freies Gespräch') + menuBtn('garn', 'Erzähl mal was', 'Seefahrt, Fakten, Geschichten');
  if (role === 'M') items = menuBtn('quiz', 'Frag mich ab', 'Fällige Fragen oder eine Extrarunde') + menuBtn('traps', COURSE.kind === 'mc' ? 'Zeig mir die Prüfungsfallen' : 'Meine Wackelkandidaten', COURSE.kind === 'mc' ? 'Antworten, die fast gleich klingen' : 'Fragen, die noch nicht sitzen') + menuBtn('story', 'Kajütengeschichte', 'Über den Kajütenfunk') + menuBtn('tap', 'Sag was');
  if (role === 'T') items = menuBtn('mnemo', 'Merksprüche', 'Alle, die du schon bekommen hast') + (SIG_QS.length ? menuBtn('horn', 'Schallsignale üben', 'Wie am Horn an Deck') : '') + menuBtn('tap', 'Sag was');
  const w = sheet(head + `<div class="menu">${items}</div>`);
  const say = (t, kind = 'live') => { const m = $('#msay'); m.classList.remove('hidden'); m.textContent = t; AUD.unlock(); VOX.stop('Menü'); VOX.say(cidv, t, kind); };
  w.querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
    const m = b.dataset.m; AUD.click();
    if (m === 'next') {
      const r = recommendNext(); say(r.say, 'fixed');
      const go = document.createElement('button'); go.className = 'btn lamp wide'; go.style.marginTop = '10px'; go.textContent = 'Los geht\'s: ' + r.label;
      go.onclick = () => { closeSheet(); VOX.stop('Empfehlung gestartet'); r.run(); }; $('#msay').after(go); w.querySelector('.menu').classList.add('hidden');
    }
    if (m === 'strat' || m === 'garn') {
      if (!apiKey()) { closeSheet(); return needKey(); }
      const box = $('#msay'); box.classList.remove('hidden'); box.innerHTML = '<span class="think">Moment…</span>'; w.querySelector('.menu').classList.add('hidden');
      const ask = m === 'strat'
        ? `Gib mir in höchstens 4 Sätzen eine ehrliche, konkrete Lernstrategie für meine Lage. Daten: ${daysLeft()} Tage bis zur Prüfung, ${Q.filter(q => st(q.n) && st(q.n).b >= 3).length} von ${Q.length} Fragen sicher, ${Q.filter(q => isDue(q.n)).length} Wiederholungen fällig, ${UNITS.filter(u => unitStage(u) === 'fertig').length} von ${UNITS.length} Kapitelabschnitten geschafft, Bestehenschance etwa ${Math.round(passChance() * 100)} Prozent, ${S.profile.minutes} Minuten am Tag geplant. Empfohlen wird die Reihenfolge: erst raten, dann erklären lassen, dann nochmal. Keine Aufzählung.`
        : `Erzähl mir in höchstens 5 Sätzen etwas Spannendes aus der Seefahrt, passend zu meinem Seemannsgarn-Wunsch. Wenn es ein echter Fakt oder eine wahre Geschichte ist, muss sie stimmen.`;
      try { const tx = await ai(ask, {system: leadPersona(), modelTier: 'quick', maxTokens: 320, onText: t => { box.textContent = t.replace(/\*\*/g, ''); }}); say(tx.replace(/\*\*/g, '')); }
      catch (e) { box.textContent = aiErr(e); }
    }
    if (m === 'topic') {
      w.querySelector('.menu').innerHTML = TOPICS.map(t => menuBtn('t:' + t.id, t.name)).join('');
      w.querySelectorAll('[data-m^="t:"]').forEach(x => x.onclick = () => { closeSheet(); const t = TOPICS.find(tt => tt.id === x.dataset.m.slice(2)); showLesson(t, () => setTab('cabin')); });
    }
    if (m === 'talk') { closeSheet(); startTalk(); }
    if (m === 'quiz') { closeSheet(); reviewSession('Abfrage von ' + c.short); }
    if (m === 'traps') { closeSheet(); trapRound(); }
    if (m === 'story') { closeSheet(); openFunk(); }
    if (m === 'horn') { closeSheet(); hornQuiz(); }
    if (m === 'tap') say(lineOf(cidv, 'tap'), 'fixed');
    if (m === 'mnemo') {
      const list = Object.entries(S.mnemo || {}); const box = $('#msay'); box.classList.remove('hidden');
      box.innerHTML = list.length ? list.slice(-12).reverse().map(([n, t]) => `<p style="margin:0 0 8px"><b>${esc(QN[n] ? qLabel(QN[n]) : 'Frage ' + n)}:</b> ${esc(t)}</p>`).join('') : 'Noch keine Merksprüche. Die gibt es, wenn du eine Frage falsch hast: Tippe dann auf „Merkspruch“.';
    }
  });
}
function chaptersSheet() {
  AUD.sfx('buchAuf', {vol: .6});

    <div class="menu">${UNITS.map(u => { const s = unitStage(u); return `<button class="menuitem" data-u="${u.id}"><b>${esc(u.label)}</b><small>${STAGE_NAMES[s]} · ${u.qs.length} Fragen</small></button>`; }).join('')}</div>`;

}

    <div class="menu">${Object.values(COURSES).map(c => menuBtn('c:' + c.id, c.name + (c.id === S.course ? ' ✓' : ''), c.kind === 'open' ? 'Freie Antworten, Fragebogen mit 60 Punkten' : 'Multiple Choice, 30 Fragen')).join('')}</div>`);
  w.querySelectorAll('[data-m^="c:"]').forEach(b => b.onclick = () => { const id = b.dataset.m.slice(2); closeSheet(); if (id !== S.course) { switchCourse(id); toast('Jetzt lernst du für den ' + COURSES[id].name + '.'); } setTab(tab === 'deck' ? 'deck' : 'cabin'); });
}
