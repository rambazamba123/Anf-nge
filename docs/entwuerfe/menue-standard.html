<!doctype html>
<html lang="de" data-glas="weich" data-stil="laviert">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menüs Standard-Glas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Menüs im Standard-Glas (Entwurf v5.80, E34): Deck und Kajüte wie in der heutigen App, auf der Glasbühne (film.js).
   Deck: Bild oben (so groß wie möglich), darunter Smillas Zettel und „Weiter“ nebeneinander, dann das Schiffsrennen; alles ohne Scrollen.
   Kajüte: bildschirmfüllend. Antippen: die Kamera fährt heran. Knotenbrett: fast Vollbild, dann Überblendung auf dasselbe Brett, scharf und mit Namen.
   Seekarte: heranfahren und dabei langsam kippen, bis man von oben auf den Tisch schaut. Keine pulsierenden Knöpfe; das Fernglas zeigt, was man antippen kann (R13). */
:root{--hfont:"Baloo 2","Trebuchet MS",sans-serif;--bfont:"Nunito","Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark;
  --grund:#15212c;--karte:#1f2e3b;--rand:rgba(255,255,255,.14);--tinte:#f1ead8;--tinteHell:#a9b4bd;--akzent:#e1a03c;--akzentTinte:#2a1a07;--gut:#7fbf7a;--bahn:#2f5670;--holz:#3a2a1c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0b08;font-family:var(--bfont);overflow:hidden;color:var(--tinte)}
#wahl{position:fixed;left:0;right:0;top:0;z-index:60;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;background:rgba(14,11,8,.94);display:flex;flex-direction:column;gap:4px}
#wahl .z{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
#wahl button,#wahl a{flex:none;font:700 12px var(--bfont);border:1px solid #6b553c;background:#2a2118;color:#f3e7c9;border-radius:999px;padding:5px 11px;cursor:pointer;text-decoration:none}
#wahl button[aria-pressed="true"]{background:#e8963a;color:#2a1a05;border-color:#e8963a}
#info{color:#cdbb98;font-size:11.5px;line-height:1.25;min-height:15px}
#rahmen{position:fixed;left:0;right:0;bottom:0;top:var(--oben,70px);display:grid;place-items:center}
#tel{position:relative;height:100%;aspect-ratio:400/860;max-width:100vw;overflow:hidden;background:var(--grund)}
@media (min-width:700px){#tel{border-radius:26px;height:calc(100% - 20px);box-shadow:0 18px 50px rgba(0,0,0,.6)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.buehne{position:relative;flex:1;min-height:0;overflow:hidden}
.buehne .fb{border-radius:0}
.ecke{position:absolute;top:10px;right:10px;z-index:6;display:flex;gap:8px}
.ecke button{width:42px;height:42px;border-radius:12px;border:1px solid var(--rand);background:rgba(21,33,44,.82);color:var(--tinte);display:grid;place-items:center;cursor:pointer;font-size:19px}
.ecke svg{width:22px;height:22px}
.tipp{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;font:800 13px var(--bfont);color:#2b2a26;background:rgba(253,250,242,.92);border-radius:999px;padding:7px 14px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25)}
/* Deck unten: so knapp wie in der App */
.unten{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px 10px;background:var(--grund)}
.karte{position:relative;background:var(--karte);border:1px solid var(--rand);border-radius:14px;padding:9px 11px;color:var(--tinte)}
.karte b{font-family:var(--hfont);font-size:15px;line-height:1.1;display:block}
.karte small{display:block;font-size:11.5px;color:var(--tinteHell);line-height:1.2}
.paar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paar .karte{display:flex;align-items:center;gap:8px;min-height:58px;cursor:pointer}
.zettel .kopf{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;background:#f3e6c8;border:2px solid #d9c49a}
.weiter{background:var(--akzent)!important;border-color:transparent!important;color:var(--akzentTinte)!important}
.weiter small{color:rgba(42,26,7,.75)!important}
.weiter .play{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.2);display:grid;place-items:center;flex:none;font-size:13px}
.rennen .kopfz{display:flex;justify-content:space-between;align-items:baseline}
.rennen .kopfz small{color:var(--akzent);font-weight:800}
.rennen .bahn{position:relative;height:20px;border-radius:10px;background:var(--bahn);margin:12px 30px 6px 4px}
.rennen .bahn .b{position:absolute;top:50%;transform:translate(-50%,-70%);line-height:0}
.rennen .ziel{position:absolute;right:-30px;top:50%;transform:translateY(-50%)}
.rennen .leg{display:flex;gap:14px;font-size:11px;color:var(--tinteHell)}
.rennen .leg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.nav{flex:none;display:flex;background:var(--holz);border-top:1px solid #5a4430;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;border-right:1px solid rgba(0,0,0,.25);background:none;color:#e9d9b6;font:800 12px var(--bfont);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;opacity:.8}
.nav button:last-child{border-right:0}
.nav button.an{color:#ffc35c;opacity:1}
.nav svg{width:24px;height:24px}
/* Kajüte */
.bw{position:relative;flex:1;min-height:0;overflow:hidden}
.bw .buehne{position:absolute;inset:0}
.over{position:absolute;inset:0;z-index:5}
.fernglas{position:absolute;right:10px;bottom:10px;z-index:9;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,250,240,.92);color:#2a2019;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fernglas svg{width:26px;height:26px}
.kringel{position:absolute;z-index:6;border:3px solid #ffd27a;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px rgba(0,0,0,.25);animation:kringel 2.6s ease-out forwards}
@keyframes kringel{0%{opacity:0;transform:scale(1.25)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.zoom .fernglas{opacity:0;pointer-events:none}
.detail{position:absolute;inset:0;z-index:7;pointer-events:none}
.detail>*{pointer-events:auto;position:absolute;opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s}
.detail.an>*{opacity:1;transform:none}
.detail.an>*:nth-child(2){transition-delay:.1s}.detail.an>*:nth-child(3){transition-delay:.2s}.detail.an>*:nth-child(4){transition-delay:.3s}.detail.an>*:nth-child(5){transition-delay:.4s}.detail.an>*:nth-child(n+6){transition-delay:.5s}
.tag{font:800 11px var(--bfont);padding:3px 8px;border-radius:999px;background:rgba(31,46,59,.9);border:1px solid var(--rand);color:var(--tinte);white-space:nowrap}
.tag.ok{background:#2f5a35;border-color:#7fbf7a}
.zur{left:10px;top:10px;font:800 13px var(--bfont);padding:8px 12px;border-radius:12px;border:1px solid var(--rand);background:rgba(21,33,44,.88);color:var(--tinte);cursor:pointer;z-index:12}
.los{font:800 14px var(--bfont);padding:11px 16px;border-radius:14px;border:0;background:var(--akzent);color:var(--akzentTinte);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.dkarte{background:rgba(31,46,59,.92);border:1px solid var(--rand);border-radius:14px;padding:10px 12px}
.dkarte b{font-family:var(--hfont);font-size:15px;display:block}.dkarte small{display:block;font-size:12px;color:var(--tinteHell)}
/* Knotenbrett nah: dasselbe Brett, scharf */
.nah{position:absolute;z-index:8;transform-origin:0 0;opacity:0}
.nah svg{width:100%;height:100%;display:block}
.nah .zelle{position:absolute;border:0;background:none;cursor:pointer;padding:0}
.nah .zelle span{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);font:800 10px var(--bfont);color:#f1ead8;background:rgba(20,30,40,.78);border-radius:999px;padding:1px 6px;white-space:nowrap;opacity:0;transition:opacity .4s}
.nah .zelle span.ok{background:#2f5a35}
.nah.fertig .zelle span{opacity:1}
.kblick{position:absolute;inset:0;z-index:11;background:rgba(14,11,8,.55);display:grid;place-items:center;opacity:0;transition:opacity .3s}
.kblick.an{opacity:1}
.kblick .p{width:86%;background:#f4ead2;border-radius:16px;padding:10px;color:#2b2a26;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.kblick canvas{width:100%;max-height:52vh;object-fit:contain;display:block;border-radius:10px}
.kblick b{font:800 17px var(--hfont)}
/* Seekarte: Tisch von oben */
.boden{position:absolute;inset:0;z-index:7;opacity:0;pointer-events:none;background:repeating-linear-gradient(90deg,#3d2717 0 38px,#45291a 38px 40px),#3d2717}
.oben{position:absolute;z-index:8;transform-origin:50% 50%;pointer-events:none}
.oben svg{width:100%;height:100%;display:block;overflow:visible}
.frei{flex:1;padding:14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;overflow:auto}
.frei .karte{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;text-align:center}
.frei svg{width:34px;height:34px;color:var(--tinte)}
</style>
</head>
<body>
<div id="wahl"><div class="z" id="cBild"></div><div id="info"></div></div>
<div id="rahmen"><div id="tel"></div></div>
<script src="../../figuren.js"></script>
<script src="../../boot.js"></script>
<script src="../../szenerie.js"></script>
<script src="../../knoten.js"></script>
<script src="../../brede.js"></script>
<script src="../../film.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id), F = window.FIGUREN, tel = $('tel');
const SYM = (k, cls) => window.SZENERIE && SZENERIE.SYM[k] ? SZENERIE.SYM[k].replace('<svg ', `<svg class="${cls || 'sy'}" `) : '';
/* Symbole der Leiste wie in index.html */
const TAB = {deck: '<path d="M3 18c3 2 6 2 9 0s6-2 9 0M12 3v11M12 4l6 8h-6"/>', kajuete: '<circle cx="12" cy="11" r="6"/><circle cx="12" cy="11" r="3"/><path d="M12 2v3M12 17v5"/>', frei: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>'};
const tabSvg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${TAB[k]}</svg>`;
const ZAHN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';
const FERN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="15" r="4"/><circle cx="17" cy="15" r="4"/><path d="M10.5 13.5h3M5 11l2-6h3l1 5M19 11l-2-6h-3l-1 5"/></svg>';
const BOOT = (c, w = 26) => `<svg width="${w}" height="${w * .7}" viewBox="0 0 26 18"><path d="M2 11h22l-4 6H6z" fill="${c}" stroke="#1b2733" stroke-width="1"/><path d="M12 1v10M12 2l7 8h-7" fill="#f3ead2" stroke="#1b2733" stroke-width="1"/></svg>`;

const BILDER = {deck: 'Deck', kajuete: 'Kajüte', knoten: 'Knotenbrett', karte: 'Seekarte am Tisch', frei: 'Frei üben'};
const INFO = {deck: 'Deck wie in der App: Bild so groß wie möglich, darunter Zettel und Weiter nebeneinander, dann das Rennen. Alles auf einen Bildschirm. Boot antippen: Kajüte.',
  kajuete: 'Kajüte bildschirmfüllend. Dinge antippen, das Fernglas zeigt, was geht. Die Kamera fährt hin und bleibt dort.',
  knoten: 'Knotenbrett: fast Vollbild, Überblendung auf dasselbe Brett, scharf. Die Bilder sind die Endbilder aus dem Knotenkurs. Knoten antippen: Animation.',
  karte: 'Seekarte: heranfahren und langsam kippen, bis man von oben auf den Tisch schaut.', frei: 'Frei üben wie bisher (nur angedeutet).'};
let bild = 'deck';
const kopf = id => `<svg viewBox="-19 -99 38 38" width="40" height="40">${F.figur(id, {blick: 'vorn', dreh: false, laune: 'froh'})}</svg>`;
function nav(an) { return `<div class="nav">${[['deck', 'Deck'], ['kajuete', 'Kajüte'], ['frei', 'Frei üben']].map(([k, n]) => `<button data-nav="${k}" class="${k === an ? 'an' : ''}">${tabSvg(k)}${n}</button>`).join('')}</div>`; }

/* ---------- Deck wie heute ---------- */
function deckHtml() {
  return `<div class="bw"><div class="buehne" id="b"></div><div class="ecke"><button aria-label="Werft">⚓</button><button aria-label="Einstellungen">${ZAHN}</button></div><span class="tipp" id="dtipp">Boot antippen: runter in die Kajüte</span></div>
    <div class="unten">
      <div class="paar"><div class="karte zettel"><span class="kopf">${kopf('smilla')}</span><div><b>Heute auf dem Zettel</b><small>Smilla: 3 Aufgaben</small></div></div>
        <div class="karte weiter"><span class="play">▶</span><div><small>Weiter: Folge 1-3</small><b>Leise raus</b></div></div></div>
      <div class="karte rennen"><div class="kopfz"><b>Noch 9 Tage bis zur Prüfung</b><small>2 Tage zurück</small></div>
        <div class="bahn"><span class="b" style="left:22%">${BOOT('#e1a03c')}</span><span class="b" style="left:34%">${BOOT('#8fa3b3')}</span><span class="ziel">🏁</span></div>
        <div class="leg"><span><i style="background:#e1a03c"></i>Du (Prüfungsreife 22 %)</span><span><i style="background:#8fa3b3"></i>Prüfungsboot</span></div></div>
    </div>${nav('deck')}`;
}
/* ---------- Kajüte ---------- */
const DINGE = [['knoten', 'fk-knotenbrett', 'Knotenbrett'], ['karte', 'fk-tischkarte', 'Seekarte'], ['telefon', 'fk-telefon', 'Telefon: Harms prüft'], ['manoever', 'fk-manoever', 'Manöverbrett'], ['buch', 'fk-buecher', 'Meine Prüfungen'], ['hocker', 'fk-hocker', 'Hocker: Hörreise'], ['klabauter', 'fk-klabauter', 'Klabauter: Lernkartei']];
function kajueteHtml() {
  return `<div class="bw" id="bw"><div class="buehne" id="b"></div><div class="over" id="over"><div class="detail" id="det"></div></div>
    <div class="ecke"><button aria-label="Einstellungen">${ZAHN}</button></div><button class="fernglas" id="fern" aria-label="Fernglas: zeigt, was man antippen kann">${FERN}</button></div>${nav('kajuete')}`;
}
function freiHtml() {
  return `<div class="frei">${[['frage', 'Fragen'], ['knoten', 'Knoten'], ['navi', 'Navigation'], ['licht', 'Lichter'], ['praxis', 'Manöver'], ['funk', 'Funk (später)']].map(([s, n]) => `<div class="karte">${SYM(s)}<b>${n}</b></div>`).join('')}</div>${nav('frei')}`;
}
const KN_NAMEN = {acht: 'Achtknoten', kreuz: 'Kreuzknoten', palstek: 'Palstek', schot: 'Schotstek', stopper: 'Stopperstek', webelein: 'Webeleinstek', webeleinslip: 'Webelein auf Slip', rundtoern: 'Rundtörn', klampe: 'Klampe'};
const KN_OK = {acht: 1, kreuz: 1, palstek: 1, schot: 1};
const DETAIL = {
  telefon: () => `<button class="zur" data-zurueck>‹ Kajüte</button><div class="dkarte" style="left:50%;top:16%;transform:translateX(-50%);width:76%;text-align:center"><b>Harms ist bereit</b><small>Fünf Fragen, keine Ausreden.</small></div><button class="los" style="left:50%;bottom:22px;transform:translateX(-50%)">☎️ Harms anrufen</button>`,
  manoever: () => `<button class="zur" data-zurueck>‹ Kajüte</button>${['Ablegen mit Spring', 'Anlegen', 'Wenden', 'Mann über Bord'].map((n, i) => `<span class="tag${i < 1 ? ' ok' : ''}" style="left:50%;top:${16 + i * 8}%;transform:translateX(-50%)">${i < 1 ? '✓ ' : ''}${n}</span>`).join('')}<button class="los" style="left:50%;bottom:22px;transform:translateX(-50%)">Anlegen üben</button>`,
  buch: () => `<button class="zur" data-zurueck>‹ Kajüte</button><div class="dkarte" style="left:8%;right:8%;top:12%">${[['Navigation', 34], ['Fahrregeln', 61], ['Lichter', 48], ['Recht', 80]].map(([n, p]) => `<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-top:4px"><span>${n}</span><span>${p} %</span></div><div style="height:7px;border-radius:4px;background:rgba(255,255,255,.12)"><div style="height:100%;width:${p}%;border-radius:4px;background:#7fbf7a"></div></div>`).join('')}</div><button class="los" style="left:50%;bottom:22px;transform:translateX(-50%)">Meine Prüfungen</button>`,
  hocker: () => `<button class="zur" data-zurueck>‹ Kajüte</button><div class="dkarte" style="left:50%;top:14%;transform:translateX(-50%);width:80%;text-align:center"><small>Hörreise</small><b>Folge 1-3: Leise raus</b><small>noch 14 Minuten</small></div><button class="los" style="left:50%;bottom:22px;transform:translateX(-50%)">▶ Weiterhören</button>`,
  klabauter: () => `<button class="zur" data-zurueck>‹ Kajüte</button><div class="dkarte" style="left:8%;top:62%;width:70%"><b>„Merken! Merken!“</b><small>9 Karten in der Lernkartei</small></div><button class="los" style="left:50%;bottom:22px;transform:translateX(-50%)">Lernkartei</button>`
};

/* ---------- Anzeigen ---------- */
async function zeigen() {
  $('info').textContent = INFO[bild];
  const ist = bild === 'deck' ? 'deck' : bild === 'frei' ? 'frei' : 'kajuete';
  tel.innerHTML = `<div class="screen" id="sc">${ist === 'deck' ? deckHtml() : ist === 'frei' ? freiHtml() : kajueteHtml()}</div>`;
  if (ist === 'frei') return;
  FILMB.reset(); FILMB.licht('mittag'); FILMB.mount($('b'));
  if (ist === 'deck') { await FILMB.ort('tankstelle', 'sofort', 'seite'); FILMB.sofort({p: [.5]}); FILMB.kamera('seite', 'deck', 'sofort'); extras('deck'); }
  else { await FILMB.ort('kajuete', 'sofort', 'innen'); FILMB.kamera('innen', 'totale', 'sofort'); extras('kajuete'); if (bild === 'knoten' || bild === 'karte') setTimeout(() => ran(bild), 500); }
}
/* Extras im Aquarell (spielen nicht mit): Muschelwichte am Steg, Mäuse am Mauseloch in der Kajüte; leben mit eigener kleiner Uhr */
let extraUhr = 0;
function extras(ist) {
  cancelAnimationFrame(extraUhr);
  let g;
  if (ist === 'deck') { const h = inBuehne('#fs-hilke'); if (!h) return; g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); h.parentNode.appendChild(g); }
  else { const kat = inBuehne('#fk-katze'); if (!kat) return; g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); kat.closest('svg').appendChild(g);
    g.insertAdjacentHTML('beforebegin', '<path d="M258 470 q0 -16 12 -16 q12 0 12 16Z" fill="#1e120a"/>'); }
  let t0 = performance.now(), last = 0;
  const lauf = now => { if (!g.isConnected) return; if (now - last > 80) { last = now; const t = ((now - t0) / 1000) * .35 % 1;
      g.innerHTML = ist === 'deck' ? `<g transform="translate(62 271) scale(.8)">${F.gruppe('muschelwicht', 2, {dreh: false, t})}</g>`
        : `<g transform="translate(270 474) scale(.95)">${F.figur('mausmutter', {dreh: false, pose: 'schnuppern', t})}</g><g transform="translate(252 476) scale(.8)">${F.figur('mauskind', {dreh: false, pose: 'putzen', t: (t + .4) % 1})}</g>`; }
    extraUhr = requestAnimationFrame(lauf); };
  extraUhr = requestAnimationFrame(lauf);
}
const inBuehne = sel => $('b') && $('b').querySelector(sel);
const relRect = el => { const r = el.getBoundingClientRect(), b = $('bw').getBoundingClientRect(); return {x: r.left - b.left, y: r.top - b.top, w: r.width, h: r.height}; };
let busy = false;
async function ran(k) {
  if (busy || !$('bw')) return; busy = true;
  $('bw').classList.add('zoom'); const det = $('det'); det.classList.remove('an'); det.innerHTML = '';
  if (k === 'karte') { await karteAuf(); busy = false; return; }
  if (k === 'knoten') brettZoom();
  await FILMB.kamera('innen', k, 'fahrt');
  if (k === 'knoten') { await brettAuf(); busy = false; return; }
  det.innerHTML = DETAIL[k] ? DETAIL[k]() : ''; requestAnimationFrame(() => det.classList.add('an')); busy = false;
}
async function zurueck() {
  if (busy) return; busy = true; const det = $('det'); det.classList.remove('an');
  const nah = document.querySelector('.nah'), oben = document.querySelector('.oben'), boden = document.querySelector('.boden');
  if (nah) { nah.classList.remove('fertig'); await nah.animate([{opacity: 1}, {opacity: 0}], {duration: 450, fill: 'forwards'}).finished; nah.remove(); }
  if (oben) { await kippen(false); oben.remove(); boden && boden.remove(); }
  await FILMB.kamera('innen', 'totale', 'fahrt'); det.innerHTML = ''; $('bw').classList.remove('zoom'); busy = false;
}

/* Knotenbrett: nach dem Heranfahren liegt dasselbe Brett scharf darüber und wächst auf fast Vollbild */
/* Wie nah die Kamera muss, damit das Brett fast den ganzen Bildschirm füllt (Ebene d = 0.2 wächst mit 1 + (z − 1) · 0.4) */
function brettZoom() {
  const g = inBuehne('#fk-knotenbrett'); if (!g) return;
  const r = relRect(g), W = $('bw').clientWidth, H = $('bw').clientHeight, c = FILMB.CAM && FILMB.CAM('kajuete:innen'), zl0 = 1;
  const f = Math.min(W * .97 / r.w, (H - 70) * .97 / r.h) * zl0, e = FILMB.EINST.innen.knoten;
  e.z = 1 + (f - 1) / .4; e.fy = 110 + 22 / f;  /* etwas tiefer, damit oben Platz für „‹ Kajüte“ bleibt */
}
async function brettAuf() {
  const g = inBuehne('#fk-knotenbrett'); if (!g) return;
  const bb = g.getBBox(), r = relRect(g);
  const nah = document.createElement('div'); nah.className = 'nah';
  Object.assign(nah.style, {left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px'});
  const {BRETT: Bt, KNOTEN_BRETT: KB} = FILMB.teile, ix = Bt.x + 8, iy = Bt.y + 24, cw = (Bt.w - 16) / 3, ch = (Bt.h - 32) / 3, pc = (v, a, l) => ((v - a) / l * 100).toFixed(2) + '%';
  nah.innerHTML = `<svg viewBox="${bb.x} ${bb.y} ${bb.width} ${bb.height}" preserveAspectRatio="none">${FILMB.teile.knotenbrett()}</svg>` +
    KB.map((kn, i) => `<button class="zelle" data-knoten="${kn}" aria-label="${KN_NAMEN[kn]}" style="left:${pc(ix + (i % 3) * cw, bb.x, bb.width)};top:${pc(iy + (i / 3 | 0) * ch, bb.y, bb.height)};width:${pc(bb.x + cw, bb.x, bb.width)};height:${pc(bb.y + ch, bb.y, bb.height)}"><span class="${KN_OK[kn] ? 'ok' : ''}">${KN_OK[kn] ? '✓ ' : ''}${KN_NAMEN[kn]}</span></button>`).join('');
  $('over').appendChild(nah);
  /* Überblendung: dasselbe Brett an derselben Stelle, nur scharf; dann erscheinen die Namen */
  await nah.animate([{opacity: 0}, {opacity: 1}], {duration: 650, easing: 'ease-in-out', fill: 'forwards'}).finished;
  nah.getAnimations().forEach(a => a.cancel()); nah.style.opacity = 1;
  nah.classList.add('fertig');
  const det = $('det'); det.innerHTML = `<button class="zur" data-zurueck>‹ Kajüte</button>`; requestAnimationFrame(() => det.classList.add('an'));
}
/* Knoten antippen: die echte Animation aus dem Knotenkurs läuft */
let raf = 0;
function knotenBlick(kn) {
  const A = KNOTEN.ANIM[kn]; if (!A) return;
  const d = document.createElement('div'); d.className = 'kblick'; d.innerHTML = `<div class="p"><canvas width="${A.W * 2}" height="${A.H * 2}"></canvas><b>${KN_NAMEN[kn]}</b><div style="display:flex;gap:8px;justify-content:center;margin-top:6px"><button class="los" data-zu>Zurück zum Brett</button></div></div>`;
  $('bw').appendChild(d); requestAnimationFrame(() => d.classList.add('an'));
  const cv = d.querySelector('canvas'), cx = cv.getContext('2d'); let t0 = performance.now();
  const lauf = now => { const t = ((now - t0) / 1000) % (A.DUR + 1.6); cx.setTransform(2, 0, 0, 2, 0, 0); A.draw(cx, Math.min(A.DUR, t)); raf = requestAnimationFrame(lauf); };
  cancelAnimationFrame(raf); raf = requestAnimationFrame(lauf);
  d.addEventListener('click', e => { if (e.target.closest('[data-zu]') || e.target === d) { cancelAnimationFrame(raf); d.remove(); } });
}

/* Seekarte: heranfahren, dann kippt der Blick langsam nach oben, bis der Tisch von oben zu sehen ist */
const TISCH_KIPP = Math.acos(26 / 118) * 180 / Math.PI;  /* Tischplatte im Bild: rx 118, ry 26 */
function tischOben() {
  const karte = BREDE.svg ? BREDE.svg('K1', {routen: [1], vb: '0 214 360 265', par: 'xMidYMid slice'}).replace('<svg ', '<svg x="-80" y="-59" width="160" height="118" ') : '';
  return `<svg viewBox="-118 -118 236 236"><defs><radialGradient id="mo-holz" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#b48352"/><stop offset="1" stop-color="#8a5f38"/></radialGradient>
    <clipPath id="mo-k"><rect x="-80" y="-59" width="160" height="118"/></clipPath></defs>
    <circle r="118" fill="#946640" stroke="#3a2412" stroke-width="2.4"/><circle r="112" fill="url(#mo-holz)"/>${[-80, -40, 0, 40, 80].map(y => `<path d="M-110 ${y} Q0 ${y + 6} 110 ${y}" stroke="#7a5233" stroke-width=".8" fill="none" opacity=".5"/>`).join('')}
    <rect x="-78" y="-56" width="160" height="118" fill="#000" opacity=".18"/><g clip-path="url(#mo-k)"><rect x="-80" y="-59" width="160" height="118" fill="#fbf8ef"/>${karte}</g><rect x="-80" y="-59" width="160" height="118" fill="none" stroke="#5a3a1c" stroke-width="1.3"/>
    <g transform="translate(70 66) rotate(-18)"><rect x="-26" y="-3" width="52" height="6" rx="1.5" fill="#c9a03c" stroke="#5a3a1c" stroke-width=".8"/></g>
    <g transform="translate(-92 -40)"><circle r="12" fill="#c9a03c" stroke="#5a3a1c" stroke-width="1.2"/><circle r="7" fill="#fff4cf" opacity=".8"/></g></svg>`;
}
async function kippen(hin) {
  const o = document.querySelector('.oben'), bo = document.querySelector('.boden'), W = $('bw').clientWidth, H = $('bw').clientHeight;
  const r = JSON.parse(o.dataset.r), d = W * 1.42, ziel = `translate(${W / 2 - (r.x + r.w / 2)}px,${H * .45 - (r.y + r.h / 2)}px) perspective(4000px) rotateX(0deg) scale(${d / r.w})`, start = `translate(0px,0px) perspective(4000px) rotateX(${TISCH_KIPP.toFixed(1)}deg) scale(1)`;
  const k = [{transform: start}, {transform: ziel}], b = [{opacity: 0}, {opacity: 1}];
  const dur = 1900, opt = {duration: dur, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards'};
  if (!hin) { k.reverse(); b.reverse(); opt.duration = 1200; }
  await Promise.all([o.animate(k, opt).finished, bo.animate(b, {...opt, duration: opt.duration * .8}).finished]);
}
async function karteAuf() {
  await FILMB.kamera('innen', 'karte', 'fahrt');
  const pl = inBuehne('#fk-tischplatte'); if (!pl) return;
  const r = relRect(pl), o = document.createElement('div'), bo = document.createElement('div');
  bo.className = 'boden'; o.className = 'oben'; o.dataset.r = JSON.stringify(r);
  /* quadratisch, so breit wie die Platte; gekippt deckt es die Ellipse im Bild genau ab */
  Object.assign(o.style, {left: r.x + 'px', top: (r.y + r.h / 2 - r.w / 2) + 'px', width: r.w + 'px', height: r.w + 'px', transform: `perspective(4000px) rotateX(${TISCH_KIPP.toFixed(1)}deg)`});
  o.innerHTML = tischOben(); $('over').append(bo, o);
  await o.animate([{opacity: 0}, {opacity: 1}], {duration: 450, fill: 'forwards'}).finished;
  await kippen(true);
  const det = $('det');
  det.innerHTML = `<button class="zur" data-zurueck>‹ Kajüte</button><div class="dkarte" style="left:50%;bottom:76px;transform:translateX(-50%);width:84%"><b>Abendwache 2 von 3</b><small>Schritt 2 von 4: Kurs ablesen. Tag 1: Kuttershaven → Klüverhafen</small></div><button class="los" style="left:50%;bottom:20px;transform:translateX(-50%)">Weiter am Kartentisch</button>`;
  requestAnimationFrame(() => det.classList.add('an'));
}
function fernglas() {
  for (const [, id] of DINGE) { const el = inBuehne('#' + id); if (!el) continue; const r = relRect(el), m = Math.max(r.w, r.h) + 18, k = document.createElement('div');
    k.className = 'kringel'; Object.assign(k.style, {left: (r.x + r.w / 2 - m / 2) + 'px', top: (r.y + r.h / 2 - m / 2) + 'px', width: m + 'px', height: m + 'px'}); $('over').appendChild(k); setTimeout(() => k.remove(), 2700); }
}
function treffer(e) {
  for (const [k, id] of DINGE) { const el = inBuehne('#' + id); if (!el) continue; const r = el.getBoundingClientRect(); if (e.clientX > r.left - 8 && e.clientX < r.right + 8 && e.clientY > r.top - 8 && e.clientY < r.bottom + 8) return k; }
  return null;
}
tel.addEventListener('click', e => {
  if (e.target.closest('[data-zurueck]')) return zurueck();
  const z = e.target.closest('[data-knoten]'); if (z) return knotenBlick(z.dataset.knoten);
  if (e.target.closest('#fern')) return fernglas();
  const n = e.target.closest('[data-nav]'); if (n) { bild = n.dataset.nav; chips(); zeigen(); return; }
  if (bild === 'deck' && e.target.closest('#b')) { bild = 'kajuete'; chips(); zeigen(); return; }
  if ($('bw') && !$('bw').classList.contains('zoom') && e.target.closest('#over')) { const k = treffer(e); if (k) ran(k); }
});
function chips() { $('cBild').innerHTML = Object.entries(BILDER).map(([k, n]) => `<button data-b="${k}" aria-pressed="${k === bild}">${n}</button>`).join('') + '<a href="figuren-gang.html">Backbord und Fabelwesen →</a>'; }
$('wahl').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (b) { bild = b.dataset.b; chips(); zeigen(); } });
const hoehe = () => document.documentElement.style.setProperty('--oben', $('wahl').offsetHeight + 'px'); addEventListener('resize', hoehe);
const los = () => { chips(); hoehe(); zeigen(); setTimeout(hoehe, 300); };
fetch('../../data/karte-brede.json').then(r => r.json()).then(j => window.BREDE && BREDE.setzen(j)).catch(() => {}).then(los);
})();
