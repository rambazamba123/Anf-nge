<!doctype html>
<html lang="de" data-glas="weich" data-stil="laviert">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menüs Standard-Glas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Menüs im Standard-Glas (Entwurf v5.81, E35). Deck und Kajüte wie in der App, auf der Glasbühne (film.js).
   Kajüte: Panorama zum Wischen in der alten Aufteilung; beim Wischen wandern nahe Ebenen etwas schneller (Tiefe), sonst fast alles klar.
   Antippen: Kamera fährt nah heran, dasselbe Ding liegt scharf darüber, Schilder mit passender Schrift; Seekarte auf dem Tisch kippt in die Draufsicht.
   Sprechen: echte Stimmen aus audio/stimmen; der Mund folgt der Lautstärke, an Deck dreht die Figur den Kopf her. Fernglas statt pulsierender Knöpfe (R13). */
:root{--hfont:"Baloo 2","Trebuchet MS",sans-serif;--bfont:"Nunito","Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark;
  --grund:#15212c;--karte:#1f2e3b;--rand:rgba(255,255,255,.14);--tinte:#f1ead8;--tinteHell:#a9b4bd;--akzent:#e1a03c;--akzentTinte:#2a1a07;--bahn:#2f5670;--holz:#3a2a1c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0b08;font-family:var(--bfont);overflow:hidden;color:var(--tinte)}
#wahl{position:fixed;left:0;right:0;top:0;z-index:60;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;background:rgba(14,11,8,.94);display:flex;flex-direction:column;gap:4px}
#wahl .z{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
#wahl button,#wahl a{flex:none;font:700 12px var(--bfont);border:1px solid #6b553c;background:#2a2118;color:#f3e7c9;border-radius:999px;padding:5px 11px;cursor:pointer;text-decoration:none}
#wahl button[aria-pressed="true"]{background:#e8963a;color:#2a1a05;border-color:#e8963a}
#info{color:#cdbb98;font-size:11.5px;line-height:1.25;min-height:15px}
#rahmen{position:fixed;left:0;right:0;bottom:0;top:var(--oben,70px);display:grid;place-items:center}
#tel{position:relative;height:100%;aspect-ratio:400/860;max-width:100vw;overflow:hidden;background:var(--grund)}
@media (min-width:700px){#tel{border-radius:26px;height:calc(100% - 20px);box-shadow:0 18px 50px rgba(0,0,0,.6)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.bw{position:relative;flex:1;min-height:0;overflow:hidden}
.buehne{position:absolute;inset:0;overflow:hidden}
.buehne .fb{border-radius:0}
.ecke{position:absolute;top:10px;right:10px;z-index:9;display:flex;gap:8px}
.ecke button{width:42px;height:42px;border-radius:12px;border:1px solid var(--rand);background:rgba(21,33,44,.82);color:var(--tinte);display:grid;place-items:center;cursor:pointer;font-size:19px}
.ecke svg{width:22px;height:22px}
.tipp{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;font:800 13px var(--bfont);color:#2b2a26;background:rgba(253,250,242,.92);border-radius:999px;padding:7px 14px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:opacity .4s}
/* Deck unten: so knapp wie in der App */
.unten{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--grund)}
.karte{position:relative;background:var(--karte);border:1px solid var(--rand);border-radius:14px;padding:9px 11px;color:var(--tinte)}
.karte b{font-family:var(--hfont);font-size:15px;line-height:1.1;display:block}
.karte small{display:block;font-size:11.5px;color:var(--tinteHell);line-height:1.2}
.paar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paar .karte{display:flex;align-items:center;gap:8px;min-height:58px;cursor:pointer}
.zettel .kopf{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;background:#f3e6c8;border:2px solid #d9c49a}
.weiter{background:var(--akzent)!important;border-color:transparent!important;color:var(--akzentTinte)!important}
.weiter small{color:rgba(42,26,7,.75)!important}
.weiter .play{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.2);display:grid;place-items:center;flex:none;font-size:13px}
.rennen .kopfz{display:flex;justify-content:space-between;align-items:baseline}
.rennen .kopfz small{color:var(--akzent);font-weight:800}
.rennen .bahn{position:relative;height:20px;border-radius:10px;background:var(--bahn);margin:12px 30px 6px 4px}
.rennen .bahn .b{position:absolute;top:50%;transform:translate(-50%,-70%);line-height:0}
.rennen .ziel{position:absolute;right:-30px;top:50%;transform:translateY(-50%)}
.rennen .leg{display:flex;gap:14px;font-size:11px;color:var(--tinteHell)}
.rennen .leg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.nav{flex:none;display:flex;background:var(--holz);border-top:1px solid #5a4430;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;border-right:1px solid rgba(0,0,0,.25);background:none;color:#e9d9b6;font:800 12px var(--bfont);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;opacity:.8}
.nav button:last-child{border-right:0}
.nav button.an{color:#ffc35c;opacity:1}
.nav svg{width:24px;height:24px}
/* Kajüte: unsichtbarer Wisch-Streifen über der Bühne (native Schwungkraft), Pfeile wie früher */
.pano{position:absolute;inset:0;z-index:5;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.pano::-webkit-scrollbar{display:none}
.pano>div{height:100%}
.zoom .pano{pointer-events:none}
.pf{position:absolute;top:50%;z-index:8;transform:translateY(-50%);width:34px;height:64px;border-radius:12px;background:rgba(21,33,44,.6);color:#f3e7c9;display:grid;place-items:center;font:800 26px var(--bfont);cursor:pointer;transition:opacity .4s;border:0}
.pf.l{left:6px}.pf.r{right:6px}
.zoom .pf,.weg{opacity:0;pointer-events:none}
.fernglas{position:absolute;right:10px;bottom:10px;z-index:9;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,250,240,.92);color:#2a2019;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fernglas svg{width:26px;height:26px}
.kringel{position:absolute;z-index:6;border:3px solid #ffd27a;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px rgba(0,0,0,.25);animation:kringel 2.6s ease-out forwards}
@keyframes kringel{0%{opacity:0;transform:scale(1.25)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.zoom .fernglas{opacity:0;pointer-events:none}
.over{position:absolute;inset:0;z-index:7;pointer-events:none}
.over>*{pointer-events:auto}
.detail{position:absolute;inset:0;z-index:10;pointer-events:none}
.detail>*{pointer-events:auto;position:absolute;opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s}
.detail.an>*{opacity:1;transform:none}
.detail.an>*:nth-child(2){transition-delay:.1s}.detail.an>*:nth-child(3){transition-delay:.2s}.detail.an>*:nth-child(n+4){transition-delay:.3s}
.zur{left:10px;top:10px;font:800 13px var(--bfont);padding:8px 12px;border-radius:12px;border:1px solid var(--rand);background:rgba(21,33,44,.9);color:var(--tinte);cursor:pointer}
.los{font:800 14px var(--bfont);padding:11px 16px;border-radius:14px;border:0;background:var(--akzent);color:var(--akzentTinte);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.dkarte{background:rgba(31,46,59,.94);border:1px solid var(--rand);border-radius:14px;padding:10px 12px}
.dkarte b{font-family:var(--hfont);font-size:15px;display:block}.dkarte small{display:block;font-size:12px;color:var(--tinteHell)}
/* Nahansicht: dasselbe Ding scharf; Antipp-Felder und Häkchen liegen darauf */
.nah{position:absolute;z-index:8;opacity:0}
.nah svg{width:100%;height:100%;display:block;overflow:visible}
.nah .feld{position:absolute;border:0;background:none;cursor:pointer;padding:0;border-radius:8px}
.nah .feld:active{background:rgba(255,220,140,.18)}
.nah .ok{position:absolute;right:4%;top:3%;width:18px;height:18px;border-radius:50%;background:#2f8a4a;color:#fff;font:900 11px/18px var(--bfont);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.4);opacity:0;transition:opacity .4s .2s}
.nah.fertig .ok{opacity:1}
.kblick{position:absolute;inset:0;z-index:12;background:rgba(14,11,8,.55);display:grid;place-items:center;opacity:0;transition:opacity .3s}
.kblick.an{opacity:1}
.kblick .p{width:86%;background:#f4ead2;border-radius:16px;padding:10px;color:#2b2a26;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.kblick canvas{width:100%;max-height:52vh;object-fit:contain;display:block;border-radius:10px}
.kblick b{font:800 17px var(--hfont)}
/* Seekarte: Tisch von oben */
.boden{position:absolute;inset:0;z-index:7;opacity:0;pointer-events:none;background:repeating-linear-gradient(90deg,#3d2717 0 38px,#45291a 38px 40px),#3d2717}
.oben{position:absolute;z-index:8;transform-origin:50% 50%;pointer-events:none}
.oben svg{width:100%;height:100%;display:block;overflow:visible}
/* Sprechen: Medaillon (beim Heranfahren) und Sprechblase */
.med{position:absolute;left:12px;bottom:14px;z-index:11;width:86px;height:86px;border-radius:50%;background:#f3e6c8;border:3px solid #c9a03c;box-shadow:0 6px 18px rgba(0,0,0,.45);overflow:hidden;opacity:0;transform:scale(.6);transition:opacity .3s,transform .35s cubic-bezier(.3,1.4,.6,1)}
.med.an{opacity:1;transform:none}
.med svg{width:100%;height:100%}
.blase{position:absolute;z-index:11;max-width:230px;background:#fffaf0;color:#2b2a26;font:700 13.5px/1.3 var(--bfont);padding:8px 11px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.35);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none}
.blase.an{opacity:1;transform:none}
.blase b{display:block;font:800 11px var(--bfont);color:#9a6a2a;margin-bottom:1px;text-transform:uppercase;letter-spacing:.04em}
.blase::after{content:"";position:absolute;left:var(--px,24px);bottom:-7px;width:14px;height:14px;background:#fffaf0;transform:rotate(45deg);border-radius:2px}
.blase.links::after{left:-6px;bottom:auto;top:16px}
.frei{flex:1;padding:14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;overflow:auto}
.frei .karte{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;text-align:center}
.frei svg{width:34px;height:34px;color:var(--tinte)}
.hinweis{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);z-index:9;font:700 12px var(--bfont);color:#f3e7c9;background:rgba(21,33,44,.8);padding:6px 12px;border-radius:999px;white-space:nowrap;transition:opacity .5s;pointer-events:none}
</style>
</head>
<body>
<div id="wahl"><div class="z" id="cBild"></div><div id="info"></div></div>
<div id="rahmen"><div id="tel"></div></div>
<script src="../../figuren.js"></script>
<script src="../../boot.js"></script>
<script src="../../szenerie.js"></script>
<script src="../../knoten.js"></script>
<script src="../../brede.js"></script>
<script src="../../film.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id), F = window.FIGUREN, tel = $('tel');
const SYM = (k, cls) => window.SZENERIE && SZENERIE.SYM[k] ? SZENERIE.SYM[k].replace('<svg ', `<svg class="${cls || 'sy'}" `) : '';
const TAB = {deck: '<path d="M3 18c3 2 6 2 9 0s6-2 9 0M12 3v11M12 4l6 8h-6"/>', kajuete: '<circle cx="12" cy="11" r="6"/><circle cx="12" cy="11" r="3"/><path d="M12 2v3M12 17v5"/>', frei: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>'};
const tabSvg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${TAB[k]}</svg>`;
const ZAHN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';
const FERN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="15" r="4"/><circle cx="17" cy="15" r="4"/><path d="M10.5 13.5h3M5 11l2-6h3l1 5M19 11l-2-6h-3l-1 5"/></svg>';
const BOOT = c => `<svg width="26" height="18" viewBox="0 0 26 18"><path d="M2 11h22l-4 6H6z" fill="${c}" stroke="#1b2733" stroke-width="1"/><path d="M12 1v10M12 2l7 8h-7" fill="#f3ead2" stroke="#1b2733" stroke-width="1"/></svg>`;

const BILDER = {deck: 'Deck', kajuete: 'Kajüte', knoten: 'Knotenbrett', karte: 'Seekarte am Tisch', navi: 'Seekarte an der Wand', manoever: 'Manöverbrett', buch: 'Bücherregal', telefon: 'Telefon', hocker: 'Hocker', frei: 'Frei üben'};
const INFO = {deck: 'Deck wie in der App. Hinnerk, Smilla oder Hilke antippen: sie drehen den Kopf her und sprechen (echte Stimmen). Boot antippen: Kajüte.',
  kajuete: 'Kajüte zum Wischen wie früher, mit leichter Tiefe. Personen antippen: sie sprechen. Dinge antippen: die Kamera fährt nah heran. Das Fernglas zeigt, was geht.',
  knoten: 'Knotenbrett nah: dasselbe Brett scharf, Namen auf Messingschildern. Knoten antippen: Animation aus dem Knotenkurs.',
  karte: 'Seekarte am Tisch: heranfahren und langsam kippen, bis man von oben auf den Tisch schaut.', navi: 'Seekarte an der Wand: Navigationsschule und Abendwache.',
  manoever: 'Manöverbrett: vier Manöver mit Schildern, Praxis im 3D-Fenster.', buch: 'Bücherregal: Lernkartei und Meine Prüfungen, Lesezeichen in den Farben des Lernstands.',
  telefon: 'Telefon: Harms meldet sich zur Probeprüfung.', hocker: 'Hocker: weiter in der Hörreise.', frei: 'Frei üben wie bisher (nur angedeutet).'};
let bild = 'deck', ton = true;
try { ton = localStorage.getItem('skipper-ton') !== 'aus'; } catch (e) {}
const kopf = id => `<svg viewBox="-19 -99 38 38" width="40" height="40">${F.figur(id, {blick: 'vorn', dreh: false, laune: 'froh'})}</svg>`;
function nav(an) { return `<div class="nav">${[['deck', 'Deck'], ['kajuete', 'Kajüte'], ['frei', 'Frei üben']].map(([k, n]) => `<button data-nav="${k}" class="${k === an ? 'an' : ''}">${tabSvg(k)}${n}</button>`).join('')}</div>`; }

/* ---------- Stimmen: echte Aufnahmen aus audio/stimmen, Mund folgt der Lautstärke ---------- */
let TEXTE = {}, actx = null, laufend = null, sprechNr = 0;
const PUFFER = {};
const STIMME = {hinnerk: {moin: ['1bps9q1', '8zipg1', 'kqhc0c', '1shkgyg', '1ej9no5'], kajuete: ['1nnlbz5', 'a0u32u']}, smilla: {moin: ['9t6fo4', 'g7dxo9', '13xcbjm', '1degtj5'], kajuete: ['1tr739f', '9t6fo4']},
  klabauter: {moin: ['lzg1b7', '17eg7wk', 'l50afm'], kajuete: ['2fwqkh', 'lzg1b7']}};
const WER = {hinnerk: 'HINNERK', smilla: 'SMILLA', klabauter: 'KLABAUTER', hilke: 'HILKE', harms: 'HARMS'};
const NAME = {hinnerk: "Käpt'n Hinnerk", smilla: 'Smilla', klabauter: 'Klabauter', hilke: 'Hilke', harms: 'Kapitän Harms', backbord: 'Backbord'};
const zufall = a => a[Math.floor(Math.random() * a.length)];
async function spiele(datei) {
  if (!ton) return null;
  actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') await actx.resume();
  const b = PUFFER[datei] || (PUFFER[datei] = await fetch(datei).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(a => actx.decodeAudioData(a)));
  const q = actx.createBufferSource(), an = actx.createAnalyser(); an.fftSize = 512; q.buffer = b; q.connect(an); an.connect(actx.destination);
  const st = {q, an, fertig: false}; q.onended = () => { st.fertig = true; }; q.start(); return st;
}
const pegelVon = (an, arr) => { an.getByteTimeDomainData(arr); let s = 0; for (let i = 0; i < arr.length; i++) { const x = (arr[i] - 128) / 128; s += x * x; } return Math.max(0, Math.min(1, (Math.sqrt(s / arr.length) - .012) * 6.5)); };
const takt = t => Math.max(0, Math.min(1, .1 + .9 * Math.max(0, Math.sin(t * 12.6)) * (.55 + .45 * Math.sin(t * 3.3))));
function blaseZeigen(wer, text, ankerEl, med) {
  const box = $('bw') || tel; let b = $('blase'); if (!b || b.parentNode !== box) { if (b) b.remove(); b = document.createElement('div'); b.id = 'blase'; b.className = 'blase'; box.appendChild(b); }
  b.innerHTML = `<b>${NAME[wer] || ''}</b>${text}`; b.classList.remove('links');
  const T = box.getBoundingClientRect();
  if (med) { const m = $('med').getBoundingClientRect(); b.classList.add('links'); b.style.left = (m.right - T.left + 10) + 'px'; b.style.top = (m.top - T.top + 6) + 'px'; b.style.bottom = ''; }
  else if (ankerEl) { const r = ankerEl.getBoundingClientRect(), cx = r.left + r.width / 2 - T.left; b.style.maxWidth = Math.min(230, T.width - 24) + 'px'; b.style.left = '0px';
    const bw = b.offsetWidth, left = Math.max(12, Math.min(T.width - bw - 12, cx - bw / 2)); b.style.left = left + 'px'; b.style.setProperty('--px', Math.max(10, Math.min(bw - 24, cx - left - 7)) + 'px');
    b.style.top = ''; b.style.bottom = Math.min(T.height - 60, T.bottom - r.top + 10) + 'px'; }
  requestAnimationFrame(() => b.classList.add('an'));
}
function stumm() {
  sprechNr++; if (laufend && laufend.q) { try { laufend.q.stop(); } catch (e) {} } laufend = null;
  if (window.FILMB) { FILMB.sprecher(''); FILMB.pegel(null); }
  const b = $('blase'); if (b) b.classList.remove('an'); const m = $('med'); if (m) { m.classList.remove('an'); F.mund(m, 0); }
}
/* wer spricht clip (oder text ohne Aufnahme); med: im Medaillon statt auf der Bühne */
async function sprich(wer, clip, o = {}) {
  stumm(); const nr = sprechNr, text = (TEXTE[clip] || '').replace(/^[a-zäöü]+: /, '') || o.text || '';
  let med = null;
  if (o.med) { med = $('med'); const box = $('bw') || tel; if (!med || med.parentNode !== box) { if (med) med.remove(); med = document.createElement('div'); med.id = 'med'; med.className = 'med'; box.appendChild(med); } med.innerHTML = medaillon(wer); requestAnimationFrame(() => med.classList.add('an')); }
  else if (WER[wer]) FILMB.sprecher(WER[wer]);
  blaseZeigen(wer, text, o.anker, !!med);
  let st = null; if (clip) { try { st = await spiele(`../../audio/stimmen/${clip}.mp3`); } catch (e) { st = null; } } else if (o.datei) { try { st = await spiele(o.datei); } catch (e) {} }
  if (nr !== sprechNr) { if (st) try { st.q.stop(); } catch (e) {} return; }
  laufend = st; const arr = new Uint8Array(512), t0 = performance.now(), dauer = Math.max(1500, text.length * 62);
  await new Promise(res => { const tick = now => {
      if (nr !== sprechNr) return res();
      const v = st ? pegelVon(st.an, arr) : null, ende = st ? st.fertig : now - t0 > dauer;
      if (med) F.mund(med, v != null ? v : takt((now - t0) / 1000)); else FILMB.pegel(v);
      if (ende) return res(); requestAnimationFrame(tick); }; requestAnimationFrame(tick); });
  if (nr !== sprechNr) return;
  if (med) F.mund(med, 0); else { FILMB.sprecher(''); FILMB.pegel(null); }
  setTimeout(() => { if (nr === sprechNr) { const b = $('blase'); if (b) b.classList.remove('an'); if (med) med.classList.remove('an'); } }, 1400);
}
/* Kopf einer Figur von vorn im Medaillon (Mund bewegt sich mit) */
function medaillon(wer) {
  const id = wer === 'harms' ? 'harms' : wer, f = F.FIG[id]; if (!f) return '';
  if (f.tier) return `<svg viewBox="-10 -42 28 28">${F.figur(id, {pose: 'sitzen'})}</svg>`;
  const T = F.TYPEN[f.typStd] || F.TYPEN.klassisch, sk = f.h / 100, cy = (-77.6 * T.bh - 9 * T.k) * sk, g = 40 * T.k * sk;
  return `<svg viewBox="${(.4 * T.bw * sk - g / 2).toFixed(1)} ${(cy - g * .52).toFixed(1)} ${g.toFixed(1)} ${g.toFixed(1)}">${F.figur(id, {blick: 'vorn'})}</svg>`;
}

/* ---------- Deck wie heute ---------- */
function deckHtml() {
  return `<div class="bw"><div class="buehne" id="b"></div><div class="ecke"><button aria-label="Werft">⚓</button><button aria-label="Einstellungen">${ZAHN}</button></div><span class="tipp" id="dtipp">Boot antippen: runter in die Kajüte</span></div>

    /* während des Wischens ruhen die Extras (ihr Aquarell-Filter ist teuer), danach laufen sie mit 10 Bildern je Sekunde weiter */
    if (now - last > 100 && !(now - (PAN.zuletzt || 0) < 350)) { last = now; const t = (now - t0) / 1000, BW = ($('bw') || tel).getBoundingClientRect(), sicht = el => { if (!el) return null; const r = el.getBoundingClientRect(); return r.right > BW.left - 40 && r.left < BW.right + 40 ? el : null; };
      if (ist === 'deck' && gD && gD.isConnected) gD.innerHTML = `<g transform="translate(62 271) scale(.8)">${F.gruppe('muschelwicht', 2, {dreh: false, t: t * .35 % 1})}</g>`;
      if (ist === 'kajuete') {
        const w = sicht(inBuehne('#kj-wurm')); if (w) { const u = (t / 22) % 1, hin = u < .5, x = (hin ? u * 2 : 2 - u * 2) * 44 - 22; w.innerHTML = `<g transform="translate(${x.toFixed(1)} 0) scale(${hin ? 1 : -1} 1)">${F.figur('knotenwurm', {dreh: false, t: t * .5 % 1})}</g>`; }
        const m = sicht(inBuehne('#kj-maeuse')); if (m) m.innerHTML = `<g transform="translate(14 0) scale(.95)">${F.figur('mausmutter', {dreh: false, pose: 'schnuppern', t: t * .35 % 1})}</g><g transform="translate(-6 1) scale(.8)">${F.figur('mauskind', {dreh: false, pose: 'putzen', t: (t * .35 + .4) % 1})}</g>`;
        const p = sicht(inBuehne('#kj-puschel')); if (p) { const u = (t / 18) % 1, x = -77 - 46 + u * 92; p.innerHTML = `<g transform="translate(${x.toFixed(1)} ${(96 + Math.sin(t * .9) * 3).toFixed(1)}) scale(1.1)">${F.figur('nebelpuschel', {dreh: false, t: t * .3 % 1})}</g>`; }
      } }
    extraUhr = requestAnimationFrame(lauf); };
  extraUhr = requestAnimationFrame(lauf);
}

/* ---------- Bedienung ---------- */
tel.addEventListener('click', e => {
  if (e.target.closest('[data-zurueck]')) return zurueck();
  const z = e.target.closest('[data-knoten]'); if (z) return knotenBlick(z.dataset.knoten);
  const mn = e.target.closest('[data-manoever]'); if (mn) return hinweis(`${mn.dataset.manoever}: öffnet das 3D-Fenster (in der App)`);
  const bu = e.target.closest('[data-buch]'); if (bu) return hinweis(BUCH_INFO[bu.dataset.buch] || `${bu.dataset.buch}: Fragen und Merksätze`);
  if (e.target.closest('#fern')) return fernglas();
  const n = e.target.closest('[data-nav]'); if (n) { bild = n.dataset.nav; chips(); zeigen(true); return; }
  if (bild === 'deck' && e.target.closest('#b')) {
    for (const w of ['hinnerk', 'smilla', 'hilke']) { const el = figurEl(w); if (!el) continue; const r = el.getBoundingClientRect(); if (e.clientX > r.left - 6 && e.clientX < r.right + 6 && e.clientY > r.top - 6 && e.clientY < r.bottom + 6) {
      if (w === 'hilke') return sprich('hilke', null, {anker: el, text: 'Moin! Volltanken, wie immer?'});
      return sprich(w, zufall(STIMME[w].moin), {anker: el}); } }
    bild = 'kajuete'; chips(); zeigen(true);
  }
});
function chips() { $('cBild').innerHTML = Object.entries(BILDER).map(([k, n]) => `<button data-b="${k}" aria-pressed="${k === bild}">${n}</button>`).join('') + `<button data-ton aria-pressed="${ton}">${ton ? '🔊 Ton an' : '🔇 Ton aus'}</button><a href="figuren-gang.html">Figuren und Fabelwesen →</a>`; }
$('wahl').addEventListener('click', e => {
  const t = e.target.closest('[data-ton]'); if (t) { ton = !ton; try { localStorage.setItem('skipper-ton', ton ? 'an' : 'aus'); } catch (x) {} if (!ton) stumm(); chips(); return; }
  const b = e.target.closest('[data-b]'); if (b) { bild = b.dataset.b; chips(); zeigen(true); } });
const hoehe = () => document.documentElement.style.setProperty('--oben', $('wahl').offsetHeight + 'px'); addEventListener('resize', hoehe);
const los = () => { chips(); hoehe(); zeigen(false); setTimeout(hoehe, 300); };
Promise.all([fetch('../../data/karte-brede.json').then(r => r.json()).then(j => window.BREDE && BREDE.setzen(j)).catch(() => {}),
  fetch('../../audio/stimmen/manifest.json').then(r => r.json()).then(m => { TEXTE = m.texts || {}; }).catch(() => {})]).then(los);
})();
